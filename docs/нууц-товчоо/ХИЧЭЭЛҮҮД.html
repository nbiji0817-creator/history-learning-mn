иний эцгийг хядагч өвгөн гэж харааж байсан атал, одоо хил зант сайн эцэг гэж дуудах болов. Бас намайг Тогтоа бөөгийн сартаул хонины сүүлийг дагаж явсан гэж муулан хэлж байсан атал, одоо намайг хил зант, сайн аашит анд гэх зэргээр магтах болов. Энэ үгний утгыг би мэдэв. Байлдъя гэсэн үг байна. Үүнд ямар ч эргэлзэх зүйлгүй. Билгэ бэхи Тодойн хоёр, агтаа таргалуулж, байлдааны тугийг босгогтун\" гэв. Тэндээс Архай Хасар буцаж харьсан ба Сүхэхэй жэүний эм хөвүүд, Ван ханы хүрээнд байсан тул буцахаас зүрх халширч тэнд хоцров. Архай хүрч ирээд тэдний үгсийг Чингис хаанд өгүүлэв."}], [{"k": "read", "ref": "§182", "n": 182, "text": "Тэндээс Чингис хаан нүүж Балжун нуурт очиж буув. Тэнд буусны дараа Горлосын Цоосцагаан ирж уулзаад, горлосууд дагаж оров. Бас Онгудын Алахуш-дигитхуриас мянган иргэ (хонь) аваад далимд Эргүнэ мөрний орчим нутаглах ардаас булга, хэрэм худалдан авч яваа сартаулын (Туркестаны) Хасан гэдэг хүн, цагаан тэмээ унаж хонио тууж ирээд, Балжун нуурт усалж байхад Чингис хаан түүнтэй уулзав."}, {"k": "read", "ref": "§183", "n": 183, "text": "Чингис хаан, Балжун нуурт буугаад байхад Хасар өөрийн эм ба Егү Есүнхэй Туху гурван хөвүүнээ Ван ханытэнд орхиж, өөрөө хэдэн нөхөдтэй гарч, ах Чингисийг эрж, Хараун жидуны нуруугаар хэсэж олж чадсангүй шир шөрмөс идэж яваад сая Чингис хаанд ирж нийлэв.\nХасарыг ирмэгч, Чингис хаан баясаж, Ван ханд дахин элч явуулъя гэж зөвлөлдөж, Жауридайн Халиудар, урианханы Чахурхан хоёрыг томилж Ван хан эцэгт Хасарын үг гэж хэл гэж өгүүлрүүн:\n\n\"Хасар би танаас салж\nХан ахаа санаж\nХайн эрэвч\nХарагдах бараагүй\nХайлан уйлавч\nСонстох чимээгүй\nХаана одсоныг мэдэхгүй\nОд харан хонож\nОрвон дэрлэн унтаж\n(Гэргүй хонож\nДэргүй унтаж) байна.\n\nМиний эм хөвүүд, хан эцэг чиний тэнд бий. Хэрэв итгэмжтэй хүнийг илгээвэл би хан эцэгт одох билээ\" гэж хэлтгэй гээд бас Халиудар, Чахурхан хоёрт өгүүлрүүн: \"Та нарыг явмагц, бид хөдөлж Хэрлэний Аргал хохид очиж бууна. Та нар тэнд буцаж ирэгтүн\" гэж болзолдож, Халиудар Чахурхан хоёрыг явуулаад Жорчидай Архайн хоёрыг тэргүүн хайгуул болгон мордуулж дараа нь Чингис хаан гэр хотлоор нүүж Хэрлэний Аргал хохид ирж буув."}, {"k": "read", "ref": "§184", "n": 184, "text": "Халиудар Чахурхан хоёр, Ванханд хүрч, Хасарын үг гэж дээрх үгийг хэлэв. Тэр цагт Ван хан, алтан тэрэм (асар) босгож хуримлан байжээ. Халиудар Чахурхан хоёрынүгийг сонсоод Ванхан өгүүлрүүн: Тийм бол Хасар иртүгэй. Итгэмжит хүнд Итүргэнийг илгээе\" гэж явуулав. Тэрхүү Итүргэн, Халиудар Чахурхан хоёрын хамт уг болзсон Аргал хохи гэдэг газар хүрч ирээд их бараа (олон хүн, мал)-г үзэж Итүргэн элч [сэжиглэж] буцан дутаав. Халиударын морь хурдан тул даруй нэхэж гүйцэвч барьж чадахгүй, өмнө хойно нь орж явахад Чахурханы морь удаан тул хойноос арай гэж сум хүрэлцэх газар ирж, Итүргэний алтан эмээлт хар морины гуяны угийгхойш унатал харважээ. Тэгээд Итүргэнийг Халиудар, Чахурхан хоёр барьж Чингис хаанд авчрав. Чингис хаан, Итүргэнээс үг асуусангүй. \"Хасарт авч оч\" гэв. Хасарт авч очвол Хасар, Итүргэнтэй үг хэлэлцсэнгүй дор нь цавчиж орхив."}]], "lines": {"Мя": "§178–179 · **Лх** §180–181 · **Пү** §182–184"}}, {"n": 22, "title": "Хэрэйд мөхсөн нь, Найманы Таян хан", "vocab": [["дархан", "онцгой эрх эдлэгч"], ["агтач", "морь хариулагч"], ["бууж өгөх", ""], ["ихэмсэг", ""], ["хоромсгыг булаах", "эзлэх"]], "qs": ["Хадаг баатар яагаад гурван өдөр тулалдсан, Чингис түүнийг яагаад өршөөсөн бэ?", "Чингис Хөхөчүг яагаад шийтгэж, эхнэрийг нь өршөөсөн бэ?", "Таян ханы «газар дээр хоёр хаан байж яаж болно» гэдэг үгийг тайлбарла."], "fri": "«Үнэнч байдал» хуудсанд Хадаг баатрыг Хөхөчүтэй харьцуулж нэмнэ.", "warn": ["§189: Ван ханы толгойн хэсгийг товчилно."], "strat": "Гол санаа ба хураангуй — долоо хоногийн уншлагыг 3 өгүүлбэрт багтаана.", "mode": "Бүлгээрээ шивнэж уншина: уншигч уншиж, бусад нь дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§185", "n": 185, "text": "Халиудар Чахурхан хоёр, Чингис хаанд өгүүлрүүн: \"Ван хан болгоомж ажиггүй, алтан тэрэм босгоод хуримлаж байна. Одоо яаравчлан мордоод шөнө дүлд бүчин дайръя\" гэвэл (Чингис хаан) энэ үгийг зөвшөөрч, Жорчидай Архай хоёрыг хайгуул болгон тэргүүн явуулаад дараа нь бүгдээр шөнө дүлэн явж Жэжээр өндрийн Жэр хавчлын аманд (Ван ханыг) байхад бүслэн авав. Гурван шөнө, гурван өдөр турш байлдаад гуравдугаар өдөр тэд бууж өгөв. Үзвэл, Ван хан Сэнгүм хоёр үгүй болжээ. Шөнө оргон одсоныг манайхан мэдсэнгүй. Ингэж байлдсан нь Жүрхиний Хадаг баатар байсан ажээ.\nХадаг баатар орж ирээд өгүүлрүүн: \"Тус (өөрийн) ханаа яахин барьж алуулахгэж тэвчин ядаж, түүний амийг арчлахын тул гурван өдөр, гурван шөнө байлдав. Одоо түүнийг нэгэнт оргуулан гаргасан тул бид бууж өгөв. Намайг үхүүлбэл үхье. Чингис хаанд соёрхогдож амьдруулбал хүчээ өгье\" гэв. Чингис хаан, Хадаг баатрын үгийг зөвшөөж зарлиг болруун: \"Өөрийн ханыг орхихгүй, түүний амийг аврахын тул байлдсан эрийг хэн буруушаах вэ? Нөхөрлөж болох хүн байна\" гээд амийг соёрхож, Хадаг баатар ба Жүрхин овгийн зуун хүнийг Хуилдарын үхсэний тул Хуилдарын эм хөвүүнд зарц болгож өгөв.\nТэндээс хөвүүн үр төрвөл Хуилдарын ургийн ураг хүртэл дагаж хүчээ өгтүгэй. Охин үр төрвөл эцэг эх нь өөрийн дураар худалдаж (хадамд) өгч болохгүй. Тэдний хөвүүд охид Хуилдарын эм хөвүүдийн өмнө хойно зарагдаж явтугай\"гэж соёрхон зарлиг болов. Хуилдар сэцэн хамгийн урьд ам нээж (шударга үгээ) хэлсний тул\nЧингис хаан соёрхож зарлиг болруун: \"Хуилдарын зүтгэсний тул түүний ургийн ураг хүртэл өнчдийг тэтгэх хишгээс хүртэж яв\" гэж зарлиг болов."}, {"k": "read", "ref": "§186", "n": 186, "text": "Хэрэйд иргэнийг доройтуулж, зүг зүг хувааж авав. Сүлддэй овгийн Тахай баатрын зарц болгож нэг зуун жүрхинийг өгөв. Бас Ван ханы дүү Жаха-хамбуд хоёр охин байсны эгч Ибагыг Чингис хаан өөрөө авч, дүү Сорхагтанийг хөвүүн Толуйд өгөв. Иймийн тул Жаха-хамбын харъяат өмчийн иргэнийг халдаж авсангүй, харин Жаха-хамбыг тэрэгний нөгөө арал мэт [надад тус болж] яв гэж соёрхож өршөөв.", "chap": "Ван хан сөнөсөн нь"}, {"k": "read", "ref": "§187", "n": 187, "text": "Бас Чингис хаан, Ван ханы суудаг алтан асар, хэрэглэдэг алтан завьяа аяга ба асарч явсан ард сэлт, вангийн хажууд бараа бологч хэрэйд цөмийг Бадай Хишилиг хоёрт олгож\n\n\"Хувьдаа зарцалж\nХудагаа бариулж\nХоромсгоо зүүлгэж\nУргийн урагт хүртэл\nУдтал дархлан жаргатугай\n[Та хоёр].\nАлалдах дайнд явж,\nАвсан олзоо цөмийг\nАминдаа ашиглаж байгтун.\nАн авд явж\nАлсан гөрөөсөө цөмийг\nХувьдаа хэрэглэж байгтун\"\n\nгээд Чингис хаан бас зарлиг болруун: \"Бадай Хишилиг хоёр, миний амийг аварч тус хүргэсний тул мөнх тэнгэрт ивээгдэж, Хэрэйд улсыг доройтуулж, өндөр сууринд хүрэв, би. Одоо ба ирээдүйд ургийн ураг хүртэл миний суурийг залгамжлагчид, энэ хоёрын хүргэсэн тусыг үүрд санаж явтугай\" гэж зарлиг болов.\n\nХэрэйд улсыг эзэлж\nХэнд дутаалгүй\nХэсэглэж хувааж авав\nТүмэн түбэгэнийг номготгож\nТүүнийг бүрнээ тасчиж\nТүгээн хувааж орхив.\nОлан дунгайдыг дарж\nОрой болохын өмнө\nОгтчин хувааж авав\nЦус урсгах дуртай\nЦуут жүрхийн овгийг\nЦугийг хувааж эзлэв.\nХэрэйд иргэнийг сөнөөж тэр өвөл, Абжиа хүдгэр гэдэг газар өвөлжив."}], [{"k": "read", "ref": "§188", "n": 188, "text": "Ван хан Сэнгүм хоёр дутааж гараад Дидиг сахалын Нэхүн ус гэдэг газар Ван хан ангаж усан дээр очоод найманы харуулын Хорису-бэчи гэгч хүнтэй тохиолдов. Хорису-бэчид Ван хан, \"Би Ван хан мөн\" гэж хэлсэн боловч тэр таньсангүй ба үнэмшсэнгүй. Ван ханыг барьж аваад алжээ. Сэнгүм Дидиг сахалын Нэхүн усан дээр очилгүй тойрон гарч, цөл газар ус эрж явтал, хэсэг хулан ялаархан зогсож байхыг үзээд Сэнгүм, мориноос бууж морио агтач Хөхөчүд бариулаад, хуланг мярааж одов. Сэнгүм, агтач Хөхөчү, Хөхөчүгийн эхнэр гурвуул явсан ажээ. Гэтэл агтач Хөхөчү, Сэнгүмийн морийг хөтлөөд гэдрэг буцан хатирвал түүний эм өгүүлрүүн:\n\n\"Алттыг өмсөхөд\nАмттыг идэхэд\nАмраг Хөхөчү миньгэж хайрлаж\nАсран санаж билээ.\nХарин одоо чи\nХан Сэнгүмийг орхиж\nХаяж дутаах буюу?\"\n\nгэж хоцрохыг завдвал, Хөхөчү өгүүлрүүн: \"Чи Сэнгүмийн эхнэр болох гэв үү?\" гэвэл, эм нь өгүүлрүүн: \"Чи намайг нохой мэт ичүүргүй амьтан гэх буюу? Чи алтан хундагыг нь орхитугай. Ядахдаа ус уух савтай үлдэг\" гэвэл, Хөхөчү алтан хундагыг нь хойш хаяад хатиран одов. Агтач Хөхөчү буцаж ирээд Чингис хаанд очиж:\n\"Сэнгүмийг тийнхүү цөлд явган хаяад ирэв\"\"гэж ярилцсан үгээ бүрнээ айлтгавал Чингис хаан зарлиг болруун: \"Гагцхүү эмий нь амийг өршөөе. Нөгөө агтач Хөхөчү, хан эзнээ хаяж ирсэн, хараахан итгэж болохгүй хүн\" гэж цавчиж алав. [Сэнгүм, Ашиг балгасыг дайрч, Түвд оронд сууж байсан боловч нутгийн ардад хавчигдаж дутааж гараад Кашгарт ирэв. Тэндхийн ноён Келж, Сэнгүмийг барьж алсан ба эхнэр хүүхдийг Чингис хаанд хүргэж өгөв гэдэг үг байдаг. Рашид]."}, {"k": "read", "ref": "§189", "n": 189, "text": "Найманы Таян ханы эх Гүрбэсү өгүүлрүүн: \"Ван хан, эртний их хан билээ. Толгойгий нь авчрагтун. Хэрэв мөн бол бид тахъя\" гэж Хорису-бэчид элч илгээн, Ван ханы толгойг огтолж авчруулбал чухам мөн тул цагаан олбог дээр оршуулж, идээ шүүс өргөн, бэрээд (бэрүүд)-ээ бэрлүүлж, хуур хуурдуулж, идээ шүүс тавьж, хундага өргүүлж тахив. Тэгж тахиж байтал, тэр толгой инээсэнд инээв гэж Таян хан хилэгнэж хэмхчин гишиглүүлэв. Үүнд Хүгсэү сабраг өгүүлрүүн: \"Үхсэн ханы толгойг огтолж авчраад хэмхчин хаяж яаж зохих вэ? Манайхны нохой муухайгаар улин хуцах болов. Урьд Инанча Билгэ ханы хэлсэн нь:\n\n\"Эр намайг өтөлсөн хойно\nЭхнэрийн минь залуу байхад\nЭрхт тэнгэрийн элбэрлээр\nЭнэ Таян төрсөн билээ.\nТорлог гоо биетэй\nТоромгор бор хүү минь\nАрд дорд олноо\nАсран захирч чадах болов уу?\"\nгэж байсан билээ. Одоо\n\n\"Хар нохой муу ёроор хуцах болов.\nХатан Гүрбэсү\nХамаг хэргийг мэдэх болов.\nХан Таян чи\nХалшрах зөөлөн хүн байна.\n\nАн гөрөө хийхээс өөр, мэдэх эрдэм чадалгүй ажээ\" гэвэл, Таян хан өгүүлрүүн: \"Дорно зүгийн цөөн монгол омогдоод байх болов. Эртний сурвалжит Ван ханыг элдвээр айлган дутаалгаж энэ саяхан үхүүлэв. Тэгээд тэд, бүгдийг эзлэн хаан болох санаатай юу? Тэнгэрийг улам гэгээн гэрэлтэй болгохын тул нар сар хоёр байдаг биз. Гэтэл газар дээр хоёр хан байж яаж болно (газар дээр юуны тул хоёр хан байх хэрэгтэй вэ). Одоо тэр хэдэн монголыг эзэлж авчиръя\" гэжээ. Түүнд эх Гүрбэсү нь өгүүлрүүн: \"Юу хийнэ? Тэдний монголчууд Ханхлах муу үнэртэй\n\nХар муухай хувцастай тул авчирч юу хийнэ?\nХолхон байвал дээр бий. Гагцхүү шилдэг сайн охид бэрээдий нь авчраад гар хөлий нь угаалгавал үнээ, хонь, саалгаж болох мэт\" гэвэл Таян хан өгүүлрүүн: \"Тэд ямар боловч [хамаагүй] бид Монголд очиж хормсого саадгийг хураан авчирья (эзлэн авчиръя)\" гэжээ."}], [{"k": "read", "ref": "§190", "n": 190, "text": "Эдгээр үгийг сонсоод Хүгсэү сабраг баатар өгүүлрүүн: \"Та хэтэрхий их үг хэлж байна. Аяа, Торлог хан минь ингэж болох буюу? Болигтун\" гэж Хүгсэү сабраг хэдийгээр ятгавч [үгийг сонссонгүй]. Торбиташ нэрт элчийг онгууд аймгийн Алахуш-дигитхурид томилон явуулж хэлүүлсэн нь: \"Энэ дорно зүгийн цөөн монгол омогдох болов. Чи баруун гар болж морд. Би эндээс хамсаж хоёулаа тэр хэдэн монголын хоромсогыг булаан авъя\" гэж илгээжээ. Тэр үгэнд Алахуш-дигитхури өгүүлрүүн: \"Би чиний баруун гар болж чадахгүй\" гэж явуулаад, Ю-Хунан нэрт элчээ зарж Чингис хаанд хэлүүлсэн нь: \"Найманы Таян хан, чиний хоромсгыг булааж авъя. Намайг баруун гар бол гэсэнд би эс зөвшөөрөв. Одоо би чамайг болгоомжилтугай гэж энэ учрыг мэдэж илгээв. Дайсанд чи хоромсгоо автуузай\" гэж илгээжээ. Тэр цагт Чингис хаан, Тэмээн хээр гэдэг газар ав хийж байсан ба Түлхинчэүд гэдэг газар хомрон агнаж байхад Алахуш-дигитхурийн явуулсан элч Ю-Хунан ирж хэл хүргэв. Энэ мэдээг сонсоод мөн авын газар \"Яах вэ?\" гэж зөвлөлдвөл, олон хүн өгүүлрүүн: \"Бидний агт туранхай байна. Одоо яах ч аргагүй [намар, агтаа таргалсан хойно байлдъя. Рашид]\" гэвэл, Отчигин ноён өгүүлрүүн: \"Агтыг туранхай гэж шалтгаацаж яаж болно? Миний морьд тарган байна. Ийм мэдээг сонсоод зүгээр сууж болох уу? [Нэгэнт ийм мэдээ сонссон тул даруй байлдаар мордъё. Хөдлөлгүй сууж байгаад Таян ханд автагдвал энэ газар монголчууд, Таян ханд эзлэгдсэн гэх муу нэр үлдэх бишүү. Байлдсаны хойно тэд дийлэх, бид дийлэх алин болохыг гагцхүү мөнх тэнгэр мэднэ. Рашид.]\" гэв. Бэлгүтэй ноён өгүүлрүүн:\n\n\"Амьд яваа байтал\nАлтан хоромсогоо алдвал\nАмьд явсны хэрэг юун?\nНум сумаа барьсаар\nСаадаг хоромсгоо дэрлэсээр\nЯсаа хээр орхихоос\nЭрхэм сайн үхэл\nЭр хүнд байх буюу?\nАр найман улс\nАгуу их нутагтай\nАрд иргэн олонтой\nАдуу мал баялагтай гэж\nИх сүр бадруулан\nИйм үг хэлж байна.\nХарин энэ далимд\nХалдаж бид очвол\nНутаг усыг эзэлж\nНум сумыг булаахад\nБэрхгүй.\nОдоо бид довтлон очвол\nОлон адуугаа хурааж амжихгүй.\nОрхиод дутаах нь магадгүй бишүү.\nОрд гэрээ ачиж чадахгүй\nХаяад залах нь лавтай бишүү.\nОлон харьяат ард нь\nОй тайгад шургалж\nОсолдон самуурах биш\nОдоо ийм үгийг сонссоор байж\nОгт зүгээр өнгөрүүлж болохгүй\nОлон даяар байлдаар мордъё\" гэв."}]], "lines": {"Мя": "§185–187 · **Лх** §188–189 · **Пү** §190"}}, {"n": 23, "title": "Цэргийн шинэчлэл ба Саарь хээрийн гал", "vocab": [["аравт, зуут, мянгат", ""], ["хэвтүүл", "шөнийн манаа"], ["торгууд", "өдрийн харуул"], ["хишигтэн", "ээлжийн бие хамгаалагч"], ["тагнуул", ""]], "qs": ["Чингис хаан цэргээ хэрхэн зохион байгуулсан бэ?", "Найман нарыг айлгахын тулд ямар арга хэрэглэсэн бэ?", "Таян хан, Хүчүлүг хоёрын маргаан Найманд хэрхэн нөлөөлсөн бэ?"], "fri": "Аравт, зуут, мянгат, түмтийн бүдүүвчийг зурна. 95 мянгатад хэдэн цэрэг байх вэ гэдэг бодлого бодно.", "warn": [], "strat": "Гол санаа ба хураангуй — долоо хоногийн уншлагыг 3 өгүүлбэрт багтаана.", "mode": "Бүлгээрээ шивнэж уншина: уншигч уншиж, бусад нь дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§191", "n": 191, "text": "Бэлгүтэй ноёны энэ үгийг Чингис хаан зөвшөөрч, аваас буугаад Абжиа Хүдгэрээс нүүж, Халх голын Ор нугын хэлтгий хад гэдэг газар очиж буугаад цэрэг ардаа бүртгэн тоолов. Чингис хаан, цэргээ хуваарилж, мянганы ноён, зууны ноён, арваны ноён ба [тэргүүлэн захирах их] чэрби нарыг томилов. Додай чэрби, Доголху чэрби, Өэлэн чэрби, Толун чэрби, Бучаран чэрби, Сүйхэтү чэрби энэ зургаан чэрби түшмэлийг тэнд томилов. Цэргүүдээ арван, зуун мянган болгон хуваарилж дуусаад, бас наян хэвтүүл (шөнийн манаач), далан торгууд (торгон цэрэг), хишигтэн (ээлжийн харгалзагч) нарыг тусгайлан томилж, үүнд мянганы ноёд, зууны ноёдын хөвүүд дүү нар ба сул ардын (чөлөөт иргэний) хөвүүд дүү нарын дотроос эрдэм чадалтай, бие бялдар сайтайгий нь ялгаж оруулав. Чингис хаан тэнд Архай Хасарыг өршөөн дотнолж: \"Мянган сайн баатрыг шилж автугай ! Байлдах өдөр өмнө минь явж байлдтугай! Ерийн өдөр, миний шадар хишигтэн болж явтугай!\" гэж зарлиг болов. Бас \"Далан торгуудыг Өэлэн чэрби ахалж явтугай! Худус-халчинтай зөвлөж явтугай!\" гэв."}, {"k": "read", "ref": "§192", "n": 192, "text": "Бас Чингис хаан зарлиг болруун: \"Хорчин (нум сум агсагчид), торгууд хишигтэн буурч (тогооч), хаалгач агтач нар өдөр бүр хишиглэн (ээлжлэн) сэргийлэх хамгаалах ажлыг гүйцэтгэж байгаад уг үүргээ нар шингэхийн урьд хэвтүүлийн хүмүүст шилжүүлж өөрсдөө агтанд гарч хонотугай! Хэвтүүлийн хүмүүс шөнө ээлжээр үүдэнд зогсож, гэрийг тойрч манаж байтугай! Хорчин, торгууд биднийг өглөөний хоол идмэгц ирж хэвтүүлийн хүмүүсээс үүрэг хүлээн авч, урьд ёсоор сууриа эзэлж харгалзаж сахиж явтуай! Гурван өдөр, гурван шөнө жасаалан явж дуусаад гурван шөнө (амарч) хонотугай! Хорчин нар хэвтүүлийн үүргийг гүйцэтгэж сольж явтугай!\" гэж зарлиг болов. Тэгээд цэргүүдээ мянга мянгаар хуваарилж дуусаад, чэрби ноёдыг томилж, наян хэвтүүл, далан торгууд, хишигтэн нарыг томилж, Архай Хасарыг шилдэг баатруудын дарга болгож, Халх голын Ор нугын хэлтгий хад гэдэг газраас Найман улстай байлдахаар мордов. [Тэр цагт мэргидийн Тогтоа, хэрэйд аймгийн ноёдын нэгэн бөгөөд дутааж ирсэн Алин тайж, Хутуг бэхиэр толгойлуулсан ойрд аймаг, жажирдай овгийн Жамуха, дөрвөн татаар, хатахин, салжиуд аймгууд цөм Наймантай нэгдсэн байжээ. Рашид]."}], [{"k": "read", "ref": "§193", "n": 193, "text": "Хулгана жил (1204)-ийн зуны тэргүүн сарын арван зургааны улаан тэргэл өдөр тугаа тахиж мордоод Зэв Хубилай хоёрыг Хэрлэн өөд тагнуул болгож явуулав. Тэр хоёр явж Саарь хээрт хүрч, Ханхарханы (Хангай-ханы ) эхэн дээр байсан найманы харуултай учрав. Тэд харилцан тулалцаж байгаад найманы харуулд манай харуул эмээлтэй эцэнхий саарал морийг автжээ. Найманы харуул тэр морийг барьж аваад \"Монголын агт туранхай ажээ\" гэлдэв. Манай их цэрэг Саарь хээрт хүрч буугаад \"Одоо яах вэ?\" гэж хэлэлцэхэд Додай чэрби, Чингис хаанд дуртган айлтгасан нь: \"Бидний цэрэг цөөн бөгөөд замд чилж ядрав. Иймийн тул энд баахан саатаж агтаа цатгая, Саарь хээрийг дэлхэн бууж, амьд хүн тутам эр бүр шөнө таван анги гал түлж галаар сүр бадруулъя. Найман нар олон гэнэ. Гэвч тэдний хан нь гэрээ гарч үзээгүй танхи хүн гэнэ. Бид галаар сүрдүүлэн тэднийг гөлрүүлж байх завсар бидний агт цадах биз. Агтаа амарч цадмагц найманы харуулыг дайрч гол хүчинд нь хүртэл хөөж оруулаад тэдний самгардах самбаанд байлдан орвол болох уу?\" гэж дуртгавал, энэ үгийг зөвшөөрч Чингис хаан зарлиг болруун: \"Тийм бол галуудыг түлэгтүн\" гэж цэргүүдэд тушаал тунхаглав. Цэргүүд Саарь хээрт тарж буугаад амьд хүн бүр таван анги гал түлэв. Найманы харуул, Ханхарханы тэргүүнээс шөнө олон галыг үзэж \"Монгол цөөн гэсэн биш билүү? Одноос олон гал ноцож байна\" гэж Таян ханд өнөөх барьсан муу эмээлтэй саарал морийг хүргүүлэв. Бас Таян ханд мэдүүлсэн нь: \"Монголын цэргүүд Саарь хээрийг дүүртэл буужээ. Өдөр бүр ундрах ус шиг нэмэн ирж байх бололтой. Одноос олон гал ноцож байна. (Өдөр өндөр ууланд гарч байдаг болов уу? Шөнө талд од мэт олон гал ноцоож байна)\" гэж илгээв."}], [{"k": "read", "ref": "§194", "n": 194, "text": "Харуулын энэ хэл ирэхэд Таян хан, Хангайн Хачир усанд байв. Таян хан, энэ хэлийг аваад Хүчүлүг хан хөвүүндээ хэлж илгээрүүн: \"Монголын агт туранхай ажээ. Одноос олон гал ноцож байна гэнэ. Монгол олон ажээ. Одоо бид,\n\nХар муусайн монголтой\nХатгалдаж нэгэнт эхэлбэл\nХагацахад бэрх болно.\nХацрыг жадалж байвч\nХарсан нүдээ цавчдаггүй\nХар цусаа урсаж байвч\nХарьж огт буцдаггүй\nХатуужил ихт монголтой\nХамаагүй байлдаж болохгүй.\n\nОдоо Монголын агт туранхай байна. Бид, улсаа Алтай давуулан хөдөлгөж, цэргээ засацгааж монголчуудыг өдөөн даллаж, Алтайн өлгийг хүртэл нохой хэрэл хэрж займруулан чирэгдүүлж аваачвал бидний агт тарган тул гэдэс татран шавхарна. Монголын агт улам туранхилан ядрах болно. Тэр цагт бид өмнөөс нь довтлон оръё\" гэж илгээжээ. Тэр үгийг сонсоод Хүчүлүг хан өгүүлрүүн: \"Таян хан мөн аанай (муусайн) эм мэт зүрх алдаж, ийм үг хэлжээ. Монголчууд хаанаас олон байх вэ? Монголын олонхи, Жамухыг дагаж энд бидэнд байна.\n\nЖирэмсэн эмийн шээх газраас\nХол яваагүй\nЖижиг тугалын бэлчих газраас\nГарч үзээгүй\nЭм Таян зүрх алдаж\nЭнэ үгийг хэлжээ\" гэж\nЭцэг Таянханыг\nЭлдвээр дайран доромжилж\nЭлч хүний илгээв.\n\nЭм гэх зэрэг доромжлон хараасан энэ үгийг сонсоод Таян хан өгүүлрүүн:\n\n\"Хүчүлүг хөвүүн чиний\nХүчирхэх бардах их боловч\nХүрэлцэн алалдах цагт\nХүнээс урьд шантрах биз.\nТэр их омгоо\nТэрс дайсанд гаргаасай!\nТэмцэж нэгэнт эхэлбэл\nЗүгээр салах аргагүй\n\nгэв. Тэр үгийг сонсоод, Таян ханы дараах их ноён Хорису-бэчи өгүүлрүүн: \"Инанча Билгэ хан эцэг чинь\n\nАдил зэргийн дайсанд\nАраа үзүүлж яваагүй\nАлалдах тулалдах өдөрт\nАгтаа ухруулж үзээгүй\n\nбилээ. Өнөө чи юунд маргаашийн төлөө зүрх алдана. Чиний ингэж зүрх шантрахыг мэдсэн бол чиний хатан эх Гүрбэсийг авчирч цэрэг захируулах билүү? Хөөрхий Хүгсэү сабраг баатар өтлөөд цэргийн цааз сулрав. Монголын завшаан болох биз. Бид дийлдэх болно. Ай торлог Таян чи ялихгүй хүн ажээ\" гээд хоромсогоо дэлдэж эргэж хатиран одов."}]], "lines": {"Мя": "§191–192 · **Лх** §193 · **Пү** §194"}}, {"n": 24, "title": "Наху гүний тулаан", "vocab": [["магнай", "цэргийн тэргүүн хэсэг"], ["гол хүч", ""], ["хуяг", ""], ["алд", "урт хэмжих нэгж"], ["ухрах", ""]], "qs": ["Жамуха Чингисийн баатруудыг юутай зүйрлэсэн бэ?", "Таян хан яагаад дахин дахин ууланд авирсан бэ?", "Жамуха энэ тулаанд хэний талд байсан бэ? Үндэслэлээ хэл."], "fri": "Жамухын дүрслэлээс хамгийн гоё зүйрлэлийг сонгож зурна.", "warn": [], "strat": "Гол санаа ба хураангуй — долоо хоногийн уншлагыг 3 өгүүлбэрт багтаана.", "mode": "Бүлгээрээ шивнэж уншина: уншигч уншиж, бусад нь дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§195 (эхлэл)", "n": 195, "text": "Түүнд Таян хан хилэгнэж өгүүлрүүн: \"Үхэх амь, зовох бие бүгд нэгэн адил биз ээ. Тийм бол хатгалдъя\" гэж Хачир уснаас хөдөлж, Тамир уруу яваад Орхоныг гэтэлж, Наху гүний зүүн хормойг дайран, Цахир могод гэдэг газар хүрч ирэхэд Чингис хааны харуул үзэж, \"Найман хүрч айсуй\" гэж хэл хүргэвэл үүнийг сонсоод Чингис хаан зарлиг болруун: \"Олноос олон гарз гарна. Цөөнөөс цөөн гарз гарна\" гээд эсрэг нь морилж (өмнөөс нь очиж) тэдний харуулыг хөөгөөд цэргээ засахдаа Харгана зорчлоор хатгалдаж\nНуур байрлалаар байлдаж\nЦүүц хатгалдаанаар цөмөрч тулъя\"\nгэлдэв. Тэгээд Чингис хаан өөрөө магнайд явж, Хасарт гол хүчээ захируулав. Отчигин ноёноор бэлтгэл агтыг захируулав.\nНайман, Цахир могодоос буцаж, Наху гүний өвөр уулын хормой хижин байжээ. Тэгээд найманы харуулыг бидний харуул хөөж, Наху гүний өвөрт байгаа гол хүчинд нь хүрч очвол Таян хан үзэж, найманы хамт байлдахаар ирсэн Жамухаас асууруун: \"Тэр сүрэг хонинд орж хотонд нь хүртэл хөөж яваа чоно мэт довтлогч ямар хүмүүс вэ?\" гэвэл, Жамуха өгүүлрүүн: \"Тэмүжин анд минь, дөрвөн нохойг хүний махаар тэжээж гинжнээс уяж байдаг билээ. Одоо манай харуулыг хөөж ирэгчид тэр дөрвөн нохой биз.\n\nШирмэн төмөр магнайтай\nШивээ хурц хэлтэй\nГан төмөр зүрхтэй\nГадас цүүцэн хошуутай\nГалзуу дөрвөн нохой,\nТүмэн амьтныг хядахаар\nТөмөр гинжээс мултарч\nШууд барьж идэхээр\nШунахай шүлсээ савируулж айсуй\nШүүдрээр унд хийж\nШүлсээр хоол хийж\nСалхиар унаа хийж\nСаадгаар нөхөр хийж явдаг\nЗэв, Хубилай тэргүүтэй\nЗэлмэ, Сүбэдэй дараатай\nТэмүжин андын тэжээсэн\nТэр дөрвөн ноход\nТэмүүлэн хүрч ирэв\"\n\nгэжээ. Таян хан өгүүлрүүн: \"Тийм бол тэр муусайн амьтдаас хол байя\" гээд хойш ухарч уул өөд өгсөв. Бас тэдний хойноос харайлан дүүлэн яваа хүмүүсийг үзэж, Таян хан, Жамухаас асууруун:\n\n\"Эрт тавьсан унага\nЭхийн сүүг хөхөж\nЭрхлэн давхин наадах мэт\nЭрчлэн үсэрч яваа\nЭнэ хэдэн хүнийг\nЭрхэм Жамуха мэдэх үү?\"\nгэвэл, Жамуха өгүүлрүүн:\n\"Зэвсэгт эрийг айлгаж\nЗэв тоногийг булаадаг\nИлдэт эрийг няцааж\nИлүү дутууг булаадаг\nИдэт урууд, мангуд нар биз.\nБаатар зоригт тэд\nБайлдаан болох ойртсонд\nБаярлан харайж явна\" гэжээ."}], [{"k": "read", "ref": "§195 (Чингис, Хасар)", "n": 195, "text": "Тэндээс Таян хан өгүүлрүүн: \"Тийм бол тэр муусайнаас хол байя\" гэж бас ухран уул өөд авирав. \"Бас тэдний хойноос өлссөн шувуу мэт өрвөлзөн сөрвөлзөн ирэгчид хэн бэ?\" гэж Таян хан асуувал, Жамуха хариу өгүүлрүүн:\n\n\"Тэр хойноос ирэгч нь\nТэмүжин анд мөн байна\nХан Тэмүжин тэр\nХамаг биедээ цөм\nШөвөг хатгах зайгүй\nШөрөг төмөр өмсч\nЗүү шивэх завсаргүй\nЗүймэл хуяг өмсч\nӨлссөн шувуу мэт\nӨрвөлзөн сөрвөлзөн айсуй.\nУурласан араатан мэт\nУрагш дүүлэн айсуй.\n\nНайман аймаг та нар Монголыг үзмэгц, ишигний год ч үлдээхгүй [ийш тийш хувааж эзэлнэ] гэдэг байсан биш билүү? Одоо та нар үзтүгэй\" гэв. Энэ үгийг сонсоод Таян хан өгүүлрүүн: \"Ай тийм бол энэ уулын ам өөд бас авиръя\" гэж уул өгсөж нэлээд яваад Таян хан, Жамухаас асуув: \"Бас тэр хойноос нь ирж яваа нүсэр амьтан хэн бэ?\" гэвэл, Жамуха өгүүлрүүн:\n\n\"Хүндэт Өэлүн хатны\nХүний махаар тэжээсэн\nХүчит Хасар гэдэг\nХүү нь тэр мөн\nГурван бухаар зүтгүүлэвч\nГулзайхгүй хүчтэй\nГунжин үхрийг идэвч\nЦадахгүй ходоодтой\nХэдэн алд биедээ\nХэлхээ хуяг өмссөн\nХэрцгий догшин Хасар\nХэн бүхнийг идэхээр айсуй!\nХоромсого саадагтай хүнийг\nХовх татаад залгихад\nХомхой тэр Хасарын\nХоолойд тордоггүй гэнэ.\nАмьд хүнийг бүхлээр\nАвч шүүрээд залгихад\nАюулт тэр гайхлын\nАманд тээглэхгүй гэнэ.\nУур нь их хүрч\nУрдах сумаа шүүрч\nУхасхийн харвахад\nУулын цаадах хүмүс ч\nУул суманд оногдож\nУндуй сундуй үхэлгээнэ.\nХилэн нь их хүрч\nХийсвэр сумаа шүүрч\nХийн зүг харвахад\nХярын цаадах хүмүүс ч\nХяргах тэр суманд\nХядагдаж олноор үхэцгээнэ.\nИх дэлж харвавал\nЕсөн зуун алд газар харвадаг\nТатуу дэлж харвавал\nТаван зуун алд газар харвадаг\nХүнтэй адил хүн биш\nХүнийг идэх мангас\nХүчит Хасар тэр\nХүрч ирж явна\"\n\nгэвэл, Таян хан өгүүлрүүн: \"Тийм бол өндөр ууланд хоргодъё, дээш авиртугай\" гэж уул өөд улам авирав."}], [{"k": "read", "ref": "§195 (төгсгөл)", "n": 195, "text": "Бас Таян хан Жамухаас асуув: Түүний хойно ирж яваа хэн бэ? Гэвэл, Жамуха өгүүлрүүн:\n\n\"Өэлүн эхийн отгон хүү\nӨнөөх Отчигин тэр мөн.\nЭрхэмсэг танхи учраас\nЭрт унтдаг боловч\nЭрэлхэг зоригтой хүн\nОтгон хөвүүн учраас\nОрой босдог боловч\nОмог чадалтай эр\nБайлдаан үймээн болоход\nБайрандаа хоцордоггүй\nБаатар Отчигин тэр явна\"\nгэвэл, \"Тийм бол уулын оргил дээр гаръя\" гэж Таян хан хэлэв."}, {"k": "read", "ref": "§196", "n": 196, "text": "Жамуха, Таян ханд ийм үгийг хэлээд, найманаас хагацан салж, Чингис хаанд хүн явуулж хэлүүлсэн нь:\n\n\"Таян хан чамаас айж\nТайга ууланд шургаж оров.\nУхаан алдтал айгаад тэр\nУуланд хоргодон авирч байна\nТэмүжин чи хатуужиж хичээ\nТэд сандран дутааж байна.\nЭдний царайг ажиж харахад\nЭсэргүүцэх чадалгүй болжээ.\n\nБид нөхдийн хамт найманаас хагацав\" гэж илгээв. Чингис хаан, наран орой болох хирд Наху гүний уулыг бүсэлж аваад хонов. Тэр шөнө найманууд буруулан дутаах гээд Наху гүний уулан дээрээс халтиран унаж, нурсан түлээ мэт бие биеэ даралцаж ясаа хэмхчиж үхэцгээв. Маргааш нь Таян ханыг мохоож барив. [Таян хан хүнд шархтсан тул даруй үхэв. Рашид]. Хүчүлүг хан тусгаар байсан тул цөөн хүний хамт дутааж, Тамир гол хүрч нэхсэн цэрэгт гүйцээгдээд хүмрээ бэхлэлтийг барьж байлдсан боловч бас тэсвэрлэсэнгүй, цааш дутааж [Буйрун хан авгадаа] очив. Найманы улс иргэнийг Алтайн өлгийд мохоож цөмийг нь эрхэндээ оруулж авав. [Жамуха баруун зүг дутаав.] Жамухыг дагаж явсан Жадаран, хатагин, салжиуд, дөрвэн, тайчууд хонгирад тэргүүтэй аймгууд тэнд Чингис хаанд дагаж оров. Таяны эх Гүрбэсү хатныг Чингис хаан авчруулж өгүүлрүүн: \"Чи Монгол хүнийг муухай үнэртэй гэдэг бил үү? Чи одоо юунд ирэв? гэж түүнийг Чингис хаан өөрөө авлаа. [Таяаны аймгаас нэг хүн дутаав. Хасар түүнийг амьдаар барь гэсэнд Бат гүйцээд амьдаар барин ирэв. Үзвэл, өвөрт нь нэгэн тамга бий. Хасар өгүүлрүүн: \"Танай олон аймаг цэрэг цөм маныг дагаж байхад, чи энэ юмыг өвөрлөж хааш одно?\" гэвэл, тэр хүн өгүүлрүүн: \"Миний бие, тушаалын газраа үхтэл сахина. Энэ тамгыг хуучин эзэндээ хүргэж өгье гэсэн билээ. Аз дутаж баригдав\". Хасар өгүүлрүүн: \"Чи аль овгийн хүн, ямар тушаалтай байсан бэ?\" Тэр хүн өгүүлрүүн: \"Би язгуураас уйгур газрын хүн. Нэр Тататунга. Миний эзэн энэ тамгыг надад тушааж, эд идшийг гаргах ба оруулах явдлыг надад тушаасан билээ. Хасар бас асууруун: \"Энэ тамгыг юунд хэрэглэнэ?\" Тататунга өгүүлрүүн: \"Сайн хүнийг сонгож зарлиг бичиг явуулах аливаа үйлсэд хэрэглэн\" гэвэл, Хасар сайшааж шударга элбэрэлт хүн гэж Тэмүжинд мэдүүлж, аливаа бичиг явуулахад хэрэглэхээр тэр тамгыг мөнхүү Тататунгад тушаав. Хасар, Тататунгыг багш барин, бичиг хууль, цэргийн бодлого тэргүүтэн олон зүйл бичиг утга заалгаж удалгүй сурав. Мэргэн гэгээний Алтан товчийн 23 дугаар бүлэгт бий]."}]], "lines": {"Мя": "§195-ын эхлэл (Урууд, Мангуд хүртэл) · **Лх:** §195 (Чингис, Хасар) · **Пү:** §195-ын төгсгөл ба §196"}}, {"n": 25, "title": "Сүбээдэйн төмөр тэрэг ба Жамуха баригдсан нь", "vocab": [["төмөр тэрэг", ""], ["ятгах", ""], ["тэнүүчлэх", ""], ["хэмнэх", ""], ["шийтгэх", ""]], "qs": ["Чингис Сүбээдэйд аянд гарахын өмнө морь, хүнсний талаар ямар сургаал өгсөн бэ?", "Жамухыг барьж ирсэн нөхдийг нь Чингис яагаад шийтгэсэн бэ?", "Сүбээдэйд өгсөн зааврыг өнөөдөр аялалд гарах хүн хэрхэн хэрэглэж болох вэ?"], "fri": "«Аянд гарах хүний дүрэм» гэдэг 5 заалттай жагсаалтыг §199-өөс гаргана.", "warn": ["§197: Хулан хатны «шалгуулах» тухай хэсгийг алгасна."], "strat": "Гол санаа ба хураангуй — долоо хоногийн уншлагыг 3 өгүүлбэрт багтаана.", "mode": "Бүлгээрээ шивнэж уншина: уншигч уншиж, бусад нь дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§197", "n": 197, "text": "Мөн хулгана жилийн намар Хар талын үзүүр гэдэг газар мэргидийн Тогтоа бэхитэй Чингис хаан байлдаж, Тогтоаг дийлээд хөөж Саарь хээр гэдэг газар мэргидийн аймаг олныг дагуулан авав. Тогтоа, Худу, Чулуун хоёр хөвүүн ба цөөн хүнийг авч дутааж одов. [Худу, Чулууны эхнэрийг Чингис хаан хөвүүн Өгэдэйд өгөв]. Мэргид иргэнийг эзлэгдэхэд увас мэргидийн тэргүүлэгч Дайр-Үсүн гэгч хүн [байлдах саналгүй гэж] өөрийн охин Хуланг Чингис хаанд үзүүлэхээр авчирч явтал, замд тохиолдсон монгол цэрэг саатуулах тул Бааридайн Наяа ноёнд Дайр-Үсүн учирч өгүүлрүүн: \"Би энэ охиноо Чингис хаанд үзүүлэхээр явж байна\" гэвэл, Наяа ноён өгүүлрүүн: \"Охины чинь бид хамт аваачиж үзүүлье. Чи ганцаар одвол ийм самуун цагт тохиолдсон цэргүүд чамайг хорлох ба чиний охинтой самуурах тул хоёулаа хамт очъё. Чи намайг гурав хоног хүлээ\" гэж дуртгаж хүлээлгэв. Тэндээс Наяа ноён Дайр-Үсүн хоёр, Хуланыг авч Чингис хаанд хүргэв. Хуланыг Наяа ноён, гэртэ гурав хоног хүлээлгэснийг Чингис хаан сонсоод маш хилэгнэж \"Чи энэ Хуланыг ямар учиртай гэртээ хүлээлгэж байсан бэ?\" гэж чангад тулган асууж засаглан шийтгэх гэж байтал, Хулан өгүүлрүүн: \"Надад Наяа ноёны хэлсэн нь: \" Би Чингис хааны их ноён билээ. Бид хамт хаанд бараалхаж очъё. Замын зуур цэргүүд самуурах болзошгүй\" гэж ятгав. Хэрэв Наяа ноён учирч тусалсангүй бол бид завсрын цэрэгт баригдаж, тэдний завшаан болох бишүү. Хай энэ Наяатай учирсан минь болов. Одоо энэ Наяа ноёноос асуухын оронд хаан соёрхвол, тэнгэрээс заяасан, эцэг эхээс төрүүлсэн махбоды минь шалгаж үзтүгэй\"гэжээ. Бас Наяа ноён өгүүлрүүн:\n\n\"Хамаг олны эзэн\nХаан Чингис чамайг\nХайрлаж хүндлэхээс өөр\nХар санал надад үгүй.\nХарь улсаас олзолсон\nХацар гоо сайхан ба\nХатиртай сайн морьдыг\nХаан чиний юм гэж\nХалдалгүй харж\nХавиралгүй сахидаг билээ.\nҮүнээс өөр сэтгэлийг\nҮнэхээр санасан буюу\nҮйлдсэн зүйл байвал\nҮхэхэд надад гомдолгүй\".\n\nгэжээ. Чингис хаан, Хулан хатны үгийг зөвшөөрч, мөн өдөр тэр даруй сорьж үзвэл, Хулан хатны өчсөн үг үнэн байсан тул Чингис хаан Хулан хатныг соёрхож таалав. Наяа ноёны үг бас үнэн болсон тул \"Үнэн үгтэй шударга хүн байна. Их үйл хэргийг тушаая\"гэж өршөөж соёрхов."}, {"k": "read", "ref": "§198", "n": 198, "text": "Мэргид иргэнийг эзэлж, Тогтоа бэхийн их хөвүүн Худугийн хатан Тухай, Дөргэнэ хоёроос, Дөргэнэг тэнд Өгэдэй хаанд өгөв. Мэргидийн зарим улс дайжиж, Тайхал шивээнд очоод хороолон бэхэлжээ. Тэнд Чингис хаан зарлиг болруун: \"Сорхон-шарын хөвүүн Чимбай, зүүн гарын цэргийг аваад, хороолон бэхэлсэн мэргидийг бүсэл\" гэж илгээв.\nТогтоа хөвүүн Худу, Чулуун нарын хамт цөөн хүн дутааж гарсныг Чингис хаан нэхэж, Алтайн өвөрт өвөлжиж, үхэр жил (1205)-ийн хавар Арайн даваагаар давж одвол, найманы Хүчүлүг хан, улсаа алдаад цөөн хүнтэй дутааж яваа мэргидийн Тогтоатай уулзаж, Эрчис мөрний Бүхдэрмэ гэдэг газар хамтран цэргээ засаж байжээ. Чингис хаан хүрч байлдвал Тогтоа тэнд зэрлэг суманд оногдож үхэв. Хөвүүд нь түүний хүүрийг авч явж оршуулж завдахгүй болоод толгойг огтлон авч одов. Тэндээс найман, мэргид нар хамтран байлдаж барахгүй болоод буруулан дутааж, Эрчис мөрнийг гэтлэхэд олонх хүн нь усанд живж үхэв. Найман, мэргидийн цөөн хүн, Эрчисийг гэтлээд хагацан салав. Найманы Хүчүлүг хан, уйгарын Харлугийг дайран, Сартаулын газарт Чүй мөрөнд байгаа Хар хятадын Гүр ханд нийлэн очив. Мэргидийн Тогтоагийн хөвүүд Худу, Гал, Чулуун тэргүүтэн мэргид, ханлиныг, хипчагуудыг дайран одов.\nТэндээс Чингис хаан харьж, Арайн даваагаар давж, уул ордондоо буув. Чимбай, Тайхалд бүгсэн мэргидийг эзэлжээ. Чингис хаан зарлиг болж мэргидээс хядахы нь хядуулж, үлэгсдийг цэргүүдээр талуулж дээрэмдүүлэв. Бас урьд дагаж орсон мэргид, Аураг (арын буюу уул) ордноос урван боссонд ордны газар байсан хөтөч нар тэднийг даржээ. Тэнд Чингис хаан зарлиг болруун: \"Тэднийг хамт байлгая гэсэн билээ. Гэтэл тэд урвасан ажээ\" гээд мэргидийг зүг зүг дуустал хуваарилав.", "chap": "Хүчүлүгийн дутаасан ба Жамухын дарагдсан нь"}], [{"k": "read", "ref": "§199", "n": 199, "text": "Мөн үхэр жил, Чингис хаан зарлиг болж Сүбээдэйд төмөр тэрэг хийлгэж өгөөд Тогтоагийн хөвүүн Худу, Гал, Чулуун тэргүүтнийг нэхүүлэхээр илгээхдээ Сүбээдэйд зарлиг болгосон нь:\n\n\"Уршигт Тогтоагийн\nУрвасан хөвүүд\nУургат хулан шиг\nУхаан алдаж\nШархт буга шиг\nШантран мохож\nБуцаж харвалдсаар\nБуруулан дутаав.\nХөөгдсөн Худу, Чулуун нар\nХөөрөх жигүүртэй болж\nХөх тэнгэрт нисвэл\nХүлэг баатар чи\nХөнөөх шонхор болж\nХөөж тэднийг бариарай!\nМуу Тогтоагийн хөвүүд\nМунхаг тарвага болж\nМухар нүхэнд шургавал\nТөгс баатар Сүбээдэй\nТөмөр царил болж\nТөнхөж малтаж гүйцээрэй!\nӨшөөт мэргидийн үрс\nӨргөст загас болж\nӨргөн далайд орвол\nӨрлөг Сүбээдэй чи\nӨөш гувчуур болж\nӨлгөж гохдож бариарай!\nӨрлөг баатар чамайг\nӨндөр давааг давуулж\nӨргөн мөрнийг гэтлүүлж\nӨшөөт мэргидийг даруулахаар\nӨдөр болзож илгээв.\nУсны уртыг туулж\nГазрын холд хүрэхдээ\nУнах морьдоо гамнаж\nУулга хүнсээ хэмнэж\nУрьдаас болгоомжтой яв!\nАгт морьдоо муудуулбал\nАмаа баривч хожимдоно\nАливаа хүнсээ барвал\nАрвилан хэмнэвч оройтоно.\nАлсын тэр замд\nАвлах гөрөөс олон бий.\nАн ав хийсээр\nАлсын замыг бүү март\nХүнсний нэмэр болгож\nХүрэлцэх хэмжээгээр авла.\nЭрхэлсэн аваас ангид\nЭнгийн явах замд\nЭр цэргийн морьдын\nЭмээлийн хударгыг мулталж\nАгтны хазаарыг амгайчилж\nАяар зөөлөн яв\nЧанд эн журмыг\nЧармайн сахиж явбал\nАяны хүн дураар\nАвлан давхихаа болино.\nЦээрлэх журмыг зөрчсөн\nЦэргийн хүмүүсийг жанч\nТаних хүн, миний\nТаалал зарлигийг зөрчвөл\nТа нар надад явуул\nТанихгүй хүн, миний\nТаалал зарлигийг зөрчвөл\nТа нар мэдэж шийтэг.\nУул нурууг алславч\nУг санаагаа нэгтгэж\nМөрөн голыг гэтлэвч\nМөн санаагаа нэгтгэж\nМөнх тэнгэрийн хүчинд\nМөрийн хүч нэмэгдэж\nГайт Тогтоагийн хөвүүдийг\nГартаа оруулж баривал\nТэднийг авчрах хэрэггүй\nТэнд нь чигийг ологтун!\"\nгэж зарлиг болов.\nЧин зоригт Сүбээдэйд\nЧингис бас хэлэв:\n\"Чи одоо яваад\nЧивэлт мэргидийг сөнөө.\nБалчир цагт минь тэд\nБайн байн довтолж\nБурхан халдунд биднийг\nБултуулан сандаргаж байсан.\nӨшөөт тэр мэргидүүд\nӨнөө бас тангараглаад\nӨөр зүг дутаав.\nУртын үзүүрт хүрч\nГүний ёроолд орж\nТөлөөс өшөөг ав!\" гэж\nТөмөр тэргийг хэрэглүүлэн\nҮнэн итгэлтэй Сүбээдэйг\nҮхэр жил илгээв.\n\"Далд оровч\nИл мэт санаж\nХол очивч\nОйр мэт бодож\nБидэнд итгэлтэй явбал\nДээд тэнгэр ивээж\nДэмжих болно\" гэж\nБаатар Сүбээдэйг мордоход\nБас зарлиг болов."}], [{"k": "read", "ref": "§200", "n": 200, "text": "Найман мэргидийг эзэлж дуусвал, Наймантай хамт байсан Жамуха, улсаа алдаж, таван нөхөртэй тэнүүчилж яваад Танлу (Тагна) ууланд гарч нэгэн угалз алж шарж идэж байгаад Жамуха, нөхдөдөө хэлсэн нь: \"Хэний хөвүүд энэ өдөр угалз алж, ингэж идэж байна?\" гээд тэр угалзын махыг идэж байх завсар таван нөхөр нь Жамухыг гардан барьж Чингис хаанд авчирчээ. Жамуха, нөхдөдөө баригдаж ирээд Чингис хаанд хэлүүлсэн нь:\n\n\"Хар хэрээ\nХалтар нугасыг\nБарих болов\nХарц боол\nХан эзэндээ\nХалдах болов.\nХаан анд минь\nХайрлаж өршөө\nБор элээ\nБорлог нугасыг\nБарих болов\nБоол зарц\nБодот эзэндээ\nБосож халдав.\nБогд анд минь\nБодож үз\" гэжээ.\n\nЖамухын тэр үгэнд Чингис хаан зарлиг болруун: \"Хаан эзэндээ халдсан хүнийг яаж орхих вэ? Тийм хүн хэнтэй нөхөрлөх вэ? Хаан эзэндээ халдсан харц ардыг ураг төрлий нь хүртэл устга\" гэж зарлиг болов. Тэгээд Жамухын нүдний өмнө түүнд халдсан ардыг алав.\nЧингис хаан, Жамухад хэл гэж зарлиг болсон нь:\n\n\"Одоо бид хоёул\nОйртож бас нөхөрлөе.\nӨнөө болоход, чи\nӨрөөсөн арал болоод\nӨөр санаа агуулахгүй биз.\nХамт хоёул нийлж\nХарилцан найрамдаж\nУмартсанаа сануулж\nУнтсанаа сэрүүлж явъя\nӨөр замаар\nЯвсан боловч\nӨлзийт сайн нөхөр минь\nМөн билээ, чи.\nӨшилдөн байлдах\nӨдөр болоход\nӨр зүрхээ\nӨвддөг билээ, чи.\nАнгид замаар\nЯвсан боловч\nАнд сайн нөхөр минь\nМөн билээ, чи.\nУлайшран байлдах\nӨдөр болоход\nУушги зүрхээ\nӨвддөг билээ,чи\nХэдэн жишээг хэлбэл:\nХэрэйд улстай бид\nХархалзан элээтэд\nХатгалдах цаг болоход\nТоорил ханы санааг\nТодруулж бидэнд хэлээд\nТун их туслав.\nБас Найман улсыг\nҮгээр үхтэл сүрдүүлж\nАмаар айтал сандаргаж\nАливаа байдлыг мэдэгдэж\nАч тус хүргэсэн билээ\" гэж хэлүүлжээ."}]], "lines": {"Мя": "§197–198 · **Лх** §199 · **Пү** §200"}}, {"n": 26, "title": "Жамухын төгсгөл ба 1206 оны их хуралдаан", "vocab": [["есөн хөлт цагаан туг", ""], ["хуралдаан", ""], ["заргач", "шүүгч"], ["хөх дэвтэр", "бичигт тэмдэглэсэн хууль"], ["есөн алдаа уучлах", ""]], "qs": ["Жамуха хэрхэн үхэхийг хүссэн бэ, яагаад?", "Шигихутуг ямар үүрэг хүлээсэн бэ?", "Чингис, Жамуха хоёрын нөхөрлөлөөс та юу сурсан бэ?"], "fri": "Тэмүжин ба Жамуха хоёрын харилцааны түүхийг он цагийн хэлхээсээр гаргана (§116 → §201).", "warn": [], "strat": "Гол санаа ба хураангуй — долоо хоногийн уншлагыг 3 өгүүлбэрт багтаана.", "mode": "Бүлгээрээ шивнэж уншина: уншигч уншиж, бусад нь дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§201", "n": 201, "text": "Жамуха өгүүлрүүн:\n\n\"Эрт өнгөрсөн цагт\nЭнхрий бага насанд\nХорхунаг Жубурын хөндийд\nХоёул их найрамдаж\nХан анд чамтай\nХайрт найз болж\nҮл шингэх идээ идэлцэж\nНэг хөнжил нөмөрч\nНэг санал санаж явлаа.\nХөндлөнгийн хүнд хөөдөгдөж\nХөнөөх үгэнд автагдаж\nХажуугийн хүнд хатгагдаж\nХатгах үгэнд автагдаж\nХаан анд чамаас\nХагацан салаад, би\nХар нүүрийнхээ арьсыг\nХалцарч хуурсны адил\nХаан анд чиний\nХалуун царайг харахаас\nХалшран зовж явав\nУмарташгүй хэлэлцсэн\nУрьдын үгийг санаж\nУлаан нүүрнийхээ арьсыг\nУруулж өвчүүлснй адил\nУужим сэтгэлт андынхаа\nУхаант царайг харахаас\nУхран зовч явав.\nХаан анд намайг\nХайрлан соёрхож\nХамтран нөхцөе гэжээ.\nНөхцөх цагт\nНөхцсөнгүй, би\nТэмүжин чи\nТүмэн улсыг\nТөвшин болгож\nХарь улсыг\nХамтатган захирч\nХамгийг эзэлсэн\nХаан болоод\nДэлхий дахин\nБэлэн байхад\nДэмий надаар\nЮу хийх вэ?\nХаранхуй шөнийн\nЗүүд болж\nГэгээн өдрийн\nГэмтэн болж\nХаан андыг\nЗовоох болно, би\nЭнгэрийн чинь бөөс\nЭгмийн чинь өргөс\nБолох биз, би.\nАтаат эмийн үгээр\nАндаас салаад\nАлжаан зовов, би\nЭнэ насны дотор\nЭрхэм анд бидний\nЭнхрий нэр алдаршиж\nУргах нарнаас аваад\nШингэх наран хүртэл\nУлс даяарт дуурьсав.\nСэргэлэн баатар чамд\nСэцэн эх заяажээ.\nЭрэлхэг баатар андад\nЭрдэмтэн дүү нар төржээ.\nДалан гурван хүлэгтэй\nДархан өрлөг нөхөдтэй\nДалай Чингис чамдаа\nДарагдаж мөхөв, би чинь\nӨөрийн эцэг эхээс\nӨнчин бие хоцроод\nИтгэх сайн нөхөргүй\nИдтэй сайн дүүгүй\nИлүү дутуу үгтэй\nИх домогч эхнэртэй\nИйм байсан учраас\nТэнгэр эцгээс заяатай\nТэмүжин чамд дийлэгдэв, би\nАнд нөхөр минь соёрхож\nАмийг минь үтэр тонилговол\nАриун зүрх чинь амарч\nАмгалан жаргах болно\nАнд чи соёрхож\nАсгарах цусыг гаргалгүй\nАлуулж өршөө, намайг\nҮхэж хэвтэх яс минь\nҮржилт эх дэлхийд\nҮүрд оршиж байгаад\nИтгэлт андын ургийг\nИвээж тэтгэх болтугай гэж\nИйм ерөөлийг тавъя\nӨөр төрлийн би\nӨндөр төрөлт андын\nӨмөг сүлдэнд дарагдав\nХүсэн үгийг минь\nМартахгүй\nХэзээ ямагт\nДурдаж яваарай!\n\nОдоо намайг тонилготугай!\" гэж өгүүлбэл, эдгээр үгийг сонсоод Чингис хаан өгүүлрүүн:\n\n\"Анд нөхөр Жамуха\nАнги тасархай явавч\nАтаа хор санаж\nАмиа хорлох үгийг\nАрай хэлсэнгүй билээ.\nЗасарч чадах боловч\nЗасрахгүй хичээхгүй байна.\nҮзэх төлгөөр мэргэлбэл\nҮхэх цаг нь болоогүй мэт\nДээд язгуурын хүнийг\nДэмий хорлож болохгүй\nХүний амийг хорлоход\nХүндэт шалтгаан хэрэгтэй.\n\nЭнэ тухайн шалтгааныг хэлбэл, урьд Жочи Дармала, Тайчар хоёр адуугаа харилцан дээрэмдэлцэх үед Жамуха анд чи, буруу зан, бульхай явдал гаргаж, Далан балжууд гэдэг газар байлдаж, намайг Зээрэний хавчилд бачимдуулан айлгаснаа санаж байна уу? Одоо бас нөхөрлөе гэвэл зөвшөөрөхгүй байна. Амийг чинь хайрлах боловч аргагүйд хүрэв гэж хэлэгтүн. Одоо чиний үгээр цус гаргалгүй нөгчүүлж, хүүрий чинь ил хаяхгүй, хүндэт ёсоор оршуулъя\" гэж зарлиг болов. Тэнд Жамухыг үхүүлж хүүрийг оршуулав.\n\nТэгээд эсгий туургатан улс энх шударга болж, барс жил (1206) Онон мөрний эхэнд хуралдаж, есөн хөлт цагаан тугаа мандуулаад Тэмүжинд Чингис хаан (Далай хаан) цолыг өргөв. Мухулайд гоо ван (улсын ван) цолыг тэнд өгөв. Найманы Хүчүлүг ханыг нэхүүлэхээр Зэвийг мордуулав. Монгол угсаатан улсыг нэгтгэн барж Чингис хаан зарлиг болруун:"}], [{"k": "retell", "ref": "§202", "n": 202, "text": "§202. \"Улс төрийг байгуулалцсан урьдын гавьяат нөхдөө угсаатан ноёд болгож, мятралгүй зүтгэсэн миний хайрт нөхдийг мянганы ноёд өргөмжилж, соёрхлын\nүгийг хэлье\" гэж зарлиг болов. Мяганы ноёдыг томилж тушаасан нь: 1. Мэнлиг эцэг, 2. Боорчи, 3. Мухулай гоо ван, 4. Хорчи, 5. Илугай, 6. Жорчидай, 7. Хунан, 8. Хубилай, 9. Зэлмэ, 10. Түгэ, 11. Дэгэй, 12. Толун, 13.Үнгүр, 14. Чүлгэдэй, 15. Борохул, 16. Шигихутуг, 17. Хүчү, 18. Хөхөчү, 19. Хоргасун, 20. Үсүн, 21. Хуилдар, 22. Шилүгэй, 23. Жидай, 24. Тахай, 25. Цагаан гуа, 26. Алаг, 27. Сорхан-шара, 28. Булугун, 29. Харачар, 30. Хөхөчос, 31. Сүйхэтү, 32. Наяа, 33. Жунсо, 34. Хүчүгүр, 35. Бала, 36. Оронартай, 37. Дайр, 38. Мүгэ, 39. Бужир, 40. Мүнгүүр, 41. Долоодай, 42. Бөгэн, 43. Худус, 44. Марал, 45. Жибгэ, 46. Юрүхан. 47. Хөхө, 48. Зэв, 49. Удутай, 50. Бала-чэрби, 51. Хэтэ, 52. Сүбээдэй, 53. Мөнх, 54. Халжа, 55. Хурчахус, 56. Гэүги, 57. Бадай, 58. Хишилиг, 59. Хэтэй, 60. Чаурхай, 61. Хонгиран, 62. Тогоонтөмөр, 63. Мэгэтү, 64. Хадаан, 65. Мороха, 66. Дори-бөхө, 67. Идухадай, 68. Ширахул, 69. Даун, 70. Дамачи, 71. Хауран, 72. Алчи, 73. Тобсаха, 74. Тунхудай, 75. Тобуха, 76. Ажинай, 77. Түйдхэр, 78. Сачуур, 79. Жидэр, 80. Олар хүргэн, 81. Хингиадай, 82. Буха-хүргэн, 83. Хурил, 84. Ашиг хүргэн, 85. Хадай хүргэн, 86. Чигу хүргэн, 87, 88. Алчи хүргэн, гурван мянган хонгирад, 89, 90. Буту хүргэн, 2 мянган Ихирэс, 91, 92, 93, 94, 95. Онгуудын Алхушдигид хури хүргэн, таван мянгат онгууд, ойн иргэнээс гадна, Монгол улсын мянгатын ноёдыг Чингис хааны томилсноор мянгатын ноёд ерэн таван хүн болов."}, {"k": "read", "ref": "§203", "n": 203, "text": "Бас Чингис хаан хүргэдийн хамт эдгээр ерэн таван мянганы ноёдыг томилоод тэр дотор зарлиг болруун: \"Өмөг туст нөхдөдөө өөр соёрхлыг өгье. Боорчи, Мухулай тэргүүтэн бусад ноёдыг ирүүлтүгэй\" гэж тэр дотор байсан Шигихутугийг \"Тэднийг урьж авчир\" гэсэнд Шигихутуг өгүүлрүүн:\n\n\"Боорчи, Мухулай нар\nБэлт биднээс\nИх тусалж\nИлүү зүтгэсэн үү?\nТэмдэглэн соёрхоход\nТэднээс би\nДутуу тусалж\nЯдуу зүтгэсэн үү?\nӨлгийтэй цагаасаа би\nӨндөр босгыг чинь түшиж\nӨдий их сахалтай\nӨвгөн буурал болтлоо\nӨөр санаа санасангүй\nӨршөөлд чинь багтсаар ирэв.\nАлмай бага наснаасаа би\nАлтан босгыг чинь түшиж\nАмандаа өдий сахалтай\nАхмад настай болтлоо\nАлжааж бэрхшээсэн зүйлгүй\nАль чадахаар зүтгэв.\nХөлдөө хэвтүүлж\nХөнжилдөө хучиж\nХөвүүн адилаар\nХүмүүжүүлэв, намайг\nДэргэдээ хэвтүүлж\nДээлдээ хучиж\nДүү мэтээр\nТүшиж өсгөв.\n\nОдоо надад ямар соёрхлыг хайрлах вэ?\" гэж хэлсэнд Чингис хаан, Шигихутугт өгүүлрүүн: \"Чи миний зургадугаар дүү биш үү? Өргөмөл дүү чамд өөрийн дүү нарын адилаар өмч хувийг олгоё. Бас чиний хүргэсэн ач тусыг бодож, есөн ослыг хэлтрүүлэх болгоё\" гэж зарлиг болов. \"Мөнх тэнгэрийн ивээлээр улс гүрнийг тохинуулж байхад чи, үзэх нүд, сонсох чих болж яв. Бидний эх ба дүү нар, хөвүүдэд эсгий туургатны дотроос эзлэх хувийг олгож, хавтсан үүдтэний дотроос харъяалах ардыг хувааж өг. Чиний тушаасан үгийг хэн ч өөрчилж үл болно\" гэж зарлиг болов. Бас Шигихутугийг \"Бүх улсын доторх хулгайг цээрлүүлж, худлыг мохоож, үхүүлэх ёстойг үхүүлж, яллах ёстойг яллаж бай\" гэж бүх улсын дээд заргач (шүүгч) болгов. Бас \"Нийт улсын өмчийг хувааж заргыг шийтгэж, түүнийгээ хөх дэвтэрт бичиж тэмдэглэгтүн. Надтай зөвлөж, Шигихутугийн шийтгээд цагаан цаасан дээр хөх бичиг бичиж дэвтэрлэснийг ургийн урагт хүртэл үүрд хэн ч бүү өөрчилтүгэй\" гэж зарлиг болов. Шигихутуг өгүүлрүүн: \"Миний мэтийн өргөдөл (өргөмөл) дүү, хааны дүүтэй адилаар хувь өмч авч яаж болох вэ? Хаан соёрхвол, байшин гэртэй, балгас хотын иргэдээс авъя\" гэж өчвөл \"Чи өөрөө энэ хэргийг бүртгэж шийтгэх тул өөрөө мэдэж гүйцэтгэ\" гэв. Шигихутуг өөрөө хаанаас соёрхлыг олж төгсөөд гарч, Боорчи, Мухулай тэргүүтэн ноёдыг урьж оруулав."}], [{"k": "read", "ref": "§204", "n": 204, "text": "Тэндээс Чингис хаан, Мэнлиг эцэгт зарлиг болруун: \"Төрөхийн хамт төрөлцсөн, өсөхийн хамт өсөлцсөн өлзийт буянт чиний, өршөөл тус хүргэсэн нь өдий төдий болжээ. Тэр дотроос тэмдэглэж хэлбэл, Ван хан эцэг, Сэнгүм анд хоёр намайг мэхэлж урьсанд очих замдаа Мэнлиг эцгийн гэрт хоновол, чи намайг ятгасангүй бол хар усанд живж, халуун галд түлэгдэж үхэх билээ, би. Тэр тусы чинь санаж, энэ эрхэм суудалд суулгаж он бүр осолдохгүй, сар бүр саатахгүй сайшаал шагналыг өгч, үрийн үрд хүртэл үүрд мялааж байя\" гэж зарлиг болов."}, {"k": "read", "ref": "§205", "n": 205, "text": "Бас Чингис хаан, Боорчид өгүүлрүүн: \"Насан бага цагт найман шарга морио алдаад гурван хоног нэхэж явах замд чамтай уулзсан билээ. Мунгинаж яваа надад тусалъя гэж чи гэртээ харьж, эцэгтээ хэлэлгүйгээр гүүний айрагтай суулгаа хээр орхиж, миний оготор хонгор морийг юүлж, орог шинхул морийг надад унуулаад өөрөө хурдан ухаа морио унаж, адуугаа эзэнгүй орхиод яаравчлан надтай бас гурван хоног дээрэмчдийг нэхсэн билээ. Бид хоёр, шарга морьды минь дээрэмдсэн хүрээнд хүрээд, хүрээлсэн гэрүүдийн захад байсан шарга морьдыг гадагш хөөж дутааж авчрав. Чи Наху баяны ганц хөвүүн бөгөөд юу мэдэж надтай нөхөрлөсөн билээ? Чи үнэн сайхан сэтгэлээр нөхөрлөв. Түүний хойно чамайг санасаар явж, би Бэлгүтэйг илгээж нөхөрлөе гэвэл, чи богтгор хонгороо унаж, бор өрмөг хэвнэгээ нөмөрч өөрөө хүрч ирэв. Гурван мэргид бидэнд халдаж, Бурхан халдуныг гурван удаа бүслэхэд чи бидний хамт бүслэгдэв. Бас түүний хойно, Далан нэмүргэд татаартай тулалдаж хоноход өдөр шөнө үргэлж хур зүсрэн оров. Тэр шөнө намайг унтуулах гэж нөмрөгөө надад нөмөргөөд, миний дээр борооны усыг дусуулахгүйгээр шөнө турш зогсохдоо чи өрөөсөн хөлөө ганц удаа сольж гишгэсэн билээ. Хүлэг баатрын шинж\nэнэ мөн. Түүнээс бусад чиний зүтгэлийн алийг хэлж барах вэ? Боорчи Мухулай хоёр, зөв явдлыг минь зөвшөөрөн тэтгэж, буруу явдлыг минь буцаан зогсоож энэ их сууринд хүргэв. Одоо бүгдийн дээр суулгаж, есөн удаа осол гаргавч ял хэлэлцэхгүй болгоё. Боорчи, баруун гарын Алтай орчмын түмнийг мэдэж захиртугай\" гэж зарлиг болов."}]], "lines": {"Мя": "§201 (хоёр хэсэг: Жамуха ба 1206 оны хуралдаан) · **Лх** §203 · **Пү** §204–205 (§202-ын 95 нэрийг багш харуулж товч ярина)"}}, {"n": 27, "title": "Мухулай, Хорчи, Жорчидай, Хубилайг шагнасан нь", "vocab": [["гоо ван", "улсын ван"], ["ойн иргэн", ""], ["түмний ноён", ""], ["дуулгаргүй", "үг сонсдоггүй"], ["мэлзэх", ""]], "qs": ["Хорчи юуны төлөө шагнагдсан бэ?", "Жорчидай ямар ач тус хүргэсэн бэ?", "Хүнийг шагнахдаа Чингис юуг хамгийн их үнэлдэг байсан бэ? Гурвыг нэрлэ."], "fri": "«Ач тусыг санах» хуудсанд Боорчи, Мэнлиг, Мухулай, Жорчидайг нэмнэ.", "warn": [], "strat": "Гол санаа ба хураангуй — долоо хоногийн уншлагыг 3 өгүүлбэрт багтаана.", "mode": "Бүлгээрээ шивнэж уншина: уншигч уншиж, бусад нь дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§206", "n": 206, "text": "Бас Мухулайд Чингис хаан зарлиг болруун: \"Хотала хааны бүжиглэх Хорхунаг-жубурын хөндийд саглагар модны ёроолд саатан буух цагт Мухулай, тэнгэрийн зайран (сүлд)-ы заасан үгийг тэмдэглэн хэлсний тул тэнд би (Мухулайн эцэг) Гүн гуаг дурсаж, Мухулайтай үг барилдсан билээ. Одоо түүний ёсоор би их сууринд суусны тул Мухулайг ургийн урагт хүртэл улс гүрний гоо ван болгоё\" гэж гоо ван нэр өгөв. \"Мухулай гоо ван, зүүн гарын Хараун-жидуны хавийн түмнийг мэдтүгэй\" гэж зарлиг болов."}, {"k": "read", "ref": "§207", "n": 207, "text": "Чингис хаан, Хорчид өгүүлрүүн:\n\n\"Өчүүхэн балчир цагаас\nӨдий болтол минь\nӨлзийт нөхөр болж\nНойтонд хамт норж\nХүйтэнд хамт хөрч\nХүчээ өргөв, чи\nХол урьдын цагт\nХорчи чи мэргэлээд\nЗөгнөж хэлсэн үгээ\nЗөв болгон тохирч\nТэнгэрийн өршөөл хүчээр\nТэр ёсоор бүтвэл\nГучин эхнэр авъя гэж\nГуйсан билээ, чи.\n\nОдоо чи хэлсэн үг бүтсэний тул эзэлж оруулсан улсын дотроос чи сайн эхнэр, сайхан хүүхнүүдийг сонгож ав\" гэж зарлиг болов. Бас \"Гурван мянган баарины дээр Тахай Ашиг хоёрын хамт Адаргины чинос, тоолис, тэлэнгүүд аймгийг нийлүүлж түмэн иргэн болгоод Хорчи захирч, Эрчис мөрний дагуу ойн иргэнд хүртэлх нутгийг эзэмшин нутаглаж, бас ойн түмэн иргэнийг даргалж мэдтүгэй\"гэж зарлиг болов. \"Хорчийн зөвшөөрөлгүйгээр ойн иргэн ийш тийш нүүж үл болно. Хорчийн үгийг зөрчигчдийг шийтгэтүгэй\" гэж зарлиг болов."}], [{"k": "read", "ref": "§208", "n": 208, "text": "Бас Чингис хаан, Жорчидайд өгүүлрүүн: \"Чиний бүтээсэн эрхэм тусыг дурдвал, Хэрэйдтэй, Хархалзан элээтэд хатгалдан байлдах цагт Хуилдар анд тэргүүтэн байлдана гэсэн боловч, чухам хэргийг бүтээсэн нь чи мөн. Жорчидай чи довтолж ороод Жүрхин, Түбэгэн, Дунгайд, Хориширэмүний мянган торгууд, шилдэг цэрэг бүгдийг дарсаар их гол хүчинд хүрч, Сэнгүмийн энгэсэг хацрыг харван шархтуулж, мөнх тэнгэрт ялахын үүдийг нээв. Сэнгүмийг шархтуулсангүй бол бид ямар болохыг мэдэхгүй. Жорчидай чиний хүргэсэн эрхэм их тус тэр байна. Тэндээс зайлж, Халх гол уруу нүүхэд Жорчидай чамайг би өндөр уулын нөмөр мэт өмөг болгон санаж явлаа. Тэндээс бид Балжун нуурт ундлахаар буув. Жич, Балжун нуураас Жорчидайг туршуул (алхинч) болгож Хэрэйдэд явуулсан билээ. Тэнгэр\nгазрын ивээлээр бид хэрэйд иргэнийг номхтгон дагуулав. Голлох Хэрэйд улсыг салгаж дарсан учраас дагалдах найман, мэргидийн зориг шантарч байлдаж чадахгүй буснив. Мэргид, найман нарыг бутран сарних завсар, Хэрэйдийн Жаха-хамбу, хоёр охиноо дагах шалтгаанаар харьяат нараа хамт авч үлдэв. Гэтэл тэр дайсагнаж одсон тул Жорчидай нэхэж, нэгэнт зайлан одсон Жаха-хамбыг заль аргаар барьж тонилгов. Тэр Жаха-хамбын улсыг алж эзлэв. Жорчидайн бас нэг тус нь энэ мөн\".\n\nАлалдах өдөр\nАмиа хайрлахгүй\nАчийг хүргэж\nБайлдах өдөр\nБайраа алдахгүй\nБаатарлан зүтгэсний тул\n\nЧингис хаан, Ибага бэхи хатнаа Жорчидайд соёрхож өгөөд Ибагад өгүүлрүүн:\n\n\"Авир зангий чинь голсон биш.\nАриун үзэсгэлэнг чинь чамласан биш,\n[Хөлийг чинь шивэртэй гэсэн биш,\nХөлсийг чинь үнэртэй гэсэн биш, А.то]\nӨврөө дулаацуулж\nХөлөө хучуулсан\nӨөрийн хатан чамайг\nИх төрийн үйлст\nИлт зүтгэсэн Жорчидайд\nИйнхүү соёрхох болов.\nХатгалдах цагт\nХалх болж,\nХагацсан улсыг\nХамтатган өгч\nХутгалдан байлдахад\nХуяг болж\nХуваасан улсыг\nХурааж өгсөн\n\nЖорчидайн ачийг хариулж, гавьяаг тэмдэглэхийн тул чамайг өгөв. Үүнээс хойш миний ургаас хаан ширээнд залгамжлан суугчид, энэ мэт тус хийснийг хариулсан ёсыг сэтгэж, миний үгийг өөрчлөлгүйгээр ургийн урагт хүртэл Ибагын ор суурь (нэр хүнд)-ийг бүү тасалтугай\" гэж зарлиг болов. Бас Чингис хаан, Ибагад өгүүлрүүн: \"Чиний эцэг Жаха-хамбу, чамд инж болгож Ашиг-Төмөр, Алчиг хоёр тогоочийн хамт хоёр зуун хүнийг өгсөн билээ. Одоо чи урууд иргэнд очихдоо дурсгал болгож, надад инжийн хүмүүсээс Ашиг-Төмөр тогоочоо нэгэн зуун хүний хамт өгч од\" гэж авав. Бас Чингис хаан, Жорчидайд өгүүлрүүн: \"Ибага хатнаа чамд өгөв. Чи дөрвөн мянган уруудаа мэдэж захиртугай\" гэж соёрхож зарлиг болов."}], [{"k": "read", "ref": "§209", "n": 209, "text": "Бас Чингис хаан, Хубилайд өгүүлрүүн: \"Чи хүчтэний хүзүүг мушгиж, бөхчүүдийн бөгсийг шороодуулж өгөв. Одоо Хубилай, Зэлмэ, Зэв, Сүбээдэй та дөрвүүл сайн нохой мэт итгэлтэй нөхөд мөн. Та нарыг хаана ч илгээвэл,\n\nХүр гэсэн газар хүрч\nХүр чулууг хэмх цохиж\nХалд гэсэн газар халдаж\nХад чулууг хага цохиж\nЦэгээн чулууг бутартал\nЦээлийн улсыг цалгитал\nНиргэж нядалж явав.\n\nХувилай, Зэлмэ, Зэв, Сүбээдэй дөрвөн нохойгоо зорьсон газартай явуулаад, Боорчи, Мухулай, Борохул, Чулуун дөрвөн хүлэг баатраа дэргэдээ авч, хатгалдах өдөр хамгийн түрүүнд урууд, мангудын цэргийг Жорчидай Хуилдар хоёроор толгойлуулан мордуулбал сая миний сэтгэл бүрнээ амардаг билээ\" гэв. \"Хубилай чи цэргийн үйл бүгдийг ерөнхийлөн захирч бай\" гэж соёрхож зарлиг болов. Бас Бидүгүн, их дуулгаргүй тул би буруушааж, мянганы ноён болгосонгүй. Чи түүнийг сургаж үз. Тэр чамтай зөвшиж нэг мянганыг захирч явтугай. Бидүгүнийг хойш ямар болохыг бид үзье\" гэв.", "chap": "Шадар хишигтэн цэргийг байгуулсан нь"}, {"k": "read", "ref": "§210", "n": 210, "text": "Бас Чингис хаан, Гэнигэдэй Хунанд өгүүлрүүн:\n\"Боорчи, Мухулай тэргүүтэн ноёд оо, Додай Доголху тэргүүтэн чэрби нар аа! Энэ хунан,\n\nХаранхуй шөнө\nХалдах чоно болж\nГэгээн өдөр\nХэсэх хэрээ болж\nНүүхэд үлдэхгүй\nҮлдэхэд нүүхгүй\nҮргэлж намайг дагаж\nХарийн дайсанд\nХалуун нүүр өгч\nХарилцдаггүй\nӨшөөт хүнд\nӨмөг тус болж\nӨөр зан гаргадаггүй билээ.\n\nХунан Хөхөчос хоёртой зөвлөж, хамаг үйлсийг үйлдэгтүн\" гэж зарлиг болов. \"Хөвүүдий минь ах Жүчи биз. Хунан, Гэнигэс овогтноо тэргүүлэн захирч, миний хөвүүн Жүчийн дор түмний ноён болтугай\" гэж зарлиг болов. \"Хунан Хөхөчос, Дэгэй, Үсүн өвгөн энэ дөрвүүл, үзсэнээ нуухгүй, үнэн үгээ хэлж, мэдсэнээ мэлзэхгүй, сонссон үгээ сонсгодог билээ\"."}]], "lines": {"Мя": "§206–207 · **Лх** §208 · **Пү** §209–210"}}, {"n": 28, "title": "Борохул ба Алтани, Сорхон-шар, хэвтүүлийн магтаал", "vocab": [["хишиг", "ээлж"], ["бэрээ", "саваа"], ["цөлөх", ""], ["сул хүн", "чөлөөт хүн"], ["соёрхол", "шагнал"]], "qs": ["Толуйг хэн, хэрхэн аварсан, гавьяаг нь хэнд өгсөн бэ?", "Сорхон-шар ямар соёрхол хүссэн бэ?", "Алтанийн гавьяаг хүлээн зөвшөөрсөн нь юуг харуулж байна?"], "fri": "Хишигтний дүрмийг (§227: ээлж тасалбал 3, 7, 37 бэрээ) ангийн дүрэмтэй харьцуулна.", "warn": ["§214: Харгил шарын халдлагын хэсэг."], "strat": "Дүгнэлт хийх ба үнэлэх — дүрийн үйлдлийг үнэлж, өнөөгийн амьдралтай холбоно.", "mode": "Чимээгүй уншаад, багш 2–3 хүүхдээс хэсэг уншуулна.", "quiz": null, "days": [[{"k": "read", "ref": "§211", "n": 211, "text": "Бас Чингис хаан, Зэлмэд өгүүлрүүн: \"Жарчиудай өвгөн, үлээх хөөргөө үүрч өчүүхэн хөвүүнээ дагуулж, бурхан халдунаас бууж ирээд Ононы Дэлүүн болдогт намайг төрөх цагт булган өлгийг өгөв. Түүнээс хойш ч босго хатавчийн боол, өрх үүдний өмч болж, өдий төдий тусыг хүргэв. Булган өлгийд төрсөн буянт нөхөр минь, хамт төрөөд хань болж өссөн хайрт нөхөр Зэлмэ минь чамайг есөн удаа осол гаргахад буруушаан яллахгүй\" гэж зарлиг болов."}, {"k": "retell", "ref": "§212–213", "n": 212, "text": "§212. Бас Чингис хаан, Толунд өгүүлрүүн: \"Эцгээс тусгаар мянганыг захирч байсан билээ. Улсыг хураан тохинуулахад чи өөрийн эцгийн өрөөл жигүүр болон зүтгэж бүтээсний тул чэрби гэдэг цолыг авав. Одоо өөрийн олсон зөөсөн иргэнээ мянгат болгож, Турухантай зөвшиж захирагтун\" гэж зарлиг болов.\n\n§213. Бас Чингис хаан, Үнгүр буурчид өгүүлрүүн: \"Мэнгитү хианы хөвүүн Үнгүр чи, гурван аймаг тохурауд, таван аймаг таргууд, чаншиуд, баядаа дагуулж нэгэн хүрээ болж\n\nБудан мананд төөрөлгүй\nБулаалдах дайн салалгүй\nНойтонд хамт норж\nХүйтэнд хамт хөрж\nЯвав чи\n\nОдоо ямар соёрхол авах вэ, чи?\" гэвэл Үнгүр өгүүлрүүн: \"Соёрхлыг сонгуулбал хамаг баяд ах дүү нар, хамаагүй бутран тарж байна. Хаан соёрхвол, баяд ах дүү нараа цуглуулан захиръя\" гэвэл, \"Тэг, Баяд ах дүү нараа цуглуулж мянганыг чи захиртугай!\" гэж зарлиг болов. Бас Чингис хаан зарлиг болруун: \"Борохул Үнгүр та хоёр, буурч түгээгч болж, баруун зүүн этгээдэд барих идээг түгээж, баруун талын хүмүүст байр байраар олгож, зүүн талын хүмүүст зүй зүйгээр өгч идээ хүнсийг түгээвэл миний хоолой онгойж, сэтгэл амардаг билээ. Үнгүр Борохул хоёр морилон явж (мориор явж) олон хүнд идээ рэг сөнгийн баруун зүүн этгээдэд идээ базааж бэлтгээд \"Та хоёр, Толунтай хамт төвлөн суугаад идээг түгээж байгтун\" гэж суурийг зааж өгөв."}, {"k": "read", "ref": "§214", "n": 214, "text": "Бас Чингис хаан, Борохулд өгүүлрүүн: \"Миний эх, Шигихутуг, Борохул, Хүчү, Хөхөчү та дөрвийг дүрвэсэн иргэний нүүсэн нутгаас\n\nХөдөөнөөс олж\nХөлдөө бүүвэйлж\nХүмүүжүүлэн тэжээж\nХүзүүнээс чинь татаж\nХүний зэрэг болгож\nЭгмээс чинь татаж\nЭрийн зэрэгт оруулж\n\nХөвүүд бидний нөхөр сүүдэр болгоё гэж тэжээжээ. Миний эхийн тэжээсэн ачийг та нар их хариулан зүтгэв. Борохул надад нөхөр болж\n\nХурдан аянд мордож\nХуртай шөнө тохиолдовч\nХоол ундгүйгээр\nХоосон хонуулсан удаагүй,\nЯаралтай дайнд\nЯмар ч бэрхшээл тохиолдовч\nШөл тасалдуулж\nӨл алдуулж байсангүй\nӨвөг эцгийг минь хорлосон\nӨстөн татаарыг доройтуулж\nӨшил өшиж\nХясал хясаж\nТэр татаар иргэнийг\nТэрэгний бултай чацуулж\nТүүнээс өндөр нуруутныг\nТүүж хядах цагт\n\nТатаарын Харгил шар, ганцаараа дутааж яваад өлссөний тул аргагүй ирж, манай эхийн гэрт орж ирээд \"Идэх юм гуйя\" гэсэнд, \"Идэх юм гуйвал тэнд суу\" гэж баруун исэр (ор)-ийн өмнөд үзүүрт суулгав. Тэр цагт таван настай байсан хөвүүн Толуй гаднаас орж ирээд гэдрэг гүйж гармагц, Харгил шар босон харайж, Толуйг сугандаа хавцуулж гүйхийн хамт хутга тэмтэрч сугалан авахыг завдахад эхийн гэрт зүүн талд сууж байсан Алтани \"Хүүгий минь аллаа\" гэж эхийн орилон бархирахыг сонсож гүйн гарч, Харгил шарын хойноос гүйцэж нэг гараараа үснээс нь зууран барьж, нөгөө гараараа хутгыг сугалж байсан гары нь барьж угзраад хутгыг алдуулав. Тэр үед гэрийн ард мугалзар хар үхрийг тэлэн алж байсан Жидай Зэлмэ хоёр, Алтанийн дууг сонсоод сүхээ барьсаар, улаан цустай хэвээр гүйн ирж, татаарын Харгил шарыг мөн тэнд нь сүхээр цохиж, хутгаар бүлж алав. Алтани Жидай Зэлмэ гурав, хөвүүний амь аварсан гавьяаг булаалдахад Жидай Зэлмэ хоёр өгүүлрүүн: \"Бид даруй гүйн ирж түүнийг эс алсан бол ганц эхнэр Алтани юу хийж чадах вэ? Хөвүүний амийг хорлосон байх билээ. Хөвүүний амийг аварсан гавьяа биднийх болно\"гэвэл, Алтани өгүүлрүүн: \"Миний дууг сонссонгүй бол та нар яаж ирэх билээ? Би гүйн гүйцэж түүний сэвлэг үснээс барьж хутгыг сугалсан гарыг татаж хутгыг алдуулсангүй бол Жидай Зэлмэ хоёрыг хүрч иртэл, хөвүүний амийг хорлож амжсан байх бишүү?\" гэв. Тэгж хэлбэл, гол гавьяа нь Алтанийнх болов. Борохулын гэргий, эр Борохулдаа өрөөсөн арал болон тусалж явсны дээр, Толуйн амийг аварч тус хүргэв.\nБас хэрэйдтэй, Хархалзан элээтэд хатгалдан байлдах цагт Өгэдэйн гүрээний судал, суманд шархтаж унасанд Борохул, дээр нь бууж түүний асгарсан цусыг амаараа шимж хоноод маргааш нь Өгэдэй морь унаж чадахгүй тул урдаа сундлан тэвэрч, бүрэлдсэн цусы нь бүлээн уруулаараа шимж, ам завжаа улайлгаж, ачит хөвүүн Өгэдэйг амьд мэнд авч ирсэн билээ. Эхий минь, зовж тэжээсэн ачийг, хоёр хөвүүний амийг аварч хариулав. Борохул надтай нөхөрлөж, уриалах дуунд минь уухайгаа нэмж, урагшлан зүтгэж явав. Борохулыг есөн удаа осол гаргавч, яллахгүй болгоё\" гэж зарлиг болов."}], [{"k": "read", "ref": "§215", "n": 215, "text": "Бас \"Охин ургаа соёрхол өгье\" гэв."}, {"k": "retell", "ref": "§216–218", "n": 216, "text": "§216. Бас Чингис хаан, Үсүн өвгөнд өгүүлрүүн: \"Үсүн, Хунан, Хөхөчос, Дэгэй энэ дөрвүүлээ, үзсэн сонссоноо үлдээж нуулгүй, үргэлж хэлдэг билээ. Монголын төр\nёсонд бэхи ноёдыг өргөмжлөх заншил бий. Ахмад үеийн хүнээ бэхи болгодог заншилтай тул баарин ахын ураг, Үсүн өвгөнийг бэхи болгоё. Бэхи өргөмжлөгдөөд цагаан дээл өмсөж, цагаан морь унаж, дээд сууринд сууж, он сарыг олж сонгож байтугай\" гэж зарлиг болов.\n\n§217. Бас Чингис хаан өгүүлрүүн: \"Хуилдар анд алалдан байлдах цагт урьтаж ам нээж байлдсан гавьяа бий тул түүний хөвүүд ач нарт, өнчдөд олгох өршөөл тусламжийг хүртээсүгэй\" гэв.\n\n§218. Бас Чингис хаан, Цагаан гуагийн хөвүүн, Нарийн-Тоорилд өгүүлрүүн: \"Чиний эцэг Цагаан гуа чинь зоригийг барьж байлдсаар Даланбалжудын байлдаанд Жамухад алагджээ. Одоо эцгийн гавьяаг хүртэж, өнчдийн тусламжаас авч бай\" гэсэнд, Тоорил өгүүлрүүн: \"Миний төрлийн нэгүс нар олон аймагт хуваагдан тарсан байна. Хаан соёрхвол, ах дүү нэгүс нараа цуглуулъя\" гэвэл, Чингис хаан зарлиг болруун: \"Тийм бол ах дүү нэгүс нараа цуглуулж, чи ургийн урагт хүртэл захирч бай\" гэж зарлиг болов."}, {"k": "read", "ref": "§219", "n": 219, "text": "Бас Чингис хаан, Сорхон-шард өгүүлрүүн: \"Намайг өчүүхэн цагт, Тайчуудын Таргудай Хирилтуг, ах дүү нартайгаа нийлж атаархан барих цагт Сорхон-шарын хөвүүн Чулуун, Чимбай нар, намайг ах дүү нартаа атаархагдсан ажээ гэж нууж, охин Хадаанаар асруулж байгаад тавьж илгээсэн бишүү. Чиний тэр ачийг би харанхуй шөнө зүүдэндээ бодож, гэгээн өдөр цээжиндээ санасаар явсан билээ. Дараа нь тайчуудаас надад баахан удаж ирэв. Одоо танд соёрхлыг өгье. Ямар соёрхлыг хүсч байна?\" гэвэл, Сорхан-шар ба түүний хөвүүн Чулуун, Чимбай нар өгүүлрүүн: \"Бид, мэргидийн нутаг Сэлэнгэд дархан дураар нутаглахыг хүснэ. Бас ямар соёрхол хишиг хайрлахыг Чингис хаан мэдтүгэй!\" гэв. Тэгэхэд Чингис хаан өгүүлрүүн: \"Нутаг дархалж, мэргидийн газар Сэлэнгээр ургийн урагт хүртэл нутаг орноо эзэмшиж, нум сумаа агсаж, хурим найрыг хийж, хундага сөнгөө түшилцэж явтугай. Есөн удаа осолдоход зэмлэхгүй болгоё!\" гэж зарлиг болов. Бас Чингис хаан, Чулуун Чимбай хоёрт соёрхож хэлсэн нь: \"Урьд Чулуун Чимбай та хоёрын хэлж байсныг яаж мартах вэ? Чулуун Чимбай та хоёр санаснаа хэлье гэвэл, дутуугаа гуйя гэвэл дам хүнээр бүү хэлүүлж бай. Өөрийн биеэр уулзаж, өөрийн амаар санаснаа хэлж, дутсанаа гуйж бай\" гэж зарлиг болов. Бас \"Сорхон-шар, Бадай, Хишилиг та гурван дархан,\n\nОлон дайсанд довтолж\nОлз юм олбол\nОлсноо бүрэн автугай!\nАян ав хийж\nАн гөрөөс албал\nАлснаа бүрэн автугай!\"\n\nгэж зарлиг болов. \"Сорхан-шар бол тайчуудын Түдэгэгийн гэрийн хүн. Бадай Хишилиг хоёр бол Чэрэнгийн адуучин хүн билээ. Одоо миний шадар хорчи (нум сум агсагч) болж, хуримд хундага дэвшүүлж, дархан эрхтэйгээр жаргаж явтугай!\" гэж зарлиг болов."}], [{"k": "read", "ref": "§220", "n": 220, "text": "Бас Чингис хаан, Наяад өгүүлрүүн: \"Ширээт өвгөн, Алан Наяа хоёр хөвүүний хамт Таргудай Хирилтугийг барьж авчрах замд Хутгал нугад хүрээд Наяагийн хэлсэн нь: \"Бид хаан эзнээ яахан тэвчиж барьж одох вэ?\" гэж сэтгэл түвтэхгүй\nболоод Таргудайг сул тавин буцааж, Ширээт өвгөн, хөвүүн Алаг Наяа нартай хамт ирж Наяагийн хэлсэн нь: \"Бид, хан Таргудай Хирилтугийг гардан барьж ирж яваад жич тэвчин ядаж тавин буцаагаад бид Чингис хаанд хүчээ өгье гэж ирэв. Хэрэв ханаа барьж ирвэл хан эзнээ барьсан харц ардад яаж итгэх вэ гэх билээ. Хандаа халдаж чадсангүй тул тэднийг тус (өөрийн) ханаа хайрлах их ёсыг мэдсэн хүмүүс гэж үгийг зөвшөөж, нэгэн үйл хэргийг тушаая гэсэн билээ. Боорчи, баруун гарын түмнийг захирах ноён болов. Мухулай го ван болж зүүн гарын түмнийг захирах ноён болов. Одоо Наяа, төвийн түмнийг захирах ноён болтугай\" гэж зарлиг болов."}, {"k": "retell", "ref": "§221–229", "n": 221, "text": "§221. Бас Зэв, Сүбээдэй хоёрыг өөрийн олсон зөөсөн иргэнээ мянгат болгож захирагтун гэв.\n\n§222. Бас хонь хариулагч Дэгэйд мянгатыг энд тэндээс цуглуулж өгөөд мянганы ноён болгов.\n\n§223. Бас модоч дархан Хүчүгүрт өгөх иргэн дутагдсан тул бусад ноёдын албат нараас татаж цуглуулсан иргэнийг Жадараны Мулхалхуд зүгээр нийлүүлж, Хүчүгүр Мулхалху хоёр нэг мянгатыг хавсран зөвлөж захирагтун гэв.\n\n§224. Улсыг байгуулахад зүтгэсэн хүмүүсийг түмний ноёд, мянганы ноёд, зууны ноёд, арваны ноёд болгож, соёрхлыг өгөх хүмүүст соёрхлоо өгч, зарлигийг буулгах хүмүүст зарлигаа буулгаж Чингис хаан зарлиг болруун: \"Урьд би, наян хэвтүүл манаачтай, далан шадар хишигтэнтэй байв. Одоо мөнх тэнгэрийн өршөөлөөр, тэнгэр газрын ивээлээр хүч аугаа нэмэгдэж, гүр (нийт) их улсыг хамтатгаж, ганц жолоондоо оруулсан тул одоо надад мянган шадар хишигтэн (ээлжтэн)-г ялгаж өг. Хэвтүүл, хорчин торгуудын хамт бүгд түмэн хүн болгож өгтүгэй!\" гэж зарлиг болов. Бас Чингис хаан, хишигтнийг ялгаж томилох тухай мянганы ноёдод тунхаг зарлиг буулгасан нь: \"Миний хишигтнийг томилоход түмт, мянгат, зуутын ноёдын хөвүүд, сул (чөлөөт) хүний хөвүүдийн дотроос миний дэргэд тэнцэх билэг эрдэмтэй, бие сайтайгий нь ялгаж оруултугай. Миний шадар цэрэгт орохдоо мянганы ноёдын хөвүүд, арван нөхөр (цэрэг), нэг дүүгээ дагуулж иртүгэй. Зууны ноёдын хөвүүд таван нөхөр, нэг дүүгээ дагуулж иртүгэй. Арваны ноёдын хөвүүд бас сул хүний хөвүүд, гурван нөхөр нэг дүүгээ дагуулж иртүгэй. Ингэхдээ тэд уг газраасаа уналга морио бэлтгэж иртүгэй.\nМиний шадар цэрэгт ирэх мянганы ноёдын хөвүүд арван нөхөд, хэрэглэх юмаа харъяат мянганы дотроос татаж авагтун. Эцгийн өгсөн хувь хишиг буюу өөрийн олсон зөөсөн морь, юм хэдий байвч, өмч хувиас ангид бидний заасан хэмжээгээр авч бэлтгэж иртүгэй. Зууны ноёдын хөвүүд, таван нөхөдтэй, арваны ноёд бас сул хүний хувүүд, гурван нөхөдтэй, мөн өмч хувиас ангид мөн тэр ёсоор хэрэглэх морь, юмаа бэлтгэж иртүгэй!\" гэж зарлиг болов. \"Мянгат, зуут, аравтын ноёд олон хүн, бидний энэ зарлигийг сонсоод зөрчиж давбал чангалан шийтгэнэ. Бидний шадар цэрэгт орвол зохих хүн бултарч бидний дэргэд явахдаа бэрхшээвэл өөр хүнийг оруулаад түүнийг шийтгэж, эчнээ (далд) хол газар цөлье\" гэж зарлиг болов. \"Бидний дэргэд дотно явж суралцъя гэж бидэнд ирэх ардыг бүү хориглотугай\" гэв.\n\n§225. Чингис хааны зарлигийн ёсоор мянгат, зуут, аравтын ноёдын хөвүүдийг ялгаж явуулаад, урьд байсан наян хэвтүүлийг найман зуу болгов. Найман зуу дээр нэмж мянга болготугай гэв. Хэвтүүлд орох хүмүүсийг бүү ятгаж хориглотугай гэж зарлиг болов.\nХэвтүүлийг Их-нэүрин захирч, мянганы ноён болтугай гэж зарлиг болов. Бас дөрвөн зуун хорчныг томилж, хорчныг Зэлмийн хөвүүн Есөнтэй ахалж, Түгэгийн хөвүүн Бүхэдэйтэй зөвлөж захиртугай гэв. Торгууд, хишигтэн нарыг дөрвөн ээлжээр манах болгож, Есөнтэй нэгэн ээлжийн хорчныг захирч, Бүхэдэй нөгөө ээлжийн хорчныг захирч, Хорч-худаг, гуравдугаар ээлжийн хорчныг захирч, Лаблах, дөрөвдүгээр ээлжийн хорчныг захирч явтугай. Нум сум агссан хорчин торгон цэргийг ийнхүү захирч явтугай. Хорчныг мянга болгож, Есөнтэй захирч байтугай! гэж зарлиг болов.\n\n§226. \"Урьд Өэлэн чэрбийн захирч байсан торгууд дээр нэмж мянга болгоод, Боорчийн ураг (үр) Өэлэн чэрбиэр захируулъя. Бас нэгэн мянган торгуудыг Мухулайн ураг Бухаар захируулъя. Илугайн ураг Алчидайгаар нэгэн мянган торгуудыг захируулъя. Нэгэн мянган торгуудыг Додай чэрбиэр захируулъя. Бас нэгэн мянган торгуудыг Доголху чэрбиэр захируулъя. Нэгэн мянган торгуудыг Жорчидайн ураг Чанайгаар захируулъя. Нэгэн мянган торгуудыг Алчийн ургаас Ахуйдайгаар захируулъя. Нэгэн мянган баатар цэргийг шилж Архай Хасараар захируулаад энгийн өдөр ээлжлэх торгон цэрэг болгож, хатгалдан байлдах өдөр хамгийн түрүүнд баатарлуулан явуулъя!\" гэж зарлиг болов. Олон мянгатаас ялгаж ирүүлсэн хүмүүсийг найман мянган торгууд болгов. Хоёр мянган хэвтүүл, хорчины хамт бүгд нэгэн түмэн хишигтэн болов. Чингис хаан зарлиг болруун: \"Бидний шадар түмэн хишигтэнг бэхжүүлж их голын цэрэг болгоё!\" гэж зарлиг болов.\n\n§227. Бас Чингис хаан зарлиг болж өдрийн жасаа (ээлж)-ны торгуудыг дөрвөн ээлж болгож, ээлжийн ахлагч нарыг томилсон нь: Буха, нэгэн ээлжийн хишигтнийг захирч, засаж яв. Алчидай нэгэн ээлжийн хишигтнийг захирч, засаж яв. Додай чэрби нэгэн ээлжийн хишигтнийг захирч, засаж яв. Доголху чэрби, нэгэн ээлжийн хишигтнийг захирч, засаж яв. Энэ дөрвөн ээлжийн хишигтнийг захирах ахлагчдыг томилж тунхаг зарлиг буулгаад бас ээлжийн ахлагчид, харъяат хишигтнээ жагсааж ээлж хишигт оруулаад гурав хоноод солилцуулна. Хишигт хүн, ээлжээ тасалбал тэр ээлж тасалсан хүнийг гурван бэрээ занчъя. Тэр дахин ээлжээ тасалбал долоон бэрээ занчъя. Бас тэр хүн, бие эрүүл бөгөөд ээлжийн ахлагчдын зөвшөөрөлгүйгээр гуравдугаар удаа ээлжийг тасалбал гучин долоон бэрээ занчаад, бидэнд бараа болохоос бэрхшээсэн этгээд гэж үзээд эчнээ хол газарт цөлье! гэж зарлиг болов. Ээлжийн ахлагчид, гурван ээлжийн хишигтэнд тухай бүр энэ зарлигийг сонсгож байтугай. Эс сонсгосон бол ээлжийн ахлагчид бурууг хүлээнэ. Зарлигийг сонссон байтал, зөрчих буюу зарлигаар тогтоосон ээлжийг тасалбал хишигтнийг буруушаан шийтгэнэ гэж зарлиг болов. Ээлжийн ахлагчид гагцхүү ахлагч гэсэн төдийгөөр хамт манаж байгаа хишигтнийг миний зөвшөөрөлгүйгээр бүү шийтгэгтүн. Гэм үйлдсэн хүнийг хэлэгтүн. Мухриулах (алах) ёстой бол бид мухриулъя. Занчих ёстойг хэвтүүлж занчъя. Ахлагч нар, ахлагч гэсэн төдийгөөр адил эрхтэй хишигтэнд минь, өөрийн гар хөлийг хүргэж занчвал бэрээний хариуд бэрээдэж нударгын хариуд нударгадаж занчтугай гэв.\n\n§228. Бас Чингис хаан зарлиг болруун: \"Гадаад мянганы ноёдоос миний хишигтний ерийн хүмүүс эрхэм бөгөөд гадаад зууны ноёд, аравны ноёдоос миний хишигтэн хөтөч эрхэм тул гадаад мянганы ноёд, миний хишигтэнтэй тэнцэж хэрэлдвэл мянганы ноёныг шийтгэе! гэж зарлиг болов.\n\n§229. Бас Чингис хаан зарлиг болж ээлжийн хишигтний ноёдод зарлиг тунхагласан нь: Хорчин, торгууд хишиг (ээлж)-т орж, өдрийн хамгаалагчид зүг зүгт мөр мөртөө явж наран шингэхээс өмнө хэвтүүл [манаачид хамгаалах ажлаа шилжүүлээд]-д\nзайлж гадна гарч хонотугай. Биднийг шөнө хэвтүүлийн цэрэг хамгаална. Хорчин нум сумаа, буурч (тогооч) нар аяга саваа хэвтүүлд тушааж өгөөд гарч хонотугай. Гадна хоносон хорчин, торгууд, буурч нар бидний шөл идтэл уяаны тэнд хүлээж байгаад хэвтүүлд мэдэгдэж, биднийг шөл идсэний дараа дотогш орж, хорчин нум сумаа авч, торгууд сууриа эзэлж, буурч нар аяга саваа авч ажлаа хийтүгэй. Ээлж хишгийн хүмүүс энэ тогтоосон ээлжийн хуулийг мөрдөж яв гэж зарлиг болов. Наран шингэсний хойно ордны хойгуур урдуур явах хүнийг хэвтүүл манаач нар барьж хоноод маргааш өглөө байцаан асуугтун. Хэвтүүл, халаагаа ирэхэд тэмдгээ шилжүүлж өгөөд чөлөөлөгдөнө. Манаагаа шилүүлсэн хэвтүүл гарч одтугай гэв.\nХэвтүүл, шөнө ордны орчим байж үүдийг харгалзаж, орохыг завдах хүний мөрийг мөлт цохиж, толгойг тоншин цавчиж хаятугай. Шөнө яаралтай мэдээ хүргэж хүн ирвэл урьдаар хэвтүүлд мэдэгдээд гэрийн ард хэвтүүлийн хамт байж, хэлэх үгээ гаднаас хэлэгтүн. Хэвтүүлийн суурь дээр хэн ч сууж үл болно. Хэвтүүлийн зөвшөөрөлгүйгээр хэн ч орж үл болно. Хэвтүүлийн дэргэдүүр хэн ч явж үл болно. Хэвтүүлийн завсраар явж үл болно. Хэвтүүлийн тоог асууж үл болно. Хэвтүүлийн дэргэдүүр явсан хүнийг барьтугай. Хэвтүүлийн тоог асуусан хүний тэр өдрийн унасан эмээлтэй, хазаартай морийг, өмссөн бүрэн хувцсыг хэвтүүл автугай гэж зарлиг болов. Элжигэдэй итгэлтэй хүн боловч хэвтүүлийн дэргэдүүр үдэш явж баригдсан биш үү?"}, {"k": "read", "ref": "§230", "n": 230, "text": "Чингис хаан\nөгүүлрүүн: \"Үүлтэй шөнө\nҮүдтэй гэрий минь\nҮргэлж сахиж Энэ\nбиеий минь Энх\nунтуулж Эрдэнийн\nсууринд Хүргэсэн\nэртний Ээлт\nхэвтүүл минь!\nОдтой шөнө Орд\nгэрийн минь\nОрчимд хэвтэж\nӨлгий дэвсгэрийн\nминь Өмөг болж\nӨчүүхэн биеийн\nминь Түшиг болж\nӨндөр\nсууринд\nХүргэсэн\nӨлзийт буянт хэвтүүл\nминь! Халих усан бороонд\nХайрах хүйтэн жаварт\nХанатай гэрий минь\nХаргалзан байж\nХалуун амий минь\nХамгаалан манаж\nХаан сууринд хүргэсэн\nХайр ивээлт хэвтүүл минь!\nӨрсөх дайсны мөрөөс\nӨших хортны гараас\nӨглөө үдэш ялгалгүй\nӨрх гэрийг минь хамгаалж\nӨөрийн нүдийг цавчилгүй\nӨвч биеий минь арчилсан\nӨнийн итгэлт хэвтүүл минь!\nХолтсон хоромсогын\nХорд хийх чимээнээс\nХоцролгүй ирэгч\nХотлын сайн хэвтүүл минь!\nШинсэн нумын\nШирдхийх чимээнээс\nШилжрэлгүй ирэгч\nШигшмэл сайн хэвтүүл минь!\nӨнө хэдийний\nӨлзийт хэвтүүлий минь\nӨвгөн хэвтүүлгэгтүн.\nИтгэлт Өэлэн чэрбийн\nИвээлт далан торгуудыг\nИх торгууд гэгтүн.\nАрхай Хасарын харъяат\nАчит шилдэг баатруудыг\nАхмад баатрууд гэгтүн.\nЕсөнтэй, Бүхэдэйн харъяат\nЕрөөлт хуучин хорчныг\nЕрөнхий хорчин гэгтүн\"\n\nгэж зарлиг болов.", "chap": "Уйгур ба ойн иргэдийг эзэлсэн нь"}, {"k": "retell", "ref": "§231–234", "n": 231, "text": "§231. \"Ерэн таван мянгатаас миний биеийн шадар өмч болгож илгээсэн түмэн хишигтнийг миний хойно их суурийг залгамжилсан хөвүүд, ургийн урагт хүртэл миний гэрээс дурсгал мэт сэтгэж, аливаа гасланд хүрүүлэлгүй сайтар асрагтун. Эдгээр түмэн хишигтнийг миний эрхэмсэг хишигтэн гэж өргөмжлөхгүй байж болох уу?\" гэв.\n\n§232. Бас Чингис хаан өгүүлрүүн: \"Ордны чэрбийн охид, гэрийн хүмүүс, тэмээчин үхэрчин нарыг хэвтүүл эрхлэн мэдэж, ордны гэр тэргийг бас мэдтүгэй. Туг, хэнгэрэг, дөрөө, жадыг хэвтүүл даргалтугай. Аяга савыг мөн хэвтүүл эрхэлтүгэй. Бидний унд идээг хэвтүүл даргалтугай. Тахилгын мах идээг хэвтүүл даргалж болготугай. Унд идээ хор хомс болбол даргалсан хэвтүүлээс шаардъя\" гэв. \"Хорчин нар унд идээг түгээхдээ даргалсан хэвтүүлийн зөвшөөрөлгүйгээр тараан өгч үл болно. Идээг түгээхдээ урьдаар хэвтүүлээс эхлэн түгээтүгэй\" гэв. \"Орд гэрт орох гарах юмыг хэвтүүл эрхлэн мэдтүгэй. Гэрийн ойр үүдэнд хэвтүүлийн хаалгачин байтугай. Хэвтүүлийн хоёр хүн дотогш орж, их сөнг түшиж байтугай. Хэвтүүлээс нутаг эрэн үзэж орд гэрийг буулгатугай\" гэв. Бидний шувуу авлахад хэвтүүл бидэнтэй хамт шувуу авлан явтугай. Гэр тэрэгний дэргэд заримыг цагийн байдлаар үлдээтүгэй\" гэв.\n\n§233. Бас Чингис хаан өгүүлрүүн: \"Бидний бие байлдаанд эс мордвол хэвтүүл биднээс ангид байлдаанд мордож үл болно\" гэв. \"Энэ зарлигийг мэдсээр байгаад атаархан зөрчиж, хэвтүүлийг байлдаанд мордуулбал цэргийн цэргийг эрхлэх чэрбийг буруушаан шийтгэнэ\" гэж зарлиг болов. \"Хэвтүүлийн цэргийг байлдаанд үл мордуулах шалтгааныг та нар асуувал, хэвтүүл, миний алтан амийг сахина. Шувуу, гөрөөсийг авлахад хамт зовч зүднэ. Нүүх суухад ордыг хамгаалж, хөсөг тэргийг харгалзана. Миний биеийг сахиж хонох хялбар уу? Гэр тэрэг, их аураг (гол орд)-ийг нүүхэд хамгаалах гэдэг хялбар уу? Ийм давхар салбарын ажилтай тул тэднийг биднээс ангид байлдаанд явуулахгүй гэсэн учир тийм биз\" гэжээ.\n\n§234. Бас зарлиг болруун: \"Шигихутугийн зарга шийтгэхэд хэвтүүлээс сонсолцож оролцтугай. Хэвтүүлээс нум, саадаг, хуяг, зэвийг хадгалах, түгээх ажлыг эрхлэлцтүгэй. Агт морьдыг авчирч ачаа юмыг ачиж явтугай\" гэв. \"Хэвтүүл, чэрби нарын хамт эд уурсыг түгээж байгтун. Хорчин, торгууд нар нутаг заагаад нүүхэд Есөнтэй, Бүхэдэй нарын хорчин, Алчидай, Өэлэн Ахудай нарын торгуудууд, ордны баруун этгээдэд явтугай\" гэв. \"Буха, Додай чэрби, Чанай нарын торгууд, ордны зүүн этгээдэд явтугай\" гэв. \"Архайн баатрууд ордны урьд явтугай\" гэв. \"Хэвтүүл, орд гэр, тэргийг хамгаалж ордны дэргэд, зүүн этгээдэд явтугай\" гэв. \"Бүх хишигтэн, торгууд ба ордны орчим явах, орд гэрийн хөвүүд адуучин, хоньчин, тэмээчин үхэрчнийг ордны дараа ард явах Додай чэрби захиртугай\" гэж тушаав. \"Додай чэрби, хотол ордны хойноос дагаж, хог идэж, хомоол түүж явтугай\" гэж зарлиг болов."}]], "lines": {"Мя": "§211, §214 · **Лх** §215, §219 · **Пү** §220, §230 (§212–213, §216–218, §221–229-ийг багш товч ярина)"}}, {"n": 29, "title": "Уйгур, ойн иргэд, Борохулын үхэл", "vocab": [["дагаар орох", "өөрийн хүслээр нэгдэх"], ["газарчлах", "зам заах"], ["хувь", ""], ["авга", ""], ["ятгах", ""]], "qs": ["Уйгурын Идүүд яагаад өөрийн хүслээр нэгдсэн бэ?", "Дөрбэй догшин хорь түмдийг ямар аргаар ялсан бэ?", "Боорчи, Мухулай, Шигихутуг гурав Даридайг өршөөхийг яагаад гуйсан бэ?"], "fri": "Чингис хаан эх, хөвүүд, дүү нартаа хэдэн мянган өрх хуваарилсныг (§242) баганан диаграмаар зурна.", "warn": [], "strat": "Дүгнэлт хийх ба үнэлэх — дүрийн үйлдлийг үнэлж, өнөөгийн амьдралтай холбоно.", "mode": "Чимээгүй уншаад, багш 2–3 хүүхдээс хэсэг уншуулна.", "quiz": null, "days": [[{"k": "read", "ref": "§235", "n": 235, "text": "Хубилай ноёныг харлагуудад мордуулав. Харлагийн Арслан хан, Хубилайд элсэн ирсэнд Хубилай ноён, Арслан ханыг авчирч, Чингис хаанд уулзуулав. Чингис хаан, Арсланыг байлдсангүй дагав гэж сайшаан соёрхож, охиноо өгье гэж зарлиг болов. [Харлугуудын Арсланд Алха бэхийг өгч Чингис хаан соён зарлиг болруун:\n\nХарайхад минь хөл болж\nХазайхад минь түшиг болж\nХалтирахад минь тах болж\nХаламж тус хүргэхээ\nХайрт Алха минь мэдтүгэй.\nЭнэ биеэ хэврэг боловч\nЭрхэм нэр мөнх шүү\nСаруул ухаанаас илүү\nСайн нөхөр байдаггүй.\nМунхаг хилэнгээс илүү\nМуу дайсан байдаггүй.\nЭрхэм итгэл олон боловч\nХалуун амийг хамгаас хайрлалтай\nХатуужиж явбал хамагт хэрэгтэй.\nАриун явбал ашид тустай гэж\nСургасан ажээ. А.то]"}, {"k": "read", "ref": "§236", "n": 236, "text": "Сүбээдэй баатар, төмөр тэрэгтэй цэргээ авч яваад мэргидийн Тогтоагийн Худу, Чулуун зэрэг хөвүүдийг нэхэн довтолж, Чүй мөрний тэнд гүйцэж сөнөөгөөд ирэв."}, {"k": "read", "ref": "§237", "n": 237, "text": "Зэв, Найманы Хүчүлүг ханыг нэхэж Сариг гүн гэдэг газарт гүйцэж санаагаад ирэв."}, {"k": "read", "ref": "§238", "n": 238, "text": "Уйгурын Идүүд хан, Чингис хаанд Адхираг Дарбай хоёр элчийг илгээж хэлүүлсэн нь: \"Үүл арилж гэгээн наран тодорсон мэт, мөс хайлж тунгалаг мөрөн урссан мэт. Чингис хаан соёрхвол, алтан бүсий чинь горхиноос барьж, ариун дээлийн чинь үртэснээс олж, тавдугаар хөвүүн чинь болж хүч өгье\" гэж өчиж илгээжээ. Тэр үгийг сонсоод Чингис хаан соёрхож хариу хэлж илгээсэн нь: \"Охиноо өгье. Тавдугаар хөвүүн болтугай. Алт мөнгө, сувд, тана, хоргой хээт оёмол, торго уурсыг авч иртүгэй\" гэж илгээвэл, Идүүд соёрхогдов гэж баясаж, алт, мөнгө, сувд, тана, торго, хоргой зэрэг уурс авч ирээд Чингис хаантай уулзав. Чингис хаан, Идүүдийг соёрхож, Алалтун бэхи охиноо өгөв. [Уйгурын Идүүдэд Алалтун бэхийг өгөхөд Чингис хаан сургасан нь: \"Хатагтай хүнд гурван эр бий. Анхны эр нь алтан төр. Түүний дараах эр нь ариун нэр. Түүний дараах эр нь авсан эр мөн билээ. Алтан төрийг хатуужиж дагавал ариун нэр бэлэн болно. Ариун нэрийг бэхэлбэл, авсан эр ангид үл одно\" гэж зарлиг болсон ажээ. А.то]"}], [{"k": "read", "ref": "§239", "n": 239, "text": "Туулай жил (1207 он), Зүчи, баруун гарын цэргийг авч, ойн иргэнийг эзлэхээр мордоход Буха газарчилж явав. Ойрд (ойн ард)-ын Худуга бэхи, түмэн ойрдоо авч дагаар ирэв. Худуга бэхи ирээд Зүчийг газарчлан, түмэн ойрдын нутгаар явж Шигшид (Шишгид гол)-д хүрэв. Зүчи, ойрд, буриад, барга урсууд, хабханас, ханхас, туба аймгийг оруулаад Түмэн хэргисийн нутагт хүрвэл, хэргисийн ноёд, Эди, Инал, Алдиэр, Өлэбэг-тигин нар элсэн орж цагаан шонхор, цагаан морь, хар булга авч ирээд Зүчитэй уулзав. Шибир, Хэсдин, Баяд, Тухас, Тэнлиг, Төөлс, Тас зэрэг Баягидаас нааших ойн иргэнийг эзэлж оруулаад хэргисийн түмний ноёд, мянганы ноёд ба ойн иргэний ноёдыг аваад ирсэнд тэд, Чингис хаанд цагаан цонхрууд, цагаан морьд, хар булгануудаа бэлэглэж уулзав.\nОйрдын Худуга бэхийг урдаас угтан, түмэн ойрдоо дагуулан элсэж ирэв гэж соёрхож, түүний хөвүүн Иналчид Чэчэйхэн охиноо өгөв. Иналчийн ах Төрэлчид Зүчийн охин Олуйханыг өгөв. Алага-бэхи охиныг Онгуудад өгөв. Чингис хаан, Зүчийг соёрхож өгүүлрүүн: \"Хөвүүдийн минь ахмад чи, гэртээс анх гараад мөр сайтай явж хүрсэн газарт хүн, морийг гарздаж зовоосонгүй, өлзийт ойн иргэнийг оруулж ирэв, чи. Эдгээр иргэнийг чамд өгье\" гэж зарлиг болов."}, {"k": "read", "ref": "§240", "n": 240, "text": "Бас Борохул ноёныг хорь түмд (хорь буриад) иргэнийг эзлүүлэхээр явуулав. Хорь түмд иргэний ноён Дайдухул сохрыг үхсэний хойно түүний гэргий Ботохой тарган хорь түмдийг захирч байжээ. Борохул ноён, тэнд очоод гурван хүнийг дагуулан их цэргийн тэргүүн үд оройг ойлгоход бэрх ойн дотор нарийн харгуйгаар явж байтал хорь түмдийн харуулын хүмүүс тэдний ард гарч зам боогоод Борохул ноёныг барьж алжээ. Борохулыг хорь түмдэд алагдсаныг сонсоод Чингис хаан маш хилэгнэж өөрөө морилохыг завдвал, Боорчи Мухулай хоёул Чингис хааныг ятгаж болиулав. Жич Дөрвэдийн Дөрбэй-Догшинд тушаасан нь: \"Цэргийг чанга захирч мөнх тэнгэрт залчирч, хорь түмд иргэнийг эзлэхийг оролдогтун\" гэж зарлиг болов. Дөрбэй, цэргээ аваад урьд цэргийн явж, харуулын сахисан зам сүвээр цөөн цэргийг явуулж сүр үзүүлж мэхлээд өөрөө олон цэргээ авч улаан бухын харгуйгаар урагш давшив. Цэргийн аливаа хүний зүрх шантарвал жанчихын тулд хүн бүрд арван саваа (торлог) үүрүүлж, эр бүрийг сүх, ооль, хөрөө цүүцээр зэвсэглүүлээд улаан бухын явсан мөрөөр урагш давшиж, мөрт тохиолдсон модыг огтчин цавчуулж, хөрөөдүүлж замыг цэвэрлээд, уулан дээр гараад, хуримлан суугаа түмд иргэний орой дээрээс довтлон оров."}], [{"k": "read", "ref": "§241", "n": 241, "text": "Урьд Хорчи ноён, Худуга бэхи хоёр, хорь түмдэд баригдаад Ботохой тарганы тэнд байсан ажээ.\nХорчийн баригдсан учир нь: Хорь түмдээс гоо сайхан хүүхэн гучийг шилж ав гэж зарлиг болсонд Хорчи ноён, хорь түмдээс хүүхнүүдийг авах гэж очтол, урьд дагасан хорь түмд иргэн дахин дайсан болж Хорчи ноёныг бариад авчээ. Хорчийг түмдэд баригдсаныг сонсоод Чингис хаан ойн иргэний байдлыг мэдэх хүн гэж Худуга бэхийг илгээвэл, Худуга бэхи бас баригджээ. Хорь түмдийг эзэлж дуусаад Борохулын хүүр ясны тул зуун Түмдийг түүний гэр бүлд өгөв. Хорчид гучин охиныг өгөв. Ботохой тарган хатныг Худуга бэхид өгөв."}, {"k": "read", "ref": "§242", "n": 242, "text": "Чингис хаан зарлиг болж, эх, хөвүүд, дүү нартаа иргэнийг хувааж өгсөн нь: \"Улсыг хураахад зовж зүдсэн эх минь биз. Хөвүүдийн минь ах Зүчи биз. Дүү нарын минь бага Отчигин (отгон: галын хан, голомтын эзэн) биз\" гээд эх Отчигин хоёрт нэгэн түмэн иргэн (түмэн өрх)-ийг өгвөл эх чамлаж эс дуугарав. Зүчид есөн мянган иргэнийг өгөв. Цагадайд найман мянган иргэнийг өгөв. Өгэдэйд таван мянган иргэнийг өгөв. Толуйд таван мянган иргэнийг өгөв. Хасарт дөрвөн мянган иргэнийг өгөв. Алчидайд хоёр мянган иргэнийг өгөв. Бэлгүтэйд нэгэн мянга таван зуун иргэнийг өгөв. Авга Даридайг Хэрэйдтэй нийлж явсан гэж нүднээс далд болгоё гэвэл, Боорчи Мухулай Шигихутуг гурав өгүүлрүүн: \"Өөрийн голомтыг сөнөөх мэт, өөрийн гэрийг эвдэх мэт болох бишүү. Сайн эцгийн чинь гэрээс болж үлдсэн ганц авга чинь бишүү. Түүнийг үгүй хийж яаж болно? Түүний ухаж мэдсэнгүйг уучилтугай. Сайн эцгийн чинь багын нутагт голомтондоо утаа гаргаж яваг\" гэж халуун сэтгэлээр ятгаж, хамраасаа утаа гартал хэлсэнд \"За тийм болог\" гэж сайн эцгээ санаж, Боорчи Мухулай Шигихутуг гурвын үгэнд орж амарлив."}, {"k": "read", "ref": "§243", "n": 243, "text": "\"Би, эх Отчигин хоёрт түмэн иргэнийг өгөөд, Хүчү, Хөхөчү Жунсо, Аргасун дөрвөн ноёдыг тушааж өгөв. Зүчид, Хунан Мүнхэүр Хэтэ гурвыг тушааж өгөв. Цагадайд Харачар Мөнх Идухадай гурвыг тушааж өгөв\". Бас Чингис хаан өгүүлрүүн: \"Цагадай хэцүү догшин авиртай тул Хөхө-чос, өглөө үдэш дэргэд нь байж санаснаа хэлж зөвлөж байтугай\"гэж зарлиг болов. Өгэдэйд Илугай Дэгэй хоёрыгтушааж өгөв. Толуйд Жидай Бала хоёрыг тушааж өгөв. Хасарт Жибэгээг тушааж өгөв.
