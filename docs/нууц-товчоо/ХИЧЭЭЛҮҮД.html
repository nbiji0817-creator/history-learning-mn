Үнэхээр би улсын эзэн болбол чамайг түмний ноён болгоё\" гэв. Хорчи өгүүлрүүн: \"Өдий их төрийн үйлийг урьдаас заасан намайг түмний ноён болгох нь ямар жаргалан бэ? Намайг түмний ноён болгоод бүх улсаас гоо сайхан охид гучийг шил эм болгох эрхийг олго. Бас миний юу хэлсэн бүхнийг анхаарч сонс!\" гэв."}], [{"k": "read", "ref": "§122", "n": 122, "text": "Хунан тэргүүтэн Гэнигэс нэгэн хүрээ болж, бас Даридай отчигин нэгэн хүрээ болж ирэв. Жадаран аймгийн Мулхалху ирэв. Унжин сахайт нэгэн хүрээ болж ирэв. Жамухаас ийнхүү салж хөдлөөд Химурга горхины Айл-харгана гэдэг газар хүрч буув. Тэр цагт бас Жамухаас салж Жүрхиний Сорхату-Жүрхийн хөвүүн Сача бэхи, Тайчу хоёр нэгэн хүрээ болж, Нэгүүн тайжийн хөвүүн Хучар бэхи нэгэн хүрээ болж, Хотала хааны хөвүүн Алтан отчигин нэгэн хүрээ болж, Жамухаас салж хөдлөөд Тэмүжинийг Химурга горхины Айл-харганад бууж байхад нийлэн ирэв. Тэмүжин нар тэндээс нүүж Хүрэлх доторх Сэнгүр горхины Хар зүрхний Хөх нуурт очиж буув."}, {"k": "read", "ref": "§123", "n": 123, "text": "Алтан, Хучар, Сача бэхи бүгдээр зөвлөлдөж Тэмүжинд өгүүлрүүн: \"Чамайг хаан болгоё. Тэмүжин чамайг хаан болгож бид\n\nОлон дайнд\nОройлон явж\nОнц гуа\nОхидыг олзолж\nОрдон сайхан\nГэрийг авч\nОлны хаан\nТэмүжинд өгье.\nХарийн иргэнийг\nХалдан довтолж\nХацар гуа\nХатдыг олзолж\nХатир сайт\nАгтыг хөөж\nАвчирч өгье.\nОроо гөрөөсийг\nАвлах цагт\nОтож ойртуулж\nӨгье бид.\nХээрийн гөрөөсийг\nХэтэж авлахад\nХэвлий нь нийлтэл\nШахаж өгье.\nГууны гөрөөсийг\nАгнах цагт\nГуяы нь нийлтэл\nШахаж өгье.\nХатгалдах дайн\nБолох цагт\nХан тэмүжин чиний\nХатуу зарлигийг\nХайхрахгүй явбал\nХатан эмээс\nХагацуулан салгаж\nХамаг юмыг\nХамран авч\nХар толгойгий минь\nХаяж одогтун.\nЭнх цагт\nЭзэн Тэмүжин чиний\nЭе зарлигийг\nЭс дагах бол\nЭзэлсэн ардыг авч\nЭм хөвүүдийг булааж\nЭнэ биеийг минь\nЭзгүй газар\nХөөж орхи\" гэв.\nИйм үгийг хэлж, ийнхүү ам алдаж, Тэмүжинийг Чингис хаан гэж нэрийдэж хаан болгов (Чингис хаан гэх нь Тэнгис хаан, Далай хаан гэсэн үг бололтой.)"}], [{"k": "read", "ref": "§124", "n": 124, "text": "Чингис хаан болоод Боорчийн хүү Үгэлэн чэрби, Хачиун-Тохураун ба ах дүү Жэтэй, Доголху дөрөвт хоромсго агсуулав. Өнгүр, Сүйхэтү чэрби, Хадаан-Далдуурхан гурав өгүүлрүүн:\n\n\"Өглөөний зоогийг\nӨнөд осолдохгүй\nҮдийн ундыг\nҮүрд тасалдахгүй\n\nгүйцэтгэж байя\" гэсэн тул буурч (тогооч) болгов.\nДэгэй өгүүлрүүн:\n\n\"Алаг сайхан хоньдыг\nАр дүүрэн бэлчээж\nХонин олон сүргийг\nХот дүүрэн өсгөж\nХовдог төрсөн би чинь\nХос цувдай хүртэл\nХошгиног мах идэж\nӨдөр тутам өнжихгүй\nХоног тутам хожимдохгүй\nШилдэг иргийг алж\nШимтэй шөлийг бэлтгэж явъя\"\n\nгэсэн тул Дэгэйгээр хонь адуулгав. Түүний дүү Хүчүгүр өгүүлрүүн:\n\n\"Цуургатай тэрэгний\nЦуурга цүүг\nЦуцран эвдрэхгүй болгож\nТэнхлэгтэй тэргийг\nТэргүүр замд\nТээглэн саатахгүй болгож\nТэрэг гэрийн ажлыг\nТэгшлэн засаж явъя\"\n\nгэсэн тул Хүчүгүрийг тэрэгчийн тушаалд томилов. Гэр доторх гэргий хүүхэд ба зарц нарыг Додай чирбиэр захируулав. Хасарын захиргаанд илд агсаж явахаар Хубилай, Чилгутай, Хархай-Тохураун гурвыг томилж:\n\n\"Хүч түрэмгийлэгчдийн\nХүзүүг хянгардаж\nОмог ихтний\nОмрууг огтолж яв\" гэв.\n\nБэлгүтэй, Харалдай-Тохураун хоёрыг: \"Агт хариултугай. Агтчин болтугай\" гэв. Тайчуудын Хуту, Моричи, Мулхалху гурвыг \"Адуу адуултугай\" гэв. Архай Хасар, Тахар, Сүхэхай, Чаурхан дөрвийг \"Холын холбогч, ойрын оточ (хол ойрыг сурвалжлах газарч) болтугай гэв. Сүбээдэй баатар өгүүлрүүн:\n\n\"Хулгана оготно мэт\nХураасан хөрөнгийг хадгалж\nХар хэрээ мэт\nХамаг юмыг харамлаж\nНөмрөх эсгий мэт\nНөхөөс бамбай болж\nГэр орныг хамгаалж\nХэрсгээ бүрээс болъё\" гэв."}, {"k": "read", "ref": "§125", "n": 125, "text": "Тэндээс Чингис хаан, хан болж Боорчи Зэлмэ хоёрт өгүүлрүүн:\n\n\"Сүүдрээс өөр\nНөхөргүй байхад\nСүүдэр минь болж\nСүүлнээс өөр\nТашуургүй байхад\nСүүл минь болж\nСэтгэлий минь сэргээж\nСанаагий минь амруулсан\nЗүрхний дотно нөхөд минь\n\nТа хоёр хамгаас урьд ирж нөхөрлөсөн тул хамгийг ахална\" гэв. Бас Чингис хаан өгүүлрүүн: \"Тэнгэрт өршөөгдөж, газарт ивээгдэж, Жамухаас салж намайг сэтгэж нөхөрлөе гэж ирсэн анхны өлзийт нөхөд минь алинаас ч илүү хүндтэй байх учиртай тул ийнхүү та нарыг зохих зохих тушаалд томилов\" гэв."}, {"k": "read", "ref": "§126", "n": 126, "text": "Чингис хааныг хаан болгов гэж Хэрэйдийн Тоорил ханд Тахай Сүхэхэй хоёрыг илгээвэл, Тоорил хаан өгүүлрүүн: \"Тэмүжин хөвүүний минь, хан болгосон нь маш зөв. Монголчууд, хангүй байж яаж болно.\n\nЭнэ шийдвэрээ эвдэхгүй\nЭв зангиагаа таслахгүй\nЭх захаа алдахгүй\nЭгнэгт журамтай бай\" гэв."}]], "lines": {"Мя": "§120–121 · **Лх** §122–123 · **Пү** §124–126"}}, {"n": 13, "title": "Арван гурван хүрээний байлдаан, найрын хэрүүл, Татаар", "vocab": [["элч", ""], ["хундага барих", ""], ["занчих", "цохих"], ["бэхлэлт", ""], ["цол шагнах", ""]], "qs": ["Тайчар яагаад алагдсан, үүнээс юу үүдсэн бэ?", "Бэлгүтэй шархадсан хэрнээ яагаад «ах дүү битгий муудалц» гэсэн бэ?", "Өэлүн эх олзны хүүхдүүдийг өргөж авсан нь түүнийг ямар хүн болохыг харуулж байна?"], "fri": "Өэлүнийн дөрвөн өргөмөл хүүг (Хүчү, Хөхөчү, Шигихутуг, Борохул) он цагийн хэлхээсэд нэмнэ.", "warn": ["§129: Харгислалын хэсгийг товчилно."], "strat": "Асуулт тавих — хүүхдүүд өөрсдөө асуулт зохиож, хосдоо асууна.", "mode": "Багш чангаар уншина, хүүхдүүд хуруугаараа дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§127", "n": 127, "text": "Архай Хасар, Чаурхан хоёрыг Жамухад элч болгож очуулбал, Жамуха өгүүлрүүн: \"Алтан Хучар хоёрт очиж хэл: Алтан, Хучар та нар Тэмүжин анд (найз) бид хоёрын завсарт сүвээг сүлбэж, хавиргыг хатгаж юунд салгав? Тэмүжин бид хоёрыг хамт байхад түүнийг хан эс болгосон байтал, одоо ямар санаагаар түүнийг хан болгов? Алтан, Хучар та хоёр хэлсэн үгэндээ хүрч Тэмүжин андын сэтгэлийг амруулж, андад сайн нөхөр болж яв\" гэж хэлүүлжээ.", "chap": "Жамуха ба Тайчуудтай тэмцсэн нь"}, {"k": "read", "ref": "§128", "n": 128, "text": "Түүний хойно, Жалама (уул)-ын өвөр Өлгий булаг гэдэг газар нутаглан суугаа, Жамухын дүү Тайчар, Саарь-хээр гэдэг газар байгаа манай Жөчи-Дармалагийн адууг дээрэмдэхээр явж Жөчи-Дармалагийн адууг Тайчар дээрэмдэн одов. Үүнд Жөчи-Дармала, адуугаа дээрэмдэгдээд нөхөд нь зүрх шантарч явахгүй болмогц Жөчи-Дармала өөрөө ганцаар нэхэж, шөнө адууны захад хүрээд мориныхоо дэл дээр элгээрээ хэвтэж очоод Тайчарын нурууг хуга харван алж адуугаа буцааж аваад иржээ."}, {"k": "read", "ref": "§129", "n": 129, "text": "\"Дүүгээ Тайчарыг алагдав гэж Жамуха, Жадараны арван гурван отгийг нэгтгэн тэргүүлж, гурван түмэн цэргийг авч Алагууд, Тургагууд уулыг давж, Чингис хаанд халдахаар айсуй\" гэж Ихирэс овгийн Мүлхэ-тотаг, Боролдай хоёр Чингис хааныг Хүрэлхэд байхад хэлж ирэв. Энэ мэдээг аваад Чингис хаан, арван гурван хүрээнээсээ гурван түмэн цэргийг авч, Жамухыг угтаж мордоод Даланбалжуд гэдэг газар байлдав. Чингис хаан, Жамухад шахагдаж Онон мөрний Зээрэн гэдэг хавчилд шургаж оров. Үүнд Жамуха өгүүлрүүн: \"Ононы Зээрэг хавчилд тэднийг бид шургуулав\" гэж буцахдаа чинос овгийн залуусыг далан тогоонд буцалгаж, Нэүдэй цагаан гуагийн толгойг огтолж морины сүүлд чирч оджээ."}, {"k": "read", "ref": "§130", "n": 130, "text": "Жамухыг харьсны хойно тэндээс Уруд аймгийн Жүрчидэй, Мангуд аймгийн Хуйлдар нар харъяат аймгаа дагуулж Жамухаас салаад Чингис хааныг түшиж ирэв. Хонхотаны Мэнлиг эцэг, Жамухыг дагаж байсан бөгөөд одоо долоон хөвүүнээ дагуулан, Жамухаас хагацаж, Чингис хаанд нийлэн ирэв. Жамухаас өдий улс иргэн салж, Чингис өөртөө ирэв гэж баясаж Чингис хаан, Өэлүн үжин, Хасар, Жүрхиний Сача бэхи, Тайчу нар Ононы шугуйд нийлж хуримлав. Чингис хаан, Өэлүн үжин, Хасар, Сача бэхи нарт тэргүүлэн нэжээд хундага барив. Дараа нь Сача бэхийн бага эхнэр Эбэхэйд тэргүүлэн хундаглахад Хорижин хатан, Хуурчин хатан хоёр уурлаж, \"бидэнд тэргүүлэн барихгүй, яагаад Эбэхэйд эхлэн хундаглав\" гэж тогооч Шихүрийг занчив. Тогооч Шихүр занчигдаад \"Есүхэй баатар, Нэгүүн тайж хоёр үгүйн тул ингэж занчигдав\" гэж их дуугаар уйлжээ."}], [{"k": "read", "ref": "§131", "n": 131, "text": "Тэр хуримыг манай талаас Бэлгүтэй засаад, Чингис хааны морийг барьж байв. Жүрхинээс Бүри-бөх тэр хуримыг засаж байв. Гэтэл хатагин овгийн нэгэн хүн, бидний морины уяанаас цулбуур хулгайлж аваад баригдав. Бүри-бөх тэр хүнийг өмөөрч, Бэлгүтэйтэй хэрэлдэв. Бэлгүтэй үргэлж барилдах тул баруун ханцуйгаа мулталж, гараа нүцгэн гаргаж явах бүлгээ. Бэлгүтэйн нүцгэн мөрийг Бүри-бөх илдээр хага цавчив. Бэлгүтэй ингэж цавчигдсан боловч, огт ажиггүй цусаа цувриулж явахыг, сүүдэрт суугаад хуримлаж байсан Чингис хаан үзэж гарч ирээд өгүүлрүүн: \"Хэнд ингэж цавчигдав\" гэхэд Бэлгүтэй өгүүлрүүн: \"Өглөө ийм болсон билээ. Миний төлөө ах дүү нар муудалцах болуузай! Би алзахгүй. Миний бие ялаарь байна. Ах дүү нар сая ижилдэн найрамдаж байгаа тул миний төлөө ах битгий муудалц, хоромхон байзна\" гэв."}, {"k": "read", "ref": "§132", "n": 132, "text": "Чингис хаан, Бэлгүтэйн ятгасан үгийг үл хайхарч, хоёр этгээд (хоёр тал)-ээс модны гишүүдийг хуга татаж, айргийн бүлүүрийг сугачиж аваад зодолдож, Жүрхин нарыг ялж Хорижин хатан Хуурчин хатан хоёрыг булааж авав. [Хасар харвах тутам нэг хүнийг унагаж байв. Бэлгүтэй хөхүүртэй айргаар цохилцож явав. Тайчууд нар Бэлгүтэйг барьж аваад хасаг тэрэгнээс хүлж тавив. Унтсан хойно Бэлгүтэй, хасгийг үүрсээр хүрч ирэв. А.то] Жүрхин нар найрамдан зохилдъё гэснийг бид зөвшөөрч, Хорижин хатан, Хуурчин хатан хоёрыг буцааж өгөв. Тэр цагт Хятадын Алтан хаан, Татаарын Мэгүжин сүүлтийг эедээ үл орох тул Вангин чансанд цэрэг өгч, тэдэнтэй даруй байлд гэж явуулжээ. Вангин чансан, Мэгүжин-сүүлт тэргүүтэн Татаартай байлдаж, Улз гэдэг газар өөд адуу малын хамт түрэн хөөж айсуй гэх мэдээг авав. Тэр мэдээг аваад,"}], [{"k": "read", "ref": "§133", "n": 133, "text": "Чингис хаан өгүүлрүүн: \"Хэдийнээс Татаар бол бидний эцэг өвгөдийг алсан өстөн иргэн билээ. Одоо энэ алалдаанд хавсралцъя\" гээд Тоорил ханд элч зарж \"Алтан хааны Вангин чансан, Мэгүжин-сүүлт тэргүүтэй Татаарыг Улз өөд түрж айсуй гэнэ. Эцэг өвгөдийг хорлосон өшөөт Татаартай байлдъя. Тоорил хан эцэг даруй иртүгэй\" гэж явуулав. Энэ хэлийг аваад Тоорил хан өгүүлрүүн: \"Хөвүүн (Чингис) минь зөв үг хэлж ирүүлжээ. Бид хавсран байлдъя\" гээд гуравдугаар өдөр цэргээ цуглуулж мордоод Тоорил даруй Чингисийг угтан хүрч ирэв. Чингис хаан, Тоорил хан хоёр Сача бэхи тэргүүтэй Жүрхин нарт хэлүүлсэн нь: \"Энэ байлдаанд хавсарч, эртний эцэг өвгөдийг минь хорлосон Татаартай байлдахаар хамт мордъё\" гэж элч явуулаад зургаан өдөр хүлээвч тэд ирсэнгүй. Хүлээж ядаад Чингис хаан, Тоорил хан хоёр, цэргээ авч Вангин чансантай хавсрахаар Улз өөд явж очвол, Улзын Хусуту шитүэн, Нарату шитүэн гэдэг газар Татаарын Мэгүжин-сүүлт тэргүүтэн татаар нар хороо бэхлэлтийг барьжээ. Чингис хаан, Тоорил хан хоёр тэрхүү Мэгүжин-сүүлт нарыг бэхлэлтээс нь барьж, Мэгүжин-сүүлтийг тэнд нь алаад мөнгөн өлгий ба тана эрдэнийн чимэгт хөнжлий нь Чингис хаан олзлон авав."}, {"k": "read", "ref": "§134", "n": 134, "text": "Мэгүжин-сүүлтийг алав гэж Чингис хаан, Тоорил хан хоёр мэдэгдвэл, Вангин чансан сонсоод маш баясаж чаутхури (чаутхурийг, хятадаар хүчит ноён гэсэн үг гэж Рашид Эддин тайлбарлажээ) гэдэг цол шагнав.\nХэрэйдийн Тоорилд ван цол шагнав. Вангин чансан, ван цол өгсөн түүнээс хойш Тоорилыг ван гэж нэрийдэх болов. Вангин чансан өгүүлрүүн: \"Мэгүжин-сүүлтийг хавсран алж, та нар Алтан хаанд их тус хийв. Энэ тусыг чинь Алтан хаанд хэлье би. Чингис хаанд үүнээс илүү цол шагнахыг Алтан хаан мэдтүгэй\" гэв. Вангин чансан тийнхүү баясаж буцав. Чингис хаан Ван хаан хоёр Татаарыг хувааж аваад гэртээ харьж буув."}, {"k": "read", "ref": "§135", "n": 135, "text": "Татаарын хоргодож байсан Нарату шитүэний нутаг дээр нэгэн өчүүхэн хүүхэд орхигдсоныг бидний цэргүүд олжээ. Үзвэл, дөртэй алтан ээмэг зүүсэн ба булгаар доторлосон даж торгон элгэвч (хантааз) өмссөн ажээ. Тэр хүүхдийг Чингис хаан авчирч, Өэлүн эхэд бэлэг гэж өгөв. Өэлүн эх өгүүлрүүн: \"Сайн хүний хөвүүн биз. Язгуур сайт хүний ураг биз. Таван хөвүүний дараах зургадугаар хөвүүн болгоё гээд Шигихутаг гэдэг нэр өгч асрав."}]], "lines": {"Мя": "§127–130 · **Лх** §131–132 · **Пү** §133–135"}}, {"n": 14, "title": "Жүрхин, Бүри бөх, Жамуха гүр хан болсон нь", "vocab": [["гүр хан", "бүх нийтийн хаан"], ["зад", "бороо, шуурга дуудах ид шид"], ["манлай", "тэргүүн цэрэг"], ["харуул", ""], ["андгайлах", ""]], "qs": ["Чингис хаан Жүрхин нарыг юунд буруутгасан бэ?", "Буйруг хан, Худуга хоёрын зад ямар үр дүнд хүргэв?", "Бэлгүтэй, Бүри бөх хоёрын барилдаан шударга байсан уу?"], "fri": "Хүйтэний тулааныг газрын зураг дээр тэмдэглэнэ.", "warn": ["§140: Бүри бөхийн үхэл."], "strat": "Асуулт тавих — хүүхдүүд өөрсдөө асуулт зохиож, хосдоо асууна.", "mode": "Багш чангаар уншина, хүүхдүүд хуруугаараа дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§136", "n": 136, "text": "Чингис хааны аураг гэр (ар гэр) Харилт нуурт байсан билээ. Жүрхин нар, Чингисийн ар гэрт хоцорсон хүмүүсийг довтолж, тавин хүний хувцсыг тоноод арван хүнийг алжээ. Жүрхин нар ингэж сүйтгэв гэж бидний ар гэрт хоцрогсод, Чингис хаанд мэдэгдвэл, Чингис хаан маш хилэгнэж өгүүлрүүн: \"Жүрхин нар биднийг яагаад ингэж байгаа билээ? Ононы шугуйд хуримлаж байхад тогооч Шихүрийг тэд занчив. Бэлгүтэйн мөрийг цавчив. Найрамдъя гэхэд бид Хорижин хатан, Хуурчин хатан хоёрыг буцааж өгсөн билээ. Түүний хойно эцэг өвгөдий минь хорлосон эртний өшөөт Татаарыг хавсран байлдъя гээд Жүрхин нарыг зургаан өдөр\nхүлээсэн боловч, тэд ирсэнгүй. Одоо бас дайсны хажуугаар дайсан болов\" гээд Чингис хаан, Жүрхинтэй байлдахаар морилов. Жүрхин нарыг Хэрлэний Хөдөө аралын Долоон болдог гэдэг газар байхад дайран орвол Сача бэхи Тайчу хоёр, цөөн хүмүүсийг авч дутаав. Хойноос нь нэхэж Тэлэтү ам гэдэг газар гүйцэж, Сача бэхи Тайчу хоёрыг барив. Бариад Чингис хаан, Сача Тайчу хоёрт өгүүлрүүн: \"Урьд бид юу гэж хэлэлцсэн билээ?\" гэвэл, Сача Тайчу хоёр өгүүлрүүн: \"Бид хэлсэн үгэндээ хүрээгүй бол үгэнд минь хүргэ\" гэвэл, тэдний урьд хэлсэн үгийг сануулж, хэлсэн үгэнд нь хүргэж тэднийг бүтээж алав."}, {"k": "read", "ref": "§137", "n": 137, "text": "Сача Тайчу хоёрыг дуусгаад Жүрхиний иргэнийг хөдөлгөж ирэхэд тэдний дотор Жалайрын Тэлэгэтү баяны хөвүүн Гүн гуа, Чулуун хайч, Зэвгээ гурав байв. Гүн гуа, Мухулай (Мухули) Буха хоёр хөвүүнээ Чингист\n\nуулзуулан өгч өгүүлрүүн:\n\n\"Босгын чинь\nБоол болтугай!\nБосгоноос чинь\nБултаж зайлбал\nБорвий нь огтол!\nҮүдний чинь\nӨмч болтугай!\nҮүднээс чинь\nДутааж зайлбал\nЭлгий нь эмтэл!\"\n\nгэв. Чулуун хайч Түнгэ Хаши хоёр хөвүүнээ уулзуулан өгч өгүүлрүүн:\n\n\"Алтан босгы чинь\nАшид сахиж байг.\nАлтан босгоноос чинь\nАнгид одох бол\nАмий нь тасалж ал\nӨргөн үүдийг чинь\nӨргөж өгч байг\nӨргөн үүднээс чинь\nӨөр зүг явбал\nӨрий нь эмтэлж ал\"\n\nгэв. Зэвгээг Хасарт өгөв. Зэвгээ Жүрхиний нутгаас Борохул нэрт хөвүүнийг олж авснаа Өэлүн эхэд уулзаж өгөв."}, {"k": "read", "ref": "§138", "n": 138, "text": "Өэлүн эх, мэргидийн олж авсан Хүчү нэрт хөвүүн ба тайчуудын бэсүдийн нутгаас олж авсан Хөхөчү, Татаарын нутгаас олж авсан Шигихутуг, Жүрхиний нутгаас олж авсан Борохул энэ дөрвөн хөвүүнийг гэр дотроо асарч байв. Өэлүн эх хөвүүддээ өгүүлрүүн: \"Эднийг өдөр үзэх нүд, шөнө сонсох чих болгоё\" гэв."}], [{"k": "read", "ref": "§139", "n": 139, "text": "Жүрхин овгийн уг гарал нь Хабул ханы долоон хөвүүний ах нь Охинбархаг бүлгээ. Түүний хөвүүн Сорхату Жүрхи, Жүрхиний эцэг, Хабул ханы хөвүүдийн ахмад тул харъяат иргэдийн дотроос\n\nЭрхийдээ эрчимтэй\nЭлгэндээ шүүстэй\nУушгиндаа ууртай\nУруулдаа хилэнтэй\nХүчит бөх ба\nЭрдэмт эрсийг\n\nялгаж хөвүүндээ өгөв. Ийнхүү уур омогтой, чанга зүрхтэй хүмүүс нийлсэн тул Жүрхин гэж нэрлэжээ. [Эрийн эр төрсөн А.то] Чингис хаан, ийм омогт жүрхин нарыг доройтуулан дарж, олон арды нь өөрийн иргэн болгов."}, {"k": "read", "ref": "§140", "n": 140, "text": "Чингис хаан, нэгэн өдөр Бүри-бөх, Бэлгүтэй хоёрыг барилдуулъя гэв. Бүри-бөх Жүрхинд байсан билээ. Бүри-бөх, урьд Бэлгүтэйг өрөөсөн гараар барьж, өрөөсөн хөлөөр ташиж унагаад хөдөлгөлгүй дарж чадах бүлгээ. Бүри-бөх, улсын нэртэй бөх байсан. Энэ удаа Бүри-бөх Бэлгүтэй хоёрыг барилдуулахад Бүри-бөх үл ялагдах хүн байтал унаж өгөв. Бэлгүтэй, Бүри-бөхийг арай гэж мөрлөн дарж саарь бүс дээр гараад Чингис хааныг нүдээр хяламхийж харвал Чингис хаан хөмхийгөө зуув. Бэлгүтэй ухаан олж Бүри-бөхийг агдлан барьж, цээж бөгснөөс угзран татаж нуруугий нь хугалав. Бүри-бөх, нуруугаа хугалуулаад өгүүлрүүн: \"Бэлгүтэйд би үл ялагдах билээ. Хаанаас айж аргадаж зориуд унаад амиа алдав, би\" гээд үхэв. Түүний нурууг Бэлгүтэй хугалж чирч аваачаад хаяв. Хабул ханы долоон хөвүүний ахмад нь Охинбархаг, хоёрдугаар нь Бартан баатар бүлгээ. Түүний хөвүүн Есүхэй баатар. Гуравдугаар нь Хутугт Монхор, түүний хөвүүн Бүри-бөх, Бүри-бөх барилдахдаа Бартан баатрын хөвүүдээс илүү бөгөөд Бархагийн зоригт хөвүүдтэй нөхөрлөж явдаг бүлгээ. Улсын бөх Бүри ийнхүү Бэлгүтэйд нуруугаа хугалуулж үхэв."}, {"k": "read", "ref": "§141", "n": 141, "text": "Түүний хойно, тахиа жил (1201 дүгээр онд) хатагин салжиуд хамтаар, Багу чорхи тэргүүтэй хатагин нар, Чирхитэй баатар тэргүүтэй салжиуд нар, Дөрвэний татаартай найрамдсан Хачиун бэхи тэргүүтэй дөрвэн нар, Алчи, татаарын Жали Буха тэргүүтэй татаар нар, Түгэ маха тэргүүтэй ихирэсүүд, хонгирадын Тэрхэг Эмэл Алхуй нар, Чоёг цагаан тэргүүтэй горлосууд, найманаас Хүчүгүд, Найманы Буйруг хан, мэргэдийн Тогтоа бэхийн хөвүүд Хуту, ойрдын Худуга бэхи, тайчуудын Таргудай Хирилтуг, Ходун орчан [Монголын А.то] Аучу баатар нар, бусад тайчууд нар, Алхуй булаг гэдэг газар чуулаад жажирдай овгийн Жамухыг хан өргөмжлөхөөр хэлэлцэж, азарга гүүг алж андгайлан тангараглаад тэндээс Эргүнэ мөрөн уруу нууж, Эргүнэд цутгах Хан мөрний шанаагийн Агуу нугад Жамухыг гүр хан болгож өргөмжлөв. Жамухыг гүр хан (бүгдийн хан) өргөмжлөөд, Чингис хаан Ван хан хоёртой байлдахаар мордъё гэлцэв. Ийнхүү байлдах гэснийг горлосын Хоридай гэдэг хүн, Чингис хааныг Хүрэлх гэдэг газар байхад хүрч ирж хэлэв. Энэ хэлийг Чингис хаан аваад Ван ханд мэдэгдвэл, Ван хан сонсоод цэргээ авч даруй Чингис хаанд хүрч ирэв."}], [{"k": "read", "ref": "§142", "n": 142, "text": "Ван ханыг ирмэгц, Чингис хаан Ванхан хоёр хамтарч, Жамухын эсрэг байлдахаар морилъё гэж Хэрлэн мөрөн уруу мордож, Чингис хаан, Алтан, Хучар, Даридай гурвыг манлайд явуулав. Ван хан Сэнгүн, Жаха хамбу, Билгэ бэх гурвыг манлайд явуулав. Энэ манлай явагчдын түрүүнд бас харуул гаргаж Энэгэн Гүйлэтү гэдэг газар нэгэн суурин харуул тавив. Түүний цаана Чихурху гэдэг газар нэгэн суурин харуул тавив. Бидний манлай болж тэргүүлэн явсан Алтан, Хучар, Сэнгүн нар Утхия гэдэг газар хүрч бууя гэж байтал, Чихурхуд тавьсан харуулаас хүн давхиж ирж \"Дайсан айсуй\" гэж мэдээлэв. Тэр мэдээг аваад, дайснаас тодорхой хэл мэдээ авъя гэж буулгүй угтан явж, дайсны тэргүүтэй уулзаж, \"Хэн бэ?\" гэж асуувал Жамухын манлай болгож явуулсан Монголын Аучу баатар, найамны Буйруг хан, мээргидийн Тогтоа бэхийн хөвүүн Хуту, ойрдын Худуга бэхи энэ дөрөв явж байна. Бидний манлай, тэдэнтэй хашхиралдан хэлэлцэж, маргааш байлдахаар тогтоод үдэш болоход буцаж голд нийлэн бууж хонов."}, {"k": "read", "ref": "§143", "n": 143, "text": "Түүний маргааш хоёр этгээд Хүйтэн гэдэг газар учирч бие биеэ шахалцан давших, ухрах зэргээр байлдаж байв. Мөн Буйруг хан, Худуга хоёр зад (хур оруулах, шуурга шууруулах)-ын аргыг мэдэх ажээ. Тэр хоёр зад барьтал мөн үүсгэсэн арга нь тэдэн дээр бууж балчигт гулгаж явах аргагүй болоход \"Бидэнд тэнгэрийн хилэн болов\" гээд бутран дутаажээ."}, {"k": "read", "ref": "§144", "n": 144, "text": "Найманы Буйруг хан, Алтайн өвөр Улугтаг гэдэг газрыг зорин салж хөдөлжээ. Мэргидийн Тогтоагийн хөвүүн Хуту, Сэлэнгийг зорин хөдөлжээ. Ойрдын Худуга бэхи, ой модыг хүсэж Шисгисийг зорин хөдөлжээ. Жамуха өөрөө хан өргөмжилсөн иргэдийг дээрэмдээд Эргүнэ уруу буцаж хөдөлжээ. Тэднийг тэгж бутрахад Ван хан, Эргүнэ уруу Жамухыг нэхэв. Чингис хаан, Ононы зүг тайчуудын Аучу баатрыг нэхэв. Аучу баатар, улсдаа хүрээд, улсаа дүрвүүлж хөдөлгөөд Аучу баатар, Ходун орчан нар үлдсэн шилдэг цэргээ засаж, Ононы цаана байлдахаар хүлээж байжээ. Чингис хаан хүрээд тайчуудтай байлдав. Зууралдан ихэд байлдсаар үдэш болоход мөн байлдсан газар хонов. Дүрэвсэн айлууд байлдсан цэргүүдтэй хамт хүрээлж хонов."}]], "lines": {"Мя": "§136–138 · **Лх** §139–141 · **Пү** §142–144"}}, {"n": 15, "title": "Зэлмийн ач ба Зэв", "vocab": [["судас", ""], ["тараг", ""], ["ундаасах", "цангах"], ["ач", "тус, буян"], ["зэв", "сумны төмөр үзүүр"]], "qs": ["Зэлмэ Чингис хааныг ямар гурван удаа аварсан бэ?", "Чингис хаан Зэвийг яагаад өршөөж, нөхөр болгосон бэ?", "Үнэнээ хэлэхэд хэзээ зориг шаардагддаг вэ?"], "fri": "«Хэрэв би Зэв байсан бол» сэдвээр 4 өгүүлбэр бичнэ.", "warn": [], "strat": "Асуулт тавих — хүүхдүүд өөрсдөө асуулт зохиож, хосдоо асууна.", "mode": "Багш чангаар уншина, хүүхдүүд хуруугаараа дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§145", "n": 145, "text": "Чингис хаан, тэр байлдаанд хүзүүний судсыг шархтаж цус тогтохгүй ядран зовж, нар шингэхэд мөн байлдааны газар буув. Чингисийн бөглөрсөн цусыг Зэлмэ амаар шимж, уруулаа цусдаж, бус (өөр) хүнийг итгэхгүй, өөрөө сахиж суусаар шөнө дүл болов. Цусыг ам дүүрэн балгаж асгасаар шөнө дүл өнгөрвөл Чингис хааны ухаан сэргэж өгүүлрүүн: \"Цус хатаж гүйцэв. Би ундаасаж байна\" гэв. Тэндээс Зэлмэ, малгай гутал, дээл хувцсаа бүгдийг тайлж, гагцхүү дотууж (дотуур өмд)-тай чармаа нүцгэнээр эсрэг дайсны дунд гүйн орж, цаана хүрээлж буусан иргэний тэргэн дээр авирч гараад эсэг (цэгээ) эрж олсонгүй. Учир нь, дүрвэж яваа айлууд гүүгээ саалгүй тавьсан ажээ. Эсэг олдохгүй тул нэгэн их хөхүүртэй таргийг авчраад Зэлмэ өөрөө бас ус олж авчирч таргийг зуурч Чингис хаанд уулгав. Чингис хаан, гурвантаа амран ууж өгүүлрүүн: \"Дотор минь саруул болов\" гээд өндийж суутал, үүр цайж гэгээн болсон ажээ. Зэлмийн шимж асгасан цус, тэдний суусан орчны газрыг намаг болгожээ. Үүнийг Чингис хаан үзэж өгүүлрүүн: \"Энэ юу вэ? Хол асгахгүй яасан юм бэ?\" гэв. Үүнд Зэлмэ өгүүлрүүн: \"Чамайг зовуурь байхад хол явахаас эргэлзэн айж сандран, залгихыг залгиад, асгахыг асгаад байсан билээ. Хэвэлд минь бас үлэмж оров\" гэв. Чингис хаан бас өгүүлрүүн: \"Намайг ийм болж хэвтэн байтал чи яагаад нүцгэн гүйж одов? Чи баригдвал намайг энд ингэж хэвтэнэ гэж хэлэх байсан биш үү?\" гэвэл, Зэлмэ өгүүлрүүн: \"Би ингэж бодсон билээ. Нүцгэн яваад хэрэв баригдвал, би тэдэнд ингэж хэлнэ: Би танд орох дуртай билээ. Гэтэл манайхан үүнийг мэдэж, намайг барьж алъя гэж хувцсыг минь цөм тайлж, гагцхүү өмдийг тайлаагүй байтал, би мултарч танд дутааж ирэв гэж хэлнэ. Миний үгийг тэд үнэмшиж надад хувцас өгч асарна. Би тэгэхэд нэг морь олж унаад хүрч ирж чадах биш үү? Би ингэж бодоод хааны зовсон биеийг амруулъя гэж нүд цавчих зуур шийдэж одсон билээ\" гэв. Чингис хаан өгүүлрүүн: \"Би одоо юу гэх вэ? Намайг урьд гурван мэргидэд хөнөөгдөж, Бурхан халдунд хоргодож, гурвантаа нэгжүүлэхэд чи миний амийг нэг авч гарлаа. Одоо чи бас хальж бүхий цусыг амаар шимж аминд минь нэг оров. Бас цангаж ядран байхад амиа өрж нүд үзсээр дайсны дотор орж ундаан авчирч аминд минь оров. Энэ гурван ачийг чинь үүрд мартахгүй\" гэж зарлиг болов."}], [{"k": "read", "ref": "§146", "n": 146, "text": "Өдөр болоход үзвэл, байлдахад бэлэн хоносон дайсны цэргүүд шөнөдөө бутран дутаажээ. Харин хүрээлж буусад иргэд, цэргийн хамт хурдан нүүж үл чадах учраас хөдөлсөнгүй хоцорчээ. Дүрэвсэн улсыг хурааж авчиръя гэж Чингис хаан, хоносон газраас мордож, дүрэвсэн улсыг хураан явахад нэгэн улаан дээлтэй эм хүн \"Тэмүжин, Тэмүжин\" гэж их дуугаар уйлан хайлан бархирахыг Чингис хаан өөрөө сонсож: \"Ямар хүний эм ийнхүү уйлж байна?\" гэж асуулгахаар хүн илгээв. Тэр хүн очиж асуувал тэр эм өгүүлрүүн: \"Би Сорхон-шарын охин. Хадаан нэртэй. Эрийг минь энд цэргүүд барьж алах гэж байна. Эрийг минь аварч аль гэж Тэмүжинийг дуудаж уйлав\" гэв. Тэр хүн буцаж ирээд Чингис хаанд түүний үгийг өгүүлбэл, Чингис хаан сонсоод давхин очиж мориноос буугаад Хадаантай тэврэлдэв. Гэтэл эрий нь манай цэргүүд тэр завсар нэгэнт алжээ. Тэр улсыг хувааж аваад, Чингис хаан, их цэргийн хамт мөн тэнд бууж хонов. Хадааныг урин ирүүлж дэргэдээ суулгав. Маргаашийн өдөр тайчуудын Төдөгэгийн харъяат байсан Сорхон-шар, Зэв хоёр хүрч ирэв. Чингис хаан, Сорхон-шард өгүүлрүүн:\n\n\"Хүзүүнд минь угласан\nХүнд модыг\nХөсөр хаясан\nЗаханд минь угласан\nЗаадас дөнгийг\nЗайлуулж өгсөн\nЭцэг мэт ачит\nЭрхэм ах та\nИнгэж юунд их хождож ирэв?\"\n\nгэв. Сорхон-шар өгүүлрүүн: \"Би чамд дотроо гүн итгэсээр билээ. Яараад яах вэ? Хэрэв яарч урьд ирвэл тайчуудын ноёд миний хоцорсон эм, хөвүүд ба адуу малыг үнсээр хийсгэх нь магад тул би яарсангүй. Одоо хаандаа нийлж ирэв\" гэв. Энэ үгийг сонсож, Чингис хаан: \"Зөв\" гэв."}], [{"k": "read", "ref": "§147", "n": 147, "text": "Бас Чингис хаан өгүүлрүүн: \"Хүйтэн гэдэг газар урагшлах, ухрах зэргээр байлдаж байхад уулан дээрээс харваж, миний байлдааны ам цагаан хул морины аман хүзүүг хэн шартуулсан бэ?\" гэвэл тэр үгийг сонсож, Зэв өгүүлрүүн: \"Уулан дээрээс харвасан хүн би билээ. Одоо хаан намайг\nАлъя гэвэл ал\nАлганы төдий газрыг\nАлаг болгож үмхийрэх\nАлд бие байна.\nАваръя гэж санаад\nАмий минь соёрхвол\nХалд гэсэн газарт чинь\nХарайж очоод би\nХар усыг цалгитал\nХад чулууг хэмхэртэл\nХарь дайсныг довтолж\nХаан чамд тусалъя.\nЦээлийн усыг цалгитал\nЦэгээн чулууг хагартал\nЧин зоригийг гаргаж,\nЧингис чамд тусалъя.\nХүр гэсэн газарт чинь\nХүрч очоод би\nХүр чулууг хэмхэлье\nХүний зүрхийг шанталъя!\"\n\nгэв. Чингис хаан өгүүлрүүн: \"Дайсны хүн дайсагнаж хорлож явснаа нууж худал хэлэх бүлгээ. Гэтэл чи дайсагнаж хорлосноо нуухгүй шударга хэлж байна. Ийм хүнтэй нөхөрлөж болно. Чиний Зургаадай нэрийг халж, байлдааны ам цагаан хул морины минь аман хүзүүг зэвээр харвасан тул Зэв гэж нэр өгье. Миний дэргэд зэв мэт хамгаалж яв\" гэж зарлиг болов. Тайчуудаас Зэвийн ирж нөхөрлөсөн ёс ийм билээ. (Чингис өөрийн шархатсанаа далдалж, морио шархатсан мэтээр хэлж байгаа бололтой.)"}, {"k": "read", "ref": "§148", "n": 148, "text": "Чингис хаан, тэнд тайчуудыг довтолж Аучу баатар, Ходун орчан, Худуудар зэргийн тайчуудын язгууртныг ургийн ураг хүртэл үнсэн товрог болгож хядав. Улс иргэний нь нүүлгэж, Чингис хаан, Хубхаяа (Ухаа хаяа) гэдэг газар ирж өвөлжив.", "chap": "Татаарыг сөнөөсөн ба Ван хантай эвдэрсэн нь"}]], "lines": {"Мя": "§145 · **Лх** §146 · **Пү** §147–148"}}, {"n": 16, "title": "Зүүд ба зургаан сайд", "vocab": [["хошууч", ""], ["бамбай", ""], ["халхавч", ""], ["магтаал", ""], ["сайд", ""]], "qs": ["Зургаан сайд тус бүр юу амласан бэ?", "Чуу мэргэн «зугтаж ч магадгүй» гэж яагаад урьдчилан үнэнээ хэлсэн бэ?", "Аль сайдын амлалт чамд таалагдсан бэ, яагаад?"], "fri": "6 бүлэг тус бүр нэг сайдын шүлгийг цээжилж, ангийн өмнө уншина.", "warn": [], "strat": "Асуулт тавих — хүүхдүүд өөрсдөө асуулт зохиож, хосдоо асууна.", "mode": "Багш чангаар уншина, хүүхдүүд хуруугаараа дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§149 (зүүд ба зургаан сайд)", "n": 149, "text": "[Суут богд Чингис хаан, зах нутаг нутаглаж явахын цагт нэгэн өдөр дотоод есөн сайдаа авч мөр хайж, бараа харж яваад зарлиг болруун: \"Аль ч зүгээс ямар ч дайсан ирэх магадгүй, есөн сайд минь гурван хэсэг болж яв\" гэж зарлиг болов. Эдний зарлигийг дагаж Зэлмэ, Чуу мэргэн, Шигихутуг гурвуул нэг хэсэг болов. Боорчи, Борохул, Мухулай гурвуул нэг хэсэг болов. Сүлдүсний Сорхон-шар, бэсүдийн Зэв, ойрдын Хар хирүгэ гурав нэг хэсэг болж гэрт үлдэв. Эзэн бусад зургаан сайдаа авч мөр хайж, бараа харж, Чахарай хааныг арлаж, Жалман ханыг өлгийлж явтал эзний дороос\n\nХалтар тэх\nХарайн гүйхэд эзэн\nТолбот бор мориороо\nДовтлон гүйцэж\nАгссан нумаа\nАнгайлган татаж\nАлтан сумаа\nАлдлан тэлж\nАлаг тэхийг\nАтиртал харваж\nАлсан даруйд\nАр дахь сайд нь\nАмдан бууж\nАвч ганзагалахыг завдтал\n\nЭзэн зарлиг болов: \"Үүнийг та нар үтэр өвчиж шар. Би тэр Шар дэвсэг дээр гарч бараа харъя\" гээд одов. Тэнд эзний нойр хүрч, толбот бор морины дэл дээр ташуураа тулж унтаад нэг зүүд зүүдлэв. Чингис хаан сэрээд зургаан сайддаа ирж зарлиг болруун:\n\n\"Би нэг зүүд зүүдлэв\nБор зүрх минь\nБол бол хийв\nБогино хавирга минь\nШир шир хийв.\nБолшгүй дайсан\nИрэх нь бололтой.\nӨндөр уулын цаадах\nӨргөн шар талд\nГурван хар тугтай\nГурван зуун дайсан байна.\nГурван зуун дайсны\nХошууч баатар нь\nЗээрд морио унаж\nЗэвт сумаа дэлж\nБат хуягаа өмсөж\nБараан сахлаа илж\nБаруун тийш ширвэж\nЗүүн тийш ажиглаж\nЗүү мэт жирвэлзэж\nУтас мэт улалзаж явна.\n\nЭнэ зүүд минь хэрэв үнэн бол зургаан сайд минь та нар яах вэ? гэж асуув. Шигихутуг хэлэв:\n\n\"Хол ойрыг харагч\nХоёр хурц нүдээрээ\nМонгол аймгийг\nМохтол\nМэргэд аймгийг\nМэгдэртэл\nТайчууд аймгийг\nДалдиртал\nСарын газрыг\nСаравчлан харж\nЖилийн газрыг\nЖилэвчлэн үзэж\nХар нүдний цэцгийгээр\nХаан чамдаа тусалъя\nЭргэх нүдний харцаар\nЭзэн чамдаа тусалъя\" гэв.\n\nЗэлмэ хэлэв:\n\n\"Үхэх амиа\nХайрлахгүй\nҮгүйрэх малаа\nХарамлахгүй\nҮзэгдэх дайсныг\nХалтиртал дайрч\nЗамдаа тохиолдсоныг\nЗад цохиж\nМөртөө тохиолдсоныг\nМөлт цохиж\nХар тугий нь\nХамран авч\nБарьсан хүний нь\nБайлдан алж\nХийсэх түгий нь\nГишгэн дэвсэж\nУранхай тугий нь\nУландаа гишгэж\nДайсны сүрийг\nДаран сөнөөж\nДахин босох\nЧадлы нь мөхөөе\" гэв.\n\nЧуу мэргэн хэлэв:\n\n\"Довтлон орох чадалгүй боловч\nТогтсоныг бататгах чадалтай би\nЭрчлэн дайрах чадалгүй боловч\nЭвдэрснийг сэлбэх чадалтай би.\nУульхай зантай Чуу мэргэн би,\nУулгалан орох цаг болоход\nУхрах зугтах магадгүйг\nУрьдаас хаандаа хэлье.\nУлс орноо тогтоосон хойно\nУчиртай үгээрээ тусалж чадна.\nХарь дайсныг довтлох цагт\nХаан эзэн Чингис чамд\nХашир миний боломжит үг\nХааяа боловч тус болно\" гэв.\n\nБоорчи хэлэв:\n\n\"Өрсөлдөн ирэх дайсны\nӨмнөх замыг бөглөж\nХалдан ирэх дайсны\nХарайх замыг хааж\nАчит эзэн чиний\nАмь биеийг хамгаалж\nАлтан жолоогий чинь\nАлдалгүй дагаж\nХандсан зүгт чинь\nХагацалгүй явъя\" гэв.\n\nБорохул хэлэв:\n\n\"Харвах сумны\nХалхавч болж\nХангинах зэвийн\nБамбай болж\nИтгэлт эзэн чиний\nИдэх биед\nИрт мэс\nБүү хүргэе\" гэв.\n\nМухулай хэлэв:\n\n\"Дайсныг дарж\nОлзыг оруулж\nИрэх дайсны\nИрийг мохоож\nБуцах дайсныг\nБултыг хядаж\nХүлэг мориныхоо\nСүүл дээгүүр\nХүдэн манан татуулж\nУнасан мориныхоо\nДэл дээгүүр\nУргах сайхан нарны\nУлаан гэрлийг цацруулж\nБайлдаан бүхэнд ялсан\nБаяртай сайхан мэдээг\nБаатар чамдаа хүргэе\" гэв.\n\nЧингис:\n\nШилдэг зургаан сайдын\nШийдвэртэй үгийг сонсож\nШарсан тэхийн махнаас\nШаламгайлан идэж дуусаад\nШаргал морины цулбуурыг Шигихутугт өгч\n\"Үзсэн зүүдний минь\nҮнэн худлыг мэд\"\n\nгэж явуулав."}], [{"k": "read", "ref": "§149 (тулалдаан ба залбирал)", "n": 149, "text": "Шигихутуг, шунхан шаргал морий нь унаад\n\nТал газар тавиулж\nТайга газар алхуулж\nХөндий газар хатируулж\nХөвч газар сажлуулж\nШар дэвсэгт хүрээд\nШалгаж сайтар харвал\nБараан тугийг хийсгэсэн\nБалмад дайсны цэрэг\nБачмаг тулгарахад\nБаатар Шигихутуг\nБайсан газрын зүг\nБачимдан давхиж ирээд:\n\"Шар дэвсэг дээр\nЦочмог гарч очвол\nГурван зуун дайсантай\nБачмаг тулгарч уулзав\nТайчуудыг\nТаньсангүй\nМэргидийг\nМэдсэнгүй\nМонголыг\nМохтол харж чадсангүй\n\nХойшоо ганцхан хяламхийж үзэхэд эзний зүүдэнд үзсэн дайсантай адил мэт байна\" гэв. Тэгэхэд зургаан сайд хуягаа өмсөж, бамбайгаа зүүж, байлдаанд бэлдэж байтал дайсны цэрэг хүрч ирэв.\nСайд баатар Боорчи\nСаарал мориндоо мордож\nСамуун дайсны өмнөөс\nСамбааг олж очоод\nСанаа зоригийн асууруун:\n\n\"Та, юун хүн бэ? Ёст хүн бол ёсоо хэл! Нэрт хүн болнэрээ хэл\" гэвэл тэд өгүүлрүүн:\n\n\"Нэрээ асуулцахаар\nИрээгүй бид,\nНэвширтэл байлдахаар\nИрлээ бид\"\n\nБоорчи хэлэв:\n\n\"Надад учраа хэлбэл\nНайрамдлаар өршөөж болно\nНаадах тулах санаатай бол\nНарны галтайд эхэлье\" гэв.\n\nТэгэхэд цаадах хүн хэлрүүн:\n\n\"Танд хэлэх сайн нэр\nБидэнд үгүй\nТарвагачин загасчин хүн бид\" гэв.\n\nТэгэхэд Шигихутуг өгүүлрүүн: \"Тэднээс үг асуух хэрэггүй. Таньсан тайчууд байна. Татгалзалгүй байлдъя\" гэв. Борохул буун гүйж, бор бамбайгаа авч, Богд эзнээ хамгаалан зогсов. Зэлмэ, хөндлөн этгээдээс илд барьж ороод\n\nМөртөө тохиолдсоныг\nЗам гартал цавчиж\nГурван хар тугий нь\nГулд татаж аваад\nУулан дээр аваачиж\nУруу харуулан хатгав.\n\nЧуу мэргэн хэдийнээ дутаажээ. Боорчи урагшаа алалдаж явах зуур хойшоо Чуу мэргэнийг харж өгүүлрүүн: \"Үй Чуу мэргэн, байз! Эзэн хаан төлөө ингэж зүтгэдэг билүү! Нүхнээс гарсан алагдаага мэт годхийн зугтах чинь юу вэ?\" гэвэл, Чуу мэргэн эргэж ирээд инээж өгүүлрүүн: \"Зэргэлдэн байлдъя гэхэд, зэв дутаад байна\" гэвэл, эзэн алтан саадгаасаа шунхт зэвээ сугалж өгөв. Чуу мэргэн, шунхан зэвийг сумлан татаж, суниалган дэлж, эрхийдэн сойж, эргүүлэн татаж, суниалган дэлж, эрхийдэн сойж, эргүүлэн чиглүүлж, дайсны тэргүүнийг тас харваж, зээрд халзан морийг барьж ирээд эзэнд унуулав. Эзэн тэр морийг унаж үзвэл нисэх шувуу, хийсэх салхи мэт байв. Тэгээд зөрчих дайсныг цөхрүүлэн дарж, хатгалдах дайсныг\nзагас болгож байтал, Борохулын толгойд сум тусвал, тэр доош унаж, нумаа тэмтэрч аваад салдархилан түшиж бамбайгаа алдалгүй барьж зогсоно. Боорчи урагшаа алалдаж байх зуур, хойшоо харж түүнд өгүүлрүүн: \"Эр хүн ганц суманд унадаг билүү? Эврээ цохиолсан ишиг мэт, эргэлзэн салганах чинь юу вэ?\" гэвэл, Борохул, мориныхоо буруу талаас харайж мордоод халхавчаа барьж хайхралгүй байлдаж явав. Тэгээд халдаж ирсэн дайсан алагдсан хүнийхээ хүүрийг авч дутаав. Эзэн зарлиг болруун:\n\"Буруу хандсан дайсныг яах билээ?\" гэвэл Боорчи өгүүлрүүн:\n\n\"Бурхан болсон хүнийг\nБуянаар үддэг\nБуруу хандсан дайсныг\nЗэр зэвээр үддэг.\n\nНэхье\" гэвэл, тэр үгийг эзэн зөвшөөрч нэхэв. Цайтын цагаан талд дайсныг гүйцээд, олон хонинд орсон чоно мэт цавчиж нэг зуун хүнийг алав. Хоёр зуун хүн дутаав. Энэ байлдаанд зуун морь, тавин хуяг олзолж авав.\nТэр цагт Чингис хаан, тэнгэр эцэгтээ мөргөе гэж довцог өндөр дээр гарч,тохмоо дэлгэж тавиад бүсээ хүзүүндээ өлгөж залбиран өчив:\n\n\"Эрэмгий сайнаар\nЭзэн эс боллоо, би.\nЭрхт тэнгэр\nЭцгийн хайраар\nЭзэн боллоо, би.\nЭцэг тэнгэрийн ачаар\nЭсрэг дайснаа дарлаа, би.\nХамрагч сайнаар\nХаан эс боллоо, би.\nХан тэнгэр эцгийн\nХайраар эзэн боллоо, би.\nХан тэнгэр эцгийн өршөөлөөр\nХарь дайсныг дарлаа, би\"\n\nгэж мөргөв."}], [{"k": "read", "ref": "§149 (магтаал ба Боорчийн дуу)", "n": 149, "text": "Тэндээс мордож явахад эзэн, зургаан сайдаа магтан дуулав. Эхлээд Шигихутугийг магтсан нь:\n\n\"Мэргидийг мэгдүүлж\nМонголыг мохоож\nТайчуудыг таньж\nДайсныг даралцсан\nТатаарын Шигихутуг минь\" гэж магтав.\n\nЗэлмийг магтсан нь\n\"Ороо гөрөөсний\nОтлого болсон\n(Ан гөрөөсийг\nАнаж мэддэг)\nОмогт дайсны\nЗүрхийг чичрүүлсэн\nУнах морьгүй болоход\nУнаа авчирч өгсөн\nУндаасан цангах цагт\nУух дарс өгсөн\nСэргэг бага нойртой\nСэцэн мэргэн ухаантай\nУлс төрийн төлөө\nУрьд цагаас зүтгэсэн\nУрианханы сайн Зэлмэ минь\" гэж магтав.\n\nЧуу мэргэнийг магтсан нь:\n\n\"Зарлигийг минь алдалгүй дагаж\nЗаасныг минь эндэлгүй гүйцэтгэж\nДайсны тэргүүнийг\nТас харваж\nУнасан зээрд морий нь\nУулгалан булааж\nХатгалдах дайсныг\nХага цохиж\nЗөрчилдөх дайсныг\nЦөм цохисон\nЗүрчидийн Чуу мэргэн минь\" гэж магтав.\n\nБорохулыг магтсан нь:\n\n\"Харвах суманд\nХалхавч болсон\nСурхирах суманд\nСаравч болсон\nТолгойгоо шархтахад\nТохмоо эс алдсан\nХушиний сайн Борохул минь\" гэж магтав.\n\nМухулайг магтсан нь:\n\n\"Дайсныг даралцаж\nОлзыг оруулалцаж\nИрэх дайсны\nИрийг мохож\nБуцах дайсны\nБовийг хянгардаж\nХүлэг мориныхоо сүүл дээгүүр\nХүдэн манан татуулж\nУнасан мориныхоо дэл дээгүүр\nУргах нарыг гийгүүлж\nДайсны хөрөнгөнөөс\nТасархай утас орхилгүй\nХугархай зүү гээлгүй\nХураан авч ирсэн\nЖалайрын сайн Мухулай минь\" гэж магтав.\n\nБоорчийг магтсан нь:\n\n\"Намайг залуу байх цагт\nНайман шаргыг эрэх үед\nНаран ургах хирд\nНадтай уулзсанаас хойш\nНасад үнэнээр зүтгэсэн\nНаху баяны хөвүүн\nНайрт хүлэг Боорчи минь!\nАйл зуур явахад\nАлаг бяруу мэт номхон байвч\nАлалцах дайсантай уулзахад\nАрслан барс мэт догширч\nАюулт дайсныг дарахын төлөө\nАмь биеэ үл хайрлагч\nАчит хүлэг Боорчи минь!\nХанилж явах цагт\nХар бяруу мэт номхон байвч\nХатгалдах дайсантай тулах цагт\nХарцага шонхор мэт догширч\nХарийн дайсныг дарахын төлөө\nХалуун амиа үл бодогч\nХайрт хүлэг Боорчи минь!\nИнээлдэн явах цагт\nИжил бяруу мэт номхон байвч\nИрэх дайсан учрахад\nИдэт араатан мэт догширч\nИдэмхий дайсныг дарахын төлөө\nИтгэлт биеэ үл хайрлагч\nИвээлт нөхөр Боорчи минь!\nНаадан явах цагт\nНамрын унага мэт эелдэг боловч\nНанчилдах дайсантай учрахад\nНачин шонхор мэт довтолж\nНасан ямагт зүтэгсэн\nНайз хүлэг Боорчи минь!\nХарил буцалгүй явагч\nХаан эзнээ дагагч\nХайрт хүлэг Боорчи минь\" гэж магтан дуулав.\n\nЭзэн зургаан сайдаа магтан дуусахад Боорчи, эзнээ магтаж дуулсан нь:\n\n\"Есүхэй баатар эцэгтэй\nЕсөн өрлөг түшмэлтэй\nЕр бүгдийг эрхэндээ оруулсан\nЕртөнцийн эзэн Чингис хаан минь!\nӨэлүн хатан эхтэй\nӨрлөг есөн түшмэлтэй\nӨгэдэй, Толуй хөвүүнтэй\nӨршөөл хайр ихтэй\nӨнгө бүрийн улсыг\nӨмнөө сөгдүүлсэн\nӨшөөтөн дайсан бүгдийг\nӨлмий дороо гишгэсэн\nӨндөр дээд эзэн хаан минь!\nХан эзэн чамайг байхад\nХарийн дайснаас\nХалшрах явдалгүй.\nЭзэн баатар чамайг байхад\nЭзэрхэг дайснаас\nЭмээх явдалгүй.\nХамаг бүгд хамтарч\nХамаатан садан мэт эвлэлдэж\nХарийн дайсныг хамх цохъё\nХалуун зуураа цэнгэлдэн сууж,\nХун галуу мэт\nХуралдан цэнгэе\nХудалч хүний үгэнд\nБүүр оръё\nХарцага шонхор мэт\nХарайлан дүүлэн явъя\nХатгалдах дайнд\nХалуун амиа\nБүү хайрлая.\nАнгир шувуу мэт\nАмраг үрээ бүү хөнөөе. . .\nАлалцах дайсанд\nАмиа бүү хайрлая.\nЭлэг садан дотроо\nЭв найрамдлыг бүү алдъя\nЭзэрхэх дайсантай тулахад\nЭнэ биеэ бүү хайрлая\"\n\nХүлэг Боорчийн дуулсан үг энэ билээ."}]], "lines": {"Мя": "Зүүд ба зургаан сайдын тангараг · **Лх:** Гурван зуун тайчуудтай тулалдсан нь, Чингисийн залбирал · **Пү:** Чингис зургаан сайдаа магтсан нь, Боорчийн дуу (багш, хүүхдүүд хамтдаа уншина)"}}, {"n": 17, "title": "Наяа, Ван ханы түүх, Татаарыг сөнөөсөн нь", "vocab": [["эзэндээ халдах", ""], ["итгэмжгүй", ""], ["цааз", "хууль, дүрэм"], ["олз", ""], ["тэнхлэг", ""]], "qs": ["Наяа Таргудайг суллая гэж яагаад хэлсэн бэ?", "Олзонд шунаж зарлиг зөрчсөн хүмүүсийг Чингис хэрхэн шийтгэсэн бэ?", "Бэлгүтэй нууцыг задалснаас юу болсон бэ?"], "fri": "«Үнэнч байдал» сэдвийн хуудсанд Наяа, Зэвийн жишээг нэмнэ.", "warn": ["§154 (Татаарыг хядсан), §155–156 (Есүй хатан): багш товчилно."], "strat": "Асуулт тавих — хүүхдүүд өөрсдөө асуулт зохиож, хосдоо асууна.", "mode": "Багш чангаар уншина, хүүхдүүд хуруугаараа дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§149 (Ширээт өвгөн ба Наяа)", "n": 149, "text": "Суут богд Чингис хаан, үд зуур явж гурван зуун тайчуудыг дарж эсэн мэнд гэртээ ирж энх амгалан суув. А.то] Нүцгэн баарины Ширээт өвгөн, хөвүүн Алаг Наяа хоёртой элбэж тайчуудын ноён Таргудай Хирилтугийг ойд хоргодож байхад олж бариад, тэр, морь унаж үл чадах тарган тул тэргэнд суулгаж [Тэмүжинд хүргэхээр] авч явахад Таргудай-Хирилтугийн хөвүүд, дүү нар нэхэж булаан авахаар ирэв. Тэднийг ирмэгц Ширээт өвгөн, хөдлөн ядах Таргудайг хөлбөрүүлэн унагаж, гэдрэг харуулан хэвтүүлж, гэдсэн дээр нь сандайлж суугаад, хутгаа сугалж өгүүлрүүн: \"Хөвүүд дүү нар чинь, чамайг булааж авахаар ирэв. Хан чамайг одоо би эс алавч, чамд нэгэнт халдсан тул намайг алах болно. Чамайг алавч, нэгэн адил алагдах болно. Иймийн тул чамаар дэр хийж үхье\" гэж хутгын ирийг Таргудайн хоолойд тулгавал, Таргудай-Хирилтуг, дүү нар хөвүүддээ их дуугаар уйлан өгүүлрүүн: \"Ширээт, намайг алах гэж байна. Намайг нэгэнт албал миний хүүрээр та нар юу хийх вэ? Намайг алаагүй байхад даруй буцагтун. Тэмүжин, намайг алахгүй. Тэмүжинийг эзэнгүй нутагт орхигдоод байхад нүдэндээ галтай, нүүртээ гэрэлтэй, сэргэлэн авьяастай хөвүүн гэж би олж авчраад, эмнэг үрээ даага сургах мэт сургаж хүмүүжүүлж явсан билээ. Тэр цагт түүнийг хялбар үхүүлж чадах боловч өршөөж өсгөсөн юм. Одоо Тэмүжин, түүнийг ухаандаа ойлгож, сэтгэлдээ сэнхэрч байгаа биз. Тэмүжин, намайг алахгүй. Та хөвүүд, дүү нар минь үхэт (түргэн) харигтун. Ширээт, намайг алуузай\" гэж их дуугаар уйлан бархирвал хөвүүд, дүү нар нь сонсож хэлэлцэв: \"Эцгийнхээ амийг аваръя гэж ирсэн билээ. Гэтэл, эцгий минь энэ Ширээт өвгөн албал хоосон амьгүй биеэр бид юу хийх вэ? Одоо алаагүйд буцъя\" гэж харив. Тэднийг далд ормогц тайчуудаас зугтаж одсон, Ширээт өвгөний хөвүүн Алаг Наяа хоёр, эцэгтээ буцаж ирэв. Ширээт өвгөн, хөвүүдтэй хамт нийлээд, Таргуйдайг аван хөдөлж, Хутухул-Нуга гэдэг газар хүрэв. Тэнд Наяа өгүүлрүүн: \"Бид энэ Таргудайг барьж очвол, Чингис хаан, биднийг хан эзнээ барьж ирсэн итгэмжгүй ард гэж биднийг итгэж нөхөрлөхгүй, харин хан эзэндээ халдсан харц ард гэж барьж алах биз. Одоо Таргудайг эндээс тавьж буцаагаад бид Чингис хаанд биеэр очиж ингэж хэлье: \"Бид Чингис хаан чамд хүчээ өгөхөөр ирэв. Бид, Таргудайг барьж ирж явтал, хан эзнээ харсаар байж, х арийн хүнд яаж барьж өгөх вэ гэж халшран өрөвдөж замдаа тавьж буцаагаад, өөрсдөө таныг бишрэн дагахаар ирэв\" гэж хэлье гэвэл Наяагийн үгийг эцэг, хөвүүд зөвшөөрч, Таргудай-Хирилтугийг Хутухул-нугаас тавьж явуулаад, Ширээт өвгөн, Алаг Наяа хоёр хөвүүний хамт, Чингис хаанд хүрч ирэв. Тэдний ирсэн учрыг асуувал, Ширээт өвгөн, Чингис хаанд өгүүлрүүн: \"Бид, Таргудай-Хирилтугийг авчирч явсан боловч замд эзнээ харсаар байж, харийн хүнд яаж барьж өгөх вэ гэж тавьж буцаагаад, бид өөрөө Чингис хаанд хүчээ өгөхөөр ирэв\" гэв.\nЧингис хаан өгүүлрүүн:\n\"Хан эзэн Таргудайг\nХалдаж авчирсан бөгөөс\nХандаа халдсан\nХарц ардад\nИтгэж үл болох тул\nХарин та нарыг\nХамаатан садны\nХамт алах бүлгээ.\nХан эзнээ хайрласан\nХалуун сэтгэл чинь\nХарин зөв\" гээд Наяаг дотночлон өршөөв."}], [{"k": "read", "ref": "§150", "n": 150, "text": "Түүний хойно, Чингис хааныг Дэрсүд гэдэг газар байхад Хэрэйдийн Жаха хамбу нөхөрлөхөөр ирэв. Тэр цагт мэргид хатгалдахаар ирвэл, Чингис хаан, Жаха хамбу хоёр хатгалдан байлдаж няцаав. Тэнд түмэн түбэгэн, олан Дунгайд Хэрэйдийн бутарсан иргэн Чингис хаанд дагаар ирэв. Хэрэйдийн Ван хан, урьд Есүхэй баатартай сайхан ханилж анд бололцсон билээ. Анд бололцсон учрыг хэлбэл, Ван хан, Хурчахус буйруг хан эцгийн дүү нарыг алаад авга Гүр хантай эвдрэн тэмцэлдэж, Хараун хавцал гэдэг газар шурган хоргодож, тэндээс зуун хүнтэй арайхан зугтаж, Есүхэй ханд ирвэл, Есүхэй хан, түүнийг асран тэтгэж, өөрийн биеэр цэрэг авч мордоод, Гүр ханыг Хашин оронд дутаалгаж, албат иргэд ба эд малыг Ван ханд өвч өгсний тул анд амраг бололцсон билээ."}, {"k": "retell", "ref": "§151–152", "n": 151, "text": "§151. Түүний хойно Ван ханы дүү Эрх хар, ах Ван ханд алагдахаас айж дутаан, Найманы Инанча ханд очив. Инанча хан, цэрэг мордуулж ирэхэд Ван хан зайлж, гурван хот дамжин тэнэж, хар Хятадын Гүр ханд очив. Тэр хантай бас эв тасраад Уйгурын хот, Тангудын балгасаар хэсүүчлэн явж, таван ямаа шөрөглөн сааж, тэмээний цус ханаж идсээр арай гэж Гүсэүр нуурт хүрч ирвэл, урьд Есүхэй баатартай анд барилдсаныг Чингис хаан сэтгэж, Дахай баатар, Сүхэхэй жэүн хоёрыг элч болгон угтуулж, бас дараа нь Хэрлэний эхнээс, Чингис хаан өөрөө тосож аваад өлсөж турж ирэв гэж Ван ханд (харъяат ардаас) гувчуур татаж өгөөд өөрийн хүрээнд агуулж тэжээв. Тэр өвөл хамт нүүж Чингис хаан Хубахаяад өвөлжив.\n\n§152. Тэр цагт Ван ханы дүү ноёдын хэлэлцсэн нь:\n\n\"Энэ хан ах мань\nҮр садан биднийг\nҮнсээр хийсгэж болох\nҮмхий санаа өвөртөлсөн\nҮл бүтэх хүн байна\nХайран ах дүүгээ\nХамран алж барав\nХар Хятадад бас\nХамгаалал гуйж шургав\nХамаг улсаа хайрлахгүй\nХаргислаж зовоов.\nҮүнийг яах билээ? Урьд долоон настай байхдаа мэргид иргэнд баригдаж, харлаг ишгэн дах өмсөж, Сэлэнгийн Буур хээрт очоод Мэргидийн газар будаа нүдэж амьдарч явсан билээ. Хурчахус буйруг хан эцэг нь мэргид иргэнийг байлдан дайлж, хөвүүнээ аварч ирсэн. Гэтэл энэ Тоорил бас Татаарын Ажай ханд арван гурван настай байхдаа эхийн хамт баригдаж очоод түүний тэмээг хариулж явжээ. Тэндээс Ажай ханы хоньчийн хамт оргож гэртээ ирэв. Түүний хойно найманаас айн дутааж, Сартаул газрын Чуй мөрнөө хар Хятадын Гүр ханд очив. Тэнд нэг жил болоод бас зайлж, Уйгур нутгаар тэнэж, Тангуд газраар зайлж, таван ямаа шөрөглөн (ямааг дэлэвчлэх буюу ишигний хошууг шөрөглөн) сааж, тэмээний цус ханаж идсээр ганц сохор халиун морьтой, Тэмүжинд ядаж ирвэл, Тэмүжин хөвүүн, гувчуур татаж түүнийг тэжээв. Гэтэл, одоо тэр ингэж явснаа мартаад өмхий элэг өвөртөлж явна\" гэж хэлэлцэв. Энэ хэлэлцсэн үгийг Ван ханд Алтан ашуг уламжлан айлтгав. Алтан ашугийн хэлсэн нь: \"Би энэ хуувь ярианд оролцсон билээ. Гэтэл, хан чамайг тэвчиж чадахгүй тул хамаг сонссоноо айлтгав\" гэжээ. Тэр үгийг хэлэлцсэн Элхудур, Хулбари, Арин тайж зэргийн дүү ноёдыг Ван хан бариулав. Ван ханы дүү Жаха хамбу амжин дутааж, Найманд очив. Баривчлан авсан дүү нараа Ван хан нэгэн гэрт оруулж өгүүлрүүн: \"Уйгар нутгаар тангуд газраар яаж явсан гэж та нар хэлсэн бэ? Та нар муусайн юу гэж бодов?\" гээд нүүрт нь нулимж, гэрт байсан ард цөмийг босгон нулимуулж, тэдний хүлгийг тавиулав."}, {"k": "read", "ref": "§153", "n": 153, "text": "Тэр өвөл өвөлжиж, нохой жилийн (1202 оны) намар, Чингис хаан, цагаан татаар, алчи татаар, тутауд татаар, алухай татаар нартай Далан нэмүргэ гэдэг газар байлдахын урьд Чингис хаан, цааз тогтоож зарласан нь: \"Дайсныг дарах цагт олзонд бүү саатагтун. Дайсан нэгэнд дарагдвал тэдний юм хэзээ ч бидний олз болох тул хуваалдаж амжина. Хэрэв бид ухрахад хүрвэл анх довтолсон байрандаа даруй эгж ирвэл зохино. Уг байрандаа эгж ирээгүй хүнийг алтугай\" гэж ийм засаг тогтоож зарлав. Далан нэмүргэ гэдэг газар татаартай байлдаж тэднийг дутаалгав. Тэднийг нэхэн байлдаж, Улхуй шилүгэлжид гэдэг газар эзлэн дагуулав. Цагаан татаар, алчи татаар, тутауд татаар, алухай татаар нарын эрхтэн (дээд язгууртан)- ийг дарж харъяат нарыг эзлэх цагт тогтоосон цаазыг Алтан Хучар Даридай гурвуул зөрчиж, олзонд шунан байлдаанаас саатжээ. Хэлсэн үгэндээ хүрсэнгүй, тогтоосон цаазыгдагасангүй гэж Зэв Хубилай хоёрыг явуулж, тэдний олзолсон адуу ба юмыг бүрнээ хураан авахуулав."}, {"k": "read", "ref": "§154", "n": 154, "text": "Татаарыг сөнөөж, бүгдийг эзэлсэн хойно, улс иргэний нь яах тухай Чингис хаан, алтан ургаа цуглуулж нэг гэрт ороод их зөвлөлдөөнийг хийв. Тэдний зөвлөсөн нь:\n\n\"Эрт цагаас нааш\nЭцэг өвгөдийг минь хорлосон\nЭнэ муусайн татааруудыг\nЭгнэгт дуусгахын тул\nТэрэгний булд хэмжиж\nҮгүй хийж устгая.\nҮлдсэн эхнэр хүүхдийг\nҮүд бүрд хувааж\nҮүрдийн боол болгоё\"\n\nгэж зөвлөлдөж тогтоод, гэрээс гарвал татаарын Их-Чэрэн, Бэлгүтэйгээс асууруун: \"Та нар ямар үг зөвлөлдөв?\" гэвэл Бэлгүтэй өгүүлрүүн: \"Та бүгдийг тэнхлэгийн цүүд хэмжиж, түүнээс өндөр нуруутныг цөмийг хядахаар тогтов\" гэв. Бэлгүтэйн энэ үгийг сонсоод Их-Чэрэн, олон татаарт тунхаг зарлаж, хороо бэхлэлтэд цуглуулав. Тэдний бэхлэлтийг эвдэхийн тул манай цэргүүд маш хохиров. Бэхлэлтэд цугласан татааруудыг арай гэж эзлэн авч тэнхлэгт чацуулан хядахад татаар нар хүн тутам \"Дэр авч үхье\" гэж хутга ханцуйлж байсан тул түүнээс бас манай цэргүүд их хохирчээ. Тэдгээр татаар нарыг тэнхлэгт чацуулан хядаж дуусаад Чингис хаан зарлиг болруун: \"Бид ургаараа их зөвлөлдөөн хийснийг Бэлгүтэй гаргаж хэлээд бидний цэргүүдэд маш их хохирлыг учруулав. Үүнээс хойш их эе зөвлөлдөөнд Бэлгүтэйг бүү оруул. Зөвлөлдөөн хийж байхад, Бэлгүтэй, гаднах үйлийг захирч, хэрүүл ба хулгай худлын заргыг шүүж байтугай. Зөвлөлдөөн төгсөж, сархад уусны хойно Бэлгүтэй Даридай хоёр сая орж болно\" гэж зарлиг болов."}], [{"k": "read", "ref": "§155", "n": 155, "text": "Тэр цагт татаарын Их-Чэрэнгийн охин Есүгэнийг Чингис хаан өөрийн хатан болгож авав. Есүгэн хатан Чингис хааны өршөөлд орж өгүүлрүүн: \"Хаан соёрхвол, намайг хүнд бодож асрах биз. Миний эгч Есүй надаас дээр, хан хүнд зохиолдох гоо бүлгээ. Гагцхүү саяын будлианд хааш одсоныг мэдэхгүй\" гэвэл Чингис хаан өгүүлрүүн: \"Эгч чинь үнэхээр чамаас гоо бол түүнийг эрүүлье. Эгчээ ирвэл чи зайлж сууриа өгөх үү?\" гэв. Есүгэн хатан өгүүлрүүн: \"Хаан соёрхож, эгчийг минь авчирч уулзуулбал, би эгчдээ даруй зайлъя\" гэв. Энэ үгэнд Чингис хаан тунхаг зарлаж эрүүлбэл Есүй хатан, өөрийн хүргэнтэй хат ойд дутааж явахыг бидний цэргүүд үзэж Есүй хатныг барьж авчирсан ба эр нь дутаажээ. Есүгэн хатан, эгчээ үзээд хэлсэн үгэндээ хүрч босоод суусан сууриндаа суулгаж, өөрөө доод этгээд (доод тал)-д суув. Есүгэн хатны хэлсэнтэй адил, Есүй хатан үнэхээр гоо тул Чингис хаан анхааран өршөөж, хатдын зэрэгт суулгав."}, {"k": "read", "ref": "§156", "n": 156, "text": "Татаар нарыг довтлон дуусгаж, нэгэн өдөр Чингис хаан, гэрийн гадна Есүй хатан, Есүгэн хатан хоёрын дунд сууж унд ууж байтал, Есүй хатан ихэд санаа алдав. Үүнд Чингис хаан дотроо сэжиг авч, Боорчи Мухулай хоёр ноёныг урьж ирүүлээд өгүүлрүүн: \"Та хоёр энд чуулсан бүх ардыг аймаг аймгаар нь болго. Бус аймгийн хүнийг өөрийн аймагт бүү үлдээгтүн\" гэж зарлиг болов. Тэгээд бүх ардыг аймаг аймгаар ялгавал нэгэн залуу сайн эр аймаггүй үлджээ. \"Чи юун хүн бэ?\" гэж асуувал, тэр хүн өгүүлрүүн: \"Татаарын Их-Чэрэнгийн охин Есүйг авсан хүргэн билээ. Дайсанд талагдахад айж дутаан явсан бүлгээ. Одоо дайн амарлив гэж сэтгэж ирээд олон ардын дотор танигдахгүй биз гэж санаж явлаа\" гэв. Энэ үгийг Чингис хаанд мэдүүлбэл, хаан зарлиг болруун: \"Тэр хүн хорт сэтгэл өвөрлөж ганцаар тэнэсээр одоо энд ирсэн ажээ. Тэр мэт этгээдийг хэдийний тэнхлэгт чацуулж хядсан биш үү. Юунаас буцна. Нүднээс далд болго\" гэсэнд түүнийг даруй алав."}]], "lines": {"Мя": "§149-ийн сүүлийн хэсэг (Ширээт өвгөн, Наяа) · **Лх** §150, §153–154 · **Пү** §155–156 (§151–152-ыг багш товч ярина)"}}, {"n": 18, "title": "Ван хан, Сэнгүм ба Жамухын хов (§157–166) · Хагас жилийн үнэлгээ", "vocab": [["бэлчир", "голын бэлчир"], ["бууц", ""], ["эцэг хөвүүн бололцох", ""], ["ихэмсэглэх", ""], ["ховлох", ""]], "qs": ["Ван хан шөнө гал түлж орхиод юу хийсэн бэ?", "Ван хан, Чингис хоёр «хорт могойн хэл» орвол яахаар тохирсон бэ?", "Жамуха хов зөөж юунд хүрэхийг хүссэн бэ?"], "fri": "**Хагас жилийн үнэлгээ** (1-р долоо хоногийн хэлбэрээр, өөр текстээр). Уншлагын хурдыг дараагийн долоо хоногийн хосын уншлагын үеэр авна.", "warn": [], "strat": "Асуулт тавих — хүүхдүүд өөрсдөө асуулт зохиож, хосдоо асууна.", "mode": "Бүлгээрээ шивнэж уншина: уншигч уншиж, бусад нь дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§157", "n": 157, "text": "Мөн нохой жил (1202) Чингис хааныг татаартай байлдаж бай цагт Ван хан, мэргидийг довтлохоор мордож, Тогтоа бэхийг Баргуужин төхүмийн зүг үлдэн хөөж, Тогтоагийн их хөвүүн Төгс бэхийг алж, Тогтоагийн Хутугтай Чаалун хоёр охиныг ба хатдыг олзлон авч, Хуту Чулуун хоёр хөвүүний нь харъяат иргэдийн хамт эзлэн авсан боловч, энэ олзноос Чингис хаанд юухныг ч эс өгөв."}, {"k": "read", "ref": "§158", "n": 158, "text": "Түүний хойно Чингис хаан, Ван хан хоёр найманы хүчүгүдийн Буйруг хантай байлдахаар морилж, Улуг тагийн Сохог ус гэдэг газарт хүрвэл, Буйруг хан байлдан ядаж, Алтай даван хөдлөв. Чингис хаан Ван хан хоёр Сохог уснаас Буйруг ханыг нэхэж Алтай давуулан Хумшингирийн Үрүнгү гол уруу хөөж явав. Гэтэл, тэдний Еди-Тоблуг нэрт ноён, харуул харж яваад бидний харуулын цэрэгт хөөгдөж уул өөд дутаахад олом нь тасарч баригдав. Буйруг ханыг Үрүнгү гол уруу хөөн оруулж, Хишилбаши нуурт гүйцэж түүнийг тэнд сөнөөв."}, {"k": "read", "ref": "§159", "n": 159, "text": "Тэндээс Чингис хаан Ван хан хоёр буцаж ирэхэд найманы Хүгсэү сабраг баатар, Байдраг голын билчирт цэрэг засаж байлдахаар тосож байсан ажээ. Чингис хаан Ван хан хоёр мөн байлдахаар цэргээ засаж иртэл, нэгэнт үдэш болсон тул маргааш байлдъя гэж засацгааж хонов. Гэтэл, шөнийн цаг Ван хаан, буусан газартаа гал түлж орхиод, Хар сүүл голыг өгсөн хөдөлжээ."}, {"k": "read", "ref": "§160", "n": 160, "text": "Тэр шөнө Жамуха, Ван хантай хамт хөдөлж яваад Ван ханд өгүүлрүүн: \"Тэмүжинд хэдийнээс наймантай харилцаатай байсан билээ. Одоо бидэнтэй хамт эс хөдлөв.\n\nХан! Хан! Би бол\nХамаагүй хол нисэхгүй\nХайргуна шувуу мэт\nХамт нэг газар байна.\nХарин миний анд Тэмүжин бол\nХарьж нисэх шувуу мэт\nХааш яаш урван өднө.\nХан чамаас одоо салж\nХарь найманд очих гэж\nХарсаар зориуд хоцров\"\n\nгэвэл, Жамухын үгийг сонсож, Убчигдайн Хүрэн баатар өгүүлрүүн: \"Чи юун дэмий зусардаж, шударга ах дүүгээ ховлон хачилж байна вэ?\" гэв."}, {"k": "read", "ref": "§161", "n": 161, "text": "Чингис хаан, тэр шөнө тэнд хоноод маргааш өглөө байлдах гэж босвол Ван ханы буусан газар хов хоосон болсон тул \"Харин чи биднийг мэхэлж бууцанд хаясан байна\" гээд Чингис хаан хөдөлж, Эдэр Алтайн бэлчрээр гэтэлж сааталгүй явсаар Саарь хээрт очиж буув. Тэндээс Чингис хаан Хасар хоёр, найманууд ямар төвөг учруулсныг мэдсэн боловч, үүнийг нэг ч хүнд хэлсэнгүй."}, {"k": "read", "ref": "§162", "n": 162, "text": "Найманы Хүгсэү Сабраг баатар, Ван ханы хойноос нэхэж, Сэнгүмийн эм, хөвүүд ба эд хөрөнгө, албат ардыг цөм булаан авч, бас Ван ханыг Тэлэгэтү амсар гэдэг газар байхад нэхэн байлдаж, зарим албат иргэн ба адуу малыг булаан аваад буцжээ. Ван ханыг дагаж явсан мэргидийн Тогтоагийн Хуту Чулуун хоёр хөвүүн, тэр завшааныг тохиолдуулж, албат иргэнээ авч Сэлэнгийг чиглэн хөдлөөд эцэгтээ нийлэн очив."}], [{"k": "read", "ref": "§163", "n": 163, "text": "Ван хан, найманы Хүгсэү сабраг баатарт дийлэгдээд Чингис хаанд элч явуулж хэлүүлсэн нь: \"Найманд эд хөрөнгө ба эм, хөвүүдээ булаагдав, би. Хөвүүн чамаас дөрвөн хүлэг баатраа ирүүлэхийг гуйя. Миний албат иргэн ба эд хөрөнгийг аварч өгнө үү\" гэжээ. Чингис хаан цэрэг засаж, Боорчи, Мухулай, Борохул, Чулуун дөрвөн хүлэг баатраа цэргийн хамт илгээв. Энэ дөрвөн хүлэг баатрыг ирэхийн урьд Улаан\nхус гэдэг газар Сэнгүм байлдаан хийж байгаад мориныхоо гуяыг шархдуулж баригдахад хүрч байтал, Чингисийн дөрвөн хүлэг очиж түүнийг авраад албат хөрөнгө ба эм, хөвүүд бүгдийг аварч өгөв. Тэр цагт Ван хан өгүүлрүүн: \"Урьд Тэмүжиний сайн эцэг Есүхэй баатар миний бутарсан улсыг аварч цуглуулж өгсөн билээ. Одоо хөвүүн Тэмүжин бас дөрвөн хүлэг баатраа явуулж, миний алдагдсан улсыг аварч олж өгөв. Ач хариулахыг тэнгэр газрын ивээл мэдтүгэй\" гэв."}, {"k": "read", "ref": "§164", "n": 164, "text": "Бас Ван хан өгүүлрүүн:\n\n\"Анд Есүхэй баатар минь\nАлдагдан барсан улсы минь\nАварч цуглуулж өгсөн билээ.\nТүүний ууган хөвүүн\nТэмүжин Чингис хаан\nТэнэж бутарсан улсы минь\nТэтгэж хурааж өгөв.\nЭнэ эцэг хөвүүн хоёр эл улсы минь тэтгэж\nХэний төлөө зүтгэж\nЮуны төлөө зовж байгаа билээ?\nӨтөлсөн өвгөн би\nӨндөр уулыг түшиж\nӨвс хагдыг дэрлэж\nӨөд болж одвол\nӨнөр олон улсы минь\nӨвлөн хэн эзлэх вэ?\nХан Тоорил би\nХанат гэрээс салж\nХадат гэрт очвол\nХамаг хураасан улсы минь\nХарж хамгаалж байх хүн\nХаана хэн байх билээ?\nЭзэн Тоорил би\nЭсгий гэрээс холдож\nЭнгэр гэрт очвол\nЭнхрийлж хураасан улсы минь\nЭзэлж хэн захирах билээ?\nТөрсөн дүү нар байвч\nТөр барьж чадахгүй\nТөв сайн авиргүй\nТүвэг ихтэй хүн бий.\n\nГанц хөвүүн Сэнгүм байвч, түүнд хань болох хүнгүй тул Тэмүжинийг Сэнгүмийн ах болгож, хоёр хөвүүнтэй болоод сэтгэл амар сууя\" гэв. Тэгээд Чингис хаан Ван хоёр хоёр, Туул голын хар шугуйд нийлж эцэг хөвүүн болж ёслов. Эрт өдөр Есүхэй баатартай Ван хан анд бололцсон тул Ван ханыг эцэг мэт үзэж, ийнхүү эцэг хөвүүн бололцсон билээ, Энэ тухай хэлэлцсэн үг нь:\n\"Харь дайсантай тулахад\nХамт нийлж байлдъя\nХадны гөрөөсийг авлахад\nХавсарч нийлж явъя\" гэв.\nБас, Чингис Ван хан хоёр хэлэв:\n\"Хорт могойн хэл\nХооронд минь хутгаж\nХов жив оруулбал\nХолдож салалгүй, харин\nХоёр нүүрээр учирч\nХор хөнөөлийг тасалж байя.\nАраат могойн шүд\nАмрагийн хооронд орж\nАя эвийг эвдвэл\nАтаат сэтгэл төрөлгүй\nАм хэлээрээ уулзан ярьж\nАливаа учрыг олж байя\"\n\nгэж бат үгээ барилдаж, амраглан явав."}], [{"k": "read", "ref": "§165", "n": 165, "text": "Түүний хойно, амраг дээр давхар амраг болъё гэж Чингис хаан сэтгэж, Зүчид Сэнгүмийн дүү Чаур бэхийг гуйж, бас Сэнгүмийн хөвүүн Тусахад өөрийн Хожин бэхийг арилжин өгье гэж гуйвал, Сэнгүм биеэ ихэмсэглэн сэтгэж өгүүлрүүн: \"Миний ураг тэднийд очвол, ямагт хатавчинд хоймор харж суух болно. Тэдний ураг бидэнд ирвэл, хоймор сууж хатавч харах болно\" гэж ихэмсэглэн, биднийг доромжлон хэлж, Чаур бэх дүүгээ өгөхийг зөвшөөрсөнгүй. Үүнд Чингис хаан дотроо Ван хан, Нялха-Сэнгүм хоёрт дургүй болжээ."}, {"k": "read", "ref": "§166", "n": 166, "text": "Тэгж дургүй бололцсоныг Жамуха мэдэж, гахай жилийн (1203) хавар Жамуха, Алтан, Хучар, Хар хятадын өвөгжин ноёхон, Сүбээдэй-Тоорил, Хачиун бэхи нар эелдэн нийлэлдэж нүүгээд Жэжээр өндрийн хярын Бэрхэ Элэтэд очиж Нялха-Сэнгүмтэй уулзаад, Жамуха ховлон өгүүлрүүн: \"Миний анд Тэмүжин, найманы Даян ханд элч илгээж үргэлж харилцаатай байдаг билээ.\n\nТэр,\nАм хэлэндээ\nАав хөвүүн гэдэг боловч\nАвир санаа нь\nАдвиш өөр бишүү\n\nТүүнд итгэж байна уу? Хожидвол та нар юу болохоо мэдэж байна уу? Та нар Тэмүжинтэй байлдахаар мордвол би хажуунаас оролцъё\" гэжээ. Алтан Хучар хоёр өгүүлрүүн: Бид:\n\nӨэлүн эхийн өнчин хөвүүдийн\nАхы нь алж\nДүүгий нь дүүжилж\nөгье\" гэжээ. Хар хятадын Өвөгжин ноёхон өгүүлрүүн:\n\"Гары нь барьж\nХөлий нь хүлж\n\nөгье\" гэжээ. Тоорил өгүүлрүүн: \"Арга сүвэгчилж Тэмүжиний улсыг булааж авъя. Улсаа автвал тэр яах ч аргагүй болно\" гэжээ. Хачиун бэхи өгүүлрүүн: \"Нялха-Сэнгүм хөвүүн чамайг сэтгэж, чиний төлөө уртын үзүүрт, гүний ёроолд хүрэхээс буцахгүй\" гэжээ."}]], "lines": {"Мя": "§157–162 · **Лх** §163–164 · **Пү** §165–166"}}, {"n": 19, "title": "Хуйвалдаан ба Хархалзан элээтийн тулаан", "vocab": [["багалзуур идэх", "сүй тавих, хуримын ёс"], ["сэжиг", ""], ["адууч", ""], ["тоос", ""], ["хатуужих", ""]], "qs": ["Мэнлиг эцэг юунд сэжиглэсэн бэ?", "Бадай, Хишилиг хоёр яагаад Чингист мэдээ хүргэсэн бэ?", "Жамуха Чингист далдуур мэдээ илгээсэн нь түүнийг хэнд үнэнч байсныг харуулж байна вэ?"], "fri": "Долоо хоногийн уншлагыг 3 өгүүлбэрт хураангуйлна (энэ улирлын стратеги).", "warn": [], "strat": "Гол санаа ба хураангуй — долоо хоногийн уншлагыг 3 өгүүлбэрт багтаана.", "mode": "Бүлгээрээ шивнэж уншина: уншигч уншиж, бусад нь дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§167", "n": 167, "text": "Эдгээр үгийг Нялха-Сэнгүм, эцэг Ван хандаа Сайхан-Тодэ гэгч хүнээр хэлж илгээв. Энэ үгийг Ван хан сонсоод өгүүлрүүн: \"Тэмүжин хөвгүүнд тийм муу сэтгэж яаж болно? Бид, Тэмүжин хөвүүнээр тулгуур болгож байгаа атал, түүнд муу санавал тэнгэр биднийг таалахгүй. Жамуха хэзээнээс тэнэмэл чалчаа хүн билээ. Тэр дэмий зөв бурууг хэлж байна\" гэж эс таалан буцаажээ. Бас Сэнгүмийн хэлүүлсэн нь: \"Амьд хүн, ам хэлээрээ хэлж байхад аав та яагаад итгэдэггүй билээ?\" гэж дахин хүн явуулж хэлүүлж ядаад эцэст нь өөрийн биеэр ирж эцэгтээ өгүүлрүүн: \"Одоо чамайг амьд байхад биднийг тэр тоомсорлохгүй байна. Хэрэв хан эцэг чамайг цагаан идээнд цацаж, хар маханд хахвал, Харчахус-Буйруг хан эцгийн зовж хураасан улс, зүдэж байгуулсан төрий чинь бидэнд мэдүүлэхгүй болуузай\" гэжээ. Ван хан өгүүлрүүн: \"Үр хөвүүнээ яаж хөнөөх вэ? Үнэхээр тулгуур болж байгаа түүнд муу сэтгэвэл, тэнгэр биднийг үл таалах болно\" гэвэл, хөвүүн Нялха-Сэнгүм уурлаж үүд хаян гарав. Жич, Ван хан, хөвүүн Сэнгүмийг хайрлаж урьж ирүүлээд өгүүлрүүн: \"Тэнгэрт үл таалагдахаас айж хөвүүнээ яаж хөнөөх вэ? гэсэн билээ. Та нар чадах бол юу үйлдэхээ өөрсдөө мэдтүгэй\" гэжээ."}, {"k": "read", "ref": "§168", "n": 168, "text": "Тэндээс Сэнгүм өгүүлрүүн: \"Мөнөөхөн тэд, манай Чаур бэхийг гуйж байсан билээ. Одоо \"Багалзуур ид\" гэж өдөр болзож ирүүлээд түүнийг барьж авъя\" гэв. (\"Багалзуур идэх\" гэх нь хонины багалзуур махыг ид гэсэн үг биз. Залуу эр эм гэрлэсэн өдрөөс эхлэн гурван хоног хонины хүзүү багалзуурыг хувааж идэх заншил Монгол газар одоо ч хүртэл байна. Хүзүү багалзуурын яс маш бат хэлхээтэй байдаг тул үүгээр эр эмийн бат холбоог бэлэгджээ. Иймийн тул \"Багалзуур ид\" гэх нь эр эм болох хурим хийе гэсэн үг биз). Тэгж хэлэлцэж тогтоод \"Чаур бэхийг өгье. Багалзуур идэхээр ирэгтүн\" гэж Чингист хүн илгээв. Тэр ёсоор Чингис хаан, арван хүн дагуулж, Ван ханд очих замын зуур Мэнлиг эцгийн гэрт хоновол, Мэнлиг эцэг өгүүлрүүн: \"Мөнөөхөн бид Чаур бэхийг гуйвал, биднийг доромжилж өгсөнгүй билээ. Одоо багалзуур ид гэж гэнэт урих нь жигтэй. Саяхан ихэмсэглэн биднийг тоохгүй байсан хүмүүс, гэнэт яагаад Чаур бэхийг өгөх болов? Үүнд сэжигтэй явдал байна. Хөвүүн чи болгоомжлох хэрэгтэй. Одоо хавар болов. Бидний адуу туранхай байна. Адуугаа таргалмагц очъё гэж шалтаглаж, энэ хэргийг хойш тавивал ямар?\" гэсэнд Чингис хаан, түүний үгийг авч өөрөө очсонгүй, Бухатай, Хиратай хоёрыг \"Багалзуур ид\" гэж явуулаад Чингис хаан, Мэнлиг эцгийн гэрээс буцав. Бухатай Хиратай хоёрыг очмогц, Сэнгүм нар \"Бидний хэрэг мэдэгдэв. Маргааш эрт хамарч баръя\" гэв."}], [{"k": "read", "ref": "§169", "n": 169, "text": "Тийнхүү барих гэж хэлэлцэж тогтсоныг Алтаны дүү Их-Чэрэн гэртээ ирж өгүүлрүүн: \"Маргааш өглөө Тэмүжинийг барихаар шийдэв. Энэ үгийг хүргэсэн хүнд Тэмүжин юугаа ч хайрлахгүй өгөх биз\" гэвэл, түүний эм Алахчит өгүүлрүүн: \"Чиний энэ дэлэм үг, алд хэл чинь юун болно? Хүн сонсож үнэмшүүзэй\" гэв. Энэ үгийг сүү хүргэхээр ирсэн тэдний адууч Бадай сонсож буцав. Бадай харьц ирээд\nнөхөр адууч Хишилигт Чэрэнгийн үгийг хэлбэл, Хишилиг өгүүлрүүн: \"Би бас очиж учрыг мэдье\" гэж Чэрэнгийн гэрт очвол Чэрэгийн хөвүүн Нарийн-гэгээн, гадна сууж сумаа зүлгэж байна. Нарийн-гэгээн өгүүлрүүн: \"Манайхан сая юу гэж ярьсан бэ? Хэлээ татаж, амаа барьж яваасай\" гэжээ. Тэгээд Нарийн-гэгээн, бас адууч Хишилигт өгүүлрүүн: \"Мэргидийн цагаан, ам цагаан хээр хоёр морийг барьж авчир. Уяж хоноод өглөө эрт мордоно\" гэжээ. Хишилиг ирж Бадайд өгүүлрүүн: \"Тугаар (сая)-ын чинь хэлсэн үнэн болов. Одоо бид хоёр, Тэмүжинд хэл хүргэе\" гэж үг барилдаж, мэргидийн цагаан, ам цагаан хээр хоёр морийг барьж, их гэрийн гадна уяад мөн үдэш хонинд орж нэгэн хурга алаад исэр (ор)-ээ түлж чанаад мэргидийн цагаан, ам цагаан хээр хоёр бэлэн уясан морийг унаж тэр шөнөдөө Чингис хаанд давхиж ирэв. Бадай Хишилиг хоёр, Чингисийн гэрийн араас Их-Чэрэнгийн өгүүлсэн үг ба түүний хөвүүн Нарийн-гэгээний сумаа зүлгэж бэлдэж байсан хийгээд мэргидийн цагаан, ам цагаан хээр хоёр морийг барьж уя гэсэн бүх үгийг Чингис хаанд хэлж өгөв. Бас Бадай Хишилиг хоёр өгүүлрүүн: \"Чингис хаан соёрхвол, бидний үгэнд эргэлзэх явдалгүй. Хамран ирж таныг баръя гэж хэлэлцэж тогтсон нь магадтай үнэн\" гэв."}], [{"k": "read", "ref": "§170", "n": 170, "text": "Түүнийг сонсоод Чингис хаан Бадай Хишилиг хоёрын үгийг итгэж, мөн шөнө шадар байсан итгэлт нөхдөд мэдэгдээд, юм хүмээ орхиж, хөнгөвчлөн мордов. Мау өндрийн хярд гарч явахад хойноо урианханы Зэлмээг цагдах харуул болгон тавив. Тэгж явсаар маргаашийн өдөр наран хэлбийхэд Хархалзан элээт хүрч үдлэн буув. Тэнд үдэлж байтал, Алдчидайн агтагч Чихитай Ядир хоёр сайхан бэлчээрт агтаа адуулж яваад Мау өндрийн өврөөр Улаан бургадыг дайран ирж яваа дайсны тоосыг үзэж, агтаа яаравчлан хөөж ирсэнд ажиглан харвал, үнээр Мау өндрийн өврөөр Улаан Бургад гэдэг газарт тоос гарч байна. чингис хаан, тэр тоосыг үзэж, Ван хан нэхэж айсуй гэж агт морьдыг бариулж ачаалан хөдлөв. Хэрэв тэр тоосыг урьдаас үзээгүй бол гэнэдэж болох билээ. Тэр цагт Ван хантай Жамуха ирж явсан ажээ. Ван хан, Жамухаас асууруун: \"Тэмүжин хөвүүнд бидэнтэй байлдаж чадмаар ямар хүмүүс байна?\" гэвэл, Жамуха өгүүлрүүн: \"Урууд, мангууд нар түүнийг дагаж байгаа. Бодвол тэд байлдах биз.\n\nТойрч ирээд\nДовтлон буудан\nТашаалдаж ирээд\nДаран ордог\nБараан алаг тугийг\nБарьж явдаг\nБачит тэдгээр иргэн\nБага наснаас эхлэн\nБайлдаж мэргэжсэн тул\nВан хан та\nБаахан болгоомжилбол зүйтэй\" гэжээ.\nТэр үгийг сонсоод Ван хан өгүүлрүүн: \"Тийм бол бид анханд Хадагиар толгойлуулан, Жүрхиний баатруудыг оруулъя. Түүний хойноос түмэн түбэгэний Ачиг-Ширүнг оруулъя. Түүний хойноос Олан дунгайдын баатруудыг оруулъя. Түүний хойноос Ван ханы мянган торгон цэргийг удирдан Хориширэмүн тайж довтолтугай. Түүний хойноос бидний их гол хүчин оръё\" гэв. Бас ван хан өгүүлрүүн: \"Жамуха дүү чи бидний бүх цэргийг зас (захирагтун)\" гэвэл, Жамуха, олноос онцгой гарч нөхдөдөө өгүүлрүүн: \"Ван хан, бүх цэргээ намайг захир гэж байна. Би Тэмүжин андтай байлдан ядаж байхад намайг харин цэргээ захир гэнэ. Үзвэл, Ван хан, надаас хэтрэхгүй дорой бөгөөд түр нөхөрлөх хүн байна. Тэмүжин андад хэл оруулъя. Анд хатуужтугай\" гэж Жамуха, Чингис хаанд эчнээгээр (далдуур) хүн явуулж хэлүүлсэн нь: \"Ван хан, надаас асуув. \"Тэмүжин хөвүүнд бидэнтэй байлдах ямар хүн бий?\" гэж асуувал, би: \"Уруул Мангуд тэргүүтэй хэцүү баатрууд бий\" гэж хэлбэл, Ван хан Жүрхиний баатруудыг манлай болгож томилов. Түүний хойноос Түмэн Түбэгэний Ачиг-Ширүнг томилов. [Түүний хойноос] Олан дунгайдыг томилов. Түүний хойноос Ван ханы мяган торгон цэргийн ноён Хориширэмүн тайжийг томилов. Түүний хойноос Ван хан, их гол цэргээ авч орно гэнэ. Бас Ван ханы хэлсэн нь: \"Жамуха дүү, эдгээр бүх цэргийг захир\" гэж надад итгэж хэлнэ. Үүнээс үзвэл, [энэ Ван хан] хялбархан нөхөр ажээ. Цэргүүдээ өөрөө захирч үл чадна. Би Тэмүжин андтай урьд байлдахад давдаггүй билээ. Гэтэл Ван хан, надаас дорой хүн байна. [Иймийн тул] Анд чи бүү ай. Хатууж\" гэж илгэжээ.", "chap": "Хэрэйд улсын мөхсөн нь"}, {"k": "read", "ref": "§171", "n": 171, "text": "Энэ мэдээг сонсоод, Чингис хаан өгүлрүүн: \"Уруудын Жорчидай авга чи юу гэж бодно? Чамайг манлай болгож явуулъя\" гэвэл Жорчидайг хариу хэлэхийн урьд Мангудын Хуилдар сэцэн өгүүлрүүн: \"Тэмүжин андын өмнөөс би байлдъя. Миний хойно хоцорсон өнчин хөвүүдийг асрахыг Тэмүжин анд мэдтүгэй\" гэв. Жордийг асрахыг Тэмүжин анд мэдтүгэй\" гэв. Жорчидай өгүүлрүүн: \"Чингис хааны өмнөөс бид урууд, мангуд манлайлан хатгалдъя\" гэжээ. Тэгээд Жорчидай Хуилдар хоёр урууд, мангуд [цэрэг]-аа жагсааж, Чингис хааны өмнө мордохыг бэлтгэв. Тэгж байтал, Жүрхинээр толгойлуулсан дайсан хүрч ирэв. Тэднийг ирмэгц урууд, мангуд нар угтан байлдаж Жүрхинийг дарав. Гэтэл бас Түмэн түбэгэний Ачиг-Ширүн довтолж ирэв. Ачиг-Ширүн, Хуилдарыг шархтуулж хадны хавчилд мориноос унагав. Үүнийг үзээд мангуд нар буцаж Хуилдарыг хамгаалав. Жорчидай урууд цэргээ удирдан байлдаж, Түмэн түбэгэнийг дараад цааш нэхэхэд Олан дунгуйд эсэргүүцэн довтлов. Жорчидай бас дунгайдыг дарав. Цааш нэхэхэд Хориширэмүн тайж, мянган торгудаа удирдан угтаж байлдвал бас Жорчидай, Хориширэмүн тайжийг мохоож дарахад Сэнгүм, Ван хан эцгээс зөвшөөрөл авалгүй эсэргүүцэн байлдаж, энгэсэг хацраа шархтаж унажээ. Сэнгүмийг шархтаж унахад хэрэйд бүгдээр түүн дээр цуглаж очив. Тэднийг ийнхүү дарж шингэх наран, уул ташиж байхад манай цэрэг эргэж шархтсан Хуилдарыг унасан газраас аваад харьж ирсэнд мөн үдэш Чингис хаан, Ван хаантай байлдсан газраас хөдлөн зайлж хонов."}]], "lines": {"Мя": "§167–168 · **Лх** §169 · **Пү** §170–171"}}, {"n": 20, "title": "Өгэдэйг аварсан нь ба Чингисийн Ван ханд илгээсэн үг", "vocab": [["сундлах", ""], ["хайгуул", ""], ["тэрэгний арал", "тэнхлэг"], ["хүрд", ""], ["ач хариулах", ""]], "qs": ["Борохул Өгэдэйг хэрхэн аварсан бэ?", "Чингис «хоёр аралтай тэрэг» гэсэн жишээгээр юу хэлэх гэсэн бэ?", "Чингисийн илгээсэн үгийн аль хэсэг хамгийн итгэл үнэмшилтэй байна?"], "fri": "§177-гийн гол санааг 3 өгүүлбэрээр бичнэ.", "warn": [], "strat": "Гол санаа ба хураангуй — долоо хоногийн уншлагыг 3 өгүүлбэрт багтаана.", "mode": "Бүлгээрээ шивнэж уншина: уншигч уншиж, бусад нь дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§172", "n": 172, "text": "Тэнд хоноод маргааш үүр цаймагц, (хүмүүсээ) бүртгэвэл Өгэдэй, Борохул, Боорчи гурав үгүй ажээ. Чингис хаан өгүүлрүүн: \"Өгэдэйтэй итгэлт нөхөр Боорчи Борохул хоёр хоцорчээ. Амьдравч, үхэвч тэр хоёр түүнээс хагацахгүй\" гэв. Манай цэргүүд шөнө морьдоо барьж хонов. Чингис хаан: \"Хэрэв дайсан халдаж ирвэл байлдъя\" гэж цэргээ бэлхэн байлгав. Өдөр гэгээн болоход хойноос нэг хүн хүрч ирэв. Үзвэл Боорчи ажээ. Чингис хаан, өвчүүгээ дэлдэж: \"Мөнх тэнгэр мэдтүгэй\" гээд Боорчийг дуудаж асуувал, тэр өгүүлрүүн: \"Байлдаанд миний морь шархтаж унасан тул, би явган гүйж явтал хэрэйдүүд Сэнгүмийн дээр цуглаж байх чөлөөгөөр ачаагаа хөглүүлсэн морийг олж бариад ачааг огтлон хаяж янгирцаг дээр нь унаад би өөрийн цэргийн мөрийг мөшгөн явсаар хүрч ирэв\" гэв."}, {"k": "read", "ref": "§173", "n": 173, "text": "Бас хоромхон зуур болоод нэгэн морьтой хүн айсуй харагдав. Үзвэл, нэгэн хүн мэт байтал, дор нь хүний хөл мэт юм унжилзаж байна. Хүрч ирэхэд үзвэл, Өгэдэйн хойно Борохул сундалж (Өгэдэйг Борохул, эмээл дээрээ дүүрч) ирэв. Борохулын амны завжнаас цус цувирч байна. Учир нь Өгэдэйн хүзүү суманд шархтсан тул Борохул, түүний асгарсан цусыг амаар шимж, зангирсан нөжийг завжаар цувируулж ирэв. Чингис хаан үзээд нүднээс нулимс цувируулж сэтгэлээ зовж, даруй гал түлүүлээд шархыг хайрч, Өгэдэйд унд өгч уулгаад, дайсан ирвэл байлдъя гэж хүлээж байв. Борохул өгүүлрүүн: \"Мау өндрийн өврөөр Улаан Бургадын зүг цааш дайсны тоос суунаглаж далд оров\" гэвэл Борохулын тэр үгийг сонсоод: \"Дайсан хэрэв халдаж ирвэл бид хатгалдан байлдах билээ. Дайсан тийнхүү дутаасан бол бид цэргээ засацгааж нэхье\" гэж хөдлөв. Тэндээс хөдлөөд Улхуй шилүгэлжид [гэдэг голыг] чиглэн явж Далан нэмүргэ хүрэв."}, {"k": "read", "ref": "§174", "n": 174, "text": "Тэнд хойноос Хадаан-Далдурхан, эм хөвүүдээс салж хагас болж ирэв. Хадаан-Далдурхан ирээд Ван ханы үг гэж өгүүлрүүн: \"Ван хан, хөвүүн Сэнгүмийг энгэсэг хацраа суманд шархтаж унахад дээр нь ирж хэлсэн нь:\n\n\"Хөндлөний хүнийг\nХөнөөх гээд\nХөөрхий биеэ\nХөсөрдүүлэв, чи\nХажуугийн хүнийг\nХалдах гээд\nХацар энгэсгээ\nХатгуулав, чи\nХайрт хөвүүний\nХатгагдсаны төлөө\nХарь дайсныг\nХалдан довтолъё\"\n\nгэвэл, Ачиг-Ширүн өгүүлрүүн:\n\n\"Эзэн хан минь\nЭрхбиш болоомжилж айлд\n[Эзэн хан тэргүүлэн\nЭнгийн харц бүгдээр]\nЭс заяасан хөвүүний\nЭрэл мөрөөдөл болж\nЭлдэв арга хийлгэж\nЭвий бавий хэмээн залбирах бөлгөө\nЭнэ залбирал бүтэж\nЭхээс төрсөн заяасан\nЭрхэм хөвүүн Сэнгүмийг\nЭнхрийлэн асарч сувилъя\nМонгол (Мөн гол)-ын олонх, Жамуха, Алтан, Хучар нарыг дагаж бидний энд бий. Тэмүжинийг дагаж гарсан монголчууд хаана холдох вэ? Морин унаатан, модон нөмөртөн болов тэд (хүн бүр дөнгөж ганц морьтой бөгөөд гэргүй учраас модны нөмөрт хоргодож байгаа). Тэднийг дагаж эх ирвэл бид очиж, морины хомоол мэт хормойлж авч ирье\" гэв. Ачиг-Ширүний энэ үгэнд Ван хан өгүүлрүүн: \"За, тийм бол хөвүүн эндэх болуузай. Хөвүүнийг асран сувил\" гээд байлдааны газраас буцаж харив\" гэв."}, {"k": "read", "ref": "§175", "n": 175, "text": "Чингис хаан, тэрхүү Далан нэмүргээс Халх [гол] уруу хөдөлж явах зуур цэргээ бүртгэж үзвэл, хоёр мянган зургаан зуун хүн байна. Үүнээс нэгэн мянган гурван зуун хүнийг Чингис хаан авч Халх голын өрнөд этгээдээр нүүв. Нөгөө нэгэн мянган гурван зуун цэрэг, урууд мангудын хамт Халх голын дорнод этгээдээр нүүв. Тэгж нүүж явах замдаа хүнс олохын тул ав хийхэд Хуйлдар шархаа эдгээгүй байтал, Чингис хааны ятгасан үгийг үл сонсон, гөрөөсөнд довтолж яваад шарх үгдэрч наснаас нөгчив. Түүнийг ясыг Халх голын Ор Нугын хэлтгий хад гэдэг газар оршуулав."}], [{"k": "read", "ref": "§176", "n": 176, "text": "Халх голын Буйр нуурт цутгах уулзрын газарт тэргэн эмээлтэй [ор малтай А.то] тэнэмэл хонгирад нутаглаж байгаа гэж сонсож, Чингис хаан өгүүлрүүн: \"Эдний хонгирад эртнээс эхлэн, одоо хүртэл зээгийн зүсээр, охины өнгөөр явна гэх тэдний дууллыг дурдан сануулбал дуртайяа элсэн дагах биз. Хэрэв эсэргүүцвэл байлдаж эзлэгтүн\" гэж Жорчидайгаар толгойлуулан урууд иргэнийг илгээвэл, хонгирад нар түүнд элсэн оржээ. Элсэн орсон хонгирад нарыг Чингис хаан огт хөндсөнгүй."}, {"k": "read", "ref": "§177 (эхний хагас)", "n": 177, "text": "Чингис хаан, хонгирадыг оруулаад тэндээс нүүж Түнхэлэг горхины зүүн этгээдэд хүрч буугаад Архай Хасар, Сүхэхэй Жэүн хоёрыг элч болгон томилж [Ван ханд] хэлүүлсэн нь: \"Бид Түнхэлэг горхины зүүн этгээдэд буув. Энд өвс сайн ургажээ. Агт морьд минь тамиржиж байна. Хан эцэгт минь ингэж өгүүлтүгэй: \"Хан эцэг минь юунд хилэгнэж, намайг юунд айлгав? Муу хөвүүд, муу бэрүүд биднийг амар унтуулахгүй юунд айлгаж байна?\n\nСандайлж суух орыг минь\nСалбагнуулан түлхэж\nСавсан гарах утаагий минь\nСацруулан хийсгэж\nСанамсаргүй муу хөвүүнээ юунд\nСандруулан хөнөөв, чи?\nХан эцэг минь чи\nХажуугийн ховч хүний\nХалтай муу үгэнд\nХатгагдан юунд оров?\nХөвүүн миний тухай\nХөндлөнгийн муу хүн\nХөвсөргөн үгийг хэлж\nХөнөөн салгаж байна.\nХан эцэг минь, бид хоёр юу гэж хэлэлцсэн билээ? Зоргал хоны Улаан болдог гэдэг газар бид хоёр юу гэж хэлэлцсэн билээ?\n\nХорт могойн хэл\nХооронд минь хутгаж\nХов жив оруулбал\nХолдож салалгүй, харин\nХоёр нүүрээр учирч\nХор хөнөөлийг тасалж байя\n\nгэж хэлэлцсэнгүй билүү? Одоо эцэг минь чи хоёр нүүрээр уулзаж хэлэлцэлгүй юунд хөнөөж эхлэв?\n\nАраат могойн шүд\nАмрагийн хооронд орж\nАя эвийг эвдвэл\nАм хэлээр уулзан ярьж\nАливаа учрыг олж байя\n\nгэж хэлэлцсэнгүй билүү? Одоо хан эцэг минь, чи ам хэлээр уулзан ярилгүй, ангижран юунд салав? Хан эцэг минь! Би цөөн боловч олноос дутахгүй, муу боловч сайнаас дордохгүй [чамд нөхөр түшиг болж байсан]. Хоёр аралтай тэрэгний нэгэн арал хугарвал, үхэр түүнийг чирч чадахгүй. Тэр мэт нэгэн арал чинь би биш билүү? Хоёр хүрдтэй тэрэгний нэгэн хүрд эвдэрвэл явж чадахгүй. Тэр мэт нэгэн хүрд чинь би биш билүү? Эрт өдөр Хурчахус буйруг хан эцгийн дөчин хөвүүний эх гэж чи хан болсон билээ. Чи хан болоод, Тай-Төмөр тайж, Буха-Төмөр хоёр дүүгээ алав. Би чиний дүү Эрх-хар алагдахаас айж дутаан, найманы Инанча Билгэ ханд очиж амь хоргодов. Дүү нараа алав гэж Гүр хан авга чинь чамтай байлдахаар ирэхэд чи зуун хүн авч арай гэж амь гарч Сэлэнгэ уруу дутааж, Хараун-хавчил гэдэг газар шургав, чи. Жич мэргидийн Тогтоад Ужаур үжин охиноо бялдуулчлан өгч, Хараун-хавчлаас гараад Есүхэй хан эцэгт минь ирж: \"Авга Гүр хаанаас улсыг минь аварч өг\" гэж гуйсанд, Есүхэй хан эцэг минь, чиний улсыг аварч өгөхийн тулд тайчуудын Хунан Бахажи хоёроор удирдуулан цэрэг засан мордуулж, Гурван Тэл гэдэг газар байгаа Гүр ханыг [дарж түүнийг дөнгөж] хорь гучин хүний хамт Хашин (тангуд) оронд дутаалгаж, чиний улсыг аварч өгсөн билээ. Тэр цагт чи Туул голын Хар шугуйд Есүхэй хэн эцэгтэй анд бололцоод Ван хан эцэг чиний баясаж хэлсэн нь \"Энэ хүргэсэн тусыг чинь ургийн ураг хүртэл [мартахгүй] ачийг хариулахыг тэнгэр газрын ивээл мэдтүгэй\" гэж биширч хэлсэн билээ. Түүний хойно [чиний дүү] Эрх-хар, найманы Инанча Билгэ ханаас цэрэг гуйж аваад чамтай байлдахаар ирэхэд чи улсаа орхиж, цөөн хүнтэй амь хоргодон дутааж, хар хятадын Гүр ханыг Сартаулын нутаг Чүй мөрөнд байхад хүрч очоод тэнд нэгэн жил бололгүй бас Гүр ханаас салж, Уйгур нутаг ба Тангуд газраар тэнэж, таван ямаа шөрөглөн сааж, тэмээний цус ханаж идсээр ганц сохор халиун морьтой хүрч ирэв, чи. Есүхэй хан эцэг минь, чамайг ингэж ядарж явааг сонсож урьд анд бололцсоноо сэтгэж, Тахай Сүхэхэй хоёрыг элч болгож угтуулсан ба би өөрөө Хэрлэн мөрний Бүрги эргээс угтан мордож, Гүсэүр нуурт бид золголдов. Чамайг ядаж ирэв гэж гувчуур татаж өгсөн ба\nурьд эцэгтэй минь анд бололцсон ёсоор Туул голын Хар шугуйд бид хоёр эцэг хөвүүн бололцсон биш билүү? Тэгээд тэр өвөл чамайг бид хүрээн дотроо оруулж тэжээв. Тэр өвөл өвөлжиж зун өнгөрөөд намар нь мэргидийн Тогтоа бэхийг байлдахаар мордож, Хадиглиг нурууны Муруч сүүл гэдэг газар хатгалдаж, Тогтоа бэхийг Баргужин төхүмийн зүг хөөж, мэргид иргэнийг эзлэн, адуу мал, орд гэр ба хүнс тариа хүртэл цөмийг авч энэ бүгдийг би хан эцэг чамд өгсөн билээ.\n\nӨлсөх өдөрт чинь\nӨршөөж тэжээсэн би.\nӨнчрөх сард чинь\nӨмөглөж тэтгэсэн би"}], [{"k": "read", "ref": "§177 (үлдсэн хэсэг)", "n": 177, "text": "Бас бид Хүчүгүдийн Буйруг ханыг Улуг таг (уул)-ийн Сохог ус гэдэг газраар Алтайг давуулан хөөж, Үрүнгү гол хүргэж, Хишилбаши нуурт түүнийг барьж сөнөөв. Тэндээс харьж ирэхэд найманы Хүгсэү сабраг баатар, Байдраг голын бэлчирт цэргээ засаж, [байлдахаар тосож байсан ажээ. Бид хоёр мөн байлдахаар цэргээ засаж иртэл] нэгэнт үдэш болсон тул маргааш байлдъя гэж засацгааж хоновол хан эцэг минь, чи буусан газраа олон гал түлж орхиод мөн шөнө Хар сүүл голыг өгсөн хөдлөв.\nБид маргааш өглөө нь үзвэл, чи буусан газраа үгүй болсон тул \"Биднийг энэ орхисон гал мэт хаясан ажээ\" гэж бид хөдөлж, Эдэр Алтайн бэлчрээр гэтэлж, Саарь хээр гэдэг газар очиж буув. Тэнд чамайг Хүгсэү сабраг баатар нэхэж очоод Сэнгүмийн эм хөвүүд ба эд хөрөнгө, албат ардыг цөм булаан авч, хан эцэг чамайг Тэлээтү амсар гэдэг газар байх үед нэхэн байлдаж, зарим албат иргэн ба адуу малыг булаан авав. Чамайг дагаж явсан мэргидийн Тогтоагийн хөвүүн Худу Чулуун хоёр, тэр завшааныг тохиолдуулж, албат иргэнээ авч эцэгтээ нийлэхээр Баргужин төхүмийн зүг дутаан хөдлөв. Тэр цагт чи: \"Найманы Хүгсэү сабрагт эд хөрөнгө албат иргэдээ булаагдав. Хөвүүн минь дөрвөн хүлэг баатраа явуулж тусална уу\"гэж гуйсанд би чам шиг ийм санаа агуулалгүй, даруй Боорчи, Мухулай, Борохул, Чулуун дөрвөн хүлэг баатраа цэргийн хамт илгээсэн билээ. Миний дөрвөн хүлэг баатар очихын урьд Улаан хус гэдэг газар Сэнгүм байлдаж байгаад мориныхоо гуяыг шархтуулж баригдахад хүрч байтал миний дөрвөн хүлэг баатар хүрэлцэн очиж Сэнгүмийг авраад албат хөрөнгө ба эм, хөвүүд сэлтийг аварч өгөв. Тэр цагт хан эцэг чи биширч өгүүлрүүн: \"Хөвүүн Тэмүжин дөрвөн хүлэг баатраа явуулж, миний алдагдан барсан улсыг аварч өгөв\" гэж хэлсэн билээ. Одоо хан эцэг минь, би ямар хэрэгт буруудаж, чиний хилэнг хүргэв. Ингэж буруушаан хилэгнэсэн учраа Хулбари-хури Итүргэн хоёр элчийг томилон ирүүлж хэлтүгэй. Энэ хоёрыг эс явуулбал ондоо хүнийг илгээвч болно\" гэж илгээв."}]], "lines": {"Мя": "§172–175 · **Лх** §176 ба §177-ийн эхний хагас · **Пү** §177-ийн үлдсэн хэсэг"}}, {"n": 21, "title": "Ван ханы гэмшил ба Балжуна", "vocab": [["андгайлах", ""], ["урвах", ""], ["элэнц, хуланц", "өвөг дээдэс"], ["тэрэм", "асар, том майхан"], ["итгэмжит хүн", ""]], "qs": ["Ван хан гэмшсэнээ юугаар баталсан бэ?", "Сэнгүм Чингисийн үгийг яагаад «байлдъя гэсэн үг» гэж ойлгосон бэ?", "Хасар ахыгаа хэрхэн эрж олсон бэ?"], "fri": "Хэн хэнд ямар үг илгээснийг сумтай бүдүүвчээр зурна.", "warn": [], "strat": "Гол санаа ба хураангуй — долоо хоногийн уншлагыг 3 өгүүлбэрт багтаана.", "mode": "Бүлгээрээ шивнэж уншина: уншигч уншиж, бусад нь дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§178", "n": 178, "text": "Ван хан энэ үгийг сонсоод өгүүлрүүн:\n\n\"Ай халаг.\nСайн хөвүүнээсээ салж\nСайхан төрөө гутаав, би.\nЭрхэм хөвүүнээс хагацаж\nЭвдрэх үйлийг хийв, би\"\nгэж гэмшиж өгүүлрүүн: \"Одоо хөвүүн (Тэмүжин)-ээ үзэж муу сэтгэвэл энэ мэт цусаа урсгая\"гэж андгайлж, чигчий хурууныхаа өндгийг хутгаар хатгаж, цусыг цувируулж аваад өчүүхэн саванд хийж \"Хөвүүнд минь өг\" гэж илгээв."}, {"k": "read", "ref": "§179", "n": 179, "text": "Бас Чингис хаан, Жамуха андад хэлүүлсэн нь: \"Хартай муу сэтгэлээр хан эцгээс минь хагацуулав, чи. Бид хоёрын хэн эрт боссон нь хэн эцгийн хөх хундагаар (айраг) уух бүлгээ. Ямагт би урьд босож уудаг байсан тул чи атаархсан биз. Одоо чи хан эцгийн хөх хундгаар чадах чинээгээр уугтун. Чи хэдийхэн хороох вэ\" гэж илгээв. (Чингис бага насанд Ван ханы гэрт байснаа дурдаж байгаа бололтой) Бас Чингис хаан, Алтан Хучар хоёрт хэлүүлсэн нь: \"Та хоёр намайг тэвчиж шууд урвах гэв үү? Мэхлэн урвах гэв үү? Хучар чамайг Нэгүн тайжийн хөвүүн тул \"Чи хан бол\" гэж бидний хэлэхэд чи хан эс болов. Алтан чиний эцэг Хотала хан, бид бүхнийг захирч явахад чи мэдэлцэж байсан тул Алтан чамайг хан бол гэвэл, чи бас зөвшөөрсөнгүй.\nБартан баатрын хөвүүдээс ахмад үеийн хүмүүс болох тул Сача Тайчу хоёрыг хан бол гэж ядав би [тэр хоёр бас зөвшөөрсөнгүй]. Та нарын алин нь ч хан болохгүй тул би та нарт хан өргөмжлөгдөөд захирч явав. Таныг хан болсон бол би\n\nӨрсөх дайн болоход\nӨмнө нь уулгалан яваад\nӨндөр хөх тэнгэрийн\nӨршөөл ивээлд орж\nӨстөн дайсныг дарвал\nӨнгөтэй сайн охидыг авчирч\nӨөдтэй сайн морьдыг олзолж\nӨндөр эзэн тандаа барих бүлгээ.\nОйн гэрээсийг авлах цагт\nОйртуулж шахаж өгөх билээ.\nХадын гөрөөсийг авлах цагт\nХавьтуулж шахаж өгөх билээ\nГууны гөрөөсийг авлах цагт\nГуяыг нийлтэл шахаж өгөх билээ\nХээрийн гөрөөсийг авлах цагт\nХээлийг нийлтэл шахаж өгөх билээ.\n\nОдоо та нар хан эцэгт минь үнэнчээр нөхөрлөж явтугай. Та нарыг буцамтгай гэдэг билээ. Битгий дахин урваж одогтун. Та нар Чаутхури (Чингист Алтан улсын Вангин чансангийн өгсөн цол. Энэ тухай 134 дүгээр зүйлд үз)-ийн садан энэ ажээ гэж бүү хэлүүлэгтүн. Гурван мөрний эхэнд бусдыг бүү нутаглуултугай\" гэж илгээв."}], [{"k": "read", "ref": "§180", "n": 180, "text": "Бас Чингис хаан, Тоорил дүүдээ өгүүл гэж өгүүлрүүн: \"Чамайг дүү гэсний учир нь урьд нэгэн цагт Тумбинай, Чархай Лянхуа хоёр, байлдаанд яваад Огда гэдэг боолыг барьж ирсэн билээ. Огда боолын хөвүүн Сүбэхэй боол бүлгээ. Сүбэхэй боолын хөвүүн Хөхөчү-хирсаан. Хөхөчү-хирсааны хөвүүн Ехэй-хонтагар бүлгээ. Ехэй-хонтагарын хөвүүн Тоорил чи, хэний улсыг эзлэх санаатай тэгж бялдуучлан явна? Миний улсын Алтан Хучар хоёр хэнд ч мэдүүлэхгүй нь лавтай биз. Иймийн тул чамайг дүү гэж нэрийднэ.\nЭлэнцийн үеийн\nИштэй боол чамд\nЭрхэмлэж хэлэх үг минь\nЭнэ байна.\nХуланцынүеийн\nХувьтай боол чамд\nХуурмаггүй хэлэх үг минь\nЭнэ байна\"\n\nгэж илгээв."}, {"k": "read", "ref": "§181", "n": 181, "text": "Бас Чингис хаан, Сэнгүм андад өгүүл гэж өгүүлрүүн: \"Би эцгийн дээлтэй төрсөн хөвүүн ажээ. Чи нүцгэн төрсөн хөвүүн ажээ. Хан эцэг бид хоёрыг нэгэн адил асардаг, үүнд Сэнгүм чи атаархан завсардуулж намайг хөөлгөв. Одоо чи хан эцгийн элгийг эмгэнүүлэхгүй, зүрхийг зүдүүлэхгүй, өглөө үдэш орж гарч санааг баясган, сэтгэлийг сэргээж яв. Чи эртний санаснаа үл тавин, хан эцгийг амьд байтал, хан болох гэж эцгийн сэтгэлийг битгий зовоо. Сэнгүм анд чи Билгэ бэхи Тодойн хоёрыг элч болгож надад илгээ\"гэж явуулав. Бас өгүүлрүүн: \"Надад хан эцэг, Сэнгүм анд, Жамуха анд, Алтан, Хучар, Ачиг-Ширүн, Хачиун тус бүр хоёр хүнийг элч болгож ирүүлнэ үү\" гэж Архай Хасар, Сүхэхэй жэүн хоёрт энэ үгсийг цээжлүүлж илгээв. Энэ үгийг сонсоод Сэнгүм өгүүлрүүн: \"Саяхан м
