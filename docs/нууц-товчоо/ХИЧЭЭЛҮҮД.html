Алчидайд Чаурхайг тушааж өгөв."}]], "lines": {"Мя": "§235–238 · **Лх** §239–240 · **Пү** §241–243"}}, {"n": 30, "title": "Дэв тэнгэр", "vocab": [["бөө", ""], ["зөн", ""], ["наманчлах", ""], ["хов", ""], ["донгодох", "загнах"]], "qs": ["Дэв тэнгэр Чингисийг Хасараас сэжиглүүлэхийн тулд юу хэлсэн бэ?", "Өэлүн эх хүүгээ хэрхэн номхотгож, юуг сануулсан бэ?", "Бөртэ хатан Тэмүгийг яагаад өмгөөлсөн бэ?"], "fri": "«Эв нэгдэл» хуудсанд нэмж, эхний долоо хоногийн таван сумтай холбоно.", "warn": ["§244: Өэлүн эхийн хөхөө гаргасан хэсгийг эх хүний хайрын бэлгэдэл гэж тайлбарлана. §245: зодоон, үхэл."], "strat": "Дүгнэлт хийх ба үнэлэх — дүрийн үйлдлийг үнэлж, өнөөгийн амьдралтай холбоно.", "mode": "Чимээгүй уншаад, багш 2–3 хүүхдээс хэсэг уншуулна.", "quiz": null, "days": [[{"k": "read", "ref": "§244", "n": 244, "text": "Хонхотны Мэнлиг эцгийн хөвүүд долоо билээ. Долоон хөвүүний дундахь нь Хөхөчү Дэв тэнгэр бөө бүлгээ. Тэр хонхотны долоон хөвүүд, Хасарыг бариад элбэж жанчжээ. Хасар, долоон хонхотонд жагчигдав гэж Чингис хаанд сонсговол Чингис хаан бусад хэрэгт хилэгнэж байсан цаг тул хилэнтэйгээр Хасарт өгүүлрүүн: \"Амьтанд дийлэгддэггүй хүн гэдэг биш билүү, чи? Яагаад дийлэгдэв?\" гэвэл, Хасар нулимс унагаж босоод гарав. Хасар гомдож, гурван өдөр ирсэнгүй. Тэр цагт Дэв тэнгэр, Чингис хаанд өгүүлрүүн: \"Мөнх тэнгэрийн сахиулс, нэгэн удаа Тэмүжин, улсын эрхийг барина. Нэгэн удаа Хасар, улсын эрхийг барина гэж зөн мэдэгдэв. Хасараас эс болгоомжилбол юу болохыг мэдэхгүй\" гэсэнд, Чингис хаан мөн шөнө морилж, Хасарыг барихаар одвол, Хүчү Хөхөчү хоёр, \"Хасарыг барихаар одов\" гэж Өэлүн эхэд мэдээлэв. Өэлүн эх сэүх тэргэнд цагаан тэмээ хөллөөд шөнө турш явж, наран ургах үеэр хүрч ирвэл, Чингис хаан, Хасарын ханцуйг уяж, малгай бүсий нь аваад байцаан асууж байв.\nЧингис хаан эхээ үзээд эмээн зайлав. Өэлүн эх уурлаж тэрэгнээс буумагц, Хасарын ханцуйн хүлгийг өөрөө тайлж тавиад малгай, бүсий нь Хасарт өгөөд уур хилэнгээ даран ядаж завилан суугаад хоёр хөхөө гаргаж, хоёр өвдөг дээрээ барьж өгүүлрүүн: \"Үүнийг харж байна уу? Хөхсөн хөх чинь энэ байна. Хавиргаа хадран хазагчид, хүйгээ хүчирхэн таслагчид! Хасар яав! Тэмүжин энэ нэгэн хөхийн сүүг хөхөж барах билээ. Хачиун Отчигин хоёул нэгэн хөхийн сүүг хөхөж үл барах билээ. Хасар бол хоёр хөхийн минь сүүг дуустал хөхөж, цээжийг минь уужим болгож амарлиулдаг билээ. Тийнхүү Тэмүжин цээжиндээ эрдэмтэй,\n\nХасар хав хүчтэй тул\nХатгалдан зайлагсдыг\nХарвах сумын хүчээр\nХамж авчирдаг билээ.\nОгшиж дутаагсдыг\nОнох сумын хүчээр\nОруулан авчирдаг билээ.\n\nОдоо дайсныг дарж төгсгөв гэж Хасарыг үзэн ядаж байна уу?\" гэв. Эхийн уурыг амарлиулаад Чингис хаан өгүүлрүүн: \"Эхийг хилэгнэсэнд би айхын ихээр айж, ичихийн ихээр ичив. Бид одоо ингэхээ болъё!\" гэв. Эхдээ хэлэлгүй далдуур Хасарын зарим иргэнийг булаан авч Хасарт нэгэн мянган дөрвөн зуун иргэнийг үлдээв. Үүнийг Өэлүн эх мэдээд сэтгэлээ зовсоор хурдан хөгширчээ. Хасарт өгсөн Жалайрын Жибэгэ тэндээс зайлж Баргужин оронд дутаав."}], [{"k": "read", "ref": "§245", "n": 245, "text": "Түүний хойно есөн хэлтэн (хамаг) улс, Дэв тэнгэрт хуралдан очсон ба Чингис хааны агтны хорооноос ч олон хүн Дэв тэнгэрт очиж захирагдав. Бас Отчигин ноён Тэмүгэ-гийн харъяат иргэн, Дэв тэнгэрт очжээ. Отчигин ноён, одсон иргэнээ авчруулахаар Сохор нэрт элчийг илгээвэл, Дэв тэнгэр, элч Сохорт өгүүлрүүн: \"Отчигин та хоёр, их элч илгээдэг болжээ\" гэж элч Сохорыг зодож, эмээлий нь үүрүүлэн явган буцаажээ. Элч Сохорыг зодуулж явган ирсний маргааш Отчигин ноён өөрөө Дэв тэнгэрийнд очиж өгүүлрүүн: \"Элч Сохорыг илгээвэл зодоод явган буцаажээ. Одоо би иргэнээ авахаар ирэв\" гэвэл, долоон хонхотон, Отчигин ноёны энд тэндээс хааж \"Элч Сохорыг илгээдэг чинь зөв үү?\" гэж барьж зодохыг завдсанд, Отчигин ноён айж өгүүлрүүн: \"Элч илгээсэн минь буруу болжээ\" гэв. Хонхотны долоон хөвүүд өгүүлрүүн: \"Буруугаа мэдсэн бол наманчлан сөгд!\" гэж Отчигиныг Дэв тэнгэрийн хойноос сөгдүүлжээ. Тэгээд Отчигин ноён, иргэнээ авч чадсангүй буцаж маргааш өглөө нь Чингис хааныг босоогүй, орон дотроо байхад орж ирээд уйлан сөгдөж өгүүлрүүн: \"Есөн хэлтэн иргэн, Дэв тэнгэрт чуулалдаж байгаа үүнд, Дэв тэнгэрээс харъяат иргэнээ авахаар элч Сохорыг илгээв. Элч Сохор зодуулж эмээлээ үүрч явган ирсэнд, би өөрөө очвол, долоон хонхотон, намайг энд тэндээс хааж тулгаж бурууг хүлээлгэн наманчлуулав. Дэв тэнгэрийн хойноос сөгдүүлэв\" гээд уйлав. Чингис хааны үг хэлэхийн өмнө Бөртэ үжин, орон дотроос өндийн сууж хөнжлийн захаар өвчүүгээ бүрхэж, Отчигины уйлахыг үзэж, нулимс унагаж өгүүлрүүн: \"Тэд хонхотон нар яасан хэцүү хүмүүс билээ? Урьд Хасарыг бүслэн жанчсан. Одоо бас энэ Отчигиныг яагаад хойноосоо сөгдүүлэв?\" Энэ ямар ёс вэ? [чамайг бэлхэн амьд байхад А.то] Ойн нарс мэт олон сайхан дүү нарыг чинь ингэж дарлаж байна.\n\nҮүнээс хойш тэд\nҮүл мэт биеийг чинь\nҮгүй болж одвол\nҮлсэн их улсы чинь\nҮр хүүхдээр чинь мэдүүлэх үү?\nСүүлийн цагт тэд\nСүлд гэгээн биеийг чинь\nСүүдэр болж одвол\nСүрэг их улсы чинь\nСүйтгэхэд хүрэх бишүү.\nӨндөр уулын нарс мэт\nӨнөр сайхан дүү нарыг чинь\nӨшин дарлагч тэд\nӨсөж бойжиж амжаагүй\nӨчүүхэн хэдэн хүүхдэд чинь\nӨргөн улсыг мэдүүлэхгүй\n\nЯасан хэцүү хонхотан нар билээ? Дүү нараа ингэж дарлахыг үзсээр байгаад зүгээр өнгөрүүлэх үү, чи?\" гээд Бөртэ үжин нулимс цувируулав. Бөртэ үжиний энэ үгийг сонсоод Чингис хаан Отчигинд өгүүлрүүн: \"Дэв тэнгэр одоо ирнэ. Өшөөгөө яаж авахыг чи өөрөө мэд\" гэв. Тагахад Отчигин босож нулимсаа арчиж гараад гурван бөхийг бэлтгэж зогсоов. Удалгүй Мэнлиг эцэг, долоон хөвүүнээ дагуулан ирж бүгдээр гэрт орж, Дэв тэнгэр, сөнгийн баруун этгээдэд суув. Отчигин, Дэв тэнгэрийн дээлийн захаас барьж \"Өчигдөр чи намайг наманчлуулсан билүү? Хүчээ үзэлцье\" гэж үүдэн тийш чирэв. Дэв тэнгэр, Отчигиныг эсэргүүцэж, түүний дээлийн захаас барив. Тэр хоёрын барилдахад Дэв тэнгэрийн малгай, голомтны дээр унав. Мэнлиг эцэг унасан малгайг авч үнсээд өвөртөө хийв. Чингис хаан өгүүлрүүн: \"Гадагш гарч бөх хүчээ тэмцэлдэгтүн\" гэв. Отчигин, Дэв тэнгэрийг босго дээгүүр чирч гарахад урьд бэлтгэсэн гурван бөх угтаж, Дэв тэнгэрийг бариад чирэлцэж нурууг хугалаад зүүн этгээдийн угсарсан хэрэгний үзүүрт орхив. Отчигин орж өгүүлрүүн: \"Дэв тэнгэр, намайг наманчлуулж байсан билээ. Одоо хүчээ үзэлцье гэвэл, үл зөвшөөрч баширлан хэвтэж байна\" гэвэл, Мэнлиг эцэг, учрыг мэдэж нулимс цувируулан өгүүлрүүн:\n\n\"Уужим эх газрыг\nДовын төдий байхад\nУулзаж нөхөрлөсөн билээ, би\nУсан их мөрнийг\nГорхийн төдий байхад\nУчирч танилцсан билээ, би\"\n\nгэхэд хонхотны зургаан хөвүүд үүдийг хааж, голомтыг тойрон ханцуйгаа шамлаж түрэмгийлэхийг завдахад, Чингис хаан бачимдан шахагдаж, \"Зайл. Гаръя\" гээд гэрээс гарвал, орчимд байсан хорчин торгууд нар ирж тойрон хамгаалав. Дэв тэнгэрийг угсарсан тэрэгний адагт нурууг хугалаад орхисныг Чингис хаан үзэж хойдуул (арын гэрүүд)-ээс нэгэн бор гэрийг авчруулж, Дэв тэнгэрийн дээр нь бариулаад \"Хөсгөө бэлтгэ! Нүүе\" гээд тэндээс нүүв."}], [{"k": "read", "ref": "§246", "n": 246, "text": "Дэв тэнгэрийг тавьсан гэрийн өрхийг бүтээж, үүдийг дарж хүнээр сахиулбал, гуравдугаар шөнө үүр цайж байхад гэрийн өрх нээгдэж, Дэв тэнгэрийн бие үгүй болжээ. Нягталж үзвэл үнэхээр түүний хүүр алга байв. Чингис хаан өгүүлрүүн: \"Дэв тэнгэр, миний дүү нарт гар хөл хүрсэн ба миний дүү нарын хооронд оргүй хов үг хэлсний тул тэнгэрийн таалалд эс нийлж, түүний амь бие хоёулыг тэнгэр авч одов\" гэв. Чингис хаан, Мэнлиг эцгийг тэнд донгодож хэлсэн нь: \"Та хөвүүдийнхээ авир занг ятгахгүй тул тэд, бидэнтэй тэмцэх гээд Дэв тэнгэрийн толгойг алдав. Та нарын ийм зан гаргахыг мэдсэн бол та нарыг хэдийн Жамуха Алтан, Хучар нарын адил болгох билээ\"\"гэж Мэнлиг эцгийг буруушаан донгодоод, жич \"Өглөө хэлснээ үдэш няцаж, үдэш хэлснээ өглөө няцаж явбал ичүүртэй бишүү. Урьд хэлснээ хатуу барьж явбал дээр бишүү\"\"гээд бас зарлиг болруун \"Ааш авираа татаж явсан бол Мэнлиг эцгийн урагтай хэн тэнцэх билээ\"\"гэв. Дэв тэнгэрийг үгүй болсноос хойш хонхотны хөвүүд номхров."}]], "lines": {"Мя": "§244 · **Лх** §245 · **Пү** §246"}}, {"n": 31, "title": "Алтан улс ба Тангуд", "vocab": [["боомт", ""], ["бүслэх", ""], ["найрамдах", ""], ["хэрэм", ""], ["шударга", ""]], "qs": ["Зэв Цавчаалын боомтыг ямар заль хэрэглэж авсан бэ?", "Шигихутуг Хадагийн бэлгийг яагаад аваагүй бэ?", "Шигихутугийн үйлдлийг өнөөгийн шударга байдал, авлигын асуудалтай харьцуулж ярилц."], "fri": "Бээжин, Ляоян хот, Тангуд (Си Ся) улсыг газрын зураг дээр олно.", "warn": [], "strat": "Дүгнэлт хийх ба үнэлэх — дүрийн үйлдлийг үнэлж, өнөөгийн амьдралтай холбоно.", "mode": "Чимээгүй уншаад, багш 2–3 хүүхдээс хэсэг уншуулна.", "quiz": null, "days": [[{"k": "read", "ref": "§247", "n": 247, "text": "Түүний хойно, Чингис хаан, хонин жил (1211) хятад иргэнийг эзлэхээр морилов. Фужоу (Цагаан хэрмийн ойр байгаа одоогийн Хар балгас)-г авч [Чуулалт хаалганаас баруун тийш байгаа] Үнэгэн даваагаар давж Сюнь-дэ фу (Да-тун фу-гийн баруун хойно наяны газар байгаа)-г авч Зэв Хуйханаг баатар хоёрыг манлай болгож илгээв. Цавчаал (Цюй-юн-гүан боомт)-д очиж Цавчаал давааны бэхлэлтийг хүрээд Зэв өгүүлрүүн: \"Дайсныг өдөж бэхлэлтээс гаргаад байлдъя\" гээд цэргээ ухруулав. Зэвийн цэрэг ухрахыг үзээд \"Нэхэж байлдъя\" гэж Хятадын цэргүүд уулыг бүрхэж, хөндийг дүүрэн нэхэж, Сюнь-дэ-фу-гийн хошууг хүрмэгч Зэв гэдрэг эргэж довтлоод нэхэж ирсэн дайсны цэргийг сөнөөж дарав. Чингис хаан, гол цэргээ авч дарцаагаар хүрч ирээд хятадыг хөөж хархятад, зүрчид, жүйний шилдэг баатар цэргүүдийг дарж, Цавчаалыг хүртэл хятадын цэргийг хиартал хядав. Цавчаалын хаалгыг Зэв эзэлж уулыг давав. Чингис хаан, Шар тээгт буув. Жунду (Алтан улсын дундад нийслэл бөгөөд одоогийн Бэйжин) хотыг эзлэх ба бусад олон хот балгасыг эзлүүлэхээр цэрэг явуулав. Зэвийг Дүн чан (Алтан улсын зүүн нийслэл, одоогийн Ляо ян) хотыг эзлүүлэхээр илгээв. Зэв, Дүн чан балгасанд хүрээд шууд эзэлж барахгүй буцаж зургаан хоногийн газар яваад гэнэт эргэж, хөтөлгөө морьтой цэргийг шөнө турш давхиулж, Дүн чаныг санамсаргүй байхад нь дайран эзэлжээ.", "chap": "Хятад, Тангуд, Сартаул, Багдад ба Оросыг эзэлсэн нь"}, {"k": "read", "ref": "§248", "n": 248, "text": "Зэв, Дүн чан хотыг авч харьж ирээд Чингис хаанд нийлэв. Жунду хотыг бүслэн байлдаж байхад Алтан хааны их ноён Вангин чансан, Алтан хаанд дуртгаж хэлсэн нь: \"Тэнгэр газрын заяасан цаг, их суурин шилжих цагт хүрэв үү? Монголчууд маш хүчтэй болж ирээд бидний эрэлхэг шилдэг хар хятад, зүрчид, жүйний эрхэм цэргүүдийг бүрэлгэн хяджээ. Бас итгэлтэй бат Цавчаал боомтыг булаан авчээ. Одоо бид бас цэргүүдийг дайчлан мордуулж болох боловч тэд, монголчуудад дахин дарагдвал өөрсдийн хот балгасанд бутран тарж дахин хуралдуулах аргагүй болохоос гадна, бидэнд итгэхгүй болж урваж дайсагнахад хүрнэ. Алтан хаан соёрхвол, Монголын хаанд энэ хир элсэн найрамдъя. Найрамдаад буцвал тэдний буцсан хойн, жич өөр саналаа гаргаж зөвлөе. Моголын цэрэг, агт эндэх газрын халуунд тэсэж ядаж байна гэнэ. Хаанд нь хүүхэн өгье. Цэрэг, дарга нарт нь алт мөнгө, эд уурсыг гаргаж өгье. Энэ аргад орох эсэхийг яаж мэдэх вэ?\" гэж дуртган хэлсэнд Алтан хаан, Вангин чансангийн энэ үгийг зөвшөөж, энэ ёсоор гүйцэтгэе гэж найрамдан, Чингис хаанд гүнж охиныг илгээж алт мөнгө, уурс эд таваарыг Жунду-гээс гаргаж цэргийн хүмүүст даах хирээр өгч, Чингис хаанд тусгайлан Вангин чансанг элч болгож илгээв. Тэдний элсэн дагаж найрамдъя гэснийг Чингис хаан зөвшөөж, олон хотыг эзлэхээр байлдаж байсан цэргүүдийг гэдрэг татаж ирүүлэв. Вангин чансан, Можоу-фужоу нэрт хошууг хүртэл Чингис хааныг үдэж гаргаад харив. Эд уурсыг манай цэргүүд өргөж даахуйц ачиж, хив торгоор ачаагаа татаж явав."}], [{"k": "read", "ref": "§249", "n": 249, "text": "Тэндээс Чингис хаан, Хашин иргэнийг зорив. (Тангуд буюу Си сиагийн хан, Монголын дотор Хашин хан гэж алдаршжээ) Хүрч очвол, Хашин улсын Бурхан (эзэн) дагаар орж, \"Баруун гар чинь болж хүчээ өгье\" гэж Чага нэртэй охиноо Чингис хаанд авчирч өгөв. Бас Бурхан өгүүлрүүн: \"Чингис хааны нэр алдрыг сонсож айн биширч байв бид. Одоо сүлдэт биеий чинь хүрч ирсэнд сүрдэн их айж байна. Айн сүрдсэн манай Тангуд улс баруун гар чинь болж хүчээ өгье\" гэв. \"Хүчээ өгөхдөө бид,\n\nБайсан газартаа\nБайран нутагладаг\nШавар хотдоо\nШавалдан суудаг\nХүмүүс тул\nХурдан аянд\nТүргэн хөдөлж чадахгүй\nХурц дайнд\nДаруй мордож амжихгүй.\nХаан Чингис соёрхвол\nХамаг Тангуд улс\nӨндөр дэрснийнөмөрт\nӨсгөсөн олон тэмээгээ\nӨргөл болгож тусалъя\nӨөрийн гараар нэхсэн\nӨрмөг бөс эдээ\nБэлэг болгож өгье.\nАрга чадлаар сургасан\nАнч шонхор шувуудын\nАль сайныг хүргэе\"\nгэж өчив. Тэр хэлсэн үгэндээ хүрч, тангуд иргэнээс тэмээ татварлаж тууж барагдахгүй болон тэмээ авчирч өгөв."}, {"k": "read", "ref": "§250", "n": 250, "text": "Чингис хаан, энэ удаагийн явдалд Хятад улсын Алтан хааныг дагаар оруулж, их эд уурс аваад, Хашин (Тангуд) улсын Бурханыг элсүүлж, олон тэмээг авав. Тийнхүү Чингис хаан, тэр хонин жил морилоод хятад иргэний Ахутай нэртэй Алтан хааныг элсүүлж, тангуд иргэний Илаху Бурханыг элсүүлэн харьж Саарь хээрт буув."}, {"k": "read", "ref": "§251", "n": 251, "text": "Бас түүний хойно, Жэү гуан (буюу Сүн улсын Жэү хаан)-д найрамдахаар илгээсэн Жубхан тэргүүтэн олон элчийг Хятадын Алтан хаан алсан тул, Чингис хаан нохой жил (1214) Хятадтай байлдахаар дахин мордов. \"Бидэнтэй найрамдсан байтал, Жэү гуанд илгээсэн элчийг яагаад нөгчөөсөн билээ?\" гэж байлдахаар мордоод Чингис хаан, Дүн гуан боомтыг чиглэж, Зэвийг Цавчаалын чигээр байлдуулав. Чингис хааныг Дүн гүан боомтыг эзлэхээр явав гэж Алтан хаан мэдэж, Илэ, Хада, Хөвэгэтүр гурваар цэргээ захируулж, бас нэмэлт хүч болгож, Улаан-дэгэлэнг магнайд явуулаад Дүн гүан боомтыг бэхэлж, давааг бүү давуулагтун! гэж Илэ Хада Хөвэгэтүр гурвын цэргийг хурдлуулан илгээв. Чингис хаан, Дүн гүан боомтыг хүрвэл Хятадын цэргүүд уулыг бүрхэж, хөндийг бялхаж байна. Чингис хаан, Илэ, Хада, Хөвэгэтүр гуравтай байлдаж, Илэ, Хада нарыг ухруулав. Толуй, Чигу хүргэн хоёр, хөндлөнгөөс довтолж, Улаан-дэгэлэнг няцаан дараад Илэ Хада нарыг цэргийн хажуугаас цохиж, хятадыг зомгол болтол хядав. Хятадын цэргүүд хядагдан барагдав гэж Алтан хаан мэдэж, Жунду балгаснаас зайлан дутааж Нанжин (Алтан улсын өмнөд нийслэл бөгөөд Бянь лян хот, одоогийн Хэ нань мужийн Кай фин фу) хотод очиж суув. Үлдсэн цэрэг нь өлсөж үхэцгээсэн ба өөр зуураа алалцаж, хүний махыг идэлцжээ. Толуй, Чигу хүргэн хоёрыг сайн байлдав гэж Чингис хаан ихэд сайшаав."}], [{"k": "read", "ref": "§252", "n": 252, "text": "Чингис хаан, Хэ-си-вү-д буугаад дараа нь Жундугийн Шар хээрт буув. Зэв, Цавчаал боомтын хаалгыг эвдэж, тэндээс цэрэг хөдөлгөж Чингис хаанд ирж нийлэв. Алтан хаан, Жундугээс зайлахдаа Жунду хотод Хада нэрт ноёныг лү шоу гэдэг сайд болгож орхисон ажээ. Чингис хаан, Жунду балгасны алт, мөнгө, эд уурс, юмыг тоолуулахаар Үнгүр буурч, Архай Хасар, Шигихутуг гурвыг илгээв. Энэ гурвын очиход Хада ноён угтаж, алттай хээтэй эд уурсыг барьж хот дотроос гарч уулзав. Хада-д Шигихутуг өгүүлрүүн: \"Урьд энэ Жунду хот ба Жундугийн эд юм Алтан хааных байв. Одоо Жунду, Чингис хааных болов. Чингис хааны эд уурсыг чи яагаад далдуур хулгайлан авчирч өгч байна? Үүнийг би авахгүй\" гэж Шигихутуг эс авав. Үнгүр буурч, Архай Хасар хоёр авав. Энэ гурав, Жундугийн юмыг тоолж ирэв. Тэнд Чингис хаан, Үнгүр, Архай, Шигихутуг гурваас \"Хада юу өгөв?\" гэж асуувал Шигихутуг өгүүлрүүн: \"Алттай, хээтэй уурсыг авчирч өгөв. Миний хэлсэн нь: \"Урьд энэ Жунду, Алтан хааных байв. Одоо Чингис хааных болов. Хада чи, Чингис хааны эд юмыг далдуур хулгайлж яахин өгнө?\" гэж би эс авав. Үнгүр Архай хоёр, өгсний нь авлаа\" гэв. Тэгэхэд Чингис хаан, Үнгүр Архай хоёрыг маш буруушаан донгодов. Шигихутугийг \"Чи их ёсыг сэтгэжээ\" гэж маш сайшаан соёрхож, \"Чи миний үзэх нүд, сонсох чих бишүү\" гэж зарлиг болов."}, {"k": "read", "ref": "§253", "n": 253, "text": "Алтан хаан, Нанжин (өмнөд нийслэл) орж өөрөө найрамдъя гэж мөргөж, Тэнгэр нэрт хөвүүнээ зуун нөхөдтэйгөөр Чингис хаанд шадар цэрэг болтугай! гэж илгээв. Чингис хаан, тэдний найрамдъя гэснийг зөвшөөрч \"Буцъя\" гэж өөрөө Цавчаал боомтыг дайран буцах гэж Хасарт зүүн гарын цэргийг захируулан, далайн хөвөөгөөр хижин явж, Бэйгин гэдэг хойд нийслэл (Данин балгас)-д буугаад тэр хотыг дагуулж түүнээс цааш Зүрчидийн Фухану-г дайран одож, хэрэв Фухану (одоогийн Өвөр Монголын зүүн хэсэг) байлдахыг сэтгэвэл байлдагтун! Элсэж орвол түүний хязгаарын хотуудыг дайран Ула-нау мөрнийг огтлон одож, Таурын голыг өгсөж, Хянганы давааг давж, Их аураг ордонд нийлэн иртүгэй! гэж илгээв. Хасартай Жорчидай, Алчи, Толун чэрби гурван ноёныг илгээлцэв. Хасар Бэйжин хотыг оруулж, Зүрчидийн Фухану-г дагаар оруулж, мөрт тохиолдсон хотуудыг эзлээд Таур голыг өгсөн давааг давж, Чингисийн уул ордонд бууж ирэв."}]], "lines": {"Мя": "§247–248 · **Лх** §249–251 · **Пү** §252–253"}}, {"n": 32, "title": "Залгамжлагчийн маргаан", "vocab": [["залгамжлах", ""], ["сартаул", "Төв Азийн Хорезм улс"], ["алтан аргамжаа тасдах", "элчийг алах"], ["эв найр", ""], ["гэм хүлээх", ""]], "qs": ["Есүй хатан Чингист ямар чухал асуулт тавьсан бэ?", "Хөхөчөс Цагадайд юуг сануулсан бэ?", "Өгэдэйг сонгосон нь зөв шийдвэр байсан уу? Үндэслэлээ хэл."], "fri": "«Хэн хаан болох ёстой вэ?» сэдвээр бүлгүүд мэтгэлцэнэ.", "warn": ["§254: Цагадай Зүчийг доромжилсон хэсэг. Бөртийн олзлогдлыг (9-р долоо хоног) сануулж, хүүхэд үүнд буруугүй гэдгийг онцлоорой."], "strat": "Дүгнэлт хийх ба үнэлэх — дүрийн үйлдлийг үнэлж, өнөөгийн амьдралтай холбоно.", "mode": "Чимээгүй уншаад, багш 2–3 хүүхдээс хэсэг уншуулна.", "quiz": null, "days": [[{"k": "read", "ref": "§254", "n": 254, "text": "Түүний хойно Чингис хааны, сартаул иргэнд явуулсан Ухуна тэргүүтэн зуун элч алагдсанд, Чингис хаан өгүүлрүүн: \"Алтан аргамжаа сартаул иргэнээр таслуулаад зүгээр орхиж болох уу? Ухуна тэргүүтэй зуун элчийн өшлийг өшиж, хяслыг хясаж, сартаул (Дундад Азийн Туркестан) улстай байлдъя\" гэж мордоход Есүй хатан Чингис хаанд дуртган өчсөн нь: \"Хаан\n\nӨндөр давааг давж\nӨргөн мөрнийг гэтэлж\nУрт аянд морилохдоо\nУлс иргэнээ захирахыг\nУрьдал болгож сэтгэнэ.\nТөрсөн бие түлбэрэх\nТүмэн амьтны хуулийг\nТөгс ухаандаа санаасай\nУулс мэт бие чинь\nНурж одвол\nУлс олон Монголы чинь\nХэн захирах юм бэ?\nТулгуур мэт бие чинь\nТуйвж одвол\nТуг их сүлдий чинь\nХэн өргөх юм бэ?\nТөрсөн дөрвөн хүүгээс чинь\nТөр барих нь хэн бэ?\nХан хөвүүд дүү нар\nХарц олон ард ба\nХатад бид бүхэнд\nХариу айлдах эсэхийг\nХааны зарлиг мэдтүгэй\"\n\nгэж өчвөл,\nЧингис хаан зарлиг болруун: \"Хатан хүн боловч Есүйн хэлсэн үг зөвөөс зөв! Дүү нар хөвүүд, Боорчи, Мухулай та нарын алин ч энэ үгийг дуртгасангүй. Би, өвгөдийн хойноос одохгүй мэт өөрөө мартсан ажээ. Үхэл надаас тойрох мэт үнэхээр түүнийг санасангүй\" гээд, \"Хөвүүдийн ах Зүчи мөн. Юу хэлнэ? Чи хэл!\" гэв. Зүчийг үг хэлэхийн урьд Цагадай өгүүлрүүн: \"Зүчийг үг хэл гээд Зүчийг юунд томилох гэж байна? Энэ мэргидийн орхидост бид захирагдах гэж үү?\" гэсэнд, (Бөртэ хатан, мэргидэд олзлогдож байгаад жирэмсэн болж ирсэн учраас тэгж хэлсэнд) Зүчи босоод Цагадайн энгэрээс шүүрэн барьж өгүүлрүүн: \"Хаан эцэг, намайг гадуурхаж үзээгүй байхад чи намайг яагаад ялгаж байна? Чи надаас ямар эрдэм чадлаар илүү вэ? Чи ганц догшин омгоороо илүү биз. Харвалцаад чамд гартвал эрхийгээ огтолж хаясугай! Барилдаад чамд ялагдвал унасан газраас бүү боссугай! Хаан эцгийн зарлиг мэдтүгэй!\" гэв. Зүчи Цагадай хоёр энгэрээсээ барилцаад Зүчийн гараас Боорчи татаж, Цагадайн гараас Мухулай татаж байхад, Чингис хаан дуугүй сууж байв. Хөхөчос зүүн этгээдэд байж өгүүлрүүн: \"Цагадай чи юунд яарав? Хаан эцэг чинь, хөвүүдийн дотроос чамд итгэж байсан билээ. Та нарыг төрөхийн урьд\n\nОдтой тэнгэр орчиж\nОлон улс байлдаж\nОрондоо унтах завгүй\nОлзлон булаалдаж байв.\nХөрст дэлхий хөрвөж\nХөвчин улс хямралдаж\nХөнжилдөө унтах завгүй\nХөнөөлдөн тэмцэж байв.\nЭргэлзэн бодох чөлөөгүй\nЭлбэлдэн зүтгэж явав\nУхран дутаах газаргүй\nУрагшлан байлдаж явав.\nАмар жаргах аргагүй\nАлалдан тэмцэж явав\nХатан сайхан эхийнхээ\nХалуун элгийг хөргөж\nХайрт зүрхийг гомтгож\nТос шиг санааг царцуулж\nСүү шиг сэтгэлийг ээдүүлэх\nЧалчаа муу үгийг\nЦагадай чи хэллээ.\nБүлээн элэг нэгтэй\nБөртэ хатны хүүхэд бишүү\nХалуун элэг нэгтэй\nХамт төрсөн хүүхэд бишүү.\nЗүрхний хайрт эхийн\nЗүртгэсэн ачийг мартаж\nЗүйгүй үгээр гомтговол\nГэвшивч нэгэнт хожидно.\nХэвэлдээ тээсэн эхийн\nХэтэрхий ачийг мартаж\nХэдэр үгээр гомтговол\nХэзээ ч баясгаж чадахгүй.\nХаан богд эцэг чинь\nХамаг улсыг байгуулахдаа\nХар толгойгоо хайрлахгүй\nХалуун цусаа гамнахгүй\nХамхих нүдээ ирмэхгүй\nГарын ханцуйг дэрлэж\nГадаад хормойгоо дэвсэж\nШүлсний хөөсөөр ундалж\nШүдний махаар хооллож\nМагнайн хөлсийг гоожтол\nМацаж чармайж явахад\nУлны хөлсийг урстал\nУлсаа хурааж явахад\nХайрт хатан эх чинь\nХамт зовж явжээ.\nОюун төгөлдөр эх чинь\nОёдолт дээлээ огшуулж\nОготор хормойгоо шууж\nХүүхдээ өсгөхийн тул\nХүч чадлаа шавхаж\nЗалгих хоолны шимтэйг\nЗаяасан хүүхдэдээ өгч\nУух ундны дээжийг\nУрьдаар та нарт өгч\nӨсөх үрээ тэжээж\nӨлсөж ядарч явлаа.\nЭгмээс чинь татаж\nЭрийн зэрэгт хүргэсэн\nЭрхэм ачийг санацгаа\nХүзүүнээс чинь татаж\nХүний зэрэг болгосон\nХүндэт ачийг бодоцгоо.\nБохиры чинь арилгаж\nБорвий чинь тэнийлгэж\nЭрийн зэрэгт оруулж\nЭмээлийн дөрөөнд хүргээд\nЭнхрий хөвүүд та нарын\nЭрхэм сайныг үзье гэж\nЭх чинь одоо бодож байна.\nНаран шиг гэгээн ухаант\nНавч шиг дэлгэр сэтгэлт\nСайн хатан эхийнхээ\nСанааг бүү гомдуул!\" гэв"}], [{"k": "read", "ref": "§255", "n": 255, "text": "Тэндээс Чингис хаан өгүүлрүүн: \"Зүчийг тэгж хэлж яаж болно? Хөвүүдийн минь ахмад Зүчи бишүү? Хожим тэгж бүү хэлтүгэй\" гэж зарлиг болов. Энэ үгэнд Цагадай мөшилзөж өгүүлрүүн: \"Зүчийн хүч эрдмийг басамжлахгүй.\n\nАмаар алсныг\nАчиж болдоггүй\nҮгээр үхүүлснийг\nӨвчиж болдоггүй.\nАавын хөвүүдийн ахмад нь\nЗүчи бид хоёр биз.\nХаан эцэгтээ\nХавсарч хүчээ өгье\nДалдиран зайлсан этгээдийг\nТас цавчиж шийтгэе.\nСалж саатсан этгээдийг\nСалбартал цавчиж байя\nӨгэдэй өршөөлтэй тул\nӨргөмжлөхөд болно.\nХаан эцгийн дэргэд\nХамт ойр байлгаж\nБараат их малгайг\nБариулан мэдүүлж болно\n\nгэв. Энэ үгэнд Чингис хаан өгүүлрүүн: \"Зүчи юу хэлэхээ хэлэгтүн!\" гэв. Зүчи өгүүлрүүн: \"Цагадайн хэлсэн ёсоор Цагадай бид хоёр хавсарч хүчээ өгье. Өгэдэйг өргөмжилье!\" гэв. Чингис хаан зарлиг болруун: \"Хавсрах нь юу вэ? Эх дэлхий аугаа бөгөөд ус мөрөн олон бий. Харь улсыг эзлүүлэн тус тус салгая. Өөр өөрийн нутгийг өргөтгөж яваарай. Харин Зүчи Цагадай та хоёр, хэлсэн үгэндээ хүрч, ардын инээдэм, амьтны тоглоом болохгүй, эв найртай яваарай. Эрт цагт Алтан Хучар хоёр энэ мэтээр үг барилдсан байтал, хэлсэн үгэндээ хүрсэнгүй, хэдэр зан гаргаад юу болсныг та нар мэдэж байгаа биз. Одоо Алтан Хучар хоёрын харьяат нарыг та нарт хувааж өгнө. Тэднийг үзэж цээрлэл болгож явагтун!\" гээд Өгэдэй юу хэлэх вэ? Хэлэгтүн!\" гэв. Өгэдэй өгүүлрүүн: \"Хаан эцэг соёрхож, үг хэлгэхэд би юугаа хэлэх вэ? Чадахгүй гэж яаж хэлэх вэ? Чадахыг хичээе! Гагцхүү хойд үеийн хөвүүд ач нар минь, өвсөнд ороовч үхэр тоож идэхгүй, өөхөнд хучивч нохой тоож идэхгүй юм төрөөд хандгайг харваад оготныг онох болуузай. Би үүнээс өөр юуг хэлэх вэ?\" гэв. Энэ үгийг сонсоод Чингис хаан зарлиг болруун: \"Өгэдэй ийм үгийг хэлэх бол болжээ. Бас Толуй юу хэлэх вэ? Хэлэгтүн!\" гэв. Толуй өгүүлрүүн: \"Би хаан эцгийн нэрлэсэн ахын дэргэд байж, мартсаныг сануулж, унтсаныг сэрүүлж, уриалах дуунд нь уухай болж, унах моринд нь ташуур болж, холын аянд явалцаж, ойрындайнд оролцож тусалъя\" гэж хэлбэл, Чингис хаан зөвшөөн зарлиг болруун: \"Хасарыг түүний үр хүүхдийн нэг нь залгамжил. Алчидайг түүний үр хүүхдийн нэг нь залгамжил! Отчигиныг түүний үр хүүхдийн нэг нь залгамжил! Бэлгүтэйг түүний үр хүүхдийн нэг нь залгамжил! Бэлгүтэйг түүний үр хүүхдийн нэг нь залгамжил! Тэрчлэн намайг миний үр хүүхдийн нэг нь залгамжилж, миний зарлигийг өөрчлөхгүй, задлахгүй, осолдохгүй, алдахгүй баримталж явтугай! Өгэдэйн үр хүүхэд өвсөнд ороовч үхэр тоож идэхгүй, өөхөнд хучивч нохой тоож идэхгүй юм төрвөл, миний ураг төрлийн дотор нэг хөвүүн нь сайн төрөх үгүй юу?\" гэж зарлиг болов."}], [{"k": "read", "ref": "§256", "n": 256, "text": "Чингис хаан (баруун зүг) байлдаанд мордоод, Тангуд улсын Бурханд элч явуулж хэлүүлсэн нь: \"Баруун гар чинь болъё гэж чи хэлсэн бишүү? Сараул улсад алтан аргамжаа тасдуулаад би хариу авахаар мордов. Баруун гар болж морил!\" гэж илгээвэл, Бурханыг үг хэлэхийн урьд Аша хамбу өгүүлрүүн: \"Хүч хүрэхгүй бол хаан юунд болов?\" гээд туслах цэрэг өгсөнгүй омогтой их үг хэлж элчийг буцаажээ. Тэнд Чингис хаан өгүүлрүүн: \"Аша хамбуд яаж ингэж хэлэгдэх билээ? Урьдаар тэдэнтэй очиж байлдвал зохилтой бишүү? Гэвч өөр хүнд зорьж байгаа цаг тул энэ удаа болъё. Мөнх тэнгэрт ивээгдэж алтан жолоогоо бат татаж ирвэл, тэр цагт магад болтугай!\" гэжээ."}, {"k": "read", "ref": "§257", "n": 257, "text": "Туулай жил (1219), Чингис хаан, хатнаас Хулан хатныг авч, дүү нараас Отчигин ноёныг их ордондоо үлдээгээд Арайн даваагаар давж, Сартаул улстай байлдахаар морилов. Зэвийг магнайд илгээв. Зэвийн дараа гэзэгт Сүбээдэйг илгээв. Сүбээдэйн гэзэгт Тогочарыг илгээв. Энэ гурвыг илгээхдээ тушаасан нь:\"Султан хааны нутгийн гадуур явж цаана нь гараад биднийг очиход хамтарч нийлтүгэй!\" гэв. Зэв яваад хан Мэлигийн балгасуудыг огт түйвээлгүй гадуур нь гарч одов. Түүний хойноос Сүбээдэй мөн ёсоор түйвээлгүй явж өнгөрөв. Түүний хойноос Тогочар явахдаа хан Мэлигийн хязгаарын хотуудыг дээрэмдэн, тариачдыг олзолжээ. Хан Мэлиг хотуудаа сүйтгүүлэв гэж дутаан хөдөлж, Жалалдин султантай нийлж, Чингис хааны эсрэг байлдав. Чингис хааны урьд Шигихутуг манлайлан явав. Жалалдин султан, хан Мэлиг хоёр, Шигихутугтай байлдаж, Чингис хаанд хүртэл хөөн ирэхэд Зэв, Сүбээдэй, Тогочар гурвуул, Жалалдин султан, хан Мэлиг хоёрын хойноос нэхэн байлдаж, тэднийг дарж хядаад Бухар, Сэмисгяб, Отрар хотын алинд нь ч оруулалгүйгээр хөөж байлдсаар Шин мөрнийг хүргэвэл сартаулын цэрэг Шин (Инд) мөрөнд харайн орж, олонх нь живж үхэв. Жалалдин султан хан Мэлиг хоёр амь хоргодохын тул Шин мөрнийг өгсөн дутаав. Чингис хаан, Шин мөрний өөд явж Батхэсэнг дайран одож, Эх горхи, Гүүн горхинд хүрч Баруан хээрт буув. Жалалдин султан, хан Мэлиг хоёрыг нэхүүлэхээр Жалайрын Балааг илгээв. Чингис хаан, Зэв Сүбээдэй хооёрыг маш сайшаан өгүүлрүүн: \"Зэв чиний нэр Зургаадай билээ. Тайчуудаас ирж Зэв нэртэй болов\" гээд Тогочар, хан Мэлигийн хязгаарын хотуудыг өөрийн дураар сүйтгэж, хан Мэлигийг дайсан болгов. Цээрлэл болгож түүнийг алъя гэж хэлсэн боловч, дараа алахаа байж маш буруушаан зэмлэж, цэрэг захирах эрхийг хасав."}]], "lines": {"Мя": "§254 · **Лх** §255 · **Пү** §256–257"}}, {"n": 33, "title": "Төв Азийн аян ба Тангудын аяны эхлэл", "vocab": [["аян", ""], ["гэзэг", "цэргийн ар тал"], ["султан", ""], ["халиф", ""], ["халуурах", ""]], "qs": ["Тогочар яагаад шийтгэгдсэн бэ?", "Чингис хаан хөвүүддээ яагаад уурласан, хорчид түүнийг юу гэж ятгасан бэ?", "Өвдсөн хэрнээ Чингис яагаад буцахыг хүсээгүй бэ?"], "fri": "Монголын эзэнт гүрний тархалтыг газрын зураг дээр зурна (Сүбээдэйн Киев хүрсэн аян).", "warn": [], "strat": "Дүгнэлт хийх ба үнэлэх — дүрийн үйлдлийг үнэлж, өнөөгийн амьдралтай холбоно.", "mode": "Чимээгүй уншаад, багш 2–3 хүүхдээс хэсэг уншуулна.", "quiz": null, "days": [[{"k": "read", "ref": "§258", "n": 258, "text": "Тэр Баруан хээрээс Чингис хаан өөрөө буцаж, Зүчи, Цагадай, Өгэдэй гурван хөвүүнээ баруун гарын цэргийг захирч, Аму мөрнийг гэтлэн Өргнэчи (Гурганачи) хотыг хүрэгтүн гэж явуулав. Толуйг Иру, Исэбүр тэргүүтэн олон хотыг эзлүүлэхээр илгээв. Чингис хаан өөрөө Отрар хотод буув. Зүчи, Чагадай, Өгэдэй гурван хөвүүн очоод гэдрэг лавласан нь: \"Цэрэг бүрдэв. Өргнэчи хотыг хүрэв. Бид хэнийхээ үгийг дагаж явах вэ?\" гэж өчиж илгээвэл, Чингис хаан зарлиг болруун: \"Өгэдэйн үгээр явтугай\" гэж илгээв."}, {"k": "read", "ref": "§259", "n": 259, "text": "Тэндээс Чингис хаан, Отрар хотод буугаад бас хөдөлж, Сэмисгяб хотод буув. Семисгяб хотоос хөдөлж, Бухар хотод буув. Тэнд Чингис хаан, Бала ноёныг хүлээж, Алтан горхины нуруунд Султан хааны зусланд зусаж, Толуйд элч илгээж хэлүүлсэн нь: \"Зуны халуун болов. Цэргээ амсхийж буулга. Чи бидэнд ирж нийл! Гэж илгээв. Толуй, Иру, Исэбүр хотыг аваад Систэн хотыг эвдэж, Чүхчэрэн хотыг эвдэж байхад элч хүрч очив. Толуй, Чүхчэрэн хотыг эвдээд буцаж ирээд Чингис хаанд нийлэв."}], [{"k": "read", "ref": "§260", "n": 260, "text": "Зүчи, Цагадай, Өгэдэй гурван хөвүүн, Өргнэчи хотод орж гурвуул олон хот ба иргэнийг хувааж аваад Чингис хаанд хувь гаргаж өгсөнгүй. Гурван хөвүүн буцаж\nирвэл Чингис хаан, Зүчи, Цагадай, Өгэдэй гурван хөвүүнд уурлаж, гурван өдөр эс уулзав. Тэгэхэд Боорчи, Мухулай, Шигихутуг гурав өгүүлрүүн: \"Тэмцэн мэлзэж байсан Сартаул улсын султаныг доройтуулж, хот ба иргэнийг нь авлаа, бид. Хуваагдаж автах Өргнэчи хот хувааж авах хөвүүд бүгд Чингис хааных билээ. Тэнгэр газарт хүч нэмэгдэж, сартаул иргэнийг ингэж доройтуулсанд олон бид, цэрэг морь чинь бүгдээр баясаж бахдаж байна. Хаан юунд ингэж хилэгнэв? Хөвүүд нэгэнт буруугаа мэдээд айж байна. Хойшид сургаал болтугай! Хөвүүдийн авир алгасангуй болуузай. Хаан соёрхвол, хөвүүдийг уулзулж болох уу?\" гэж өчвөл, Чингис хаан тайтгарч Зүчи, Цагадай, Өгэдэй гурван хөвүүнийг уулзуулж донгодож, өвгөдийн үгийг өв болгож, хуучин үгийг хууль болгож, байсан газар нь тогтож ядтал, магнайн хөлсийг арчиж ядтал зэмлэж буруушааж байхад Хонхай, Хонтахар, Чормаган энэ гурван хорчин, Чингис хаанд өчрүүн: \"Гөрөөнд сая гарч байгаа залуу харцага мэт, хөвүүдийн зоригийг шантруулан энэ мэтээр яаж донгодож болох вэ? Хөвүүд айж сэтгэл алгасангүй болуузай. Ургах нарнаас шингэх наранд хүртэл дайсан иргэн олон байна. Бидний түвд нохдыг (зуудаг нохдыг) тухирч явуулбал, дайсан улсыг бид дарж, тэнгэр газрын өмгөөр хүчээ нэмэгдүүлж, алт, мөнгө, эд уурс эл бүхий юмыг чамд авчирч өгье! Аль улсад явуулах вэ гэвэл, Багдад иргэний Халиф султан гэж бий гэнэ. (Багдад бол Энэтхэг ба Иранаас баруун тийш, Тигер мөрний хөвөөн дээр байгаа их хот мөн). Түүнийг эзлэхээр бид аялан явъя!\" гэж өчвөл энэ үгийг шүүмжлэн бодож, Чингис хааны хилэн тайтгарч зөвшөөрөөд Хонхай, Хонтахар, Чормаган гурван хорчинг соёрхож, Адаргины Хонхай, Долонгирын Хонтахар хоёрыг \"Миний дэргэд байтугай!\" гэж нөгөө Үдгэгийн Чормаганыг Багдад улсын Халиф султанд аялуулав."}, {"k": "retell", "ref": "§261–264", "n": 261, "text": "§261. Бас индус (энэтхэг) иргэн, багдад иргэн хоёрын завсарт байгаа Ару-Мару Мадсаары улсын Абту хотыг эзлэхээр Дөрвэдийн Дөрбэй догшиныг аялуулав.\n\n§262. Бас Сүбээдэй баатрыг умар зүгийн Ханлин, Хипчак, Бажигид, Орос, Мажар, Асу, Сасу, Чэркэс, Кэшимир, Болар буюу болгар, Лала эдгээр арван нэгэн аймагхарь улсыг хүртэл Ижил (Волга), Яик (Урал гол) мөрнийг гэтлүүлэн, Кивамен (Кивамен буюу Киев), Хэрмэн хотуудыг хүртэл аялуулав.\n\n§263. Бас Сартаул улсыг эзэлж дуусаад Чингис хааны зарлигаар хот, хотод дарга тавихад Өргнэчи хотоос Хоромши овогтой сартаул Ялавач, Масхуд гэдэгнэртэй эцэг хөвүүн хоёр ирж, хот газрын ёс заншлын тухай Чингис хаантай ярилцав. Тэд, хот газрын заншил ёсыг сайн мэдэх тул хөвүүн Хоромши Масхудыг монгол дарга нарын хамт Бухар, Сэмисгяб, Өргнэчи, Удан, Хисгар, Уриан, Гусандарил тэргүүтэн хотыг захируулаад эцэг Хормши Ялавачийг авчирч, Хятадын Жунду (Бэйжин) хотыг захируулав. Ялавач, Масхуд нар хот суурин газрын журам ёсыг сайн мэдэх тул Хятад улсыг захирах монгол дарга нарын дэргэд сартаул хүмүүсийг зөвлөгч нараар томилов.\n\n§264. Чингис хаан, Сартаул улсад долоон жил яваад тэнд Жалайрын Бала ноёныг хүлээж байхад Бала ноён Шин мөрнийг гэтэлж, Жалалдин султан, хан Мэлиг хоёрыг Индус газар хүртэл нэхвэл Жалалдин султан, хан Мэлиг хоёр нэгэнт завхсан тул Индусийн хязгаарын иргэдийг олзолж тоноод олон тэмээ, ямааг авч буцаж иржээ. Тэндээс Чингис хаан, буцах замдаа Ирчис мөрөнд зусаж, долоодугаар он тахиа жил (1225) -ийн намар Туул голын Хар шугуйд их ордоо засаж буув."}], [{"k": "read", "ref": "§265", "n": 265, "text": "Тэр өвөл өвөлжиж, тангуд иргэнд морилъё гэж цэргээ шинээр тоолон бүртгэж, нохой жил (1226)-ийн намар Чингис хаан, тангуд иргэнтэй байлдахаар мордов. Хатдаас Есүй хатныг авч явав. Замын зуур өвөл, Арбухад олон хулан авлахад Чингис хаан, зост (толбот) бор морийг унаж явав. Олон хулан дайрч ирэхэд зост бор морь үргэж Чингис хааныг унагавал, хааны бие маш чилээрхэж Цоорха гэдэг газар буув. Тэр шөнө хоноод өглөө Есүй хатан өгүүлрүүн: \"Хөвүүд ноёд хэлэлцэгтүн! Хааны бие шөнө их халуурч хонов\" гэв. Хөвүүд ноёд хуралдсанд Хонхотны Толун чэрби өгүүлрүүн: \"Тангуд иргэн, байсан газартаа байран нутагладаг, шавар хотондоо шавалдан суудаг тул байран нутагладаг, шавар хотондоо шавалдан суудаг тул байран нутаг, шавар хотоо хаяж тэд хаана очих вэ? Бид буцаж, хааны биеийг сайжруулан, жич дахин байлдахаар мордъё!\" гэвэл, хөвүүд ноёд цөмөөр тэр үгийг зөвшөөрч, Чингис хаанд айлтгавал Чингис хаан өгүүлрүүн: \"Тангуд иргэн биднийг зүрх шантарч буцав гэх болно. Бид элч илгээж, мөн элчийг иртэл, энд Цоорхад биеэ сувилж байгаад Тангудын хэлэх үгийг сонсож буцвал болно\" гэж элчийг томилоод дуу бариулж (албан бичиг нь их төлөв шүлэг бөгөөд цээжлэвч амархан тул дуу гэж нэрлэсэн) хэлүүлсэн нь: \"Урьд тангуд иргэн баруун гар болж тусалъя! гэж Бурхан чи хэлсэн билээ. Чиний тэр үгийн ёсоор бид сартаул иргэнийг эрхэндээ оруулахаар мордохдоо чамд мэдэгдвэл, Бурхан чи хэлсэн үгэндээ хүрсэнгүй, цэрэг ч өгсөнгүй, харин их үгээр дайрсан билээ. Тэр үед бид өөр улсад зорьсон тул дараа учраа ололцъё гэж сартаул иргэнд морилж, мөнх тэнгэрт ивээгдэж, сартаул иргэнийг эрхэндээ оруулж, одоо Бурхан чамтай учраа ололцъё гэж ирэв\" гэж илгээвэл, Бурхан өгүүлрүүн: \"Дайрамх муу үгийг би хэлсэнгүй\" гэв. Аша хамбу өгүүлрүүн: \"Дайрах үгийг би хэлсэн. Одоо монголчууд та нар байлдаж сураад байлдъя! гэвэл, миний бие Алаша нутагт тэрэм (ханат) гэртэй, тэмээн ачаатай хүмүүс бий. Алаша-д аялж надад ирэгтүн! Тэнд байлдъя! Алт, мөнгө уурс, таваар хэрэгтэй бол Яргай (Нин-ся), Эржиү (Ся-лян) хотод ирэгүн!\" гэж илгээжээ. Энэ үгийг Чингис хаанд сонсговол, Чингис хаан бие их халуунтайгаар өгүүлрүүн: \"За тэр бишүү. Тэд ийм их үг хэлж байхад бид яаж буцаж болно? Үхэвч тэр их үгийг зүгээр орхихгүй. Мөнх тэнгэр чи мэд!\" гэж Чингис хаан Алашаг зорьж хүрээд Аша хамбутай байлдаж, Алаша-д бүсэлж Аша хамбыг барьж, түүний тэрэм гэртэй тэмээ ачаатай иргэнийг үнсэн товрог болтол талж сүйтгэв. \"Тангудын омогтой дуулгаргүйгий нь хядаж орж дагагсдыг манай цэргүүд дураар барьж олзолж автугай!\" гэж зарлиг болов."}, {"k": "read", "ref": "§266", "n": 266, "text": "Чингис хаан, Цаст ууланд зусаж, цэргээ явуулж, Аша хамбыг дагаж ууланд дутаан бүгсэн тэрэм гэртэн, тэмээн ачаатан тангудыг хураан эзэлж авав. Тэндээс Боорчи Мухулай хоёрт \"Тангуд иргэнээс чадлын хэрээр автугай!\" гэж соёрхоод зарлиг болруун: \"Боорчи Мухулай хоёрт хятад иргэнээс соёрхож эс өгсөн билээ. Хятад иргэний жүйнийг та хоёр адил хувааж авагтун! Тэдний сайн эрсээр шувуугаа бариулж дагуулж явагтун! Сайхан хүүхнээр нь эхнэрүүдийнхээ хормойг засуулж явагтун! Хятад иргэний Алтан хааны итгэлт янагууд нь Монголын өвөг эцгийг хорлосон Хар хятадын жүйн байсан билээ. Одоо миний итгэлт янаг нөхөд Боорчи Мухулай та хоёр бишүү !\" гэж зарлиг болов."}]], "lines": {"Мя": "§258–259 · **Лх** §260 · **Пү** §265–266 (§261–264-ийг багш газрын зураг дээр товч ярина)"}}, {"n": 34, "title": "Чингис хааны төгсгөл, Өгэдэй хаан", "vocab": [["тэнгэрт халих", "нас барах, хүндэтгэлийн үг"], ["хасаг тэрэг", ""], ["гэрээслэх", ""], ["өргөмжлөх", ""], ["ахмад хөвүүд", ""]], "qs": ["Чингис хаан хэзээ, хаана таалал төгссөн бэ?", "Гилүгэтэй баатар хаандаа хандаж юу гэж гуйсан бэ?", "Аянд хөвүүдийн ахмадыг явуулах санааны учир юу байсан бэ?"], "fri": "Тэмүжиний он цагийн хэлхээсийг дуусгана (1162?–1227).", "warn": ["§268: Тангудыг устгасан хэсэг."], "strat": "Дүгнэлт хийх ба үнэлэх — дүрийн үйлдлийг үнэлж, өнөөгийн амьдралтай холбоно.", "mode": "Чимээгүй уншаад, багш 2–3 хүүхдээс хэсэг уншуулна.", "quiz": null, "days": [[{"k": "read", "ref": "§267", "n": 267, "text": "Чингис хаан, Цаст уулнаас хөдөлж, Яргай хотод бууж, Яргай хотоос хөдөлж, Түрэмгий (Лин-жоу) хотыг эвдэж байхад Бурхан, Чингис хаантай уулзахаар ирэв. Тэнд Бурхан, уулзаж алтан сүм тэргүүтэн алтан мөнгөн аяга сав есөн ес, хөвүүд охид есөн ёс, морь, тэмээ есөн ёс, элдэв зүйлс тус бүр есөн есийг бэлэглэн уулзахад\nБурханыг үүдний гадна бараалхуулав. Тэр уулзах үед Чингис хааны дотор муухай болов. Түүнээс хойш гуравдугаар өдөр Чингис хаан зарлиг болж, Илаху Бурханд шударга нэрийг өгч, Илаху бурхан шударгыг ирүүлээд Чингис хаан, Илаху-г Толун чэрби гардаж нөгчөөтүгэй! Гэж зарлиг болов. Толун чэрби, Илаху-г гардаж танилгавгэж айлтгавал, Чингис хаан зарлиг болруун: \"Тангуд улстай учраа ололцох гэж ирэх замд Арбухад хулан авлаж өвдсөн биеий минь анаая гэж амь биеий минь хайрлаж үг дуртгасан Толун чи мөн биз. Дайсан хүний хорт үгэнд хорсож яваад мөнх тэнгэрийн хүч нэмний ачаар дайсныг гартаа оруулж өшөөгөө авав бид. Илахугийн энэ авч ирсэн нүүдлийн харш (дагшаа орд), аяга сав сэлтийг Толун чи автугай!\" гэж зарлиг болов."}], [{"k": "read", "ref": "§268", "n": 268, "text": "Тангуд улсыг эзэлж, Илаху Бархунд шударга нэр өгөөд түүнийг тонилгож, тангуд иргэнийг уг удмаар нь хүртэл мохол мушгилгүй болгож (үр үлдэгдэлгүй болгож үүнийг тэмдэглэхийн учир) идээ ундаа идэж уугаад \"Мохол мушгилгүй болсон\" гэж хэлж төгсгөж бай! гэж зарлиг болов. Тангуд улс, үгээ баталж хэлээд тэр хэлсэн үгэндээ хүрсэнгүйн тул дахин байлдахаар явж, Тангуд улсыг сөнөөн дараад гахай жил (1227) [долоон сарын 12-т Түрэмгий балгасанд, А.то.] Чингис хаан, тэнгэрт халив. Халихын өмнө, тангуд иргэнээс маш олныг Есүй хатанд өгөв. [Эзний алтан хүүрийг хасаг тэргэнд тээж харин өөд болон ирэхэд Сөнидийн Гилүгэтэй баатар магтан шүлэглэсэн нь нь:\n\n\"Хамгийн хаан, улсын эзэн минь\nХарцгай шувууны жигүүр болон одов\nХангинах тэрэгний тээш болон одов\nЖиргэх шувууны жигүүр болон одов\nЖигдрэх тэрэгний ачаа болон одов\"\n\nгэж магтан дуулав.\nМунын хөөвөрт хасаг тэрэг булд хүртэл шигдэж таван хүлгээр татаж хөдөлгөн ядаж, гүр их улс зовоход Сөнидийн Гилүгэтэй баатар өчрүүн:\n\n\"Хөх тэнгэрээс заяагаар төрсөн\nХүлэг богд эзэн минь!\nХүр их улсаа орхиж одов уу, чи?\nТөвшитгөн байгуулсан улс төр чинь\nТөгс заяат хатад хөвүүд чинь\nТөрсөн их газар ус чинь\nТэмүжин эзэн чамайг хүлээж байна.\nАриунаа байгуулсан төр чинь\nАлбат олон улс чинь\nАмраг хатад хөвүүд чинь\nАлтан орд харш чинь\nАлс газар билээ.\nУдирдан байгуулсан төр чинь\nУчирсан хатад хөвүүд чинь\nУраг элгэн монгол чинь\nУлс олон иргэн чинь\nУнасан Дэлүүн болдог чинь\nТэнд хол байна.\nХээр азарганы хөхлөөр хийсэн\nХийр туг сүлд чинь\nХэнгэрэг бүрээ уриа чинь\nХэлэхгүй бүгд улс чинь\nХэрлэний Хөдөө арал чинь\nТэнд билээ эзэн минь!\nБүтэхийн урьд учирсан\nБүртэгэлжин сэцэн хатан чинь\nБуянт газар нутаг чинь\nБоорчи Мухулай нөхөд чинь\nБулт их улс чинь\nТэнд билээ эзэн минь!\nХувилгаанаар учирсан\nХулан хатан чинь\nХуур цуур хөг дуу чинь\nХотол бүгд улс чинь\nХутагт эрхэн (эрхэм) газар ус чинь\nТэнд билээ, эзэн минь!\nХарууна уулыг дулаан гэж\nХарь тангудыг олон гэж\nХатад охидыг гоо гэж\nХамаг монголоо мартав уу\nХайрт эзэн минь!\nХалуун амийг чинь алдавч\nХас эрдэнэ мэт хүүрийг чинь\nХамгаалан авч харъя эзэн минь!\nХатан Бүртэгэлжинд чинь үзүүлье\nХамаг улсад чинь хүргэе\"\n\nгэж өвчөл\n\nХаан эзэн энэрэн соёрхов.\nХасаг тэрэг хангирсан хөдлөв\nХамаг улс баясгалант болов.\nХан их газар тэнд хүргэв\nХамгийн мөнхийг тэнд оршуулж\nХаан зайсангуудын тулгар болж\nХамаг улсын бштээн болоод\nНайман цагаан гэр болов за.\nЭнэ их улсад тунхаг зарлаж\nӨмссөн цамц, өргөө гэр\nОроосон оймыг тэнд онголов.\nҮнэн хүүрий нь заримууд Бурхан Халдунд онголов гэх, заримууд Алтай хааны ард, Хэнтий ханы өвөрт Их өтөг нэрт газар онголов гэх бий А.то.]"}], [{"k": "read", "ref": "§269", "n": 269, "text": "Хулгана жил (1228) Цагадай, Бат тэргүүтэй баруун гарыг эзэлсэн хөвүүд, Отчигин ноён, Жэү, Есүнхэй тэргүүтэн зүүн гарыг эзэлсэн хөвүүд, Толуй тэргүүтэн голыг эзэлсэн хөвүүд охид, түүний ноёд, мянганы ноёд бүгдээр Хэрлэний Хөдөө арал (одоогийн Баян-Улаан)-д хурж, Чингис хааны гэрээсэлсэн зарлигийн ёсоор Өгэдэйг хаан өргөмжлөв. Цагадай ах, Өгэдэй дүүгээ хаан өргөмжлөөд Чингис хаан эцгийн алтан амийг сахиж байсан хэвтүүл, хорчин, мянган торгууд хаан эцгийн шадар явсан өмч түмэн хишигтнийг Цагадай Толуй хоёр, Өгэдэй хаанд өгөв. Голын улсыг мөн ёсоор Өгэдэй хаанд өгөв."}, {"k": "read", "ref": "§270", "n": 270, "text": "Өгэдэй, хаан өргөмжлөгдөөд шадар бараа болох түмэн хишигтэн, голын улсыг өөрөө захирч урьдаар Цагадай ахтай зөвлөөд, Чингис хаан эцгийн дуусгаагүй Багдад улсын Халиф султанд аялсан Чормаган хорчийн хойноос Оготор Мөнхөт хоёрыг илгээв. Бас урьд Сүбээдэй баатрыг Ханлин, Хипчак, Багижид, Орос, Асу, Сасу, Мажар Кэшимир, Чэркэс, Болгар, Кэрт улсуудад хүртэл, Ижил, Яик мөрнүүдийг гэтлүүлэн, Мэкэтмэн, Хэрмэн, Кэйбэ тэргүүтэн хотыг байлдан эзлүүлэхээр явуулсан нь тэдгээр улсын эсэргүүцэл үлэмж гэх мэдээг аваад Сүбээдэйн хойноос Бат, Бүри, Мөнх тэргүүтэн хааны төрлийн ахмад хөвүүд ноёдыг Бат ахлан захиртугай! гэж зарлиг болов. Гол улсаас гарсан цэргийг Гүюг ахалтугай! гэж зарлиг болов. Энэ аянд улс иргэнийг захирсан хан хөвүүд өөрсдийн хөвүүдийн ахмадыг явуултугай! Улсыг эс захирсан хан хөвүүд, түмэн, мянган, зуун, аравны ноёд, олон хүн хэн боловч, мөн тэрчлэн өөрийн хөвүүдийн ахмадыг явуултугай! Ханы охид хүргэд мөн түүний адилаар хөвүүдийнхээ ахмадыг явуултугай! гэж зарлиг болоод бас Өгэдэй хаан өгүүлрүүн: \"Хөвүүдийн ахмадыг ингэж аянд явуулах саналыг Цагадай ах гаргав. Цагадай ахын хэлүүлсэн нь: \"Сүбээдэйн хойноос хөвүүдийнхээ ах бүрийг явуулна. Хөвүүдийн ах аялбал цэрэг арвин болно. Цэрэг олон бол үзэгдэх сүр хүч их болно. Тэнд, дайсны хүн үлэмж, харийн улс олон бий. Тэр хязгаарын улсууд хэцүү. Хилэгнэвэл өөрийн биеийг мэсээр хорлож үхэх улс бий. Хурц мэстэй гэнэ\" гэж илгээжээ. Цагадай ахын хичээн болгоомжилж хэлсэн энэ үгийн ёсоор хөвүүдийн ахмадыг томилж явуулъя! гэж зүг зүгт тунхаг зарлаж Бат, Бүри, Гүюг, Мөнх тэргүүтнийг аянд мордуулах болсон учир ийм билээ\" гэжээ."}, {"k": "read", "ref": "§271", "n": 271, "text": "Бас Өгэдэй хаан, Цагадай ахад зөвлөж илгээсэн нь: \"Би Чингис хаан эцгийнхээ бэлэн сууринд суув. Ямар эрдмээр хаан суув? гэж би хэлэгдэх бишүү? Цагадай ахыг зөвшөөрвөл бидний хаан эцгийн эзэлж дуусгаагүй орхисон Хятад улсын Алтан хааныг эзлэхээр морилъё\" гэж зөвлөж илгээвэл, Цагадай ах зөвшөөрч \"Юу алзах вэ? Аураг ордоо сайн хүнд тушаагаад морилогтун! Би эндээс цэрэг гаргаж илгээе!\" гэжээ. Их ордоо Олдхар хорчинд тушаав."}]], "lines": {"Мя": "§267 · **Лх** §268 · **Пү** §269–271"}}, {"n": 35, "title": "Толуйн золиос ба Өгэдэйн гэмшил", "vocab": [["золиос", ""], ["хээрийн хэрэг / гэрийн хэрэг", ""], ["өртөө", "морин шуудангийн буудал"], ["улаач", "өртөөний морьтон"], ["бурууг хүлээх", ""]], "qs": ["Толуй ахынхаа төлөө юу хийсэн бэ?", "Өгэдэй өөрийн ямар дөрвөн сайн үйл, дөрвөн буруу үйлийг нэрлэсэн бэ?", "Өөрийн алдааг хүлээн зөвшөөрөх нь удирдагчид яагаад чухал вэ?"], "fri": "Нууц товчоо хэзээ, хаана бичигдсэн бэ (1240 он, Хэрлэний Хөдөө арал)? Номын эхний ба сүүлийн зүйлийг харьцуулна.", "warn": [], "strat": "Дүгнэлт хийх ба үнэлэх — дүрийн үйлдлийг үнэлж, өнөөгийн амьдралтай холбоно.", "mode": "Чимээгүй уншаад, багш 2–3 хүүхдээс хэсэг уншуулна.", "quiz": null, "days": [[{"k": "read", "ref": "§272", "n": 272, "text": "Туулай жил (1231) Өгэдэй хаан, хятад иргэнд морилж, Зэвийг манлай болгож илгээв. Тэгээд Хятадын цэргийг хиартал хядаж, Цавчаалын даваагаар давж зүг зүгт олон хотыг хааж байлдах цэргүүдийг явуулав. Тэр үед Өгэдэй хаан өвчин хүрч үг хэлж чадахгүй болов. Бөө, төлөгчин нараар мэрэглүүлбэл Хятад улсын газар усны эзэд, хүн хөрөнгөө сүйтгүүлж, хот балгасаа эвдүүлсний учир хилэгнэн хаанд хор хүргэж байна гэв. Хүн хөрөнгө, алт мөнгө, адгуус идээгээр золио өгье гэж төлөгдвөл өвчин ялааршихгүй харин улам хүнд болов. Ойр төрлийн хүнээс золио болгож өгье гэж төлөгдвөл хаан гэнэт нүдээ нээж ус гүйж уугаад \"Юу болов?\" гэж асуув. Бөө нар өгүүлрүүн: \"Хятад улсын газар усны эзэд газраа сүйтгүүлж, хүн хөрөнгөө талуулаад хорлож ийм өвчин хүргэжээ. Элдэв бусад юмаар золио төлөөс өгье гэхэд зөвшөөрөхгүй улам хилэгнэж байна. Гагцхүү ойр төрлийн хүнийг золио болгож өгье гэвэл зөвшөөрч өвчнийг хөнгөрүүлж байна. Одоо яахыг зарлиг мэднэ!\" гэж өгвөл Өгэдэй зарлиг болруун: \"Хан хөвүүдээс миний дэргэд хэн байна?\" гэвэл, дэргэд нь байсан Толуй өгүүлрүүн: \"Суут Чингис хаан эзэн минь, дээр чинь ах нар, доор чинь дүү нар байтал, хаан ах таныг агт морь шиг сорьж, иргэ хонь шиг барилж үзээд их сууринд суулгаж, олон улсыг захирах дээд үүргийг даатгав. Намайг хаан ахын дэргэд байж, мартсаныг сануулж, унтсаныг сэрүүлж яв гэсэн билээ. Одоо хаан ах чамайг алдвал, би хэний мартсаныг сануулж, хэний унтсаныг сэрүүлэх вэ? Үнэхээр хаан ах муужирвал, олон монгол улс өнчирч, Хятад улс баясах болно. Хаан ахын оронд би золио болъё! Тул загасны нурууг тунтарч явлаа, би. Хилэм загасны нурууг хяргаж явлаа, би. Илийг ялж, далдыг дарж байв. Миний нүүр гоо, нуруу өндөр биз. Бөө нар бөөлж залбирагтун!\" гэв. Бөө нар бөөлөн залбирч, адисласан усыг Толуйд уулгав. Бяцхан суугаад өгүүлрүүн: \"Согтов би. Согтсоноос сэргэтэл өнчин өчүүхэн дүү нар ба бэлбэсэн бэр Бэрүдийг хүмүүжүүлэн асрахын хаан ах мэдтүгэй! Аливаа үгээ хэлэв, би. Согтов!\" гээд гаран одож муужирсан билээ."}, {"k": "read", "ref": "§273", "n": 273, "text": "Өгэдэй хаан, тэгээд Алтан хааныг мөхөөж Сяа-Сы (зарц) нэрийг өгч, алт, мөнгө, алттай хээтэй уурс таваар, агт морь, албат зарцыг хурааж аваад захирагч, мэдээлэгч нарыг томилоод Нанжин, Жунду ба зүг зүгийн хотуудад дарга нарыг тавьж төвшин мэндээр буцаж, Хар Хоруим хотод ирж буув."}], [{"k": "read", "ref": "§274", "n": 274, "text": "Чормаган хорчи, Багдад улсыг дагуулжээ. Тэндхийн газар сайн, эд эрхэм гэдгийг мэдээд Өгэдэй хаан зарлиг болруун: \"Чормаган хорчи, мөн тэр газарт захирагч (тамгач) болж, шар алт, шармал чимэг, хоргой, магнаг, хив, торго, сувд, тана, урт хүзүүтэй, өндөрхөлтэй аргамаг морь, ачааны тэмээ, луус зэрэг юмыг жил бүр хүргэн ирүүлж байгтун!\" гэв. Сүбээдэй баатрын хойноос явсан Бат, Бүри, Гүюг, Мөнх тэргүүтэн олон хөвүүд Ханлин, Хипчак, Бажигидыг оруулж, Ижил, Яик мөрнийг гэтэлж, Мэгэд хотыг эвдэж оросыг хядаж сүйтгэв. Асу, Сасу, Боларман, Хэрмэн, Кива зэрэг хотын иргэнийг эзлэн дагуулж, дарга захирагч нарыг тавиад буцав. Урьд Зүрчид Солонгосыг эзлэхээр аялсан Жалардай хорчийн хойноос Есүдэр хорчийг явуулав. Түүнийг тэнд захирагч суутугай! гэж зарлиг болов."}, {"k": "read", "ref": "§275", "n": 275, "text": "Бат, хипчак нутгаас Өгэдэй хаанд нууцаар өчиж илгээсэн нь: \"Мөнх тэнгэрийн хүчинд, хаан ахын сууд Мэгэд хотыг эвдэж, Орос улсыг эзэлж, зүг зүгт арван нэгэн харь улсыг оруулж, алтан жолоогоо татаж салалцах болоход их асар босгож хуримыг хуримлав. Энэ хурим дээр би бүх хан хөвүүдийн ахмад тул нэг хоёр аяга сархад тэргүүлэн уув. Гэтэл, Бүри Гүюг хоёр надад муудаж хуримаас гарч одов. Явахдаа Бүрийн хэлсэн нь: \"Бат бид адил байтал, яагаад тэргүүлэн уух билээ?\" Тэр сацуурах санаатай сахалт эмгэнийг өсгийгөөр давтаж өлмийгөөр гишгичих юм сан! гэжээ. Гүюгийн хэлсэн нь: \"Бид хоёр тэр нум сум агссан эмгэдийн эгмийг харвалдъя\" гэжээ. Элжгэний хөвүүн Аргасуны хэлсэн нь: \"Тэдэнд модон сүүл зүүвэл зохино\" гэв. Бид, харь элэгтэй, дайсан улсын дотор явж байгаа учир зүйгээ гаргаж хэлсэн боловч, Бүри, Гүюг хоёр тэгж хэрүүлийн үгийг хэлээд найрамдалгүй тарав. Одоо яахыг хаан авга мэдтүгэй!\" гэж өчиж илгээжээ."}, {"k": "read", "ref": "§276", "n": 276, "text": "Батын энэ үгийг сонсоод Өгэдэй хаан маш хилэгнэж, Гүюгийг\nбараалхуулсангүйгээр өгүүлрүүн: \"Энэ түрэмгий гайхал, хэний үгэнд орж ах хүнийг ам мэдэн доромжлох болов? Ганц муу өндөг ялзарчээ. Ах хүний өөдөөс\nэсэргүүцсэн ажээ. Харь хол газар хайгуулд явуулж, арван хурууны нь хумсыг ханзартал уул мэт хотыг эзлүүлэхээр урагш зүтгүүлье! Зах хол газрын захирагч болгож таван хурууны нь хумсыг тамтартал бат бэх хотыг байлдуулан авируулъя! Бузар муу түрэмгий Аргасун, хэнийг дуурайж, бидний ургийн хүнд ам гарч доромжлох үг хэлэв? Гүюг Аргасун хоёрыг хамт илгээе! Зүй нь Аргасуныг албал зохих билээ. Гэтэл, та нар алагчлах гэх биз. Бүрийн тухай бол Батад хэлэгтүн! Цагадай ахад хэлж илгээтүгэй! Цагадай ах мэдтүгэй!\" гэв."}], [{"k": "read", "ref": "§277", "n": 277, "text": "Хан хөвүүнээс Мангай, ноёдоос Алчидай, Хонхордай, Жанги тэргүүтэн ноёд дуртган өчрүүн: \"Чингис хаан эцгийн чинь зарлиг билээ: Хээрийн үйлийг хээр шийтгэж, гэрийн үйлийг гарт шийтгэх билээ. Хаан, одоо Гүюгт хилэгнэж байна. Энэ бол хээрийн үйл хэрэг мөн. Хаан соёрхвол энэ хэргийг Батад тушааж илгээвэл болох уу?\" гэж өчвөл энэ үгийг хаан зөвшөөж тайтгараад Гүюгийг уулзуулж буруушаан донгодож сургасан нь: \"Аянд явах зуур эрүүл бөгстэй хүнийг эс үлдээсэн гэнэ, чи. Цэрэг хүний нүүрийн арьсыг хуулж явсан гэнэ, чи. Чиний тэр уур хилэнгээс айж, Орос улсыг дагаж орсон гэж бодож байна уу? Чи орос иргэнийг ганцаараа дагуулж оруулсан мэт санаж, бардам омог гаргаж, ах хүний өөдөөс эсэргүүцэв үү? Чингис хаан эцгийн зарлигт: Олон хүн хүчтэй, гүн ус аюултай! гэж бий бишүү. Сүбээдэй Бужиг хоёрын далавч дор явж олон бүгдээр хамсаж, орос, хипчакуудыг оруулж авсан байтал, чи анх удаа гэрээс гараад орос, хипчакийн нэг ч хүнийг олж барьсангүй, адаглавал ишигний шийр ч олж авсангүй байж эрэмгий түрэмгий зан гаргаж, ийм тийм үг хэл болж, ганц биеэ гайхуулж явдаг чинь юу вэ? Харин Алчидай, Хонхордай Жанги нар, бургилсан зүрхийг дарах нөхөр болж, буцалсан усыг сэвэх шанага болж уур хилэнг минь амирлиулав. Хээр болсон хэрэг тул үүнийг Бат шийтгэвэл зохино. Гүюг Аргасун хоёрыг Бат мэдтүгэй! Бүрийг Цагадай ах мэдэж шийтгэтүгэй!\" гэв."}, {"k": "retell", "ref": "§278–280", "n": 278, "text": "§278. Бас Өгэдэй хаан зарлиг болруун: \"Чингис хаан эцгий минь хамгаалж явсан хэвтүүл, хорчин, торгууд, бүх хишигтний тухай нийтэд тунхаг зарлигийг буулгах нь: Хаан эцгийн зарлигийг урьдын ёсоор дагаж явтугай! Хорчин, торгууд урьд ёсоор өдөр дараалан ээлжлэн манаж, наран шингэмэгц үүргээ хэвтүүлээс өөр хүн дотогш ордонд орвол хэвтүүл манаач, тэр хүний толгойг цавчиж хаятугай! Шөнө яаралтай мэдээг хүн хүргэж ирвэл хэвтүүлийн хамт гэрийн хойно байж мэдээгээ хэлтүгэй! Орд гэрт орох гарах бүх зүйлийг Хонхордай Ширхан хоёр хэвтүүлтэй хамт элбэж эрхлэн мэдтүгэй. Элжигэдэй итгэлтэй хүн боловч үдэш хэвтүүлийн дэргэдүүр яваад хэвтүүд баригдсаны адилаар зарлигийг дагаж, хэдий итгэлтэй хүн боловч хэвтүүлийн ойр очиж үл болох ба хэвтүүлийн тоог асууж үл болно. Хэвтүүлийн дэргэдүүр бүү явтугай! Хэвтүүлийн завсраар бүү явтугай! Хэвтүүлийн дэргэдүүр явж, хэвтүүлийн завсраар орсон ардыг хэвтүүл барьтугай! Хэвтүүлийн тоо асуусан хүний тэр өдрийн унаж явсан эмээл хазаартай морийг бүх хувцасны хамт хэвтүүл автугай. Хэвтүүлийн байрны дээр хэн ч сууж үл болно. Хэвтүүл, туг хэнгэрэг, дөрөө, жад, аяга савыг асарч хадгалтугай! Идээ унд, архи айраг, мах шүүсийг хэвтүүл даргалж мэдтүгэй!\" гэж зарлиг болов. \"Орд тэргийг хэвтүүл асарч мэдтүгэй! Бидний шувуу авлахад хэвтүүлийн зарим нь орд гэр, тэргийг сахиж, зарим нь бидэнтэй хамт явтугай! Хэвтүүлчин, нутаг үзэж, орд өргөөг нүүлгэж буулгатугай! Ордны үүдэнд хаалгачин хэвтүүл үргэлж сахиж байтугай! Бүх хэвтүүлийг мянганы ноён Хадаан захирч мэдтүгэй!\" гэж зарлиг болов. \"Бас хэвтүүлийн ээлж хишгийн ноёд Хадаан Булхадар хоёр, нэг ээлж болон хавсарч, нэг ээлж болон манаж, ордны баруун зүүн этгээдэд оногдсон хагасаа сэргийлж манатугай! Амал Чанар хоёр хавсарч нэг ээлж болж ордны баруун зүүн этгээдэд оногдсон хагасаа сэргийлэн манатугай! Хадй Хорчи-хачар хоёр хавсарч, нэг ээлж болон орж ордны баруун зүүн этгээдэд оногдсон хагасаа сахиж манатугай! Ялбаг Хараудар хоёр хавсарч нэг ээлж болон орж ордны баруун зүүн этгээдэд оногдсон хагасаа сахиж манатугай! Бас Хадаан, Булхадарын ээлж, Амал, Чанарын ээлж, энэ хоёр ээлж жасааны манаачид ордны баруун этгээдэд байрлаж суутугай. Энэ дөрвөн ээлжийн хэвтүүлийг Хадаан ноён захирна. Бас хэвтүүл миний биеийншадар ордыг тойрон байж үүдийг сахиж харгалзтугай. Хэвтүүлийн хоёр хүн ордонд орж сөн түшиж барьтугай!\" гэж зарлиг болов. \"Бас хорчныг захирсан Есүнтэй, Бүхэдэй, Хорхудаг, Лабалха дөрвүүл нум сум агссан торгуудаа дөрвөн ээлж болгож, ээлж бүрийн хорчиноо захиран орж сахитугай!\" гэж зарлиг болов. \"Бас торгуудын ээлжийн ахлагчдыг урьдын захиран мэдэж байсан хүний ургаас болгож, урьд мэдэж байсан Алчидай Хонхордай хоёр хавсарч нэг ээлж торгуудыг захирч ортугай. Тэмүдэр Жэхү хоёр хавсарч нэгэн ээлж торгуудыг захирч ортугай! Мангудай гэзэглүүр (туслах) нэгэн ээлжийн торгуудыг захирч ортугай!\" Бас хаан зарлиг болруун: \"Бүх ноёдыг Элжигэдэй ахалж, Элжигэдэйн үгээр явтугай! Ээлжийн манаач, цагаас хожимдвол урьдах зарлигийн ёсоор гурван бэрээ жанчтугай! Мөн хүн дахин ээлжээс хожидвол долоон бэрээ жанчтугай! Бас тэр хүн өвчний шалтгаангүй, ээлжийн ахлагчийн зөвшөөрөлгүйгээр гурав дахь удаа тасалбал бидэнд бараа болохоос бэрхшээсэн этгээд гэж үзэж, гучин долоон бэрээр жанчаад хол газар нүдний далд цөлж орхиё. Бас ээлжийн ахлагчид, харьяат хишигтнээ бүртгэн жагсаасангүйгээр манаанд орвол ээлжийн ахлагчдыг шийтгэе! Бас ээлжийн ахлагчид гурван ээлж солилцохдоо энэ зарлигийг хишигтэндээ сонсгож байтугай. Зарлиг сонссон бөгөөтөл хишигтэн ээлж тасалбал зарлиг ёсоор шийтгэе! Энэ зарлигийг хишигтэндээ эс сонсгосон бол ээлжийн ахлагчдын буруу болно. Бас ээлжийн ахлагчид харьяалж хамт манаж байгаа миний хишигтэн нарыг ахлагч гэсэн төдийгөөр дур мэдэн шийтгэж үл болно. Тэд, засгийг зөрчвөл бидэнд мэдэгдэж ирүүлтүгэй! Алах ёстойг бид ална. Шийтгэх ёстойг бид шийтгэнэ. Ахлагч гэсэн төдийгөөр бидэнд мадагдахгүйгээр, миний хишигтэнд гар хөл хүргэвэл нударгын оронд нударгаар, бэрээний оронд бэрээгээр цохиж хариулна. Гаднах мянганы ноёдоос миний хишигтэн дээр биз. Гаднах мянганы ноёд, миний хишигтэнтэй хэрэлдвэл мянганы ноёдыг шийтгэнэ\" гэж зарлиг болов.\n\n§279. Бас Өгэдэй хаан өгүүлрүүн: \"Чингис хаан эцгийн зовж байгуулсан улсыгбүү зовооё. Хөлий нь хөсөр, гары нь газар тавиулж жаргуулъя. Хаан эцгийн бэлэн суурийг эзлээд иргэнийг үл зовоохыг эрхэм болгоно. Шөл шүүс болгож харьяат улсын сүрэг хонь бүрээс нэжээд хонь жил тутам авч байна. Зуун хониноос нэжээд хонь гаргаж улсын доторх үгээгүй ядуучуудын тусламж болгож өгтүгэй. Бас олон ах дүү эр цэрэг, агт морь дараалан чуулах бол чуулагсдын ундыг тухай бүр ардаас татварлан авах нь зохилдохгүй. Зүг зүгийн мянгат бүрээс гүү гаргаж, мөн саах саальчин адуулах нутагчныг томилж өр хөлсийг төлөөд унагачин болготугай. Бас ноёд ах дүү нар чуулбал өглөг соёрхлыг өгч байя. Үүний тул эд уурс, мөнгө, сүх, нум, саадаг хуяг, зэв зэргийг байшин зооринд хадгалж, тэр байшин балгасыг сахиулъя. Үүнийг зүг бүрээс балгасчин, амучин (аму будаа хадгалагч) нарыг томилж сахиулъя. Бас улс иргэнийг нутаг усыг хувааж өгье. Нутгийг хувааж\nсонгож нутаглахад мянгат бүрээс нутагчныг ялгаж гаргавал болно. Бас цөл говь нутагт гөрөөснөөс өөр амьтангүй байна. Ард иргэн, уужим суухыг хүснэ. Чанай Уйгуртай хоёр тэргүүтэй нутагчныг явуулж, цөл говьд худаг малтуулж хашуулъя. Бас элч нарыг одоогийн байдлаар явуулахад элч нар удаан явах ба ард олонд зовлон чирэгдэл үлэмж байна. Одоо бид байнга журам болгож зүг зүгийн мянгатаас замчин улаачин гаргаж, суурь суурьд өртөө тавьж элч нарыг ард олны дундуур хамаагүй уургын улаа унаж хэсүүчлэн давхихгүй гагцхүү өртөө замаар явах болгоё. Энэ үйл хэргийг ингэж явуулъя гэж Чанай Булхадар хоёр санаж бидэнд дуртгасан нь зөв зүйтэй санагдах боловч, Цагадай ах мэдтүгэй! Эдэгэр хэлсэн үйлсийг зохимжтой гэж зөвшөөх эсэхийг Цагадай ах шийтгэтүгэй!\" гэж илгээвэл, эдгээр асууж илгээсэн бүх үйл хэргийг цөм зөвшөөрч \"Тэр ёсоор хийтүгэй!\" гэж хариу илгээжээ. Бас Цагадай ахын хэлж илгээсэн нь: \"Би эндээс угтуулан өртөө замыг байгуулсугай. Бас эндээс Батад элч илгээе. Бат угтуулан өртөө зам байгуулж холботугай!\" гээд бас өгүүлсэн нь: \"Бүгдийн хооронд өртөө зам тавья гэдэг, зөвөөс зөв үгийг дуртгажээ!\" гэж илгээжээ.\n\n§280. Тэндээс Өгэдэй хаан өгүүлрүүн: \"Энэ явдлыг Цагадай ах, Бат тэргүүтэн баруун гарын хөвүүд, ах дүү нар цөм. Отчигин ноён, Кэхү тэргүүтэн зүүн гарын хөвүүд ах дүү нар цөм, голын охид, хүргэд, түмний ноёд, мянганы ноёд, зууны ноёд, арваны ноёд цөм зөвшөөрчээ. Зөвшөөрсөн зүйл нь: Далай хаан (Өгэдэй хааныг жижиг хаадаас ялгаварлаж, их хаан буюу Далай хаан гэнэ)-ы шөлд хэрэглэхээр жил тутам сүрэг бүрээс нэжээд шүлгэн иргийг харгаж өгнө. Зуун хониноос нэжээд зусаг хонь гаргаж, үгээгүү ядуу хүмүүсийн тусламж болгож өгвөл сайн бий. Өртөө тавиулж, замчин, улаачныг гаргавал олон улс иргэнд амгалан болох ба элч нарт дөхөмтэй гэснийг бүгдээр зөвшөөрчээ гэж хаан зарлиг болж, Цагадай ахтай зөвлөөд Цагадай ах зөвшөөрсөн тул бүх улсаас, зүг зүгийн мянгатаас хааны зарлигаар жил тутам, сүрэг хониноос нэжээд шүлгэн иргэ, зуун хониноос нэжээд зусаг хонь гаргуулав. Гүүг гаргуулан цуглуулж унагачныг суулгав. Унагачин, балгасчин, амучныг томилж гаргуулав. Замчин, улаачныг гаргуулж суурилах газрыг тогтоож, өртөө замыг тавиулаад Арачиан Тогучар хоёроор захируулж, замын нэгэн суурь өртөөнд хорин улаачныг гаргав. Суурь тутмыг хориод улаачтай болгов. Улааны морь, шүүсний хонь, саалийн гүү, хөллөх үхэр, ачих тэрэг зэргийг тогтоосон хэмжээгээр бэлтгэж, охор шидэмс дутуулбал уруулын хагасыг огтолно. Халбага хигээс дутуулбал хамарын хагасыг огтолно\" гэж зарлиг болов."}, {"k": "read", "ref": "§281", "n": 281, "text": "Өгэдэй хаан өгүүлрүүн: \"Эцгийнхээ их сууринд сууж, хаан эцгээс хойш үйлдсэн хэрэг минь: Нэгдүгээрт, би Алтан улсыг эзлэн дагуулав. Хоёрдугаарт, бидний хооронд элч явуулж харилцах ба элдэв хэргийг зөөлгөх өртөө замыг тавиулав. Гуравдугаарт, усгүй газарт худаг малтуулж гаргуулаад улс иргэнийг ус өвсөнд хүрэлцээтэй болгов. Дөрөвдүгээрт, зүг зүгийн суурин улсын хотуудад мэдээлэгч, захирагч нарыг тавьж, улс иргэнийг хөл хөсөр, гар газар тавиулж амар төвшин болгов. Хаан эцгээс хойш, энэ дөрвөн үйлийг нэмэв, би. Бас хаан эцгийн их сууринд сууж, олон улс иргэнийг захирах их үүргийг хүлээсэн байтал бор дарсанд орсон минь нэгдүгээр буруу болов. Хоёрдугаарт ёсгүй эм хүний үгэнд орж Отчигин авгын харьяат нарын дотроос хүүхэн авчруулсан нь буруу болов. Улсын эзэн хаан байтал, ёсгүй муу алжаас үйлэнд автсан минь бас нэг буруу болов. Гуравдугаарт Доголхуг далдаас хардсан нэг буруу бий. Ямар буруу вэ гэвэл, хаан эцгийн минь харах нүдний өмнө, хамгаас түрүүнд хатгалдаж явсан Доголхуг хорт муу үгэнд орж хороожээ. Одоо миний өмнө хэн тэгж тэргүүлэн давшиж өгөх вэ? Хаан эцгийн минь өмнө зүтгэсэн журамт хүнийг мэдэхгүйгээр өшөөлснийг өөрөө би буруушаана. Дөрөвдүгээрт, тэнгэр газрын заяагаар төрсөн гөрөөсийг бусад ах дүү нарын нутагт очих болуузай гэж харамлаж, шавар хэрэм бариулж, ах дүү нараас гомдох үгийг сонсов, би. Энэ бас нэг буруу бий. Хаан эцгээс хойш дөрвөн үйлийг нэмэв. Бас дөрвөн бурууг үйлджээ!\" гэв."}, {"k": "read", "ref": "§282", "n": 282, "text": "Их хуралдаан болж, хулгана жилийн (1240) хуран (долдугаар) сард Хэрлэний Хөдөө арлын Долоон болдог, Шилхинцэг хоёрын завсар хааны орд бууж байхад бичиж төгсгөв."}]], "lines": {"Мя": "§272–273 · **Лх** §274–276 · **Пү** §277, §281–282 (§278–280-ийг багш товч ярина)"}}, {"n": 36, "title": "Жилийн эцсийн үнэлгээ", "vocab": [], "qs": [], "fri": "«Миний мэдэх Чингис хаан» сэдвийг дахин бичиж, 1-р долоо хоногийнхтой харьцуулна. «Нууц товчооноос надад хамгийн их нөлөөлсөн хэсэг» сэдвээр богино эссэ бичнэ.", "warn": [], "strat": "", "mode": "Чимээгүй уншаад, багш 2–3 хүүхдээс хэсэг уншуулна.", "quiz": null, "days": null, "lines": {"Мя": "Бичгийн ойлголтын тест (1 ба 18-р долоо хоногийн хэлбэрээр).", "Лх, Пү": "Чимээгүй уншлагын хурд (бүгд), А түвшний хүүхдийг чангаар уншуулна. Бусад нь жилийн таван сэдвийн хуудсаа бүлгээрээ танилцуулна."}}]}</script>

(function(){
const DATA=JSON.parse(document.getElementById('data').textContent);
const DAYN=['Мягмар','Лхагва','Пүрэв','Баасан'], DAYS=['Мя','Лх','Пү','Ба'];
const KEY='nuuts-tovchoo-hicheel-v1';
const LESSONS=[]; DATA.weeks.forEach(w=>{for(let d=0;d<4;d++)LESSONS.push({w:w.n,d:d,id:'w'+w.n+'d'+d});});
const idx=id=>LESSONS.findIndex(l=>l.id===id);
let st=load();
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  s=s||{};s.done=s.done||{};s.notes=s.notes||{};s.bm=s.bm||{};s.scroll=s.scroll||{};s.font=s.font||1.25;s.current=s.current||'w1d0';return s;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\*(.+?)\*/g,'<em>$1</em>');
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800);}
function applyPrefs(){document.documentElement.style.setProperty('--read-size',st.font+'rem');
  if(st.theme)document.documentElement.setAttribute('data-theme',st.theme);else document.documentElement.removeAttribute('data-theme');
  const n=Object.keys(st.done).filter(k=>st.done[k]).length;$('#prog').textContent=n+' / '+LESSONS.length+' хичээл';}
const week=n=>DATA.weeks[n-1];
function lessonTitle(l){return l.w+'-р долоо хоног · '+DAYN[l.d];}

/* ---------- vocab highlighting ---------- */
function terms(w){const out=[];(w.vocab||[]).forEach(([t,m])=>{t.split(/\s*(?:,|\/)\s*/).forEach(x=>{x=x.trim();if(x.length>1)out.push([x,m,t]);});});return out;}
function vocabRegex(w){const ts=terms(w);if(!ts.length)return null;
  const parts=ts.map(([x])=>{const words=x.split(/\s+/);let p=words.map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s+');
    if(words.length===1&&x.length>=6)p=p.slice(0,-2*1)+'\\p{L}*';else if(words.length===1)p+='\\p{L}*';return p;});
  return {re:new RegExp('(?<!\\p{L})('+parts.join('|')+')','giu'),ts};}
function highlight(text,vr){let h=esc(text);if(!vr)return h;
  return h.replace(vr.re,m=>{const low=m.toLowerCase();const t=vr.ts.find(([x])=>{const s=x.length>=6&&!/\s/.test(x)?x.slice(0,-2):x;return low.startsWith(s.toLowerCase());});
    return '<mark title="'+esc(t?(t[2]+(t[1]?' — '+t[1]:'')):'')+'">'+m+'</mark>';});}
function paras(text,vr,bid){return text.split(/\n\n+/).map((p,i)=>'<p data-p="'+bid+':'+i+'">'+highlight(p,vr).replace(/\n/g,'<br>')+'</p>').join('');}

/* ---------- timer ---------- */
let T={stages:[],i:0,left:0,run:false,h:null};
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.25,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.8);o.start();o.stop(a.currentTime+.8);}catch(e){}}
function setStages(s){clearInterval(T.h);T={stages:s,i:0,left:s[0][1]*60,run:false,h:null};drawTimer();}
function fmt(s){const m=Math.floor(Math.abs(s)/60),x=Math.abs(s)%60;return (s<0?'−':'')+m+':'+String(x).padStart(2,'0');}
function drawTimer(){const el=$('#timer');if(!el)return;
  el.innerHTML='<span class="clock'+(T.left<=0?' end':'')+'">'+fmt(T.left)+'</span>'+
   '<button class="btn sm '+(T.run?'':'primary')+'" data-t="go">'+(T.run?'⏸ Түр зогсоох':'▶ Эхлэх')+'</button>'+
   '<button class="btn sm" data-t="next">Дараах шат ›</button><button class="btn sm" data-t="reset">↺</button>'+
   T.stages.map((s,i)=>'<span class="stage '+(i===T.i?'on':i<T.i?'past':'')+'" data-t="st" data-i="'+i+'">'+esc(s[0])+' · '+s[1]+' мин</span>').join('');}
function tick(){T.left--;if(T.left===0){beep();if(T.i<T.stages.length-1){T.i++;T.left=T.stages[T.i][1]*60;}}drawTimer();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;const a=b.dataset.t;
  if(a==='go'){T.run=!T.run;clearInterval(T.h);if(T.run)T.h=setInterval(tick,1000);}
  if(a==='next'&&T.i<T.stages.length-1){T.i++;T.left=T.stages[T.i][1]*60;}
  if(a==='reset'){clearInterval(T.h);T.run=false;T.i=0;T.left=T.stages[0][1]*60;}
  if(a==='st'){T.i=+b.dataset.i;T.left=T.stages[T.i][1]*60;}
  drawTimer();});

/* ---------- home ---------- */
function home(){location.hash='';stopTimer();
  const cur=LESSONS[Math.max(0,idx(st.current))];const n=Object.keys(st.done).filter(k=>st.done[k]).length;
  let h='<div class="card hero"><div><h1>'+(n?'Та энд зогссон: ':'Эхлэх хичээл: ')+esc(lessonTitle(cur))+'</h1><p>'+esc(week(cur.w).title)+'</p>'+
    '<div class="meter"><i style="width:'+(n/LESSONS.length*100).toFixed(1)+'%"></i></div><p style="margin-top:6px;font-size:.9rem">'+n+' / '+LESSONS.length+' хичээл дууссан</p></div>'+
    '<button class="btn primary" data-go="'+cur.id+'">▶ Үргэлжлүүлэх</button></div>';
  const parts=[[1,17,'I улирал — Тэмүжиний бага нас ба өсөлт'],[18,36,'II улирал — Их Монгол Улс']];
  parts.forEach(([a,b,t])=>{h+='<h2 class="part">'+t+'</h2><div class="weeks">';
    for(let k=a;k<=b;k++){const w=week(k);const isCur=cur.w===k;
      h+='<div class="week'+(isCur?' cur':'')+'"><span class="num">'+k+'</span><span class="tt"><b>'+esc(w.title)+'</b></span><span class="pills">'+
        DAYS.map((d,i)=>{const id='w'+k+'d'+i;return '<button class="pill'+(st.done[id]?' done':'')+(id===cur.id?' cur':'')+'" data-go="'+id+'" title="'+DAYN[i]+'">'+(st.done[id]?'✓':d)+'</button>';}).join('')+'</span></div>';}
    h+='</div>';});
  app.innerHTML=h;window.scrollTo(0,0);}
function stopTimer(){clearInterval(T.h);T.run=false;}

/* ---------- lesson ---------- */
let curId=null, scrollT=null;
function open(id){const l=LESSONS[idx(id)];if(!l)return home();stopTimer();
  curId=id;st.current=id;save();if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);
  const w=week(l.w),vr=vocabRegex(w),i=idx(id),prev=LESSONS[i-1],next=LESSONS[i+1];
  const assess=!w.days, friday=l.d===3;
  let main='',dayText='';
  if(assess){const L=w.lines,keyMap=[['Мя'],['Лх','Лх, Пү'],['Пү','Лх, Пү'],['Ба']];
    const k=keyMap[l.d].find(x=>L[x]);dayText=k?L[k]:'';
    main+='<div class="card"><h3>Өнөөдрийн ажил</h3><p style="font-size:1.15rem">'+md(dayText)+'</p>'+(L._intro?'<p class="mode">'+md(L._intro)+'</p>':'')+
      '<p class="mode">Хэвлэх материал: <code>01-ЭХЛЭЛИЙН-ҮНЭЛГЭЭ.md</code>. Хүүхдийн дүнг <code>СУРАГЧДЫН-БҮРТГЭЛ.xlsx</code>-д бичнэ.</p></div>';
  } else if(!friday){
    const blocks=w.days[l.d];
    main+='<div class="card"><h3>Унших хэсэг · '+blocks.map(b=>b.ref).join(', ')+'</h3><p class="mode">'+esc(w.mode)+' Догол мөр дээр дарвал «📌 Энд зогссон» тэмдэг тавигдана.</p>'+
      (st.bm[id]?'<button class="btn sm" id="goBm">📌 Зогссон газар руу очих</button>':'')+'</div>';
    main+='<div class="card read">'+blocks.map((b,bi)=>{const chap=b.chap?'<div class="chap">'+esc(b.chap)+'</div>':'';
      if(b.k==='retell')return chap+'<details class="retell blk"><summary>'+esc(b.ref)+' — багш товч ярина (дарж уншина)</summary>'+paras(b.text,vr,bi)+'</details>';
      return chap+'<div class="blk"><div class="ref">'+esc(b.ref)+'</div>'+paras(b.text,vr,bi)+'</div>';}).join('')+'</div>';
    main+='<div class="card"><h3>Хичээлийн төгсгөл · 2 мин</h3><p style="font-size:1.1rem">Хүүхэд бүр уншлагын дэвтэртээ өнөөдрийн хэсгийг <strong>нэг өгүүлбэрээр</strong> бичнэ.</p></div>';
  } else {
    main+='<div class="card"><h3>Баасан · долоо хоногийн идэвхтэй ажил (10 мин)</h3><p style="font-size:1.15rem">'+md(w.fri)+'</p></div>';
    if(w.quiz){main+='<div class="card"><h3>Шалгалт (10 мин) · асуулт бүр 1 оноо <button class="btn sm" id="showAns" style="margin-left:8px">Хариулт харуулах</button></h3><div class="quiz">'+
      w.quiz.map((q,qi)=>'<div class="q"><b>'+(qi+1)+'. '+esc(q.q)+'</b>'+(q.opts.length?'<ol>'+q.opts.map((o,oi)=>{const L='АБВГ'[oi];return '<li data-ok="'+(L===q.ans?1:0)+'">'+L+'. '+esc(o)+'</li>';}).join('')+'</ol>':'<div class="mode" data-txt="'+esc(q.ans)+'">(бичгээр хариулна)</div>')+'</div>').join('')+'</div></div>';}
    else main+='<div class="card"><h3>Шалгалт (10 мин)</h3><p>Энэ долоо хоногийн 5 асуулттай шалгалтын хуудсыг тарааж өгнө. Доорх долоо хоногийн асуултуудаас бэлтгэж болно.</p><ol>'+w.qs.map(q=>'<li>'+md(q)+'</li>').join('')+'</ol><p class="mode">Оноог <code>СУРАГЧДЫН-БҮРТГЭЛ.xlsx</code>-ийн «Долоо хоног» хуудсанд бичнэ.</p></div>';
  }
  // side
  let side='';
  if(w.strat)side+='<div class="card"><h3>Энэ улирлын стратеги</h3><div>'+esc(w.strat)+'</div></div>';
  if(w.vocab.length){const here=!assess&&!friday?w.days[l.d].map(b=>b.text).join(' ').toLowerCase():'';
    side+='<div class="card"><h3>Шинэ үг'+(here?' · шар нь өнөөдрийн текстэд гарна':'')+'</h3><ul class="vocab">'+w.vocab.map(([t,m])=>{
      const hit=here&&t.split(/\s*(?:,|\/)\s*/).some(x=>{x=x.trim().toLowerCase();const s=x.length>=6&&!/\s/.test(x)?x.slice(0,-2):x;return s&&here.includes(s);});
      return '<li'+(hit?' class="today"':'')+'><b>'+esc(t)+'</b>'+(m?' — '+esc(m):'')+'</li>';}).join('')+'</ul></div>';}
  if(w.qs.length&&!friday)side+='<div class="card"><h3>Асуулт (5 мин)</h3><ul class="qs">'+w.qs.map((q,i)=>'<li><span class="lv">'+'★'.repeat(i+1)+'</span><span>'+md(q)+'</span></li>').join('')+'</ul><p class="saved" style="margin-top:8px">★ — бүгдэд (А түвшнээс асууна), ★★ — В ба С, ★★★ — С түвшинд.</p></div>';
  if(w.warn.length)side+='<div class="card note-warn"><h3>⚠ Багш анхаарах</h3>'+w.warn.map(x=>'<p>'+md(x)+'</p>').join('')+'</div>';
  side+='<div class="card"><h3>Миний тэмдэглэл</h3><textarea id="note" placeholder="Жишээ: §20 хүртэл уншсан. Бат, Сараа хоёр сайн оролцсон.">'+esc(st.notes[id]||'')+'</textarea><div class="saved" id="noteSaved">Бичихэд автоматаар хадгалагдана.</div></div>';
  app.innerHTML='<div class="lhead"><h1><span class="kicker">'+esc(lessonTitle(l))+'</span>'+esc(w.title)+'</h1>'+
    (st.done[id]?'<span class="donebadge">✓ Дууссан</span>':'')+
    '<button class="btn sm" '+(prev?'data-go="'+prev.id+'"':'disabled')+'>‹ Өмнөх</button><button class="btn sm" '+(next?'data-go="'+next.id+'"':'disabled')+'>Дараах ›</button></div>'+
    '<div class="card timer" id="timer"></div>'+
    '<div class="grid"><div class="main">'+main+
    '<div class="foot"><span class="saved">Явц энэ компьютерийн хөтөч дээр автоматаар хадгалагдана.</span>'+
    (st.done[id]?'<button class="btn" id="undone">Дуусаагүй болгох</button>':'')+
    '<button class="btn good" id="finish">✓ Хичээл дууссан'+(next?' — дараагийнх руу':'')+'</button></div></div>'+
    '<div class="side">'+side+'</div></div>';
  setStages(assess?[['Ажил',20]]:friday?[['Шалгалт',10],['Идэвхтэй ажил',10]]:[['Санах, шинэ үг',3],['Унших',10],['Асуулт',5],['Нэг өгүүлбэр',2]]);
  if(assess&&l.d===0&&(l.w===1||l.w===36))T.stages.unshift(['Хурд хэмжих',1]),setStages(T.stages);
  // restore bookmark / scroll
  const bm=st.bm[id];if(bm){const p=app.querySelector('[data-p="'+bm+'"]');if(p){p.classList.add('bm');const d=p.closest('details');if(d)d.open=true;}}
  requestAnimationFrame(()=>{const p=bm&&app.querySelector('p.bm');if(p)p.scrollIntoView({block:'center'});else window.scrollTo(0,st.scroll[id]||0);});
  applyPrefs();}

app.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){open(g.dataset.go);window.scrollTo(0,0);return;}
  const p=e.target.closest('.read p');if(p&&curId){const was=p.classList.contains('bm');app.querySelectorAll('p.bm').forEach(x=>x.classList.remove('bm'));
    if(was){delete st.bm[curId];toast('Тэмдэг арилгалаа');}else{p.classList.add('bm');st.bm[curId]=p.dataset.p;toast('📌 Энд зогссоныг хадгаллаа');}save();return;}
  if(e.target.id==='goBm'){const b=app.querySelector('p.bm');if(b)b.scrollIntoView({block:'center',behavior:'smooth'});}
  if(e.target.id==='finish'){st.done[curId]=true;const n=LESSONS[idx(curId)+1];save();toast('✓ Хадгаллаа');if(n){open(n.id);window.scrollTo(0,0);}else home();}
  if(e.target.id==='undone'){delete st.done[curId];save();open(curId);}
  if(e.target.id==='showAns'){app.querySelectorAll('.quiz li[data-ok="1"]').forEach(x=>x.classList.toggle('ok'));
    app.querySelectorAll('.quiz [data-txt]').forEach(x=>{x.textContent=x.textContent.startsWith('(')?'Хариулт: '+x.dataset.txt:'(бичгээр хариулна)';});}
});
app.addEventListener('input',e=>{if(e.target.id==='note'){st.notes[curId]=e.target.value;save();$('#noteSaved').textContent='Хадгалагдсан ✓';}});
window.addEventListener('scroll',()=>{if(!curId||location.hash!=='#'+curId)return;clearTimeout(scrollT);scrollT=setTimeout(()=>{st.scroll[curId]=Math.round(window.scrollY);save();},400);});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&idx(h)>=0){if(h!==curId)open(h);}else{curId=null;home();}});

$('#bHome').onclick=()=>{curId=null;home();};
$('#bBigger').onclick=()=>{st.font=Math.min(2.2,+(st.font+.1).toFixed(2));save();applyPrefs();};
$('#bSmaller').onclick=()=>{st.font=Math.max(.9,+(st.font-.1).toFixed(2));save();applyPrefs();};
$('#bTheme').onclick=()=>{const dark=st.theme?st.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;st.theme=dark?'light':'dark';save();applyPrefs();};
$('#bFull').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();};
$('#bMenu').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('hidden');};
document.addEventListener('click',e=>{if(!e.target.closest('#menu')&&e.target.id!=='bMenu')$('#menu').classList.add('hidden');});
$('#bExport').onclick=()=>{const b=new Blob([JSON.stringify(st,null,1)],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='nuuts-tovchoo-yavts-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Файл татагдлаа');};
$('#bImport').onclick=()=>$('#fImport').click();
$('#fImport').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const s=JSON.parse(t);if(!s.done)throw 0;st=s;save();applyPrefs();toast('Явц сэргээгдлээ');open(st.current);}catch(x){toast('Файл буруу байна');}});};
$('#bReset').onclick=()=>{if(confirm('Бүх явц, тэмдэглэлийг арилгах уу? Буцаах боломжгүй.')){localStorage.removeItem(KEY);st=load();applyPrefs();home();}};

applyPrefs();
const h=location.hash.slice(1);
if(h&&idx(h)>=0)open(h);else if(Object.keys(st.done).length||st.current!=='w1d0')open(st.current);else home();
})();
</script>
</body>
</html>
