<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нууц товчоо — хичээлүүд</title>
<style>
:root{
  --bg:#f7f5f0; --surface:#ffffff; --surface-2:#f0ede6; --line:#e2ddd2;
  --text:#22201c; --text-2:#5c574e; --muted:#8a8478;
  --accent:#1f5fa8; --accent-soft:#e3edf9; --done:#2e7d4f; --done-soft:#e2f2e8;
  --warn:#9a5b00; --warn-soft:#fbf0dc; --mark:#fff1b8; --retell:#f3efe6;
  --read-size:1.25rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161513; --surface:#1f1e1b; --surface-2:#292824; --line:#37352f;
    --text:#f1eee6; --text-2:#c3bfb4; --muted:#8f8a7f;
    --accent:#6ea8ec; --accent-soft:#1d2d42; --done:#5cc48a; --done-soft:#17301f;
    --warn:#e2a54a; --warn-soft:#33270f; --mark:#4a3f12; --retell:#24221e;
  }
}
:root[data-theme="dark"]{
  --bg:#161513; --surface:#1f1e1b; --surface-2:#292824; --line:#37352f;
  --text:#f1eee6; --text-2:#c3bfb4; --muted:#8f8a7f;
  --accent:#6ea8ec; --accent-soft:#1d2d42; --done:#5cc48a; --done-soft:#17301f;
  --warn:#e2a54a; --warn-soft:#33270f; --mark:#4a3f12; --retell:#24221e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .brand{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.bar .prog{color:var(--text-2);font-size:.9rem;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;min-height:36px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.good{background:var(--done);border-color:var(--done);color:#fff}
.btn.sm{padding:3px 9px;min-height:30px;font-size:.9rem}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;justify-content:space-between;margin-bottom:16px}
.hero h1{font-size:1.3rem;margin:0 0 4px}
.hero p{margin:0;color:var(--text-2)}
.meter{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:10px;max-width:420px}
.meter i{display:block;height:100%;background:var(--done);border-radius:99px}
h2.part{font-size:1rem;color:var(--text-2);margin:24px 4px 8px;font-weight:600}
.weeks{display:grid;gap:8px}
.week{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.week.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.week .num{width:34px;flex:none;font-weight:700;color:var(--text-2);text-align:right}
.week .tt{flex:1;min-width:0}
.week .tt b{display:block;font-weight:600}
.week .tt small{color:var(--muted)}
.pills{display:flex;gap:4px;flex:none}
.pill{width:42px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem}
.pill.done{background:var(--done-soft);border-color:var(--done);color:var(--done);font-weight:600}
.pill.cur{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.lhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.lhead h1{font-size:1.35rem;margin:0;flex:1;min-width:240px}
.lhead .kicker{display:block;font-size:.85rem;color:var(--text-2);font-weight:500}
.donebadge{color:var(--done);font-weight:600}
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;margin-bottom:12px}
.stage{border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--surface);font-size:.9rem}
.stage.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.stage.past{color:var(--muted);text-decoration:line-through}
.clock{font:700 1.8rem/1 ui-monospace,Menlo,Consolas,monospace;min-width:5ch;text-align:center}
.clock.end{color:var(--warn)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.side{display:grid;gap:12px;position:sticky;top:70px}
@media (max-width:900px){.side{position:static}}
.side h3,.main h3{font-size:.95rem;margin:0 0 8px;color:var(--text-2);text-transform:none}
.vocab{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.vocab li{line-height:1.35}
.vocab b{color:var(--accent)}
.vocab .today b{background:var(--mark);color:var(--text);padding:0 3px;border-radius:3px}
.qs{margin:0;padding-left:0;list-style:none;display:grid;gap:8px}
.qs li{display:flex;gap:8px}
.qs .lv{flex:none;color:var(--warn);font-size:.85rem;width:3.2em}
.note-warn{background:var(--warn-soft);border-color:transparent}
.note-warn p{margin:.3em 0}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);color:var(--text);font:inherit;resize:vertical}
.saved{font-size:.8rem;color:var(--muted)}
.main{display:grid;gap:12px}
.mode{color:var(--text-2);font-size:.95rem}
.read{font-family:Georgia,"Times New Roman",serif;font-size:var(--read-size);line-height:1.65}
.blk{scroll-margin-top:80px}
.blk .ref{font:600 .85rem system-ui,Arial,sans-serif;color:var(--accent);margin:18px 0 4px}
.chap{font:700 1rem system-ui,Arial,sans-serif;text-align:center;letter-spacing:.02em;color:var(--text-2);margin:8px 0 16px;padding:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.read p{margin:0 0 .8em;padding:2px 6px;border-radius:6px;cursor:pointer;position:relative}
.read p:hover{background:var(--surface-2)}
.read p.bm{background:var(--mark);box-shadow:inset 4px 0 0 var(--warn)}
.read p.bm::before{content:"📌 Энд зогссон";position:absolute;right:6px;top:-14px;font:600 .75rem system-ui,Arial,sans-serif;background:var(--warn);color:#fff;padding:1px 6px;border-radius:4px}
.read mark{background:transparent;border-bottom:2px dotted var(--accent);color:inherit;cursor:help}
details.retell{background:var(--retell);border-radius:10px;padding:8px 12px;margin:12px 0}
details.retell summary{font:600 .95rem system-ui,Arial,sans-serif;cursor:pointer;color:var(--text-2)}
.quiz{display:grid;gap:14px}
.quiz .q b{display:block;margin-bottom:4px}
.quiz ol{margin:0;padding-left:0;list-style:none;display:grid;gap:2px}
.quiz li.ok{color:var(--done);font-weight:600}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-top:8px}
.menu{position:absolute;right:16px;top:56px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:20}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.9rem;z-index:30}
@media (max-width:600px){
  .bar .prog,.bar .brand{display:none}
  .bar{gap:6px;padding:8px 10px}
  .btn{white-space:nowrap}
  .week{flex-wrap:wrap}
  .pills{width:100%;justify-content:flex-end}
  .pill{flex:1}
}
@media print{.bar,.timer,.side,.foot{display:none!important}.grid{display:block}}
</style>
</head>
<body>
<div class="bar">
  <button class="btn sm" id="bHome" title="Хуваарь">☰ Хуваарь</button>
  <span class="brand">Нууц товчоо · Ойлгон унших</span>
  <span class="sp"></span>
  <span class="prog" id="prog"></span>
  <button class="btn sm" id="bSmaller" title="Үсэг жижигрүүлэх">А−</button>
  <button class="btn sm" id="bBigger" title="Үсэг томруулах">А+</button>
  <button class="btn sm" id="bTheme" title="Өнгө солих">◐</button>
  <button class="btn sm" id="bFull" title="Бүтэн дэлгэц">⛶</button>
  <button class="btn sm" id="bMenu" title="Нөөцлөх">⋯</button>
</div>
<div class="menu hidden" id="menu">
  <button class="btn sm" id="bExport">⬇ Явцаа файлд хадгалах</button>
  <button class="btn sm" id="bImport">⬆ Хадгалсан явцаа сэргээх</button>
  <input type="file" id="fImport" accept=".json" class="hidden">
  <button class="btn sm" id="bReset">Явцыг бүгдийг арилгах</button>
</div>
<div class="wrap" id="app"></div>
<script type="application/json" id="data">{"weeks": [{"n": 1, "title": "Эхлэлийн үнэлгээ ба танилцуулга", "vocab": [], "qs": [], "fri": "«Миний мэдэх Чингис хаан» сэдвээр 3 өгүүлбэр бичнэ. Жилийн эцэст дахин бичүүлж харьцуулна.", "warn": [], "strat": "", "mode": "Багш чангаар уншина, хүүхдүүд хуруугаараа дагана.", "quiz": null, "days": null, "lines": {"_intro": "Дэлгэрэнгүйг `01-ЭХЛЭЛИЙН-ҮНЭЛГЭЭ.md`-ээс үзнэ үү.", "Мя": "1-р өгүүллэг. Чимээгүй уншлагын хурд ба 1–5-р асуулт (бүгд нэг зэрэг).", "Лх": "2-р өгүүллэг ба 6–10-р асуулт. Үлдсэн хугацаанд «Нууц товчоо гэж юу вэ, хэзээ бичигдсэн бэ (1240)» талаар ярилцана.", "Пү": "Сул 15–20 хүүхдийг чангаар уншуулна. Бусад нь түр бүлгээрээ газрын зураг дээр Онон, Хэрлэн, Туул, Бурхан халдуныг олно."}}, {"n": 2, "title": "Алун гуа ба таван сум", "vocab": [["өгүүлрүүн", "хэлэв"], ["бүлгээ", "байлаа"], ["гэргий", "эхнэр"], ["хөвүүн", "хүү"], ["айсуй", "ирж яваа"], ["мөс", "сум"]], "qs": ["Алун гуа хөвүүддээ юу хугалуулсан бэ?", "Нэг сумыг амархан, таван сумыг огт хугалж чадаагүй нь юуг харуулж байна вэ?", "Танай ангид «таван сум» шиг эв нэгдэл хэрэгтэй болсон тохиолдол байсан уу?"], "fri": "Таван сумын үйл явдлыг жүжиглэнэ.", "warn": ["§17–21: «Тэнгэрийн хөвүүд» гэдэг нь домог юм. Домог ба түүхийг ялгаж ярилцаарай."], "strat": "Таамаглах ба үг тодруулах — «Цааш юу болох бол?», «Энэ үгийн утгыг өгүүлбэрээс нь яаж таах вэ?»", "mode": "Багш чангаар уншина, хүүхдүүд хуруугаараа дагана.", "quiz": [{"q": "Бөртэ-чино, Гуа-марал хоёр хаана нутагласан бэ?", "opts": ["Хэрлэн мөрний эх, Бүрги эрэгт", "Онон мөрний эх, Бурхан халдун ууланд", "Туул голын Хар шугуйд", "Сэлэнгэ мөрний эрэгт"], "ans": "Б"}, {"q": "Дува сохор ямар онцлогтой байсан бэ?", "opts": ["Магнай дундаа ганц нүдтэй, гурван нүүдлийн газар хардаг", "Улсын нэртэй бөх байсан", "Хамгийн сайн харваач байсан", "Хамгийн хурдан морьтой байсан"], "ans": "А"}, {"q": "Добу мэргэн бугын махны гуяыг ядуу хүнд юугаар сольж өгсөн бэ?", "opts": ["Морь", "Тэр хүний хөвүүн", "Нум сум", "Эсгий"], "ans": "Б"}, {"q": "Алун гуа таван сумаар хөвүүддээ юуг ойлгуулахыг хүссэн бэ?", "opts": ["Сум хийж сурах хэрэгтэйг", "Эв нэгдэлтэй байвал хэнд ч амархан дийлдэхгүйг", "Ан агнаж сурах хэрэгтэйг", "Ах дүү хөрөнгөө хуваах ёстойг"], "ans": "Б"}, {"q": "«Алун гуа өгүүлрүүн» гэдгийг өнөөгийн хэлээр бич.", "opts": [], "ans": "«Алун гуа хэлэв» эсвэл «Алун гуа ингэж хэлсэн»."}], "days": [[{"k": "read", "ref": "§1", "n": 1, "text": "Чингис хааны язгуур, дээр тэнгэрээс заяат төрсөн Бөртэ-чино, гэргий Гуа-Маралын хамт тэнгис далайг гэтэлж ирээд Онон мөрний эх Бурхан халдун ууланд нутаглаж Батцагаан гэдэг нэгэн хөвүүнийг төрүүлжээ.", "chap": "Тэмүжиний уг гарал ба бага насны үе"}, {"k": "retell", "ref": "§2–3", "n": 2, "text": "§2. Батцагааны хөвүүн Тамача, Тамачийн хөвүүн Хоричар мэргэн, Хоричар мэргэний хөвүүн Уужим буурал, Уужим бууралын хөвүүн Саль-хачау, Саль-хачаугийн хөвүүн Ихнүдэн, Ихнүдэний хөвүүн Шинсочи, Шинсочийн хөвүүн Харчу.\n\n§3. Харчугийн хөвүүн Боржигидай мэргэн бүлгээ. Боржигидай мэргэний гэргий нь Монголжингуа, түүнээс төрсөн хөвүүн Торголжин баян. Торголжин баян, Борогчин гуа гэргийтэй, Боролдайсуялби гэдэг залуу зарцтай, дайр бор хоёр хүлэг морьтой бүлгээ. Торголжин баяны хөвүүн Дува сохор, Добу мэргэн хоёр бүлгээ."}, {"k": "read", "ref": "§4", "n": 4, "text": "Дува сохор, магнай дундаа ганц нүдтэй гурван нүүдлийн газар харах бүлгээ."}, {"k": "read", "ref": "§5", "n": 5, "text": "Нэгэн өдөр Дува сохор, Добу мэргэн дүүтэйгээ Бурхан халдун уулан дээр гарав. Дува сохор, Бурхан халдун дээрээс харвал Түнхэлэг горхин уруу нэгэн бүлэг иргэн нүүж айсуй."}, {"k": "read", "ref": "§6", "n": 6, "text": "Дува сохор өгүүлрүүн: \"Тэр нүүдэл иргэний дотор, тэрэгний мухлагийн өмнө нэг сайхан охин сууж явна. Хүний гэргий болоогүй бол Добу мэргэн дүү чамд гуйж гэргий болгоё\" гээд түүнийг үзүүлэхээр Добу мэргэн дүүгээ илгээв."}, {"k": "read", "ref": "§7", "n": 7, "text": "Добу мэргэн, тэр нүүдэлд хүрч охиныг үзвэл үнэхээр алдартай, гоо сайхан охин бөгөөд хүний гэргий болоогүй ажээ. Нэр Алун гуа гэнэ."}, {"k": "read", "ref": "§8", "n": 8, "text": "Энэ охин, хорь түмдийн ноён Хорилардай мэргэний гэргий Баргужин гуагаас хорь түмд (хорь буриад)-ийн нутаг Ариг ус гэдэг газар төржээ. Түүний эх Баргужин гуа бол хол газрын Баргужин төхүмийн эзэн Баргудай мэргэний охин бүлгээ. Тэр бүлэг иргэн бол Хорилардай мэргэнийх ажээ."}, {"k": "read", "ref": "§9", "n": 9, "text": "Хорилардай мэргэн, хорь түмдийн газарт булга, хэрэм зэрэг ан гөрөөс агнахаа хориглон булаалдаж харилцан муудалцаад салж, хорилар овогтон болоод Бурхан халдун ууланд ан гөрөөс элбэг гэж сонсож, Бурхан халдуны эзэн бурхан босгосон Шинч баян урианхайтай уулзахаар нүүж ирсэн ажээ. Энэхүү хорь түмдийн ноён Хорилардай мэргэний охин, Ариг уснаа төрсөн Алун-гуаг гуйж, Добу мэргэний гэргий болгосон ёс тийм ажээ."}], [{"k": "read", "ref": "§10", "n": 10, "text": "Алун-гуа, Добу мэргэнд ирээд Бүгүнүтэй, Бэлгүнүтэй гэдэг нэртэй хоёр хөвүүнийг төрүүлэв."}, {"k": "read", "ref": "§11", "n": 11, "text": "Дува сохор ах нь дөрвөн хөвүүнтэй бүлгээ. Дува сохрыг үхсэний хойно түүний дөрвөн хөвүүн, Добу мэргэнийг авга гэж үзэхгүй доромжилж салж нүүгээд дөрвэд овогтон болов."}, {"k": "read", "ref": "§12", "n": 12, "text": "Түүний хойно нэг өдөр Добу мэргэн Тогоцог өндөр дээр гөрөөлөхөөр гарвал, ой дотор нэгэн урианхай хүн гунжин буга алаад хавирга цоройг шарж байхад уулзаж,"}, {"k": "read", "ref": "§13", "n": 13, "text": "\"Нөхөр шоролгодоо\" гэж Добу мэргэн хэлбэл, тэр хүн уушги зүлд ба арьсыг өөрөө авч, бусдыг цөм Добу мэргэнд өгөв."}, {"k": "read", "ref": "§14", "n": 14, "text": "Добу мэргэн, тэр бугын махыг ачиж явтал замд хүүхдээ хөтөлсөн нэгэн ядуу хүн учрав."}, {"k": "read", "ref": "§15", "n": 15, "text": "\"Чи юун хүн бэ?\" гэж Добу мэргэн асуувал, тэр хүн өгүүлрүүн: \"Би Малиг баяудын хүн. Одоо би ядарч явна. Тэр гөрөөсний махнаас надад өг. Би энэ хөвүүнээ чамд өгье\" гэвэл,"}, {"k": "read", "ref": "§16", "n": 16, "text": "Добу мэргэн зөвшөөрч, бугын өрөөсөн гуяыг тэр хүнд өгөөд хөвүүнийг авч ирж гэртээ зарцлах болов."}, {"k": "read", "ref": "§17", "n": 17, "text": "Тэгж байтал Добу мэргэн үгүй болов. Добу мэргэнийг үгүй болсны хойно түүний гэргий Алун-гуа бэлбэсэн бөгөөтөл Буха хатаги, Бухату салжи, Бодончар мунхаг гэдэг нэртэй гурван хөвүүнийг төрүүлэв."}, {"k": "read", "ref": "§18", "n": 18, "text": "Урьд Добу мэргэнийг амьд бүхий цагт төрсөн Бэлгүнүтэй, Бүгүнүтэй хоёр хөвүүн, эх Алун-гуагаас эчнээ хэлэлцсэн нь: \"Бидний эх, ойр төрлийн эрэгтэй хүнгүй ба эргүй бөгөөтөл энэ гурван хөвүүнийг төрүүлэв. Гэр дотор ганц Малиг баяуд овгийн зарц хүн байна. Энэ гурван хөвүүн, түүний хүүхэд биз\" гэж эхээс далд хэлэлцэхийг нь Алун-гуа мэдээд,"}], [{"k": "read", "ref": "§19", "n": 19, "text": "Хаврын нэгэн өдөр хонины хатсан мах чанаж Бэлгүнүтэй, Бүгүнүтэй, Буха хатаги, Бухату салжи, Бодончар мунхаг таван хөвүүндээ идүүлээд тэднийг зэрэгцүүлэн суулгаж, хүн бүрд нэжээд мөс (сум буюу нарийн мод)-ийг хугал гэж өгвөл амархан хугачиж орхив. Бас таван мөсийг нийлүүлж баглаад хугал гэж өгвөл тавуулаа дараалан оролдож хугалж чадсангүй."}, {"k": "read", "ref": "§20", "n": 20, "text": "Үүнд Алун-гуа эх нь өгүүлрүүн: \"Бэлгүнүтэй, Бүгүнүтэй та хоёр намайг энэ гурван хөвүүнийг яахин төрүүлэв, хэний хөвүүд бол гэж сэжиглэн хэлэлцэнэ. Сэжиглэх тань зөв."}, {"k": "read", "ref": "§21", "n": 21, "text": "Гэвч, та нар учрыг мэдэхгүй байна. Шөнө бүр цагаан шар хүн, гэрийн өрх тотгоор гийгүүлэн орж ирээд миний хэвлийг илэхэд түүний гэрэл миний хэвэлд шингэх бүлгээ. Тэр хүн, гарах нар сарны хилээр шар нохой мэт шарвалзсаар гарч одно. Дэмий яахин өгүүлнэ та. Түүнээс үзвэл тэнгэрийн хөвүүд биз. Хар тэргүүт хүнтэй адилтгаж яахин болно. Хамгийн хаад болох цагт харц хүн сая учрыг мэднэ\" гээд"}, {"k": "read", "ref": "§22", "n": 22, "text": "Бас Алун-гуа, таван хөвүүнээ сургаж өгүүлрүүн: \"Та таван хөвүүн, миний нэгэн хэвлээс төрсөн биш үү. Та нар ганц ганцаар салбал нэжээд сум мэт хүнд хялбархан дийлэгдэнэ. Та нар эв эеэ нэгтгэвэл тэр багласан таван сум мэт бэх болж, хэнд ч хялбар дийлэгдэхгүй болно\" гэв. Тэгж байтал Алун-гуа эх нь үгүй болов."}]], "lines": {"Мя": "§1–9 · **Лх** §10–18 · **Пү** §19–22 (§2–3-ыг багш товч ярина)"}}, {"n": 3, "title": "Бодончар", "vocab": [["урагт эс тоолох", "төрөлдөө тооцохгүй"], ["харцага", "ан агнадаг махчин шувуу"], ["эмбүүл гэр", "өвсөөр хийсэн овоохой"], ["эсэг, цэгээ", "айраг"], ["иргэн", "нэг бүлэг ард"], ["овогтон болов", "овгийн эх болов"]], "qs": ["Бодончар ах нараасаа хувь авалгүй хаашаа явсан, юугаар хооллосон бэ?", "«Бие тэргүүтэй, дээл захтай нь сайн» гэж юу хэлэх гэсэн бэ?", "Бодончарыг «мунхаг» гэж нэрлэсэн нь зөв үү?"], "fri": "Бөртэ-чиноос Бодончар хүртэлх ургийн модыг ангиараа зурна.", "warn": [], "strat": "Таамаглах ба үг тодруулах — «Цааш юу болох бол?», «Энэ үгийн утгыг өгүүлбэрээс нь яаж таах вэ?»", "mode": "Багш чангаар уншина, хүүхдүүд хуруугаараа дагана.", "quiz": [{"q": "Алун гуа эх нь нас барсны дараа ах нар нь Бодончарт юу хийсэн бэ?", "opts": ["Түүнийг ахлагчаа болгосон", "Түүнд хувь өгөлгүй, төрөлдөө тооцоогүй", "Түүнд сайн морь бэлэглэсэн", "Түүнийг дагуулж нүүсэн"], "ans": "Б"}, {"q": "Бодончар ганцаараа амьдрахдаа юугаар хооллож байсан бэ?", "opts": ["Тариа тарьж", "Харцагаар шувуу бариулж, чонын үлдээсэн ангийн махыг идэж", "Загас барьж худалдаж", "Ах нараасаа идэх юм гуйж"], "ans": "Б"}, {"q": "Буха хатаги дүүгээ хэрхэн олсон бэ?", "opts": ["Морины мөрийг нь мөшгөж", "Түнхэлэг горхинд нутаглаж байсан иргэдээс сураглаж", "Харцаганы нь дуугаар", "Зүүдэндээ харж"], "ans": "Б"}, {"q": "Бодончар «Бие тэргүүтэй, дээл захтай нь сайн» гэж юу хэлэх гэсэн бэ?", "opts": ["Хүйтэнд дулаан хувцаслах хэрэгтэй", "Ард иргэн удирдагчтай байх ёстой. Тэр иргэд эзэнгүй тул эзлэхэд амархан.", "Ахдаа хүндэтгэл үзүүлэх хэрэгтэй", "Сайн дээлтэй хүн баян"], "ans": "Б"}, {"q": "Ах нар нь Бодончарыг «мунхаг» гэж үздэг байсан. Түүний үйлдлээс харахад тэр үнэхээр мунхаг байсан уу? Нэг жишээгээр тайлбарла.", "opts": [], "ans": "«Үгүй» эсвэл «тийм» гэсний аль нь ч болно. Түүнийг **жишээгээр** үндэслэсэн байх ёстой. Жишээ нь: ганцаараа амьдарч чадсан, харцага барьж сургасан, эзэнгүй иргэнийг эзлэх санаа гаргасан. Зөвхөн «тийм/үгүй» гэж бичвэл 0."}], "days": [[{"k": "read", "ref": "§23", "n": 23, "text": "Эх Алун-гуаг үгүй болсны хойно ах дүү тавуулаа, адуу малаа хуваах болж, Бэлгүнүтэй, Бүгүнүтэй, Буха хатаги, Бухату салжи дөрвүүлээ юмаа хувааж аваад дүү Бодончар мунхагийг бядуу гэж урагт үл тооцож хувь эс өгөв."}, {"k": "read", "ref": "§24", "n": 24, "text": "Бодончар урагт эс тоологдох атал, энд юу хийж сууна гээд гол дайрт, годил сүүлт орог шинхул морио унаж үхвэл ухье, амьдарвал амьдаръя гэж Онон мөрөн уруу зорьж одов. Тэнд Балжийн арал гэдэг газар хүрч өвсөн эмбүүл гэр барьж суув."}, {"k": "read", "ref": "§25", "n": 25, "text": "Тэгж байтал хар хур шувууг бор харцага барьж идэхийг үзэж, гол дайрт, годил сүүлт орог мориныхялгасаар урхи хийж, тэр бор харцагыг барьж авчрав."}, {"k": "read", "ref": "§26", "n": 26, "text": "Бодончар, идэх юмгүй тул чонын гууд хорьсон гөрөөсийг мярааж харван алж идэх буюу чонын идсэн сэгийг түүж гэдсээ хооллож, харцагаа тэжээсээр тэр он гарав."}, {"k": "read", "ref": "§27", "n": 27, "text": "Хавар болж, нугас ирэх цагт харцагаа сойж тавиад галуу, нугас олныг алж, идэж үл барах тул,\nМөчир бүрээс\nМөч гуя өлгөж\nХожуул бүрээс\nХоёр гурван\nшувуу олгосон нь ялзрахад хүрчээ."}, {"k": "read", "ref": "§28", "n": 28, "text": "Битүү модот уулынхяраас нэгэн бүлэг иргэн, Түнхэлэг горхин уруу нүүж ирэв. Бодончар, харцагаа тавин өдөр бүр тэр иргэнд очиж цэгээ гуйж уугаад, шөнө өвсөн эмбүүл гэртээ ирж хонох бүлгээ."}], [{"k": "read", "ref": "§29", "n": 29, "text": "Тэд иргэн Бодончарын харцагыг гуйвал эс өгөв. Тэд иргэн, Бодончарыг хэн юун хүн бэ гэж асуухгүй, Бодончар бас тэр иргэнийг юун иргэн гэж асуухгүй явна."}, {"k": "read", "ref": "§30", "n": 30, "text": "Гэтэл Буха хатаги ах нь Бодончар мунхаг дүүгээ энэ Одон мөрөн уруу одлоо гэж нэхэн ирж, Түнхэлэг горхинд нутаглах тэд иргэнд хүрээд тийм морьтой, тийм хүн үзэгдэв үү гэж сурвал,"}, {"k": "read", "ref": "§31", "n": 31, "text": "Тэд иргэн өгүүлрүүн: \"Өдөр бүр нэгэн хүн манд ирж эсэг (цэгээ) ууж одно. Тэр хүн ба түүний морь, чиний сурдагтай адил байна. Түүнд нэг харцага бий. Тэр, шөнө хаана хонодгийг мэдэхгүй. Баруун хойноос салхи салхилбал түүний харцагаар бариулсан нугас галууны өд сөд нь цас мэт бутарч хийсэж ирнэ. Бодвол түүний гэр холгүй биз. Одоо түүний ирэх цаг болов. Хоромхон хүлц\" гэв."}, {"k": "read", "ref": "§32", "n": 32, "text": "Удалгүй Түнхэлэг горхин өөд нэгэн хүн айсуй. Хүрч ирвэл Бодончар мөн. Буха хатаги ах нь таньж аваад Онон мөрөн өөд дагуулан давхив."}, {"k": "read", "ref": "§33", "n": 33, "text": "Бодончар, Буха хатаги ахын хойноос даган хатирч өгүүлрүүн: \"Ах аа, ах аа, бие тэргүүтэй, дээл захтай нь сайн\" гэвэл, ах нь тэр үгийг хайхарсангүй."}, {"k": "read", "ref": "§34", "n": 34, "text": "Бодончар мөн үгийг хоёрдугаар удаа өгүүлбэл, ах нь хариу хэлсэнгүй. Мөн үгийг гуравдугаар удаа хэлэхэд ах нь өгүүлрүүн: \"Чи энэ үгийг юунд дахин дахин өгүүлнэ?\"."}], [{"k": "read", "ref": "§35", "n": 35, "text": "Бодончар өгүүлрүүн: \"Тугаарын (саяын) Түнхэлэг горхиноо бүхий иргэнд эзэнгүй, их бага, сайн муу, толгой шийр цөм нэгэн адил чацуу байна. Ийм хялбар иргэн тул тэднийг бид эзэлж авъя\""}, {"k": "read", "ref": "§36", "n": 36, "text": "Ах нь өгүүлрүүн: \"За тийм бол гэртээ хүрч, ах дүү нартай зөвлөлдөж, тэд иргэнийг эзэлье\" гэж,"}, {"k": "read", "ref": "§37", "n": 37, "text": "Гэртээ хүрээд, ах дүү нартай хэлэлцэж мордов. Тэргүүлэн хянагчид мөн Бодончарыг явуулав."}, {"k": "read", "ref": "§38", "n": 38, "text": "Бодончар тэргүүлэн явж нэгэн жирэмсэн эмийг барьж \"Чи юун хүн бэ?\" гэж асуувал, тэр эм өгүүлрүүн: \"Би жарчиуд аданхан урианхайн хүн\"гэв."}, {"k": "read", "ref": "§39", "n": 39, "text": "Тэндээс ах дүү тавуулаа тэд иргэнийг довтолж, адуу малыг авч, хүн ардыг зарц болгов."}, {"k": "read", "ref": "§40", "n": 40, "text": "Тэр жирэмсэн эм Бодончарт ирж хөвүүн төрөв. Түүнийг харь овгийн хөвүүн гэж Жажирадай гэж нэрийдэв. Жадараны өвөг тэр болов. Тэр Жажирадайн хөвүүн Тугудай нэрт бүлгээ. Тугудайн хөвүүн Бури-булчиру, Бури-булчиругийн хөвүүн Хар-хадаан бүлгээ. Хар-хадааны хөвүүн Жамуха бүлгээ. Жадаран овогтон тэд болов. (Жада гэдэг нь харь буусад гэсэн үг болно)."}, {"k": "read", "ref": "§41", "n": 41, "text": "Тэр эм бас Бодончараас нэгэн хөвүүн төрүүлэв. Түүнийг барьж авсан эмийн хөвүүн хэмээн Баарьдай гэж нэрийдэв. Баарины өвөг тэр болов. Баарьдайн хөвүүн Зүтгэлбөх, Зүтгэлбөх олон эм авсан тул хөвүүн нь манан мэт (олон) төрөв. Манан баарин овогтон тэд болов."}, {"k": "read", "ref": "§42", "n": 42, "text": "Бэлгүнүтэй, бэлгүнүд овогтон болов. Бүгүнүтэй, бүгүнүд овогтон болов. Буха хатаги, хатагин овогтон болов. Бухату салжи, салжид овогтон болов. Бодончар, боржигин овогтон болов."}, {"k": "retell", "ref": "§43–51", "n": 43, "text": "§43. Бодончарын авааль эмээс төрсөн Барим ширату Хабич нэрт бүлгээ. Тэр Хабич баатрын эхийн инжид ирсэн эмийг Бодончар татвар эм болгон нэгэн хөвүүн төрсөнд Жаурьдай нэр өгөв. Бодончар амьд байх цагт Жаурьдайг зүхэл тайлгад орох эртэй болгов.\n\n§44. Бодончарыг үгүй болсны хойно тэр Жаурьдайг гэрт ямагт аданхан урианхайдай хүн байсан тул түүний хөвүүн гэж тайлгаас хөөжгаргав. Тэр Жэүрэдийн өвөг болов.\n\n§45. Хабич баатрын хөвүүн Мэнэн тудун бүлгээ. Мэнэн тудуны хөвүүн Хачи хүлүг, Хачин, Хачиу, Хачула, Харалдай, Хачиун, Начин баатар долоо бүлгээ.\n\n§46. Хачи хүлүгийн хөвүүн Хайду, Намулун эхээс төрсөн бүлгээ. Хачины хөвүүн Ноёгидай нэртэй бүлгээ. Ноён шиг авиртай тул ноёхон овогтон болов. Хачиугийн хөвүүн Баруладай нэрт бүлгээ. Их биетэй ба идээ барах ховдог тул Барулас овогтон болов. Хачулагийн хөвүүн бас идээ барах ховдог тул их барула, өчүүхэн барула гэдэг хоч нэртэй болж, улмаар эрдэмт барула, тодойн барула тэргүүтэн барулас овогтон болов. Харалдайн хөвүүн будаа мэт эх түрүүгүй хутгалдах тул будаад овогтон болов. Хачиуны хөвүүн Адархидай нэрт бүлгээ. Ах дүүгийн дунд адармаатай (яхир хэрүүлч) тул адархин овогтон болов. Начин баатрын хөвүүн Уруудай Мангудай хоёр бүлгээ. Урууд, мангуд овогтон болов. Начин баатрын авааль эмээс төрсөн хөвүүн Шижуудай Доголдай хоёр бүлгээ.\n\n§47. Хайдугийн хөвүүд Байшинхор догшин, Чирхай лянхуа, Чаужин ортагай гурав бүлгээ. Байшинхор догшны хөвүүн Тумбинай сэцэн бүлгээ. Чирхай лянхуагийн хөвүүн Сэнгүн билгэ, амбагайтан тайчууд овогтон болов. Чирхай лянхуа бэргэнээ эм болгон авч, нэгэн хөвүүн төржээ. Нэр нь Бэсүдэй гэнэ. Бэсүд овогтон болов. Чаужин Ортагай зургаан хөвүүнтэй нэр нь: Оронар, Хонхотан, Арулад, Сөнид, Хабтурхас, Гэнигэс гэдэг тул ийм овогтон болов.\n\n§48. Тумбинай сэцэний хөвүүн Хабул хаан Сэмсэчүлэ хоёр бүлгээ. Сэмсэчүлийн хөвүүн Бүлтэчү баатар бүлгээ. Хабул хаан, долоон хөвүүнтэй, тэдний нэр нь Охинбархаг, Бартан баатар, Хутугту Монхор, Хотала хаан, Хулан, Хадаан, Тодойн отчигин гэнэ.\n\n§49. Охинбархагийн хөвүүн Хутугту Жүрхи бүлгээ. Хутагту жүрхийн хөвүүн Сэчэ-бэхи Тайчу хоёр бүлгээ. Тэд жүрхи овогтон болов.\n\n§50. Бартан баатрын хөвүүд Мэнгитү хиан, Нэгүүн тайжи, Есүхэй баатар, Даридай отчигин энэ дөрөв бүлгээ. Хутугту Монхорын хөвүүн Бүри бөхө бүлгээ. Онон мөрний шугуйд хуримлах цагт [Чингисийн дүү] Бэлгүтэйн мөрийг тэр тас цавчсан билээ.\n\n§51. Хотала хааны хөвүүд Зочи, Хирмау, Алтан гурав бүлгээ. Хулан Баатрын хөвүүн Их Чэрэн бүлгээ. [Их Чэрэнгийн боол] Бадай Хишлиг хоёр [Чингисийн үед] Дархадын ноёд болов. Хадаан Тодойн хоёр үргүй өнгөрчээ."}]], "lines": {"Мя": "§23–28 · **Лх** §29–34 · **Пү** §35–42 (§43–51-ийн удам угсааг багш товч ярина)"}}, {"n": 4, "title": "Амбагай хаан, Өэлүн, Тэмүжиний төрөлт", "vocab": [["цээрлэл", "сургамж"], ["өшөө авах", ""], ["хуримлах", "найр хийх"], ["нөж", "бүлэгнэсэн цус"], ["үжин", "хатан"]], "qs": ["Амбагай хааныг хэн барьж, хэнд хүргэсэн бэ?", "Тэмүжин гэдэг нэрийг яагаад өгсөн бэ?", "Амбагай «охиноо өөрөө бүү хүргэ» гэж ямар сургамж үлдээсэн бэ?"], "fri": "Ургийн модонд Хабул хаанаас Тэмүжин хүртэл нэмж зурна.", "warn": ["§54–56: Тэр үед эхнэр булааж авдаг заншил байсан. Үүнийг өнөөгийн ёс суртахуунтай харьцуулж ярилцаарай."], "strat": "Таамаглах ба үг тодруулах — «Цааш юу болох бол?», «Энэ үгийн утгыг өгүүлбэрээс нь яаж таах вэ?»", "mode": "Багш чангаар уншина, хүүхдүүд хуруугаараа дагана.", "quiz": [{"q": "Амбагай хааныг хэн барьж, хэнд хүргэсэн бэ?", "opts": ["Мэргид барьж, Ван ханд хүргэсэн", "Татаар барьж, Хятадын Алтан хаанд хүргэсэн", "Тайчууд барьж, Жамухад хүргэсэн", "Найман барьж, Таян ханд хүргэсэн"], "ans": "Б"}, {"q": "Өэлүн үжин анх хэний эхнэр болох гэж явсан бэ?", "opts": ["Мэргидийн Их Чилэдүгийн", "Нэгүүн тайжийн", "Даридай отчигины", "Хотала хааны"], "ans": "А"}, {"q": "Тэмүжин төрөхдөө баруун гартаа юу атгасан байсан бэ?", "opts": ["Сум", "Мөнгөн шагай", "Шагайн чинээ нөж (бүлэгнэсэн цус)", "Цагаан чулуу"], "ans": "В"}, {"q": "Тэмүжин гэдэг нэрийг яагаад өгсөн бэ?", "opts": ["Өвөөгийнх нь нэр байсан учраас", "Есүхэй татаарын Тэмүжин-үгийг барьж ирэх үед төрсөн учраас", "Бөө ингэж нэрлэхийг заасан учраас", "Төмөр дархны гэрт төрсөн учраас"], "ans": "Б"}, {"q": "Амбагай хаан «Охиноо өөрөө бүү хүргэ» гэдэг сургамж үлдээжээ. Яагаад ийм сургамж үлдээсэн бэ?", "opts": [], "ans": "Тэр өөрөө охиноо хүргэж очоод татаарт баригдсан учраас."}], "days": [[{"k": "read", "ref": "§52", "n": 52, "text": "Хамаг Монголыг Хабул хаан захирч байв. Хабул хаан долоон хөвүүнээ байтал, Сэнгүн билгийн хөвүүн Амбагайг хамаг Монголын хаан болгохоор хэлсэн ажээ."}, {"k": "read", "ref": "§53", "n": 53, "text": "Буйр Хөлэн хоёр нуурыг холбож урсах Оршуун мөрөнд айргууд, буйргууд овгийн татаар аймаг нутаглана. Тэдэнд Амбагай хаан охиноо өгч, өөрөө охиныг хүргэж очоод татаарт баригдав. Татаар, Амбагай хааныг барьж, Хятадын Алтан хаанд хүргүүлэв. Бэсүд овгийн Балхачи гэдэг хүнийг элч болгож, Амбагай хааны хэлсэн нь: \"Хабул хааны долоон хөвүүний дундахь Хоталад, миний арван хөвүүний дундах Хадаан тайжид чи очиж хэл. Хамгийн хаан, улсын эзэн байтал охиноо өөрөө үдэж хүргэхийг надаар цээрлэл болгогтун! Би татаар аймагт баригдав. Таван хурууны хумсыг тамтартал, арван хуруугаа барагдтал миний өшөөг авахыг оролдогтун\" гэж илгээжээ."}, {"k": "read", "ref": "§54", "n": 54, "text": "Тэр цагт Есүхэй баатар, шувуу агнан явах зуур олхуноуд аймгаас эм аваад буцаж яваа мэргидийн их Чилэдү гэдэг хүнтэй уулзаж, түүний эмийг өнгийж үзвэл гоо үзэсгэлэнтэй хөтөн байна. Есүхэй баатар гэртээ давхиж ирээд ах Нэгүүн тайжи, дүү Даридай отчигин хоёрыг дагуулан мордож, их Чилэдүүг гүйцэж очвол,"}], [{"k": "read", "ref": "§55", "n": 55, "text": "Тэр айж хурдан ухаа морины гуяыг ташуурдаж, уулын бэлээр дутаав. Түүнийг гурвуулаа цувалдан хөөвөл тэр улам дутаасаар нэгэн хошууг тойрч эргэж тэргэндээ хүрч ирсэнд эм Өэлүн үжин (фүжин гэж хятадаар хатныг хэлнэ) өгүүлрүүн: \"Тэр гурван хүний учрыг мэдэв үү чи? Тэдний царай сэжиглэмээр байна. Чиний аминд хор хүргэж болно. Амьд мэнд үлдвэл эхнэрийг олоход бэрхгүй. Мухлаг тутам охид бий. Тэрэг тутам хатад бий. [Миний мэт өнгөт эхнэр олдоно А.то] Хэрэв намайг санавал дахин авсан гэргийг миний нэрээр нэрлэгтүн. Одоо амиа арчил. Миний үнэрийг үнэсэж яв\" гээд өмссөн цамцаа тайлж өгөв. Их Чилэдү, тэр цамцыг морин дээрээс тонгойж авмагц, харвал, нөгөө гурав мөн хошууг тойрч нэхэж айсуй. Чилэдү, хурдан ухаа морины гуяыг ташуурдаж яаран Онон мөрөн өөд дутаав."}, {"k": "read", "ref": "§56", "n": 56, "text": "Түүнийг гурвуулаа хойноос нь нэхэж, долоон даваа давтал хөөж орхиод, Өэлүн үжинийг авч, Есүхэй баатар жолоодон хөтөлж, ах Нэгүүн тайжи тэргүүлж, дүү Даридай отчигин хажууд дагаж [тэмээг гилж А.то] явна. Үүнд Өэлүн үжин өгүүлрүүн:\n\n\"Миний эр Чилэдү,\nСэрүүн салхинд\nСэвлэг үсээ хийсгэж\nХээр хөдөө\nГэдсээ өлсгөж яахин зовох болов?\nОдоо би хоёр сэвлэг үсээ хойш урагш унжуулж яахин одно?\"\n\nгээд Онон мөрнийг долгилтол, ой шугуйг ганхтал их дуугаар уйлахад Даридай отчигин хажуунаас өгүүлрүүн:\n\n\"Тэврэх хайрт эр чинь\nТэртээ давааг давав.\nУйлан санах эр чинь\nУс олныг гэтлэв.\nХайлж уйлавч\nХарж чамайг үзэхгүй,\nХайж эрэвч\nХаалга зам нь олдохгүй.\n[Гурван гол гэтэлгэв\nГурван гурви давуулав\nХайвал мөргүй\nХарвал бараагүй\nХайлбал үл сонстоно. Ч.Ц]\nДуугүй бай гэж ятгав.\n\nӨэлүн үжинийг Есүхэй баатар тэгээд гэртээ авчирч гэргий болгов. Өэлүн үжинийг Есүхэй баатрын авчирсан ёс ийм бүлгээ."}], [{"k": "read", "ref": "§57", "n": 57, "text": "Амбагай хаан баригдаад Хадаан Хотала хоёрыг нэр заасан тул хамаг монгол, тайчууд нар Онон мөрний Хорхунагийн хөндий гэдэг газар цугларч хэлэлцээд, Хоталыг хаан болгов. Монголын жаргалан нь бүжиг, хурим бүлгээ. Хоталыг хаан өргөмжлөөд Хорхунагийн саглагар модны дор хавирга газрыг халцартал, өвдөг газрыг өлтөртөл дэвхцэн бүжиглэж хуримлав."}, {"k": "read", "ref": "§58", "n": 58, "text": "Хотала, хаан болоод Хадаан тайжитай хоёулаа татаар иргэнээс өшөө авахаар мордов. Татаарын Хотан бараг, Жали буха хоёртай арван гурван удаа байлдавч, Амбагай хааны өшөөг сайтар авч эс чадав."}, {"k": "read", "ref": "§59", "n": 59, "text": "Тэр цагт Есүхэй баатар, татаарын Тэмүжин-үгэ, Хори-буха зэргийн татаар хүнийг барьж ирэхэд жирэмсэн байсан Өэлүн үжин, Ононы Дэлүүн болдог гэдэг газар Чингис хааныг төрүүлжээ. Чингис төрөхдөө баруун гарт шагайн чинээ нөж атган төржээ. Татаарын Тэмүжин-үгээг барьж ирэх цагт тохиолдож төрөв гэж Тэмүжин нэрийг өгчээ."}, {"k": "read", "ref": "§60", "n": 60, "text": "Есүхэй баатрын Өэлүн үжинээс Тэмүжин, Хасар, Хачиун, Тэмүгэ дөрвөн хөвүүн төрөв. Бас Тэмүлүн нэртэй нэгэн охин төрөв. [Есүхэй баатрын нөгөө гэргий Сочигэл эхээс төрсөн Бэгтэр Бэлгүтэй хоёр бүлгээ. А.то] Тэмүжинийг есөн настай байхад Зочи-Хасар долоон настай, Хачиун алчи таван настай, Тэмүгэ отчигин (отгон нь галын хаан, голомтын эзэн гэсэн үг болно) гурван настай, Тэмүлүн өлгийтэй байсан бүлгээ."}]], "lines": {"Мя": "§52–54 · **Лх** §55–56 · **Пү** §57–60"}}, {"n": 5, "title": "Сүй тавьсан нь ба Есүхэйн үхэл", "vocab": [["худ", ""], ["нагац", ""], ["сэцэн", "мэргэн ухаантай"], ["хүргэн", ""], ["тайлга", "өвөг дээдсээ тахих ёслол"], ["хождох", "хоцрох"]], "qs": ["Дэй сэцэн ямар зүүд зүүдэлсэн бэ?", "Есүхэй татаарын хуримд яагаад буусан, тэнд юу болсон бэ?", "Өэлүнийг тайлгын идээнээс хоцроосон нь юуны дохио байсан бэ?"], "fri": "Тэмүжиний амьдралын он цагийн хэлхээсийг эхлүүлнэ (төрсөн → сүй тавьсан → эцгээ алдсан).", "warn": [], "strat": "Таамаглах ба үг тодруулах — «Цааш юу болох бол?», «Энэ үгийн утгыг өгүүлбэрээс нь яаж таах вэ?»", "mode": "Багш чангаар уншина, хүүхдүүд хуруугаараа дагана.", "quiz": [{"q": "Есүхэй Тэмүжинийг хаашаа, юуны тулд дагуулж явсан бэ?", "opts": ["Ван ханд, анд барилдахаар", "Олхуноуд иргэнд, нагац нараас нь охин гуйхаар", "Бурхан халдунд, тахилга өргөхөөр", "Татаарт, өшөө авахаар"], "ans": "Б"}, {"q": "Дэй сэцэн ямар зүүд зүүдэлсэн бэ?", "opts": ["Цагаан шонхор нар, сар хоёрыг атгаж нисэж ирээд гар дээр нь буусан", "Хар чоно гэрт нь орж ирсэн", "Таван сум хугарсан", "Бурхан халдун уул гэрэлтсэн"], "ans": "А"}, {"q": "Есүхэй хүүгээ Дэй сэцэнийд үлдээхдээ юу гэж захисан бэ?", "opts": ["Хүүг минь сайн хооллоорой", "Хүү минь нохойноос цочимтгой, нохойноос бүү цочуул", "Хүүг минь харваж сургаарай", "Би удахгүй ирж авна"], "ans": "Б"}, {"q": "Есүхэй яагаад нас барсан бэ?", "opts": ["Тулалдаанд шархадсан", "Татаарууд түүнийг таньж, хоолонд нь хор хольсон", "Мориноос унасан", "Хүйтэнд даарч өвчилсөн"], "ans": "Б"}, {"q": "Тайлгын идээнээс Өэлүнийг хоцроож, «Урьж чамд өгөх ёсгүй» гэж хэлсэн нь юуг харуулж байна вэ?", "opts": [], "ans": "Есүхэй нас барсны дараа тайчууд тэдний гэр бүлийг үл тоож, хаях болсон. «Хүндлэхээ больсон», «тусгаарлах гэсэн» гэсэн утгатай хариулт зөв."}], "days": [[{"k": "read", "ref": "§61", "n": 61, "text": "Есүхэй баатар, Тэмүжинийг есөн настай байхад Өэлүн эхийн төрхөм олхуноуд иргэнд хөвүүний нагац нараас охин гуйяа гэж Тэмүжинийг аваад одов. Явах замд Цэгцэр Чихургу гэдэг газрын хооронд Хонгирадын Дэй сэцэнтэй уулзав."}, {"k": "read", "ref": "§62", "n": 62, "text": "Дэй сэцэн өгүүлрүүн: \"Есүхэй худ аль хүрэхээр явна?\" Есүхэй баатар өгүүлрүүн: \"Миний хөвүүний нагац олхуноуд иргэнээс охин гуйхаар явж байна\". Дэй сэцэн өгүүлрүүн: \"Энэ хөвүүн чинь нүдэндээ галтай, нүүрэндээ гэрэлтэй хөвүүн байна."}, {"k": "read", "ref": "§63", "n": 63, "text": "Есүхэй худ, би энэ шөнө, нэгэн зүүд зүүдлэв. Цагаан шонхор шувуу, нар сар хоёрыг атган нисэж ирээд миний гар дээр буув\" гэж зүүдлэв. Нар сарыг бид нүдээр үздэг билээ. Гэтэл, нар сарыг шонхор шувуу атгаж миний гар дээр буух нь гайхалтай, ямар сайн тохиол учрах болов гэж би бусдад хэлсэн бүлгээ. Есүхэй худ чи, хөвүүн дагуулж ирсэн нь даруй миний зүүдний тайлбар болов. Юун зүүд байх вэ! Танай хиад аймгийн сүлд ирж, зүүдээр дохиолсон ажээ."}, {"k": "read", "ref": "§64", "n": 64, "text": "Манай хонгирад хэдийнээс бусдын нутаг ба хүнийг булаан тэмцэлддэггүй.\n\nХарь улсыг үл довтлон\nХацар сайт охидоо\nХасаг тэргэнд суулгаж\nХар буур хөллөж\nХатируулж одож\nХаан болсон та нарын\nХатан сууринд дэвшүүлж\nХамт суулгана.\nӨөр иргэнийг үл тэмцэн\nӨнгө сайт охидоо\nӨлжгэтэй (суудалтай) тэргэнд суулгаж\nӨл буур хөллөж\nҮүсгэж одож\nӨндөр суурь эзлэгчдийн\nӨрөөл хань болгоно.\nМанай хонгирад хэдийнээс хацар гоо хатадтай, өнгө сайн охидтой тул зээгийн зүсээр, охидын өнгөөр явна."}, {"k": "read", "ref": "§65", "n": 65, "text": "Нуган хүүхэд нутгаа эзэмшинэ. Охин хүүхэд өнгө шилэгдэнэ. Есүхэй худ, миний гэрт оч. Надад өчүүхэн охин бий. Тэ үз\" гэж, Дэй сэцэн хэлээд Есүхэйг гэртээ дагуулж аваачив."}], [{"k": "read", "ref": "§66", "n": 66, "text": "Есүхэй худ, охиныг үзвэл нүүртээ гэрэлтэй, нүдэндээ галтай охин тул санаанд нийлэв. Түүний нэр Бөртэ гэнэ. Тэмүжинээс нэгэн нас ах, аравтай ажээ. Дэй сэцэний гэрт хоноод маргааш нь охиныг гуйвал, Дэй сэцэн өгүүлрүүн: \"Олон удаа гуйлгаж өгвөл эрхэмлэгдэх, цөөн удаа гуйлгаж өгвөл доромжлогдох гэдэг боловч, охин хүний заяа, төрсөн үүдэнд өтлөхгүй тул охиноо өгье. Чи хөвүүнээ хүргэн болгож манай гэрт үлдээ\" гэвэл, Есүхэй баатар өгүүлрүүн: \"Би хөвүүнээ орхиё. Миний хөвүүн нохойноос цочимтгой билээ. Эрхэм худ чи, миний хөвүүнийг нохойноос бүү цочуул!\" гээд хөтөлж явсан мориор бэлэг өгч, Тэмүжинийг орхиод Есүхэй баатар буцав."}, {"k": "read", "ref": "§67", "n": 67, "text": "Есүхэй баатар, Цэгцэрийн шар талд явж байтал, татаар иргэн хуримлаж байхтай тохиолдоод ам цангах тул хуримд буув. Татаар нар Есүхэйг таньж, \"Эрхэм Есүхэй ирэв\" гэж хуримд суулгаад, урьдын булаагдсан өшөөг санаж, нууцаар хэлэлцэн, хоолонд хор хольж өгчээ. Есүхэй тэндээс мордож явах замд бие муужирч, гурван хоног арай гэж яваад гэрт хүрч,"}, {"k": "read", "ref": "§68", "n": 68, "text": "Есүхэй өгүүлрүүн: \"Миний дотор муу байна. Дэргэд минь хэн байна?\" гэж асуувал, хонхотаны Чирха өвгөний хөвүүн Мэнлиг (Мэнлиг буюу Мунлиг) ойр байна гэвэл, түүнийг дуудаж өгүүлрүүн: \"Хүү минь Мэнлиг чи сонс. Хөвүүн минь балчир билээ. Тэмүжин хөвүүнийг урагт орхиод ирэх замын зуур татаарт хорлогдов. Дотор минь муу байна. Өнчин хоцорсон дүү нараа, бэлбэсэн бэргэнээ асрахыг чи мэд. Тэмүжин хөвүүнийг даруй явж авчир! Хайрт Мэнлиг минь!\" гээд наснаас нөгчив."}], [{"k": "read", "ref": "§69", "n": 69, "text": "Мэнлиг, Есүхэй баатрын үгийг дагаж, Дэй сэцэнд очоод өгүүлрүүн: \"Есүхэй ах, Тэмүжинийг маш их мөрөөдөж өрөвдөх тул Тэмүжинийг авахаар ирэв\" гэвэл, Дэй сэцэн өгүүлрүүн: \"Худ хөвүүнээ мөрөөдөх бөгөөс явуулъя. Харин удалгүй гэдрэг ирүүлэх хэрэгтэй\" гэв. Энэ үгийг сонсож Мэнлиг эцэг, Тэмүжинийг авч ирэв. [Есүхэй баатар тэнгэр болсонд Тэмүжин, газарт уруу унан хэвтэж маш гаслахад хонхотаны Чирха, түүнийг сэргээн ятгаж өгүүлсэн нь:\n\n\"Тул загас мэт юунд\nТулбарин гасална чи?\nТуурга цэрэг (торгон цэрэг)-ээ бэхэлье гэж\nТуйлтай үгээ хэлэлцсэн биш билүү?\nУсны загас мэт юунд\nУяран гасална, чи?\nУлс төрөө байгуулъя гэж\nУчиртай үгээ хэлэлцсэн биш билүү?\"\nгэж өгүүлбэл уйлахаа зогссон ажээ. А.то]", "chap": "Чингисийн идэр нас"}, {"k": "read", "ref": "§70", "n": 70, "text": "Тэр хавар Амбагай хааны хатан Орбай Сохатай хоёр ихсийн газар (өвгөдийн хүүр оршуулах газар) тайлгын идээ өргөхөд Өэлүн үжин хождож очсон тул тайлгын идээний хуваариас хоцрогдов. Орбай Сохатай хоёрт Өэлүн үжин өгүүлрүүн: \"Есүхэй баатрыг үхэв гэж, хөвүүнийг минь балчир гэж, ихсийн тайлгын хишгийн архи сархдаас яахин хождуулав, та? Нүд үзсээр үл өгөх, нүүхдээ үл хэлэх болов, та\" гэжээ."}, {"k": "read", "ref": "§71", "n": 71, "text": "Тэр үгэнд Орбай Сохатай хоёр хатан хариу өгүүлрүүн:\n\n\"Урьж чамд өгөх ёсгүй\nУчирвал чи идэх ёстой!\nХүргэж, чамд өгөх ёсгүй\nХүртвэл чи идэх ёстой!\n\nАмбагай хаан үхээд, Өэлүнд ийнхүү хэлэгдэх болов."}]], "lines": {"Мя": "§61–65 · **Лх** §66–68 · **Пү** §69–71"}}, {"n": 6, "title": "Хаягдсан гэр бүл ба Бэгтэр", "vocab": [["аргацаах", ""], ["мангир, сөдөн, хичгэнэ", "идэж болдог ургамал"], ["гөхий", "загас барих дэгээ"], ["голомт", "гал, гэр бүлийн үндэс"], ["сүүдрээс өөр нөхөргүй", ""]], "qs": ["Өэлүн эх хүүхдүүдээ юугаар тэжээсэн бэ?", "Өэлүн эх Тэмүжин, Хасар хоёрыг яагаад ингэтэл хатуу зэмлэсэн бэ?", "Ах дүүсийн маргааныг өөр ямар аргаар шийдэж болох байсан бэ?"], "fri": "«Өэлүн эх» дүрийн карт хийнэ: зан чанар, үйлдэл, ишлэл.", "warn": ["§77: Бэгтэрийг алсан хэсэг. Хүчирхийллийг зөвтгөхгүй байх. Эхийн зэмлэл, Бэгтэрийн сүүлчийн хүсэлт дээр анхаарлаа хандуулаарай."], "strat": "Таамаглах ба үг тодруулах — «Цааш юу болох бол?», «Энэ үгийн утгыг өгүүлбэрээс нь яаж таах вэ?»", "mode": "Багш чангаар уншина, хүүхдүүд хуруугаараа дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§72", "n": 72, "text": "Аргацаан эдний эх, хөвүүдийг нутагт орхиж нүүе. Бүү авч явъя\" гэв. Түүний маргааш тайчуудын Таргудай-Хирилтуг, Тодойн-Гиртэ нар Онон мөрөн уруу хөдлөв. Өэлүн үжин, хөвүүдийн хамт орхигдоход хонхотаны Чирха өвгөн нүүж одогсдыг очиж ятгавал Тодойн Гиртэ, \"Цээлийн ус ширгэв Цэгээн чулуу хагарав\"\n\nгээд Чирха өвгөний үгийг хайхрахгүй, цааш нүүж \"Чи ингэж ятгах буюу\" гэж тэр өвгөний зоо нурууг жадлан хөөв."}, {"k": "read", "ref": "§73", "n": 73, "text": "Чирха өвгөн шархтай болж гэртээ ирээд зовуурилан хэвтэхэд Тэмүжин үзэхээр одов. Хонхотаны Чирха өвгөн, Тэмүжинд өгүүлрүүн: \"Сайн эцгийн чинь хураасан улс тарж нүүхэд ятгахаар яваад ийнхүү жадлагдав\" гэвэл Тэмүжин уйлж гарав.\nӨэлүн үжин өөрийн биеэр туг барьж мордоод, орхиж нүүсэн иргэдийн заримыг буцааж авчрав. Гэвч, буцаж ирсэн иргэд бас тогтсонгүй, тайчуудын хойноос нүүжээ."}, {"k": "read", "ref": "§74", "n": 74, "text": "Ийнхүү тайчууд ах дүү нар бэлбэсэн Өэлүн үжинийг бяцхан хөвүүдийн хамт нутагт гээж нүүсэн ажээ.\n\nОюунтай төрсөн Өэлүн эх\nОёдолт дээлийг огшуулан өмсөж\nОготор хормойг шуун бүсэлж\nОнон мөрнийг өгсөж уруудаж\nОлирс мойлыг түүж явж\nӨчүүхэн хөвүүдээ хайрлан тэжээж\nӨдөр шөнийг аргацаан өнгөрүүлэв.\nЧадалтай төрсөн үжин эх\nЦарсан шорыг барин явж\nЦавчим газрыг өгсөж уруудаж\nСөдөн хичгэний үндсийг малтаж\nШөнө өдрийг хатамжин өнгөрүүлж\nСуут хөвүүдээ тэжээн өсгөв.\n[Хатан төрсөн үжин эх\nХайлаасан шор барин явж\nХалдун уулыг өгсөн уруудаж\nХавийн мангирыг малтан түүж\nХаад хөвүүдээ хайрлан тэжээж\nХанатал цадтал идүүлж өсгөв. А.то]"}], [{"k": "read", "ref": "§75", "n": 75, "text": "Гоо төрсөн Өэлүн эх Гох\nдэгээ барин явж Гол завыг\nөгсөж уруудаж Гогод мангирыг\nтүүн явж Хутагтан хөвүүдээ\nтэжээж өсгөв. Зарчимтай төрсөн\nүжин эхийн Затгас төмсөөр\nтэжээсэн хөвүүд Засагтан сайд\nболж өсөв.\n\nГоо төрсөн үжин эхийн\nГогод мангираар тэжээсэн\nхөвүүд Хутагтан сайд болж өсөв\nЭх үжиний тэжээсэн хөвүүд Эрс\nсайд болон өсөж Эрх омог\nтөгөлдөр болж Эх Ононы эрэгт\nсууж Өлгүүр гох усанд хаяж\nЭрэмдэг загасыг шүүн барьж Эх\nүжинийг тэжээх болов Зарчимт\nүжиний тэжээсэн хөвүүд Засагт\nэрс болон өсөж Замагтай усыг\nшүүрдэн байж Загас жараахайг\nгөхидөн барьж Заяат эхээ тэжээх\nболов."}, {"k": "read", "ref": "§76", "n": 76, "text": "Нэгэн өдөр Тэмүжин, Хасар, Бэгтэр, Бэлгүтэй дөрвүүл хамт сууж, загас гөхидөхөд нэг гэгээн согос загас гөхид торжээ. Тэмүжин Хасар хоёроос Бэгтэр Бэлгүтэй хоёр тэр загасыг булааж авав. Тэмүжин Хасар хоёр гэрт ирж үжин эхэд өгүүлрүүн: \"Нэгэн цайвар загас гөхид орсныг Бэгтэр Бэлгүтэй ах дүү хоёулаа булааж авав\" гэвэл, үжин эх өгүүлрүүн: \"Та нар нэг эцгийн хөвүүд байтал юунд тэгж маргалдана? Одоо сүүдрээс өөр нөхөргүй, сүүлнээс өөр ташуургүй байгаагаа мэдэх биз. Ийм бол бид тайчууд нараас яаж өшөөгөө авч чадна. Урьдын Алун эхийн таван хөвүүд мэт яагаад эв эегүй болов? Та нар битгий тэг\" гэв."}], [{"k": "read", "ref": "§77", "n": 77, "text": "Тэндээс Тэмүжин Хасар хоёр үл ойшоон өгүүлрүүн: \"Өчигдөр нэг болжмор харваж алсныг тэд булааж авсан билээ. Энэ өдөр бас дахин булаав. Ийм бол эдэнтэй хамт яаж амьдарна\" гээд гэрийн үүдийг ширүүн хаяж гарч одов. Бэгтэр, довцог дээр есөн шарга морио хариулж суутал Тэмүжин хойноос, Хасар өмнөөс нууцаар сумаа онилж хүрэхэд Бэгтэр үзээд өгүүлрүүн: \"Тайчууд ах дүү нарын хөнөөлийг хүлээгээд, өшөөгөө дуусган авч чадаагүй байтал, та нар намайг яаж нүдний сормуус, амны бөөлжис болгоно? Одоо сүүдрээс өөр нөхөргүй, сүүлнээс өөр\nташуургүй байтал юунд ингэж байна, та? Голомтыг минь бүү бүрэлгэгтүн. Бэлгүтэйг бүү хөнөөгтүн\" гээд завилан сууж хүлцэв. Тэмүжин Хасар хоёр хойно урдаас харван алж одов."}, {"k": "read", "ref": "§78", "n": 78, "text": "Тэмүжин Хасар хоёр гэрт ирж ороход үжин эх хоёр хөвүүнийхээ царайг хармагц, даруй учрыг мэдэж өгүүлрүүн:\n\n\"Хариа барагсад\nИжлээ идэгсэд\nХалуун хэвлээс гарахдаа\nХар нөж атган төрсөн билээ\nХавиргаа хазах\nХар нохой мэт,\nХаданд довтлох\nХарцага шонхор мэт,\nУураа даран ядах\nОмогт арслан мэт,\nАмьдыг залгих\nАюулт мангас мэт,\nСүүдрээ довтлох\nСүрхий араатан мэт,\nЦугийг залгих\nЦурхай загас мэт,\nБотго тормын\nБормийг хазах\nӨл буур мэт,\nБороот өдөр\nДовтлон халдах\nӨлөн чоно мэт,\nНялх үрээ\nГилэн (хөөн) ядаж\nНядлан идэх\nНүгэлт ангир мэт\n, Хэвтшийг хөдөлгөвөл\nГэдрэг довтлох Хэрцгий\nцөөвөр (чоно) мэт, Барьж\nидэх Барс араатан мэт,\nБалмад амьтад буюу\n\nСүүдрээс өөр нөхөргүй\nСүүлнээс өөр ташуургүй байхад\n\nтайчууд нарын хөнөөлийг хүлээж, өшөөгөө хэн яаж авах вэ? гэж байхад, та нар юунд ийм хэрэг хийв?\" гэж эртний үгийг иш татаж, өвгөдийн үгийг үндэс болгож хөвүүдээ ихэд буруушаан зэмлэв."}]], "lines": {"Мя": "§72–74 · **Лх** §75–76 · **Пү** §77–78"}}, {"n": 7, "title": "Тайчуудын олзонд ба Сорхон-шар", "vocab": [["дөнгө", "хүзүүнд углах модон хорио"], ["хэсүүлэх", "айлаар ээлжлэн хонуулах"], ["хариг", "урсгалын хажуугийн тогтмол ус"], ["унгас", "ноос"], ["бүлүүр", "айраг бүлэх мод"]], "qs": ["Тэмүжин хэрхэн оргосон бэ?", "Сорхон-шарын хөвүүд аавдаа юу гэж хэлж, Тэмүжинийг хамгаалсан бэ?", "Айсаар байж бусдад туслах нь зоригтой үйлдэл мөн үү?"], "fri": "Үйл явдлын дарааллыг 6 зургаар зурж, хольж өгөөд зөв дараалуулна.", "warn": [], "strat": "Таамаглах ба үг тодруулах — «Цааш юу болох бол?», «Энэ үгийн утгыг өгүүлбэрээс нь яаж таах вэ?»", "mode": "Багш чангаар уншина, хүүхдүүд хуруугаараа дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§79", "n": 79, "text": "Тэгж байтал, тайчуудын Таргудай Хирилтуг, шадар нөхдөө дагуулж, \"Хурганы үс гуужив, төлөгний бие төлжив\" (Өэлүний хөвүүд тэнхрэв) гэж довтлохоор ирэв.\nТэднээс айж Өэлүн үжин хөвүүдийн хамт ой шугуйд дутаав. Бэлгүтэй мод хугалж шивээ барив. Хасар харван байлдаж, Хачиун, Тэмүгэ, Тэмүлүн гурвыг уулын завд нууж байхад тайчууд бархиран өгүүлрүүн: \"Тэмүжин ахаа гаргаж өг. Бусад чинь хэрэггүй\" гэхийг сонсоод Тэмүжинийг сэм оргуулан ойд дутаалгав. Үүнийг тайчууд мэдээд нэхэн хөөхөд Тэмүжин, Тэргүүн өндрийн шугуйд шургаж орвол тайчууд нэвтрэн орж чадсангүй хүрээлэн сахив."}, {"k": "read", "ref": "§80", "n": 80, "text": "Тэмүжин, шугуй дотор гурав хонож одоо харъя гэж морио хөтөлж явахад мориноос эмээл нь мултран унав. Эргэж үзвэл эмээлийн олом хөмөлдрөг хэвээр байтал мултарсан ажээ. \"Олом мултарч болох гэвч, хөмөлдрөг яахин мултарна. Тэнгэр ятгаж байгаа болов уу?\" гэж бас гурав хоног хүлээв. Дахин гарахаар явахад шугуйгаас гарах замыг гэрийн чинээ цагаан чулуу бөглөн хэвтэж байна. \"Тэнгэр ятгаж байгаа болов уу?\" гэж буцаж бас гурав хонов. Бүгд ес хоног хоолгүй байж \"Энэ мэт нэргүй үхэхээр гаръя\" гээд зам бөглөн унасан гэрийн чинээ цагаан чулууг тойрон гарахад саад болох модыг сумч (сум хийдэг) хутгаараа огтлоод морио хөтөлж гармагц тайчууд угтан барьж авав."}, {"k": "read", "ref": "§81", "n": 81, "text": "Тэмүжинийг Таргудай-Хирилтуг барьж, улсдаа аваачаад засаглан шийтгэж айл бүрд нэжээд хонуулж хэсүүлэн явна. Зуны тэргүүн сарын арван зургааны улаан тэргэл өдөр тайчууд Ононы эрэг дээр хуримлаж, нар шингэхэд тарав. Тэр хуримын үед Тэмүжинийг нэгэн хялбар дорой хөвүүн авчран сахиулж билээ. Хуримын ардыг тармагц, тэр хялбар хөвүүний толгойг бугуй (дөнгө)-гаар нэгэн удаа дэлдээд (цохиод) гүйж Ононы шугуй дотор хэвтвэл үзэгдэх болов уу гэж усны хариг (урсгалын хажуу дахь тогтмол ус)-т ороод гэдрэг хэвтэж дөнгөө ус уруу урсган нүүрээ ил гаргаж хэвтэв."}], [{"k": "read", "ref": "§82", "n": 82, "text": "\"Баригдсан хүнийг алдав\" гэж түүнийг сахиж байсан хүн их дуугаар хашхирахад тарсан тайчууд цуглан ирж, өдөр мэт саруул шөнө Ононы шугуйг нэгжин бэдрэв. Усны харигт хэвтэж байгаа Тэмүжинтэй сүлдүсний Сорхон-шар яг тохиолдон үзэж өгүүлрүүн: [усанд чилмий (ором)-гүй, огторгуйд мөргүй тул чиний ингэж хэвтэх зөв байна. А.то] \"Чи ийм аргатай бөгөөд нүдэндээ галтай, нүүртээ гэрэлтэй хүн тул тайчууд ийнхүү атаархах ажээ. Чи ингээд хэвтэж бай. Би чамайг зааж өгөхгүй\" гээд өнгөрөн одов. Цааш хэрхэн эрэхийг тайчууд нар зөвлөхөд, Сорхон-шар өгүүлрүүн: \"Хүн бүр явсан мөрөөр гэдрэг явж, орчны газрыг дахин шалгаж үзье\" гэвэл цөм \"За\" гэж зөвшөөрч, хүн бүр явсан мөрөөрөө явж эрэв. Бас Сорхон-шар, Тэмүжинийг дайрч \"Ах дүү тайчүүд нар, ам шүдээ билүүдэж айсуй явна. Чи хатуужин хэвтэж бай\" гээд өнгөрч одов."}, {"k": "read", "ref": "§83", "n": 83, "text": "Тайчууд нар эрж олсонгүй тул дахин явж эрэхийг зөвлөлдөхөд Сорхон-шар өгүүлрүүн: \"Тайчууд, [ноёд А.то] хөвүүд бид, гэгээн цагаан өдөр бүхэл хүнийг алдаад, одоо харанхуй шөнө хэрхэн олох билээ. Хүн бүр явсан мөрөөрөө дахин нэгэн удаа эрж тараад маргааш цуглаж эрье. Тэр дөнгөтэй хүн хаана холдох вэ\" гэвэл бүгдээр \"За\" гэлдэж буцаж эрэхээр явав.\nСорхон-шар бас Тэмүжинд ирээд өгүүлрүүн: \"Одоо нэгэн удаа эрж тараад маргааш эрэхээр болов. Биднийг тармагц эх ба дүү нарын зүг яв. Хэрэв хүн тохиолдвол намайг үзэв гэж бүү хэл\" гээд явчив."}], [{"k": "read", "ref": "§84", "n": 84, "text": "Тэднийг тармагц, тэмүжин дотроо сэтгэрүүн: \"Саяын хэдэн өдөр айл хэсэж хоноход Сорхон-шарын гэрт хоновол түүний хөвүүн Чимбай Чулуун хоёр намайг өрөвдөн хайрлаж, шөнө гинж дөнгий минь суллаж хонуулах бүлгээ. Одоо бас Сорхон-шар намайг үзэж зааж өгсөнгүй өнгөрөв. Тэд намайг аврах биз\" гэж Сорхон-шарын гэрийг зүглэн Онон мөрөн уруу явав."}, {"k": "read", "ref": "§85", "n": 85, "text": "Сорхон-шарын гэрийн тэмдэг нь шөнө турш үүр цайтал сүү самарч эсэг (айраг)-ээ бүлэх бүлгээ. Тэр тэмдгийг баримталж, бүлүүрийн чимээг чиглэж очоод гэрт нь орвол Сорхон-шар өгүүлрүүн: \"Чамайг эх ба дүү нарын зүг яв гэж эс хэллүү, би. Чи юунд ирэв?\" гэв. Түүний хөвүүн Чимбай Чулуун хоёр өгүүлрүүн: \"Болжмор шувуу, харцагаас дутааж бутын ёроолд хоргодвол бут түүнийг хамгаалж аварна. Одоо бидэнд хүн хоргодож ирэхэд тэгж хэлж яаж болно\" гэж эцгээ буруушааж, дөнгийг эвдэж галд түлээд, Тэмүжинийг хойд унгаст хар (мухлаг) тэргэнд өгүүлж, \"Амьтан хүнд бүү хэл\" гэж Хадаан нэртэй охин дүүгээр асруулав."}, {"k": "read", "ref": "§86", "n": 86, "text": "Гуравдугаар өдөр [Дөнгөт хүн хаана холдох билээ? А.то] \"Түүнийг манайхан нуусан биз. Өөр зуураа айлуудыг нэгжье\" гэж айл бүрийг нэгжсээр Сорхон-шарынд ирж, гэр тэрэг ба исэр (ор)-ийн дор хүртэл нэгжээд хойд унгаст тэргэнд очиж амсар дахь унгасыг таталж, Тэмүжиний хөлд хүрвэл, Сорхон-шар өгүүлрүүн: \"Ийм халуун цагт унгасан дотор амьд хүн яаж байна? [Сэтгэлээ хантал эр. А.то] \" гэвэл нэгжүүлийн хүмүүс бууж одов."}, {"k": "read", "ref": "§87", "n": 87, "text": "Тэр нэгжүүлийг одсон хойно Тэмүжинд Сорхон-шар өгүүлрүүн: \"Намайг үнсээр хийсгэн алдав, чи. Одоо даруй эх ба дүү нарын зүг яв\" гэж, ам цагаан эрмэг хулагч гүүг унуулж, тэлээ (хоёр эхийг хөхдөг тарган) хургыг чанаж, хөхүүр (ундны тулам) ба нэг нум, хоёр сум өгч, эмээл ба хэтгүйгээр явуулав."}]], "lines": {"Мя": "§79–81 · **Лх** §82–83 · **Пү** §84–87"}}, {"n": 8, "title": "Боорчи", "vocab": [["агт", "морь"], ["шарга", "морины зүс"], ["мунгинах", "бэрхшээлд орох"], ["нөхөр", "найз"], ["хээр боож тавих", ""]], "qs": ["Найман шарга морийг хэн, хэрхэн буцааж авсан бэ?", "Боорчи яагаад олзноос юу ч авахаас татгалзсан бэ?", "Жинхэнэ найз ямар байдаг вэ? Боорчигоос жишээ гарга."], "fri": "«Боорчи» дүрийн карт хийнэ.", "warn": [], "strat": "Таамаглах ба үг тодруулах — «Цааш юу болох бол?», «Энэ үгийн утгыг өгүүлбэрээс нь яаж таах вэ?»", "mode": "Багш чангаар уншина, хүүхдүүд хуруугаараа дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§88", "n": 88, "text": "Тэмүжин тэндээс явж урьдын шивээлсэн газарт ирээд өвсний налархай (зурвас)-гаар мөшгөн Онон мөрөн өөд явж, өрнөөс урсах Химурга горхинд хүрэв. Химурга горхины өөд өгсөж, Бэдэр хошууны Хорчухуй болдог гэдэг газар хүрч эх, дүү нартай учрав."}, {"k": "read", "ref": "§89", "n": 89, "text": "Тэнд бүгдээр нийлэлдэж, Бурхан халдуны өвөр Хүрэлх дотор урсах Сэнгүр горхины (Цэнхэрийн голын) Хар зүрхний Хөх нуур гэдэг газар очиж нутаглаад тарвага, зурам алж идэн амьдрав."}, {"k": "read", "ref": "§90", "n": 90, "text": "Нэгэн өдөр гэрийн дэргэд байгаа найман шарга агтыг дээрэм ирж нүд үзтэл дээрэмдэж одоход Тэмүжин нар явган тул харсаар хоцров. Бэлгүтэй оготор хонгор морийг унаж, тарвага агнахаар явсан билээ. Үдэш нар шингэсний хойно оготор хонгор мориндоо тарвагануудыг дааж ядтал ачиж явган хөтөлж ирэв. \"Шарга агтуудыг дээрэм авч одов\" гэвэл, Бэлгүтэй, \"Би нэхье\" гэв. Хасар өгүүлрүүн: \"Чи чадахгүй, би нэхье\" гэв.\nТэмүжин өгүүлрүүн: \"Та нар чадахгүй, би нэхье\" гэж оготор хонгорыг унаад шарга агтыг өвсний налархайгаар мөшгөн хөөж гурав хоног яваад нэгэн өглөө олон адуунд хүрвэл нэг гавшгай хөвүүн гүү сааж байна. Түүнтэй уулзаж, шарга агтаа сураглавал, тэр хөвүүн өгүүлрүүн: \"Энэ өглөө нар ургахын урьд найман шарга морийг үүгээр хөөж гарав. Мөрийг би зааж өгье\" гээд оготор хонгорыг тавиулж орог шинхул морийг Тэмүжинд унуулав. Өөрөө хурдан ухаа морийг унаж, гэртээ харилгүй намбух (хөхүүр) суулгаа хээр боож тавив. Тэгээд өгүүлрүүн: \"Нөхөр чи их мунгинаж яваа ажээ. Эрийн мун (бэрхшээл) нэгэн адил бий. Би чамд нөхөр болъё. Миний эцэг Наху баян гэдэг. Би түүний ганц хөвүүн. Миний нэр Боорчи\" гээд хоёулаа мордож шарга морьдыг мөрөөр нь мөшгөж гурван хоног явав. Нэгэн үдэш нарны гэрэл уул ташиж бүхий цагт нэгэн хүрээ иргэнд хүрвэл, найман шарга морь нь тэр хүрээний захад өвс идэж байна. Тэмүжин өгүүлрүүн: \"Нөхөр чи эндээ бай.\nМанай шарга морьд тэр байна. Би түүнийг хөөж ирье\" гэвэл, Боорчи өгүүлрүүн: \"Би чамд нөхөр болж ирээд энд яаж үлдэнэ\" гээд хоёулаа хамт довтолж ороод шарга морьдыг хөөж гарав."}], [{"k": "read", "ref": "§91", "n": 91, "text": "Хойноос нь олон хүн цувалдан хөөв. Тэдний дотроос нэгэн цагаан морьтой [улаан дээлтэй. А.то] хүн уурга барьж ганцаар гүйцэж ирэхэд Боорчи өгүүлрүүн: \"Нөхөр чи нум сумаа надад өг. Би харвалдъя гэвэл, Тэмүжин өгүүлрүүн: \"Миний төлөө чи эрсдүүзэй. Би харвалдъя\" гэж эргэж харвалдав. Тэр цагаан морьтойн хүн уургаа дохисоор хоцорвол хойдох нөхөд нь уван цуван гүйцэж ирсэн боловч нэгэнт нар уул ташин шингэж бүрэнхий болсон тул тэд нэхэж чадахгүй хоцров."}, {"k": "read", "ref": "§92", "n": 92, "text": "Тэмүжин Боорчи хоёр морьдоо авч тэр шөнө турш яваад гурван өдөр, гурван шөнө явж Боорчийн гэрт ойртвол, Тэмүжин өгүүлрүүн: \"Би чамгүй бол энэ морьдоо яаж авч чадах билээ? [Би хэдийг авах вэ? А.то] Чи хэдийг авах вэ?\" гэвэл, Боорчи өгүүлрүүн \"Би сайн нөхөр чамайг мунгинаж явна гэж тус болохоор ханилж явсан билээ. Би олз эрсэнгүй. Би Наху баяны ганц хөвүүн тул миний эцгийн зөөсөн хураасан хөрөнгө надад элбэг хүрнэ\" гэж эс авав."}], [{"k": "read", "ref": "§93", "n": 93, "text": "Хоёулаа Наху баяны гэрт хүрвэл, хөвүүнээ алдав гэж нус нулимс болж байсан Наху баян хөвүүнээ ирснийг үзээд нэг уйлж, нэг загнаж, \"Хөвүүн минь юу болсноо хэл\" гэвэл Боорчи өгүүлрүүн: \"Энэ сайн нөхөр мунгинаж явахыг үзээд хамт одсон билээ. Одоо ирэв\" гээд мордож, хээр боож тавьсан намбух суулгаа авч ирэв. Тэмүжинд тэд тэлээ хурга алж хүнс бэлтгээд бас ганзагын тулам өгөв. Наху баян өгүүлрүүн: \"Хоёр залуус үүнээс хойш сайхан нөхөрлө, бие биеэ битгий орхи\" гэв. Тэндээс Тэмүжин мордож гурван өдөр гурван шөнө яваад Сэнгүр горхинд байгаа гэртээ хүрэв. Тэмүжинийг ирэхэд Өэлүн эх, Хасар хийгээд дүү нарын зовнил тайлагдаж сэтгэл баясав."}, {"k": "read", "ref": "§94", "n": 94, "text": "Урьд Бөртэ үжинийг Тэмүжин есөн настай байхдаа үзэж ирснээс хойш дахин уулзаагүй билээ. Одоо Тэмүжин Бэлгүтэй хоёр Бөртэ үжинийг эрэхээр Хэрлэн мөрөн уруу одов. Цэгцэр Чихургу хоёрын завсар Хонгирадын Дэй сэцэн нутаглан байгаа ажээ. Дэй сэцэн, Тэмүжинийг үзэж маш их баясаж өгүүлрүүн: \"Ах дүү тайчууд нар чамд атаархан хорсохыг би мэдэх тул чиний тухай сэтгэл зовнисоор цөхрөхөд хүрсэн билээ. Одоо чамтай уулзав\" гээд Бөртэ үжинийг Тэмүжинд өгөв. Тэмүжин Бөртэ үжинийг авч хамт буцахад Дэй сэцэн үдэж яваад Хэрлэний Ураг цөл гэдэг газар хүрч [халуунд ядрах тул А.то] Хэрлэн уруу гэдрэг буцав. Дэй сэцэний гэргий Цотан охин Бөртэ үжинийг үзэж Хүрэлх дотор Сэнгүр горхинд бүхүйд хүргэж ирэв."}, {"k": "read", "ref": "§95", "n": 95, "text": "Цотанг хариулаад Боорчийг нөхөрлөе гэж урьж Бэлгүтэйг илгээв. Бэлгүтэйг ирмэгц Боорчи, эцэгтээ үл хэлэн бөгтөр хонгорыг унаад бор өрмөг (хэвнэг)-өө бөгтрөөд Бэлгүтэйн хамт явж ирэв. Боорчийн Тэмүжинтэй нөхөрлөсөн ёс тийм."}]], "lines": {"Мя": "§88–90 · **Лх** §91–92 · **Пү** §93–95"}}, {"n": 9, "title": "Хар булган дах, Зэлмэ, мэргидийн дайралт", "vocab": [["анд", "ах дүү барилдсан найз"], ["булган дах", ""], ["хөөрөг", "дархны үлээгүүр"], ["эмгэн", ""], ["тахих", ""], ["есөнтээ сөгдөх", ""]], "qs": ["Тэмүжин Ван ханд юу бэлэглэж, Ван хан юу амласан бэ?", "Хуагчин эмгэн Бөртийг нуух гэж юу хийсэн бэ?", "Тэмүжин Бурхан халдунд яагаад талархсан бэ?"], "fri": "§103-ын залбирлаас 6 мөр цээжилнэ.", "warn": ["§100–102: Бөртэ олзлогдсон хэсэг. Тэр үеийн дайны харгис байдлыг тайлбарлаарай."], "strat": "Таамаглах ба үг тодруулах — «Цааш юу болох бол?», «Энэ үгийн утгыг өгүүлбэрээс нь яаж таах вэ?»", "mode": "Багш чангаар уншина, хүүхдүүд хуруугаараа дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§96", "n": 96, "text": "Тэмүжин нар Сэнгүр горхиноос нүүж, Хэрлэн мөрний эх Бүрги эрэгт бууж нутаглах цагт Цотан эхийн шитгүл (өмсгөл) гэж авчирсан хар булган дахыг авч Тэмүжин, Хасар, Бэлгүтэй гурвуулаа Есүхэй эцгийн хуучин дотно анд (нөхөр) Ван хантай уулзахаар очив. Эцгийн анд бол эцэг мэт биз гэж Ван ханыг Туул голын шугуйд нутаглан байхад хүрч очоод Тэмүжин өгүүлрүүн: \"Эцгийн хуучин анд та, миний эцгийн адил буюу гэж би гэргий аваад өмсгөл хар булган дахыг чамд авчрав\" гэж булган дахаа өгөв. Ван хан маш их баясаж өгүүлрүүн: \"Хар булган дахын чинь хариуд\nХагацсан улсыг чинь\nХамтатгаж өгье\nБулган дахын чинь хариуд\nБутарсан улсыг чинь\nЦуглуулж өгье.\nБөөр нь бөгсөнд байг\nЦэр нь цээжинд байг\n(Ах захтай болог)\" гэв."}, {"k": "read", "ref": "§97", "n": 97, "text": "Тэндээс бүрги эрэгт нутаглан бүхийд Бурхан халдунаас Урианхайн Жарчиудай өвгөн хөөрөг (төмрийн дархны үлээх тулам)-өө үүрч, Зэлмэ нэрт хөвүүнээ дагуулж ирээд өгүүлрүүн: \"Тэргүүн Ононы Дэлүүн болдогт Тэмүжин чамайг төрөхөд Булган өлгий өгсөн ба би энэ хөвүүн Зэлмээг чамд өгсөн боловч, балчир учраас гэрт аваачсан билээ. Одоо чи миний хөвүүн Зэлмээр\nЭмээлээ тохуул\nҮүдээ сөхүүл\" гэж өгөв."}, {"k": "read", "ref": "§98", "n": 98, "text": "Хэрлэн мөрний эх Бүрги эрэгт нутаглан байтал нэгэн өглөө эрт үүр цайж байхад Өэлүн эхийн гэрт зарцлагдах Хуагчин эмгэн босож өгүүлрүүн: \"Эх, эх үтэр бос. Газар дэлбэрэх мэт чимээ гарч, морины төвөргөөн сонстоно. Аймшигт тайчууд айсуй биз. Эх даруй бос\" гэв."}], [{"k": "read", "ref": "§99", "n": 99, "text": "Өэлүн эх, \"Хөвүүдийг даруй сэрүүлэгтүн\" гээд өөрөө даруй босов. Тэмүжин нар даруй босоод морьдоо барьж, Тэмүжин, Өэлүн эх, Хасар, Хачиун, Тэмүгэ отчигин, Бэлгүтэй, Боорчи, Зэлмэ нар тус бүр нэг морь унаж, Тэмүлүнийг Өэлүн эх өвөртээ дүүрэв. Нэгэн моринд юм ачиж хөтлөв. Бөртэ үжинд морь дутав."}, {"k": "read", "ref": "§100", "n": 100, "text": "Тэмүжин ах дүү нар мордож, үүрээр бурхан халдуны зүг одов. Хуагчин өмгөн, Бөртэ үжинийг нууя гэж бүхээгтэй тэргэнд оруулж [эд бараагаа хийж тэргэнд сууж А.то] бөөр алаг үхэр хөллөж, Түнхэлэг горхин өөд хөдөлж [уул өгсөн Түнхэлэг горхиноо хүрэхэд А.то] сая үүр цайж харуй бүрий байтал, өөдөөс цэргийн хүмүүс хатиран ирж, \"Чи юун хүн бэ?\" гэж асуувал Хуагчин эмгэн өгүүлрүүн: \"Би Тэмүжиний харьяат. Их гэрт хонь хяргахаар ирсэн билээ. Одоо [унгас тээж А.то] гэртээ харьж явна\" гэв. Тэр цэргүүд өгүүлрүүн: \"Тэмүүжин гэрт бий юу? Үгүй юу? Гэр нь хаана байна?\" гэвэл, Хуагчин эмгэн өгүүлрүүн: \"Гэр нь ойр байна. Тэмүжиний бий, үгүйг би мэдэхгүй, би хойд гэрээс гарч ирэв\" гэв."}, {"k": "read", "ref": "§101", "n": 101, "text": "Тэд цэргүүд хатиран одов. Хуагчин эмгэн, бөөр алаг үхрээ гуядаж, яаравчлан явах гэтэл тэрэгний тэнхлэг хугарав. Тэнхлэг хугарсан учир, явганаар ойд дутааж оръё гэж байтал, хойноос мөн цэргүүд Бэлгүтэйн эхийг сундалж, хоёр хөлий нь санжуулан давхиж ирээд, \"Энэ тэргэн дотор юу байна?\" гэж асуувал, Хуагчин эмгэн өгүүлрүүн: \"Унгас бий\" гэв. Тэр цэргүүдийн ахмад нь өгүүлрүүн: \"Дүү нар бууж үзэгтүн\" гэвэл, бусад нь бууж хаалттай тэрэгний хаалгыг нээвэл, дотор нь хатан сууж байна. Түүнийг тэрэгнээс чирч гаргаад Хуагчин хоёуланг сундалж Тэмүжиний хойноос өвсний налархайгаар мөшгөж, Бурхан халдун өөд гарав."}], [{"k": "read", "ref": "§102", "n": 102, "text": "Тэмүжинийг нэхэж Бурхан халдуныг гурав тойрон нэгживч олсонгүй. Урагш хойш явж эрвэл умбах шавар, битүү ой тулгарч, цатгалан могой шургах завсаргүй бэрх шугуй тул Тэмүжинийг мөрдөж олж чадсангүй. Энэхүү довтолсон цэргүүд бол гурван мэргид байсан ажээ. Удуйд мэргидийн Тогтоа, Увас (ухаа) мэргидийн Дайр-Үсүн, Хаад мэргидийн Хаатай Дармала гурвуул нийлж урьд Чилэдүгээс Өэлүн эхийг булааж авсны өшөөг нэхэхээр ирсэн ажээ. Одоо тэдгээр мэргид өгүүлэлдрүүн: \"Өэлүнийг булаагдсаны өшөөг авахаар ирээд одоо эмсий нь булааж авав. Өвөг эцгийн өшөөг авав бид\" гэж гэртээ буцав."}, {"k": "read", "ref": "§103", "n": 103, "text": "[Тэд Бөртэ үжинийг аваачаад Чилэдүгийн дүү Чилэгэр бөхөд өгөв. А.то] Тэмүжин: \"Тэр гурван мэргид гэртээ харих нь уу? Ууланд бүгэх нь үү? Гурван хоног дагаж яваад мэдэж ир\" гэж Бэлгүтэй, Боорчи, Зэлмэ гурвыг илгээв. Тэмүжин өөрөө Бурхан халдун дээр бууж, өвчүүгээ дэлдэж (цохиж) залбиран өгүүлрүүн:\n\n\"Солонго мэт сонсох\nСоргог Хуагчины\nСонор хүчээр\nҮен мэт үзэх\nҮнэнч Хуагчины\nҮзсэний ачаар\n[Аюулт дайснаас\nАмжин дутааж]\nБүтэн биеэ\nБүгэн нуугдаж\nБүдэг замыг\nМөрдөн дагаж\nБугын мөрийг\nМөшгөн хөөж\nБургасан гэрт\nБуруулан нуугдаж\nБурхан халдунд\nАмь хоргодов.\nХарийн дайсан\nХалдан довтлоход\nХарцагаас дутаасан\nБолжмор мэт\nХандгай бугын\nМөрийг дагаж\nХад хавчлын\nСүвийг эрж\nХулдун ууланд\nДутааж ирээд\nХальс холтсоор гэр барьж\nХалуун амиа\nХамгаалав, би.\nБөглүү ойт\nБурхан уул\nБөөсөн чинээ амий минь\nБөөцийлөн аварч\nБөөрийн чинээ биеий минь\nБүтэн мэнд үлдээв.\nӨшөөт дайснаас\nӨршөөн аварч\nӨнчин бидний\nӨмөг болсон\nӨндөр дээд\nБурхан халдун чамайг\nӨглөө бүр мялааж байя!\nӨдөр бүр тахиж байя!\nҮрийн үрд\nҮүрд тахим\nҮе тутам\nҮргэлж шүтье!\"\n\nгэж бүсээ хүзүүнд эрих мэт өлгөж, малгайгаа гарт сэгэлдэрч, гараар өвчүүгээ дарж, наран өөд хандаж, Бурхан халдунд есөнтээ сөгдөж өчил өчин, сацал сацав."}]], "lines": {"Мя": "§96–98 · **Лх** §99–101 · **Пү** §102–103"}}, {"n": 10, "title": "Бөртийг аварсан нь", "vocab": [["түмэн", "10,000 цэрэг"], ["баруун гар / зүүн гар", "цэргийн жигүүр"], ["болзоо", "тохиролцсон цаг, газар"], ["сал", "гол гатлах хөвөгч"], ["жолоо цулбуур", ""]], "qs": ["Бөртийг аврахад хэн хэн тусалсан бэ?", "Жамуха болзооноос хоцорсныг яагаад чухалчилсан бэ?", "Тэмүжин, Бөртэ хоёр учирсан мөчийг өөрийн үгээр бич."], "fri": "Жамухын шүлгийг (§105) хэмнэлтэй уншиж, мөр бүрийн эхний үсэг адилхан (толгой холбох) байгааг ажиглана.", "warn": [], "strat": "Асуулт тавих — хүүхдүүд өөрсдөө асуулт зохиож, хосдоо асууна.", "mode": "Багш чангаар уншина, хүүхдүүд хуруугаараа дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§104", "n": 104, "text": "Тэндээс Тэмүжин, Хасар, Бэлгүтэй гурвуул явж, Туул голын Хар шугуйд нутаглаж байгаа ван хан Тоорилд очиж өгүүлрүүн: \"Санамсаргүй байтал гурван мэргид довтолж, эхнэр хүүхдийг минь булааж авав. Хан эцэг минь эхнэр хүүхдий минь аварч өгнө үү гэж ирэв\" гэвэл, ван хан Тоорил хариу өгүүлрүүн: \"Би ноднин жил чамд хэлсэн биш үү. Эцгийн адил эцэг гэж булган дах авчирч өгсөн тухайд би ингэж хэлсэн билээ\n\n\"Булган дахын чинь хариуд\nБутарсан улсы чинь\nБөөгнөрүүлж өгье\nХар булган дахын чинь хариуд\nХагацсан улсы чинь хамтатгаж өгье.\nЦэрээ цээжинд байлга\nБөөрөө бөгсөнд байлга\n(Ах захтай байг)\"\nгэж хэлсэн билээ.\nОдоо тэр үгэндээ хүрч,\nБулган дахын чинь хариуд\nБүгд мэргэдийг\nБүрэлгэн довтолж\nБөртэ үжинийг чинь\nБуцааж өгье.\nХар булган дахын чинь хариу\nХамаг мэргидийг\nХамх цохиж\nХатан Бөртий чинь\nХариулж авчиръя.\n\nЧи Жамуха дүүд хэл өг. Жамуха дүү Хорхунаг Жубур гэдэг газар бий. Би эндээс хоёр түмэн цэрэг авч баруун гар болон мордъё. Жамуха дүү хоёр түмэн цэрэг авч зүүн гар болон морилог. Бидний учрах болзоог Жамуха тогтоотугай\" гэв.", "chap": "Мэргидийг сөнөөсөн ба Тэмүжинд Чингис хаан цол өргөмжилсөн нь"}, {"k": "read", "ref": "§105", "n": 105, "text": "Тэмүжин, Хасар, Бэлгүтэй гурвуулаа, Тоорил ханаас салж гэртээ ирээд Тэмүжин, Жамухад Хасар Бэлгүтэй хоёрыг илгээж хэлүүлсэн нь:\n\n\"Өст мэргид ирж\nӨрий минь өвтгөв\nӨврий минь хоослов.\nӨмөг түшиг болох\nӨнөр төрлийн та нар\nӨшөөг авч өгнө үү.\nЭлэг зүрх минь\nЭмтэрч байна.\nЭлгэн садан та нар\nЭнэ өгөөг авч өг\" гэв.\n\nБас Хэрэйдийн Тоорил ханы үгийг Жамухад, уламжлан хэлсэн нь: \"Эрт өдөр эцэг хан Есүхэйтэй эв нэгтэй явснаа санаж, одоо хоёр түмэн цэрэг авч баруун гар болон мордъё. Жамуха дүү хоёр түмэн цэрэг авч зүүн гар болон морилтугай. Хамтрах болзоог Жамуха дүү мэдтүгэй\" гэснийг уламжлав. Эдгээр үгийг сонсож гүйцээд Жамуха өгүүлрүүн:\n\n\"Өнөө Тэмүжин анд\nӨдий зовлон бэрхэд\nӨртөгдсөнийг сонсоод би\nӨр өвдөж\nӨршөөн санана\nЭлэг эмтэрч\nЭмгэнэн гашуудна.\nЭл өшөөг нэхэж\nЭдгээр мэргид аймгийг\nЭвдэн мөхөөж\nЭхнэр Бөртийг\nЭргүүлж авчиръя\nХамаг хаад мэргидийг\nХамх цохиж\nХатан Бөртийг\nХариулж авъяа\nДавирах гөлмийн чимээг\nДайны хэнгэргийн дуу гэж\nТашааран дутаагч Тогтоа\nДайд Буур-хээрт\nТашаалдан суугаа биз.\nДавхар хоромсгын амсар\nДарвалзан хөдлөхөд\nДайн тулаан болов гэж\nТашааран дутаагч\nДайр-Үсүн одоо\nДавлагат Орхон Сэлэнгийн\nТалхун аралд\nДалдиран суугаа биз.\nХамхуул өвс хийсэхэд\nХалдах дайсан ирэв гэж\nХар ойр чиглэж\nХашхиран дутаагч муу\nХаатай Дармала одоо\nХаржийн талд\nХааш ч үгүй байгаа биз.\nСайхан Хилго мөрөнд\nСахал өвс их гэнэ\nСахал өвс түүгээр\nСал хийж болдог гэнэ.\nӨнөө дөхмийг бодож\nӨвсөөр сал хийж\nӨргөн Хилго мөрнийг\nӨнгөрч хөндлөн гараад\nӨөдгүй муусайн мэргидийн\nӨнөөх муу Тогтоагийн\nӨрх үүдий нь эвдэж\nӨм цөм дайрч\nӨнгөтэй эдий нь олзолж\nӨвөртлөх эмий нь булааж\nӨсөх үрий нь тасалж\nӨшөө хорсголоо авъя!\nХутагт эрхэм шүтээний нь\nХуга татаж эвдээд\nХувхай болгож хаяя!\nХотол их улсы нь\nХоосон болтол довтолъё\" гэв."}], [{"k": "read", "ref": "§106", "n": 106, "text": "Жамуха бас Тэмүжин анд, Тоорил хан ах хоёрт хэлүүлсэн нь: \"Одоо би\n\nХараа ихт (холоос харагдах) тугаа тахиж\nХар бухын арьсаар бүрсэн\nХаргис дуутай хэнгэргээ дэлдэж\nХатан болд жадаа барьж\nХалх хуягт дээлээ өмсөж\nХатгах зэвт сумаа онилж\nХар хул морио унаж\nХамаг олон цэргээ дагуулж\nХаад мэргэдийг халдан довтолж\nХатгалдан байлдахаар мордов би.\nҮзэмжит сайхан тугаа тахиж\nҮхрийн арьсан хэнгэргээ дэлдэж\nҮргэлж хэлхэ хуягаа өмсөж\nҮзүүр хурц илдээ барьж\nҮнэхээр мэргэн сумаа онилж\nҮлэмж сайн морио унаж\nҮй түмэн цэргээ дагуулж\nҮхээнц муусайн мэргид иргэнтэй\nҮхтэл тэмцэхээр нэгэнт мордов.\n\nТоорил хан ах мордож, Бурхан халдуны өврөөр Тэмүжин андыг дайрч аваад Онон мөрний эх Ботохан-бооржи гэдэг газар ирэгтүн. Би эндээс нэгэн түмэн цэрэг авч мордоод замд Онон мөрөнд нутаглаж байгаа Тэмүжин андын харъяат нараас бас нэгэн түмэн цэрэг авч, бүгд хоёр түмэн цэрэг болоод Ботохан-бооржид очиж нийлье\" гэж илгээв."}, {"k": "read", "ref": "§107", "n": 107, "text": "Жамуха эдгээр үгийг Хасар Бэлгүтэй хоёроос Тэмүжин сонсоод Тоорил ханд уламжлав. Тоорил хан, Жамухын үгийг сонсмогц хоёр түмэн цэрэг авч мордоод Бурхан халдуны өврөөр Хэрлэний Бүрги эргийг чиглэн явав. Үүнийг Тэмүжин сонсоод Бүрги эргээс хөдөлж, Бурхан халдуны өвөр Түнхэлэг өөд нүүж Тана горхинд очиж буув. Тоорил хан, нэгэн түмэн цэрэгтэй, Тоорил ханы дүү Жаха хамбу нэгэн түмэн цэрэгтэй Химурга горхины Айл харгана гэдэг газар бууж бүхийд Тэмүжин, цэргээ авч очиж нийлэн буув."}], [{"k": "read", "ref": "§108", "n": 108, "text": "Тэмүжин, Тоорил хан, Жаха хамбу гурвуул нийлэн хөдөлж, Ононы эх Ботохан-бооржи гэдэг газар хүрч ирвэл энд Жамуха нэгэнт ирээд гурав хоног хүлээжээ. Тэмүжин, Тоорил, Жаха хамбу гурав бас цэргүүдээ засаж хүрэлцэн нийлэлдэж танилцав. Жамуха өгүүлрүүн: \"Бороо тохиолдовч болзооноос хождохгүй, хур тохиолдовч хурлаас саатахгүй гэж монгол үгээр хэлэлцэж \"За\"\"гэж андгайлсан биш билүү? \"За\" гэсэн цагаас хожигдсон этгээдийг зэрэг дотроо хасъя гэсэн биш билүү?\" гэвэл, Тоорил хан өгүүлрүүн: \"Тогтсон болзооноос гурав өдөр хожимдсоны учир торгож буруушаахыг Жамуха дүү минь мэд\" гэв. Болзоо хожидсон тухай ийм үгийг ярилцаж өнгөрөв."}, {"k": "read", "ref": "§109", "n": 109, "text": "Ботохан-бооржиос бүгдээр хөдөлж, Хилго мөрөнд хүрч сал уяж гэтлээд Буур-хээр гэдэг газар очиж Тогтоа бэхийн өрх дээрээс нөмрөн бууж, эрхэм шүтээний нь эвдэн сүйтгэж, эм хүүхдий нь эзлэн булаав. Хутагт сахиусы нь хуга дайрч, хотол улсы нь хомрон довтолж хоосон болгов. Тогтоа бэхийг унтаж байхад дайран барьж болох байсан. Гэтэл Хилго мөрөнд нутаглах загасчин ба булга агнагчид, гөрөөчид \"дайсан айсуй\" гэж тэр шөнийн дотор Тогтоа бэхид хэл хүргэжээ. Энэ мэдээг сонсоод Тогтоа ба Увас мэргидийн Дайр Үсүн хоёр хамтарч цөөн нөхдийн хамт Сэлэнгийг уруудаж Баргужин оронд дутаан одов."}, {"k": "read", "ref": "§110", "n": 110, "text": "Мэргидийн улс дүрвэж, тэр шөнө Сэлэнгийг уруудан дутаахад манай цэргүүд дүрвэсэн мэргидийг нэхэж довтлон дээрэмдэн явав. Тэмүжин, дүрвэж яваа хүмүүсийн дундуур \"Бөртэ Бөртэ\" гэж дуудан, эрж явтал, дүрвэж яваа иргэний дотор байсан Бөртэ үжин Тэмүжиний дууг сонсож таниад тэрэгнээс бууж Хуагчин эмгэн хоёул гүйж ирээд, Тэмүжиний жолоо цулбуурыг барьж авав. Тэмүжин шөнийн саруулд үзвэл Бөртэ үжин мөн тул тэврэлдэн учрав. Тэмүжин мөн шөнө Тоорил хан Жамуха анд хоёрт хүн илгээн хэлүүлсэн нь: \"Эрсэн хүнээ олсон тул энэ шөнө довтлохоо зогсож энд бууя\" гэв. Дүрвэж явсан мэргидүүд мөн шөнө хаана хүрсэн, тэр газраа бууж хонов. Бөртэ үжин мэргидийн гараас гарч Тэмүжинтэй уулзсан ёс ийм бүлгээ."}]], "lines": {"Мя": "§104–105 · **Лх** §106–107 · **Пү** §108–110"}}, {"n": 11, "title": "Чилэгэрийн гэмшил, андын тангараг, Жамухаас салсан нь", "vocab": [["шагай", ""], ["годил", "ясан үзүүртэй сум"], ["анд бололцох", ""], ["уйдах", ""], ["хагацах", ""]], "qs": ["Тэмүжин, Жамуха хоёр хэдэн удаа анд барилдаж, юу солилцсон бэ?", "Жамухын «ууланд буух, голд буух» үгийг Бөртэ хэрхэн тайлбарласан бэ?", "Нөхөрлөл яагаад хагардаг вэ?"], "fri": "«Тэмүжин ба Жамуха»: ижил ба ялгаатай талыг Венийн диаграмаар харьцуулна.", "warn": ["§112: Мэргидийг хядсан хэсгийг багш товчилж болно."], "strat": "Асуулт тавих — хүүхдүүд өөрсдөө асуулт зохиож, хосдоо асууна.", "mode": "Багш чангаар уншина, хүүхдүүд хуруугаараа дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§111", "n": 111, "text": "Урьд Удуйд мэргидийн Тогтоа бэхи, Увас мэргидийн Дайр-Үсүн, Хаад мэргидийн хаатай Дармала гурвуул гурван зуун хүнийг дагуулж Тогтоа бэхийн дүү Их Чилэдүгийн гэргий Өэлүнийг Есүхэй баатарт булаагдсаны өшөөг авна гэж тэр нэг өглөө мордсон билээ. Тэр цагт Тэмүжинийг Бурхан халдунд дутаалгаж гурав дахин тойрч нэгжээд Тэмүжинийг олсонгүй. Харин Бөртэ үжинийг барин авч Чилэдүгийн дүү Чилэгэр бөхөд өгч асруулсан ажээ. Түүнээс хойш Бөртэ үжин Чилэгэр бөхийн гэрт байсаар билээ. Одоо Чилэгэр бөх дутааж гараад гэмшиж өгүүлрүүн:\n\n\"Хар муу хэрээ\nХальс холтос идэх заяатай байтал\nХарлаг галууг идэхээр\nХалдан тэмцэх мэт.\nХариугүй муу Чилэгэр би\nХарин ихийг санаж\nХатан үжинд халдаж\nХамаг мэргид иргэнийг\nХачлагдах аюулд учруулж\nХалх нөмөргүй болж\nХаранхуй шөнө зугтан гарч\nХадны хавчилд хоргодон\nХайран амиа гээх\nХар толгойгоо алдах болов\nХулд муу шувуу\nХулгана оготно идэх заяатай байтал\nХун галууг идье гэж\nХошуугаа билүүдэх мэт\nХувхай муу Чилэгэр би\nХутагт үжин хатныг\nХувилан авч ирээд\nХотол олон мэргидэд\nХор хөнөөл болгов.\nХохир муу Чилэгэр би\nХохимой муу толгойгоо\nХоргодох газаргүй болов\nХорголын төдий амиа\nАрчлах газаргүй болов\nХаранхуй хавчилд шургах уу\nХадны завсраар орох уу\nХаана очих билээ?\"\n\nгээд дутаасан ажээ."}, {"k": "read", "ref": "§112", "n": 112, "text": "Хаатай Дармалааг барин авчирч, хавтсан дөнгө өмсгөж Халдун ууланд явуулав. Бэлгүтэйн эх тэр айлд бий гэхийг сонсоод Бэлгүтэй, эхээ авъя гэж очоод гэрийн баруун үүдээр орвол түүний эх навтархай нэхий дээлтэй бөгөөд гэрийн зүүн үүдээр гарч гадна хүнд өгүүлрүүн:\n\n\"Хайрт хөвүүд минь\nХаадын зэрэгт хүрч байтал\nХарин би энд\nХарц муу хүнд\nХаръяалагдаж явна\nХан хөвүүдийн нүүрийг\nХарж яахин үзэх билээ?\"\n\nгээд гүн шугуйд гүйж орсонд хойноос нь нэхэж эрээд олсонгүй. Үүнд Бэлгүтэй ноён, мэргид овгийн хүнийг үзвэл \"Эхийг минь авчир\" гэж харвах билээ. Бурхан халдунд Тэмүжин нарыг довтолсон гурван зуун мэргидийг\n\nҮрийн үрийг хүртэл\nҮнсийг хийстэл хядаж\nҮлдсэн эм хүүхдийг\nҮүдний зарц болгож\nҮзэсгэлэн сайтай заримыг\nҮүрд дотнолж авав."}], [{"k": "read", "ref": "§113", "n": 113, "text": "Тоорил хаан, Жамуха хоёрыг Тэмүжин бишрэн өгүүлрүүн:\n\n\"Эцэг хан Тоорил\nЭрхэм анд Жамуха нар\nЭв хүчийг нэгтгэж\nЭрхт тэнгэрийн өршөөлөөр\nЭх дэлхийн ивээлээр\nЭртний өшөөт мэргидийн\nЭлэг зүрхийг эмтэлж\nЭрхэм төрлийг сөнөөж\nЭзэмших гэрийг хоосолж\nЭлдэв зүйлийг олзлов\" гэв.\nМэргид иргэнийг тийнхүү дайлж буцав."}, {"k": "read", "ref": "§114", "n": 114, "text": "Удуйд мэргидийн дүрвэж дутаасны хойно тэдний нутаг дээр булган малгайтай, бугын арьсан гуталтай, булган хөөмий дээлтэй, нүдэндээ аглтай, нүүртээ цогтой Хүчү гэдэг нэртэй, таван настай хөвүүн хоцорсныг манай цэргүүд олж авчраад Өэлүн эхэд бэлэг болгон өгөв."}, {"k": "read", "ref": "§115", "n": 115, "text": "Тэмүжин, Тоорил хан, Жамуха гурвуул нийлж\n\nОлон мэргидийн оцгор гэрийг эвдэж\nОлигтой эмсийг олзолж\nОрхон Сэлэнгэ хоёрын\nОй талаас буцав.\n\nТалхун арлаас хөдөлж, Тэмүжин, Жамуха хоёр Хорхунаг Жубурыг чиглэн явав. Тоорил хан, Бурхан халдуны хяраар Өхөрт шугуйг дайран Гацуурт (Гацууртай) сүвчид, Улиат (Улиастай) сүвчид гэдэг газрыг дайрч, ан гөрөө хийсээр Туулголын Хар шугуйд буцаж харив."}, {"k": "read", "ref": "§116", "n": 116, "text": "Тэмүжин Жамуха хоёр, Хорхунагийн хөндийд нийлэн бууж, эртний анд бололцсоноо дурдаж улам дотно болж найралдъя гэлцэв. Анх урьд анд бололцоход Тэмүжин арван нэгэн настай байсан билээ. Тэр цагт Жамуха нэгэн гурын шагайг Тэмүжинд өгч, Тэмүжин нэгэн цутгамал шагайг Жамухад өгч, Ононы мөсөн дээр шагалцан наадаж анд бололцсон билээ. Түүний хойд хавар алангир нумаар харваж байхад Жамуха, бярууны хоёр эврийг нааж нүхэлж хийсэн дуут сумаа Тэмүжинд өгч, Тэмүжин, арц модон годил (болцуу)-оо Жамухад өгч анд бололцов. Хоёр удаа анд бололцсон ёс ийм билээ."}, {"k": "read", "ref": "§117", "n": 117, "text": "Ахас дээдсийн үгийг сонсвол\nАливаа хүн харилцан\nАнд нөхөр бололцвол\nАмь биедээ\nАрч болж\nАль алиндаа\nТүшиг болж\nАмраглан ханилах ёстой\nОдоо бид амраглан ялъя\n\nгэж Тэмүжин, мэргидийн Тогтоагаас олзолж авсан алтан бүсээ Жамуха андад бүслүүлж, Тогтоагийн эсгэл (эрмэг буюу агсам) халиуныг Жамуха андад унуулав. Жамуха хариуд нь Увас мэргидийн Дайр-Үсүнээс олзолж авсан алтан бүсээ Тэмүжинд бүслүүлж, мөн Дайр-Үсүний эвэрт ишгэн цагаан морийг Тэмүжинд унуулав. Ийнхүү анд бололцож\n\nХорхунаг Жубурын хөндийд\nХулдгар хуны өвөрт\nСаглагар модны дор\nСайхан хурим үйлдэж\nСайтар бүжиглэн жаргаж\nСанаа сэтгэл нэгдэж\nСайхан нөхөд болоод\nШөнө нэгэн хөнжилд орж хонох бүлгээ."}], [{"k": "read", "ref": "§118", "n": 118, "text": "Тэмүжин Жамуха хоёр янаг найртай байж, нэгэн жил хагас хамт сууж, нэгэн өдөр тэр нутгаас нүүе гэлцэж, зуны тэргүүн сарын арван зургааны улаан тэргэл (дүгрэг сартай) өдөр нүүв. Тэмүжин Жамуха хоёр, тэрэгнүүдийн урд явж байтал Жамуха өгүүлрүүн\n\n\"Тэмүжин анд аа!\nУуланд шахан бууя.\nАдуучинд гэр болтугай!\n[Ай зөв үү? А.то]\nГолд шахан бууя\nХоньчин хургачин нарт\nХоол болтугай!\n[Хориггүй биш үү? А.то] гэв.\n\n(Хагас нь адууны бэлчээрийг таатж ууланд бууя, хагас нь хонины бэлчээрийг татаж голд бууя гэсэн үг бололтой). Тэмүжин, Жамухын энэ үгийг ухан ядаж хариу юу ч хэлсэнгүй хоцроод нүүдлийн тэргийг хүлээж Өэлүн эхэд өгүүлрүүн:\n\n\"Жамуха анд надад хэлэв:\nУуланд шахан бууя,\nАдуучинд гэр болтугай!\nАй зөв үү?\nГолд шахан бууя,\nХоньчин хургачин нарт\nХоол болтугай!\nХориггүй биш үү?\n\nгэж өгүүлэв. Би энэ үгийг ухаж ядаж хариу юу ч эс хэлэв. Эхээс асууя гэж ирэв би\" гэв. Өэлүн эхийг үг хэлж амжаагүй байтал, Бөртэ үжин өгүүлрүүн: \"Жамуха анд амархан уйддаг гэдэг билээ. Одоо биднээс уйдах цаг нь болсон биз. Тугаар (сая)- ын Жамуха андын хэлсэн нь биднийг жишээлсэн үг буюу. Бид бүү бууя. Энэ хөдөлсөөр шулуухан Жамухаас хагацаж шөнө турш явъя\" гэв."}, {"k": "read", "ref": "§119", "n": 119, "text": "Бөртэ үжиний үгийг зөвшөөж үл буун шөнө турш явж зуур мөрт тайчуудыг дайрав. Тайчууд айж мөн шөнө хөдөлж Жамухын зүг одов. Тайчуудын бэсүдийн нутаг дээр Хөхөчү нэртэй нэгэн өчүүхэн хөвүүн хоцорсныг манайхан олж аваад Өэлүн эхэд өгч тэжээлгэв."}]], "lines": {"Мя": "§111–112 · **Лх** §113–117 · **Пү** §118–119"}}, {"n": 12, "title": "Олон аймаг нэгдэж, Тэмүжин хаан болсон нь", "vocab": [["хүрээ", "бөөгнөрөн буусан айлууд"], ["өргөмжлөх", ""], ["хоромсого", "сумны сав"], ["буурч", "тогооч"], ["ахлах", ""]], "qs": ["Тэмүжинийг хаан болгохдоо ноёд юу амласан бэ?", "Чингис хаан Боорчи, Зэлмэ хоёрыг яагаад бусдаас дээгүүр тавьсан бэ?", "Хүмүүс яагаад Жамухыг орхиж Тэмүжинд нэгдсэн гэж бодож байна?"], "fri": "«Хэн юуг хариуцсан бэ» хүснэгт (§124) зохионо.", "warn": [], "strat": "Асуулт тавих — хүүхдүүд өөрсдөө асуулт зохиож, хосдоо асууна.", "mode": "Багш чангаар уншина, хүүхдүүд хуруугаараа дагана.", "quiz": null, "days": [[{"k": "read", "ref": "§120", "n": 120, "text": "Тэмүжин нар тэр шөнө дүлэн явж өдөр гийхэд үзвэл, жалайр аймгийн Хачиун-Тохураун, Хархай-Тохураун, Харалдай-Тохураун ах дүү гурвуул шөнө дүлэн нүүж дагалдан ирэв. Дархад аймгийн Хадаан, Далдурхан ах дүү тавуул, бас Мэнгиту хианы хөвүүн Үнгүр нар, чаншиут, баяуд харьяат нараа дагуулж ирэв. Барулас аймгаас Хубилай, Худус ах дүү нар ирэв. Мангуд аймгаас Жатай, Доголху чэрби ах дүү хоёул ирэв. Боорчийн дүү Үгэлэн чэрби, Арулад аймгаас хагацаж ах Боорчидоо нийлж ирэв. Зэлмийн дүү Чаурхан, Сүбээдэй баатар, Урианхай аймгаас салж Зэлмэд нийлэн ирэв. Бэсүд аймгаас Дэгэй, Хүчүгүр ах дүү хоёр ирэв. Сүлдүс аймгаас Чилэгүтэй-Тахи, Тайчиудай ах дүү нар ирэв. Жалайр аймгийн Сэцэ-Домог, Архай-Хасар Бала хоёр хөвүүнээ дагуулж ирэв. Хонхотанаас Сүйхэтү чэрби ирэв. Сүхэгэнээс Жэгэй хондгарын хөвүүн Сүхэхэй-Жаун ирэв. Нэүдэйн Цагаан гоо ирэв. Олхуноуд аймгаас Хингиадай, Горлос аймгийн Сэчиүр, Дүрвэд аймгийн Мөчи бүдүүн нар ирэв. Ихирэс аймгийн Буту, энд хүргэн болж байсан тул хамт ирэв. Ноёхон аймгийн Жунсо ирэв. Оронар аймгаас Зургаан ирэв. Тэгээд барулас аймгаас Сохо сэцэн, Харачар хөвүүнтэйгээ ирэв. Бас Баарин аймгийн Хорчи, Үсүн өвгөн, Хөхөчөс, Мэнэн баарингаа дагуулж нэгэн хүрээ болж ирэв."}, {"k": "read", "ref": "§121", "n": 121, "text": "Хорчи ирж өгүүлрүүн: \"Бид Бодончар богдын барьж авсан эмээс төрсөн тул Жамухатай хэвэл нэгтэй, хэлхээ бэхтэй хүмүүс билээ. Иймийн тул Жамухаас хагацаж болохгүй. Гэвч заарин тэнгэр ирж нүдэнд минь зааж үзүүлсэн нь, ухаагчин үнээ ирж Жамухыг тойрон явж, Жамухыг ба гэр тэргий нь мөргөсөөр өрөөсөн эврээ хугалж солжир эвэртэй болоод \"Эврий минь өг\" гэж Жамухын зүг мөөрч шороо сацлан байна. Бас нэгэн мухар ухаа үхрийг их гэрт тэргэнд хөллөжээ. Тэр үхэр их тэргүүр (зам)-ээр Тэмүжиний хойноос зүтгэн явж мөөрөн хэлэх нь: \"Тэнгэр газар эелдэж (зөвлөж)\nТэмүжинг улсын эзэн болтугай\" гэж\nТээж хүргэж явна\" гэж мөөрнө.\nИйнхүү миний нүдэнд заарин тэнгэр ирж зааж үзүүлэв.\n\"Тэмүжин чи, улсын эзэн болбол намайг урьдаас зааж хэлсэн тул хэрхэн жаргуулах вэ?\" гэж асуувал, Тэмүжин өгүүлрүүн: \"
